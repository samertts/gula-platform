# =============================================================================
# GULA Platform — Patroni HA PostgreSQL Configuration
# Production-ready Patroni cluster for medical data
# DCS: etcd (recommended) or Kubernetes-native
# =============================================================================

namespace: gula
scope: gula-db
name: "{{ PATRONI_NAME | default('gula-db-0') }}"

restapi:
  listen: 0.0.0.0:8008
  connect_address: "{{ PATRONI_IP | default('127.0.0.1') }}:8008"
  authentication:
    username: "{{ PATRONI_RESTAPI_USER | default('patroni') }}"
    password: "{{ PATRONI_RESTAPI_PASSWORD }}"
  # Allow health probes from monitoring
  allowlist: ["0.0.0.0/0"]

# ── Distributed Configuration Store ──────────────────────────────────────────
# etcd is the recommended DCS for production. Use Kubernetes native DCS
# (etcd via K8s API) when running in Kubernetes.
consul:
  host: "{{ CONSUL_HOST | default('127.0.0.1') }}:8500"
  register_service: true
  checks: true

# Alternative: etcd
# etcd:
#   host: "{{ ETCD_HOSTS | default('127.0.0.1:2379') }}"
#   protocol: https
#   cacert: /etc/patroni/ssl/ca.pem
#   cert: /etc/patroni/ssl/etcd.pem
#   key: /etc/patroni/ssl/etcd-key.pem

# Alternative: Kubernetes native
# kubernetes:
#   namespace: gula
#   labels:
#     application: gula-db
#   use_endpoints: true
#   pod_label: patroni-cluster

# ── PostgreSQL Configuration ─────────────────────────────────────────────────
postgresql:
  listen: 0.0.0.0:5432
  connect_address: "{{ PATRONI_IP | default('127.0.0.1') }}:5432"
  data_dir: "{{ PG_DATA_DIR | default('/var/lib/postgresql/data') }}"
  bin_dir: "{{ PG_BIN_DIR | default('/usr/lib/postgresql/16/bin') }}"
  config_dir: "{{ PG_CONFIG_DIR | default('/etc/postgresql/16/main') }}"
  pgpass: /tmp/pgpass
  authentication:
    replication:
      username: replicator
      password: "{{ REPLICATION_PASSWORD }}"
    superuser:
      username: postgres
      password: "{{ POSTGRES_PASSWORD }}"
    rewind:
      username: postgres
      password: "{{ POSTGRES_PASSWORD }}"
  parameters:
    # Connections
    max_connections: 200
    superuser_reserved_connections: 10

    # Memory
    shared_buffers: 512MB
    effective_cache_size: 1536MB
    work_mem: 16MB
    maintenance_work_mem: 128MB
    huge_pages: try

    # WAL (replica mode for streaming replication)
    wal_level: replica
    max_wal_senders: 10
    max_replication_slots: 10
    wal_buffers: 16MB
    min_wal_size: 1GB
    max_wal_size: 4GB
    checkpoint_completion_target: 0.9

    # Hot Standby
    hot_standby: on
    hot_standby_feedback: on
    max_standby_streaming_delay: 30s
    max_standby_archive_delay: 30s

    # Synchronous Commit
    synchronous_commit: on
    synchronous_standby_names: '*'

    # Query Planner
    random_page_cost: 1.1
    effective_io_concurrency: 200
    max_parallel_workers_per_gather: 2
    max_parallel_workers: 4
    max_worker_processes: 8

    # Autovacuum
    autovacuum: on
    autovacuum_max_workers: 3
    autovacuum_naptime: 1min
    autovacuum_vacuum_scale_factor: 0.05
    autovacuum_analyze_scale_factor: 0.025
    autovacuum_vacuum_cost_delay: 2ms
    autovacuum_vacuum_cost_limit: 400

    # Timeouts
    idle_in_transaction_session_timeout: 60000
    idle_session_timeout: 600000
    statement_timeout: 30000
    lock_timeout: 5000

    # WAL Archiving
    archive_mode: on
    archive_command: "pgbackrest --stanza=gula archive-push %p"
    archive_timeout: 60

    # Logging
    log_destination: stderr
    log_min_duration_statement: 500
    log_checkpoints: on
    log_lock_waits: on
    log_line_prefix: '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
    log_connections: off
    log_disconnections: off

    # Locale
    timezone: UTC
    lc_messages: en_US.UTF-8
    lc_monetary: en_US.UTF-8
    lc_numeric: en_US.UTF-8
    lc_time: en_US.UTF-8

# ── Bootstrap Configuration ──────────────────────────────────────────────────
bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    postgresql:
      use_pg_rewind: true
      parameters:
        max_connections: 200
        shared_buffers: 512MB
        wal_level: replica
        max_wal_senders: 10
        max_replication_slots: 10
        hot_standby: on
        synchronous_commit: on
        synchronous_standby_names: '*'

  # Initial DCS configuration
  dcs_config:
    postgresql:
      use_pg_rewind: true
      parameters:
        max_connections: 200
        shared_buffers: 512MB
        wal_level: replica
        max_wal_senders: 10
        max_replication_slots: 10
        hot_standby: on
        synchronous_commit: on
        synchronous_standby_names: '*'

  # Initialize the cluster with RLS and extensions
  initdb:
  - auth: scram-sha-256
  - auth-host: scram-sha-256
  - auth-local: scram-sha-256
  - encoding: UTF8
  - locale: en_US.UTF-8
  - data-checksums

  # Create users/roles after init
  users:
    gula_app:
      password: "{{ GULA_APP_PASSWORD }}"
      options:
        - CREATEDB
        - NOLOGIN
    replicator:
      password: "{{ REPLICATION_PASSWORD }}"
      options:
        - REPLICATION
        - LOGIN

  # Post-bootstrap SQL
  post_init: /scripts/patroni/post-init.sh

# ── Standby Cluster (Disaster Recovery) ──────────────────────────────────────
# Configure a standby cluster in a remote region for DR.
# When active, this node follows the primary cluster as a cascading standby.
standby_cluster:
  host: "{{ DR_PRIMARY_HOST | default('') }}"
  port: 5432
  primary_slot_name: "{{ DR_SLOT_NAME | default('gula_dr') }}"
  create_replica_methods:
    - pgbackrest
    - basebackup
  pgbackrest:
    command: "pgbackrest --stanza=gula --delta restore"
    keep_data: true
    no_params: true
    no_master: 0

# ── Watchdog Mode ─────────────────────────────────────────────────────────────
# Automatic watchdog prevents split-brain by confirming leadership via DCS
watchdog:
  mode: automatic
  device: /dev/watchdog
  safety_margin: 5

# ── Tags ─────────────────────────────────────────────────────────────────────
tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false
  version: "2.1.0"
  environment: "{{ ENV | default('production') }}"
  region: "{{ REGION | default('me-central') }}"
  node_type: "{{ NODE_TYPE | default('standard') }}"

# ── Logging ───────────────────────────────────────────────────────────────────
log:
  level: INFO
  format: "%(asctime)s %(levelname)s %(message)s"
  dateformat: "%Y-%m-%d %H:%M:%S"
  file: "{{ PATRONI_LOG_FILE | default('/var/log/patroni/patroni.log') }}"
  max_log_size: 100MB
  max_log_files: 10

# ── Watchdog Configuration ───────────────────────────────────────────────────
loop_wait: 10
ttl: 30
retry_timeout: 10
maximum_lag_on_failover: 1048576
