# =============================================================================
# Linkerd Authorization Policy — mTLS Zero Trust for GULA Mesh
# =============================================================================
# Path: config/zero-trust/linkerd-policy.yaml
# Managed by: Security Operations
# Applied via: kubectl apply -f linkerd-policy.yaml
# Requires: Linkerd service mesh installed with mTLS enabled
# =============================================================================
#
# Architecture:
#   All service-to-service communication requires mTLS (mutual TLS).
#   AuthorizationPolicy resources enforce per-service access controls.
#   Default deny-all with explicit allow rules.
#
# Service Accounts:
#   - api-gateway    : nginx reverse proxy (ingress gateway)
#   - gula-backend   : FastAPI application server
#   - gula-worker    : Background task worker
#   - gula-postgres  : PostgreSQL database
#   - gula-redis     : Redis cache
#   - gula-rabbitmq  : Message broker
#   - prometheus     : Metrics collection
#   - grafana        : Monitoring dashboard
#   - device-bridge  : Lab instrument integration
#   - nhop-platform  : National Health Oversight Platform
#
---
# =============================================================================
# 1. DEFAULT DENY — Mesh-wide default deny authorization policy
# =============================================================================
apiVersion: policy.linkerd.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: default-deny-all
  namespace: default
  labels:
    app.kubernetes.io/name: gula-platform
    app.kubernetes.io/component: linkerd
    app.kubernetes.io/part-of: zero-trust
spec:
  targetRef:
    group: policy.linkerd.io
    kind: Namespace
    name: default
  requiredAuthentication:
    identities:
      - "*.serviceaccount.identity.linkerd.cluster.local"
---
# =============================================================================
# 2. GULA-BACKEND — Authorization policy
# =============================================================================
apiVersion: policy.linkerd.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: gula-backend-authz
  namespace: default
  labels:
    app.kubernetes.io/name: gula-platform
    app.kubernetes.io/component: linkerd
spec:
  targetRef:
    group: core
    kind: Service
    name: gula-backend
  requiredAuthentication:
    identities:
      - "api-gateway.default.serviceaccount.identity.linkerd.cluster.local"
      - "gula-worker.default.serviceaccount.identity.linkerd.cluster.local"
      - "prometheus.default.serviceaccount.identity.linkerd.cluster.local"
      - "device-bridge.default.serviceaccount.identity.linkerd.cluster.local"
      - "nhop-platform.default.serviceaccount.identity.linkerd.cluster.local"
---
# =============================================================================
# 3. GULA-BACKEND — Per-route authorization
# =============================================================================
apiVersion: policy.linkerd.io/v1beta1
kind: HTTPRoute
metadata:
  name: gula-backend-health-routes
  namespace: default
  labels:
    app.kubernetes.io/name: gula-platform
    app.kubernetes.io/component: linkerd
spec:
  parentRefs:
    - name: gula-backend
      kind: Service
      group: core
  rules:
    - matches:
        - path:
            value: "/health"
            type: path-prefix
---
apiVersion: policy.linkerd.io/v1beta1
kind: HTTPRoute
metadata:
  name: gula-backend-metrics-routes
  namespace: default
spec:
  parentRefs:
    - name: gula-backend
      kind: Service
      group: core
  rules:
    - matches:
        - path:
            value: "/metrics"
            type: exact
        - path:
            value: "/metrics/prom"
            type: exact
---
apiVersion: policy.linkerd.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: gula-backend-metrics-authz
  namespace: default
spec:
  targetRef:
    group: policy.linkerd.io
    kind: HTTPRoute
    name: gula-backend-metrics-routes
  requiredAuthentication:
    identities:
      - "prometheus.default.serviceaccount.identity.linkerd.cluster.local"
      - "grafana.default.serviceaccount.identity.linkerd.cluster.local"
---
apiVersion: policy.linkerd.io/v1beta1
kind: HTTPRoute
metadata:
  name: gula-backend-api-routes
  namespace: default
spec:
  parentRefs:
    - name: gula-backend
      kind: Service
      group: core
  rules:
    - matches:
        - path:
            value: "/api"
            type: path-prefix
---
apiVersion: policy.linkerd.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: gula-backend-api-authz
  namespace: default
spec:
  targetRef:
    group: policy.linkerd.io
    kind: HTTPRoute
    name: gula-backend-api-routes
  requiredAuthentication:
    identities:
      - "api-gateway.default.serviceaccount.identity.linkerd.cluster.local"
      - "gula-worker.default.serviceaccount.identity.linkerd.cluster.local"
      - "device-bridge.default.serviceaccount.identity.linkerd.cluster.local"
      - "nhop-platform.default.serviceaccount.identity.linkerd.cluster.local"
---
apiVersion: policy.linkerd.io/v1beta1
kind: HTTPRoute
metadata:
  name: gula-backend-admin-routes
  namespace: default
spec:
  parentRefs:
    - name: gula-backend
      kind: Service
      group: core
  rules:
    - matches:
        - path:
            value: "/admin"
            type: path-prefix
---
apiVersion: policy.linkerd.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: gula-backend-admin-authz
  namespace: default
spec:
  targetRef:
    group: policy.linkerd.io
    kind: HTTPRoute
    name: gula-backend-admin-routes
  requiredAuthentication:
    identities:
      - "api-gateway.default.serviceaccount.identity.linkerd.cluster.local"
---
# =============================================================================
# 4. GULA-WORKER — Authorization policy
# =============================================================================
apiVersion: policy.linkerd.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: gula-worker-authz
  namespace: default
spec:
  targetRef:
    group: core
    kind: Service
    name: gula-worker
  requiredAuthentication:
    identities:
      - "gula-backend.default.serviceaccount.identity.linkerd.cluster.local"
      - "gula-worker.default.serviceaccount.identity.linkerd.cluster.local"
---
# =============================================================================
# 5. API-GATEWAY — Authorization policy
# =============================================================================
apiVersion: policy.linkerd.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: api-gateway-authz
  namespace: default
spec:
  targetRef:
    group: core
    kind: Service
    name: api-gateway
  requiredAuthentication:
    identities:
      - "api-gateway.default.serviceaccount.identity.linkerd.cluster.local"
---
# =============================================================================
# 6. GULA-POSTGRES — Database authorization (strictest)
# =============================================================================
apiVersion: policy.linkerd.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: gula-postgres-authz
  namespace: default
spec:
  targetRef:
    group: core
    kind: Service
    name: gula-postgres
  requiredAuthentication:
    identities:
      - "gula-backend.default.serviceaccount.identity.linkerd.cluster.local"
      - "gula-worker.default.serviceaccount.identity.linkerd.cluster.local"
---
# =============================================================================
# 7. GULA-REDIS — Cache authorization
# =============================================================================
apiVersion: policy.linkerd.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: gula-redis-authz
  namespace: default
spec:
  targetRef:
    group: core
    kind: Service
    name: gula-redis
  requiredAuthentication:
    identities:
      - "gula-backend.default.serviceaccount.identity.linkerd.cluster.local"
      - "gula-worker.default.serviceaccount.identity.linkerd.cluster.local"
---
# =============================================================================
# 8. GULA-RABBITMQ — Messaging authorization
# =============================================================================
apiVersion: policy.linkerd.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: gula-rabbitmq-authz
  namespace: default
spec:
  targetRef:
    group: core
    kind: Service
    name: gula-rabbitmq
  requiredAuthentication:
    identities:
      - "gula-backend.default.serviceaccount.identity.linkerd.cluster.local"
      - "gula-worker.default.serviceaccount.identity.linkerd.cluster.local"
---
# =============================================================================
# 9. DEVICE-BRIDGE — Lab instrument integration
# =============================================================================
apiVersion: policy.linkerd.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: device-bridge-authz
  namespace: default
spec:
  targetRef:
    group: core
    kind: Service
    name: device-bridge
  requiredAuthentication:
    identities:
      - "device-bridge.default.serviceaccount.identity.linkerd.cluster.local"
      - "gula-backend.default.serviceaccount.identity.linkerd.cluster.local"
---
# =============================================================================
# 10. NHOP-PLATFORM — National Health Oversight
# =============================================================================
apiVersion: policy.linkerd.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: nhop-platform-authz
  namespace: default
spec:
  targetRef:
    group: core
    kind: Service
    name: nhop-platform
  requiredAuthentication:
    identities:
      - "nhop-platform.default.serviceaccount.identity.linkerd.cluster.local"
      - "gula-backend.default.serviceaccount.identity.linkerd.cluster.local"
      - "api-gateway.default.serviceaccount.identity.linkerd.cluster.local"
