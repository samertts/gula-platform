# =============================================================================
# Zero Trust Architecture Policy — GULA Platform
# =============================================================================
# Path: config/zero-trust/zero-trust-policy.yaml
# Managed by: Security Operations
# Version: 1.0.0
# Last updated: 2026-07-15
# =============================================================================
#
# This document defines the Zero Trust Architecture (ZTA) for the GULA
# healthcare platform, following NIST SP 800-207 guidelines and tailored
# for Iraqi healthcare data protection requirements.
#
# Core Principle: "Never trust, always verify."
#
# =============================================================================
# 1. FOUNDATIONAL PRINCIPLES
# =============================================================================
#
# 1.1 Never Trust, Always Verify
#   - No entity is trusted by virtue of network location or prior verification.
#   - Every access request is fully authenticated, authorized, and encrypted.
#   - Verification occurs at every request, not just at session establishment.
#   - Internal network ≠ trusted network.
#
# 1.2 Assume Breach
#   - Design every component assuming an attacker is already present.
#   - Minimize blast radius through micro-segmentation.
#   - Encrypt data at rest and in transit (never trust the network).
#   - Continuous monitoring and anomaly detection on all traffic.
#
# 1.3 Least Privilege
#   - Every service account has the minimum permissions needed.
#   - Just-in-time (JIT) access elevation where possible.
#   - Default deny: all access is prohibited unless explicitly granted.
#   - Regular access reviews and entitlement audits.
#
# =============================================================================
# 2. IMPLEMENTATION REQUIREMENTS
# =============================================================================
#
# 2.1 mTLS Required for All Service-to-Service Communication
#   - All inter-service communication MUST use mutual TLS (mTLS).
#   - Linkerd service mesh enforces mTLS at the proxy level.
#   - Certificate rotation: every 24 hours (Linkerd default).
#   - SPIFFE-compliant identities for all workloads.
#   - No plaintext HTTP between services is permitted.
#   - mTLS termination at ingress point (api-gateway).
#
# 2.2 All Requests Authorized via RBAC/ABAC
#   - Authentication: JWT-based (backend) + mTLS (service mesh).
#   - Authorization: Role-Based Access Control (RBAC) for human users.
#   - Authorization: Attribute-Based Access Control (ABAC) for lab_id tenant isolation.
#   - Every request carries: JWT (user context) + mTLS (service identity).
#   - Both must pass validation for the request to succeed.
#   - 9 RBAC roles defined in backend/app/security/rbac.py.
#   - ABAC enforces: lab_id scope, data classification, action type.
#
# 2.3 Network Segmentation — Micro-Perimeter Per Service
#   - Each service has its own AuthorizationPolicy (see linkerd-policy.yaml).
#   - No service can access another unless explicitly allowed.
#   - Default deny-all at the namespace level.
#   - East-west traffic fully governed by mesh policies.
#   - North-south traffic through api-gateway only.
#   - Database layer: only gula-backend and gula-worker can connect.
#   - Cache layer: only gula-backend and gula-worker can connect.
#   - Messaging: only authorized producers/consumers.
#
# 2.4 Continuous Verification Every 60 Seconds
#   - Linkerd probes: liveness and readiness checked every 10s.
#   - mTLS certificate expiry: proxies verify every 60s.
#   - Authorization policies re-evaluated on every request.
#   - Secret rotation: credentials rotated at configurable intervals.
#   - Session validation: JWT expiry checked on every API call.
#   - Audit log: every authorization decision recorded (allow + deny).
#   - Anomaly detection: Wazuh SIEM monitors for auth anomalies.
#
# 2.5 Minimal Service Accounts
#   - Each deployment has a dedicated Kubernetes ServiceAccount.
#   - No shared service accounts across environments.
#   - ServiceAccount names map to Linkerd identities.
#   - Service accounts:
#     - api-gateway: Ingress TLS termination, routing.
#     - gula-backend: Application server, all business logic.
#     - gula-worker: Background task processing.
#     - device-bridge: Lab instrument communication.
#     - nhop-platform: National health data exchange.
#     - prometheus: Metrics scraping only.
#     - grafana: Dashboard visualization.
#
# 2.6 No Implicit Trust for Internal Network
#   - All traffic is encrypted regardless of source/destination.
#   - Pod-to-Pod traffic within same node requires mTLS.
#   - Kubernetes NetworkPolicies complement mesh policies.
#   - Host network access is disabled for all pods.
#   - Nodes are treated as untrusted by workloads.
#
# =============================================================================
# 3. POLICY ENFORCEMENT POINTS
# =============================================================================
#
# 3.1 Policy Decision Point (PDP)
#   - Component: GULA backend authorization system.
#   - Evaluates RBAC roles, ABAC attributes, and context.
#   - Returns Allow/Deny decision with reason.
#   - Cache decisions for 60s (max) to reduce latency.
#
# 3.2 Policy Enforcement Point (PEP)
#   - Component: Linkerd proxy (sidecar).
#   - Enforces mTLS requirements.
#   - Component: GULA JWT middleware (backend/app/security/auth.py).
#   - Enforces token validation and user authentication.
#   - Component: GULA RBAC middleware (backend/app/security/rbac.py).
#   - Enforces role and permission checks.
#
# 3.3 Policy Information Point (PIP)
#   - Component: GULA feature flags and lab configuration.
#   - Provides context for ABAC decisions (lab_id, tenant tier).
#
# 3.4 Policy Administration Point (PAP)
#   - Kubernetes manifests (this file, linkerd-policy.yaml).
#   - GULA admin API for user/role management.
#   - Feature flag configuration (backend/app/core/feature_flags.py).
#
# =============================================================================
# 4. DATA PROTECTION
# =============================================================================
#
# 4.1 Data in Transit
#   - mTLS: all service-to-service (Linkerd).
#   - TLS 1.3: all external-facing (nginx ingress).
#   - TLS 1.3: database connections (PostgreSQL SSL).
#   - TLS 1.3: cache connections (Redis TLS).
#   - Minimum cipher suite: TLS_AES_256_GCM_SHA384.
#
# 4.2 Data at Rest
#   - Database: encrypted at rest (PostgreSQL TDE or filesystem-level).
#   - PHI fields: column-level encryption (patients.national_id).
#   - Secrets: stored in Kubernetes Secrets (encrypted at etcd level).
#   - Backups: encrypted with GPG before storage.
#   - Logs: no PHI in plaintext logs.
#
# 4.3 Data Classification
#   - PHI (Protected Health Information): highest protection.
#   - PII (Personally Identifiable Information): high protection.
#   - Authentication credentials: high protection.
#   - Business data: standard protection.
#   - Public/aggregate data: standard protection.
#
# =============================================================================
# 5. MONITORING AND AUDIT
# =============================================================================
#
# 5.1 Continuous Monitoring
#   - Wazuh SIEM: log collection, anomaly detection, alerting.
#   - Prometheus: metrics collection from all services.
#   - Grafana: dashboards for security posture visualization.
#   - Linkerd viz: service mesh observability (topology, latency, traffic).
#   - Audit logs: all authorization decisions recorded.
#
# 5.2 Audit Requirements
#   - Every access attempt (allow + deny) logged with:
#     - Request ID, timestamp, source identity, target service.
#     - Action attempted, resource accessed, authorization decision.
#     - User context (if human), service account (if machine).
#     - Lab ID (for tenant context).
#   - Audit logs immutable (append-only via hash chain).
#   - Logs retained per Iraqi health data regulations.
#   - Weekly audit review by Security Operations.
#
# =============================================================================
# 6. INCIDENT RESPONSE
# =============================================================================
#
# 6.1 Security Event Triage
#   - Level 12+: Immediate automated response (IP blocking).
#   - Level 10-11: Alert Security Operations (PagerDuty).
#   - Level 7-9: Log and investigate within 24h.
#   - Level 4-6: Aggregate and trend analysis.
#   - Level 1-3: Informational.
#
# 6.2 Response Playbooks
#   - mTLS failure: investigate proxy logs, check certificate expiry.
#   - Auth bypass detection: rotate credentials, audit all recent access.
#   - Anomalous service communication: isolate service, investigate.
#   - PHI exfiltration: block egress, rotate keys, notify DPO.
#
# =============================================================================
# 7. COMPLIANCE MAPPING
# =============================================================================
#
# | Requirement               | HIPAA  | Iraq NHDSS | NIST 800-207 |
# |---------------------------|--------|-------------|--------------|
# | mTLS all traffic          | 164.312(e)(1) | Art. 24 | §3.1.2 |
# | Access control            | 164.312(a)(1) | Art. 22 | §3.1.1 |
# | Audit controls            | 164.312(b)   | Art. 25 | §3.3.3 |
# | Integrity controls        | 164.312(c)(1) | Art. 26 | §3.1.3 |
# | Person/entity auth        | 164.312(d)   | Art. 23 | §3.1.4 |
# | Transmission security     | 164.312(e)(1) | Art. 24 | §3.1.2 |
# | Micro-segmentation        | 164.312(a)(1) | Art. 27 | §3.2.1 |
# | Continuous monitoring     | 164.308(a)(1) | Art. 29 | §3.3.2 |
#
# =============================================================================
# 8. EXCEPTIONS AND ESCALATION
# =============================================================================
#
# 8.1 Authorized Exceptions
#   - Health check endpoints (/health, /health/ready):
#     Exempted from auth but monitored.
#   - Prometheus metrics (/metrics): accessible by Prometheus only.
#   - Device bridge initial handshake: requires mTLS.
#
# 8.2 Exception Process
#   1. Request submitted to Security Operations.
#   2. Risk assessment completed.
#   3. Time-bound exception granted (max 7 days).
#   4. Exception logged in audit trail.
#   5. Auto-escalation if exception expires.
#
# =============================================================================
# 9. REVIEW AND UPDATE
# =============================================================================
#
# - This policy is reviewed quarterly by Security Operations.
# - Updates require approval from CISO and Architecture Review Board.
# - Policy violations are reported to the Security Incident Response Team.
# - This policy is enforced by automated tooling (Linkerd, OPA, CI/CD).
# - Exceptions to this policy must be documented and time-limited.
#
