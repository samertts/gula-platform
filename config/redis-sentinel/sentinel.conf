# =============================================================================
# GULA Platform — Redis Sentinel Configuration
# Monitors gula-redis-primary with quorum=2 (requires 3 sentinels)
# =============================================================================

# ── Network ──────────────────────────────────────────────────────────────────
port 26379
bind 0.0.0.0
protected-mode no

# ── Monitor the primary ──────────────────────────────────────────────────────
sentinel monitor gula-redis-primary redis-primary 6379 2

# ── Timeouts ─────────────────────────────────────────────────────────────────
# How long to wait before considering a node as down (ms)
sentinel down-after-milliseconds gula-redis-primary 5000

# How long to wait for a failover to complete (ms)
sentinel failover-timeout gula-redis-primary 30000

# Number of replicas to reconfigure simultaneously during failover
sentinel parallel-syncs gula-redis-primary 1

# ── Authentication ───────────────────────────────────────────────────────────
# If the Redis primary requires a password, uncomment:
# sentinel auth-pass gula-redis-primary ${REDIS_PASSWORD}

# ── Notification Scripts ─────────────────────────────────────────────────────
# Script called when a failover starts, ends, or a sentinel detects error
sentinel notification-script gula-redis-primary /usr/local/bin/redis-failover-notify.sh

# Script called when a failover is about to happen (returns 1 to abort)
# sentinel client-reconfig-script gula-redis-primary /usr/local/bin/redis-client-reconfig.sh

# ── Other Sentinels (for cross-Sentinel communication) ───────────────────────
# When running in Docker, service DNS names are used instead
# sentinel announce-ip <sentinel-ip-address>
# sentinel announce-port 26379

# ── Logging ──────────────────────────────────────────────────────────────────
loglevel notice
logfile /var/log/redis/sentinel.log

# ── General ──────────────────────────────────────────────────────────────────
# Maximum number of clients at once
maxclients 10000

# Allow `.` in char-set for slave `replica-priority`
sentinel resolve-hostnames no

