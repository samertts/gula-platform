# =============================================================================
# GULA PLATFORM — Open file descriptor limits for web + database processes
#
# Install (done automatically by server-setup.sh):
#   sudo cp config/system/gula-limits.conf /etc/security/limits.d/99-gula.conf
#   # Takes effect on next login / service restart (no reboot required)
#
# Why this matters:
#   nginx default config allows 4096 worker_connections per process.
#   Each connection uses at least 1 fd (socket) + 1 fd (upstream socket) = 2 fds.
#   With 2 workers × 4096 connections = 8192 fds minimum just for nginx.
#   PostgreSQL + Docker also consume fds. The Ubuntu default (1024 soft) is too low.
#
# Values here affect all users and all processes. They are conservative — the
# kernel fs.file-max (set in 99-gula-sysctl.conf) is the global ceiling.
# =============================================================================

# All users — safe global floor
*    soft nofile  65535
*    hard nofile  65535

# Root processes (nginx started by root, then drops to www-data)
root soft nofile  65535
root hard nofile  65535
