# =============================================================================
# GULA PLATFORM — Linux kernel tuning for high-throughput web + database workload
#
# Install (done automatically by server-setup.sh):
#   sudo cp config/system/99-gula-sysctl.conf /etc/sysctl.d/99-gula.conf
#   sudo sysctl --system
#
# Safe to apply without rebooting. All values are runtime-adjustable.
# Tested on Ubuntu 22.04 / 24.04 with nginx + Docker + PostgreSQL.
# =============================================================================

# ── File descriptors ──────────────────────────────────────────────────────────
# nginx + Docker + PostgreSQL can open many fds simultaneously.
# The kernel default (usually 65536 or 1048576) is often fine, but raise it
# explicitly so the OS setting is never the limiting factor.
fs.file-max = 2097152

# ── Network — accept queue & connection backlog ───────────────────────────────
# somaxconn: maximum length of the pending connection queue for any socket.
# Nginx sets SO_BACKLOG = worker_connections; the kernel caps it at somaxconn.
net.core.somaxconn = 65535
# syn_backlog: queue for incomplete TCP handshakes (SYN_RECV state).
net.ipv4.tcp_max_syn_backlog = 65535
# netdev_max_backlog: packets queued after the NIC but before the kernel stack.
net.core.netdev_max_backlog = 65535

# ── Network — receive / send buffers ─────────────────────────────────────────
# Larger buffers improve throughput for long-lived keep-alive connections.
net.core.rmem_default = 262144
net.core.wmem_default = 262144
net.core.rmem_max     = 16777216
net.core.wmem_max     = 16777216
net.ipv4.tcp_rmem     = 4096 87380 16777216
net.ipv4.tcp_wmem     = 4096 16384 16777216

# ── Network — TIME_WAIT and connection recycling ─────────────────────────────
# Allow reuse of TIME_WAIT sockets for new outgoing connections (nginx upstream).
net.ipv4.tcp_tw_reuse   = 1
# Shorten TIME_WAIT period so closed sockets are recycled faster.
net.ipv4.tcp_fin_timeout = 15
# Reduce maximum number of TIME_WAIT buckets (default is usually 262144).
net.ipv4.tcp_max_tw_buckets = 2000000

# ── Network — keepalive ───────────────────────────────────────────────────────
# Detect dead connections sooner so nginx upstream pool stays clean.
net.ipv4.tcp_keepalive_time   = 300   # start probing after 5 min idle (default: 7200)
net.ipv4.tcp_keepalive_probes = 3     # send 3 probes before declaring dead
net.ipv4.tcp_keepalive_intvl  = 10    # probe every 10 s

# ── Memory / swap ─────────────────────────────────────────────────────────────
# swappiness=10: prefer to keep data in RAM; only swap when <10% free.
# The server-setup.sh creates a 2 GB swap file for OOM safety on small droplets.
vm.swappiness = 10
# Reduce dirty page write-back aggressiveness — avoids latency spikes from
# massive flush operations on databases.
vm.dirty_ratio            = 15
vm.dirty_background_ratio = 5
