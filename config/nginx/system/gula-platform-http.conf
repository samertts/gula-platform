# =============================================================================
# GULA PLATFORM — System Nginx (HTTP, pre-SSL)
#
# Architecture: Internet → System nginx (80) → Docker api-gateway (127.0.0.1:8080)
#
# Install (done automatically by deploy.sh):
#   sudo cp config/nginx/system/gula-platform-http.conf /etc/nginx/sites-available/gula-platform
#   sudo ln -sf /etc/nginx/sites-available/gula-platform /etc/nginx/sites-enabled/gula-platform
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# After SSL is set up (./scripts/setup-https.sh), this file is replaced by
# the SSL-enabled version which redirects HTTP→HTTPS and also proxies 443→Docker:8443.
#
# 502 resilience strategy:
#   - upstream block with keepalive so idle TCP connections are reused
#   - proxy_next_upstream retries the request once on error/timeout
#   - proxy_connect_timeout / proxy_read_timeout raised above Docker startup time
#   - Friendly JSON error page (never a bare nginx 502) with Retry-After header
# =============================================================================

# Upstream block enables keepalive reuse and automatic retry logic.
# max_fails/fail_timeout: mark the backend down for 10s after 2 failures,
# then try again — avoids hammering a recovering Docker container.
upstream docker_gateway {
    server 127.0.0.1:8080 max_fails=2 fail_timeout=10s;
    keepalive 8;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name gula-platform.org www.gula-platform.org _;

    server_tokens off;
    client_max_body_size 50M;

    # ── Let's Encrypt ACME challenge ─────────────────────────────────────────
    # Must remain on HTTP — certbot writes files here for domain validation.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # ── Block common scanning paths ───────────────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }
    location ~* (wp-admin|phpmyadmin|\.env|\.git|xmlrpc\.php|\.php$) {
        deny all;
        return 404;
    }

    # ── Direct health probe (no Docker dependency, never 502) ────────────────
    location = /nginx-health {
        return 200 '{"status":"ok","server":"host-nginx"}';
        add_header Content-Type application/json always;
    }

    # ── Proxy everything else to Docker api-gateway ───────────────────────────
    location / {
        proxy_pass         http://docker_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;

        # Serve maintenance page when Docker is down
        proxy_intercept_errors on;
        error_page 502 503 504 =200 /maintenance.html;
    }

    location = /maintenance.html {
        root /var/www/gula-maintenance;
        internal;
    }

    # ── Friendly error pages ──────────────────────────────────────────────────
    # Converts 502/503/504 (Docker down, starting, or slow) into a structured
    # JSON response that the GULA frontend can parse and display in Arabic.
    error_page 502 503 504 = @gateway_error;
    location @gateway_error {
        default_type application/json;
        add_header Retry-After 15 always;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"Service temporarily unavailable \xe2\x80\x94 please try again shortly","error_ar":"\u0627\u0644\u062e\u062f\u0645\u0629 \u063a\u064a\u0631 \u0645\u062a\u0627\u062d\u0629 \u0645\u0624\u0642\u062a\u0627\u064b \u2014 \u062d\u0627\u0648\u0644 \u0645\u0631\u0629 \u0623\u062e\u0631\u0649","retry_after":15}';
    }
}
