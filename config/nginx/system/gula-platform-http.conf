# =============================================================================
# GULA PLATFORM — System Nginx (HTTP, pre-SSL)
#
# Architecture: Internet → System nginx (80) → Docker api-gateway (127.0.0.1:8080)
#
# Install (done automatically by deploy.sh):
#   sudo cp config/nginx/system/gula-platform-http.conf /etc/nginx/sites-available/gula-platform
#   sudo ln -sf /etc/nginx/sites-available/gula-platform /etc/nginx/sites-enabled/gula-platform
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# After SSL is set up (./scripts/setup-https.sh), this file is replaced by
# the SSL-enabled version which redirects HTTP→HTTPS and also proxies 443→Docker:8443.
# =============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name gula-platform.org www.gula-platform.org _;

    # ── Let's Encrypt ACME challenge ─────────────────────────────────────────
    # Must remain on HTTP — certbot writes files here for domain validation.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # ── Block common scanning paths ───────────────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }
    location ~* (wp-admin|phpmyadmin|\.env|\.git|xmlrpc\.php|\.php$) {
        deny all;
        return 404;
    }

    # ── Health probe (direct from host, no 502 risk) ──────────────────────────
    # Lets monitoring tools check if Docker is reachable from this nginx.
    location = /nginx-health {
        return 200 '{"status":"ok","server":"host-nginx"}';
        add_header Content-Type application/json;
    }

    # ── Proxy everything else to Docker api-gateway ───────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    30s;

        # Show friendly error page when Docker is down instead of bare nginx error
        proxy_intercept_errors on;
    }

    # ── Friendly error pages ──────────────────────────────────────────────────
    error_page 502 503 504 = @gateway_error;
    location @gateway_error {
        default_type application/json;
        return 503 '{"error":"Service temporarily unavailable — please try again shortly","error_ar":"\u0627\u0644\u062e\u062f\u0645\u0629 \u063a\u064a\u0631 \u0645\u062a\u0627\u062d\u0629 \u0645\u0624\u0642\u062a\u0627\u064b \u2014 \u062d\u0627\u0648\u0644 \u0645\u0631\u0629 \u0623\u062e\u0631\u0649"}';
    }

    client_max_body_size 50M;
    server_tokens off;
}
