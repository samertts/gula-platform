# =============================================================================
# GULA PLATFORM - System Nginx (HTTP only, no SSL)
# Use this until SSL certificates are set up with certbot.
#
# Install:
#   sudo cp config/nginx/system/gula-platform-http.conf /etc/nginx/sites-available/gula-platform
#   sudo ln -sf /etc/nginx/sites-available/gula-platform /etc/nginx/sites-enabled/gula-platform
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Architecture:
#   Internet → System nginx (port 80) → Docker api-gateway (127.0.0.1:8080)
#   Docker api-gateway → gula-backend:8000 / frontend:80
# =============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name gula-platform.org www.gula-platform.org _;

    # Let's Encrypt ACME challenge (needed when setting up SSL later)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy everything to Docker api-gateway on port 8080
    # Docker compose maps: api-gateway container port 80 → host port 8080
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;

        # Return friendly JSON on gateway errors instead of bare nginx page
        proxy_intercept_errors on;
    }

    # Friendly error pages
    error_page 502 503 504 = @gateway_error;
    location @gateway_error {
        default_type application/json;
        return 503 '{"error":"Service temporarily unavailable — please try again shortly","error_ar":"\u0627\u0644\u062e\u062f\u0645\u0629 \u063a\u064a\u0631 \u0645\u062a\u0627\u062d\u0629 \u0645\u0624\u0642\u062a\u0627\u064b \u2014 \u062d\u0627\u0648\u0644 \u0645\u0631\u0629 \u0623\u062e\u0631\u0649","retry_after":30}';
    }

    client_max_body_size 50M;
}
