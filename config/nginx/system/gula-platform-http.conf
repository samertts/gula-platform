# =============================================================================
# GULA PLATFORM - System Nginx (HTTP only, no SSL)
# Use this until SSL certificates are set up with certbot
# Install: sudo cp this /etc/nginx/sites-available/gula-platform
# Enable: sudo ln -sf /etc/nginx/sites-available/gula-platform /etc/nginx/sites-enabled/
# Remove default: sudo rm -f /etc/nginx/sites-enabled/default
# Test & reload: sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name gula-platform.org www.gula-platform.org _;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy everything to Docker api-gateway on port 8080
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;

        # Serve maintenance page when Docker is down
        proxy_intercept_errors on;
        error_page 502 503 504 =200 /maintenance.html;
    }

    location = /maintenance.html {
        root /var/www/gula-maintenance;
        internal;
    }

    client_max_body_size 50M;
}
