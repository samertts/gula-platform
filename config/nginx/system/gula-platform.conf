# =============================================================================
# GULA PLATFORM - System Nginx Reverse Proxy
# Install on server: sudo cp this /etc/nginx/sites-available/gula-platform
# Enable: sudo ln -sf /etc/nginx/sites-available/gula-platform /etc/nginx/sites-enabled/
# Test: sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# Rate limiting
limit_req_zone $binary_remote_addr zone=general:10m rate=100r/m;

# HTTP → HTTPS redirect + Let's Encrypt
server {
    listen 80;
    listen [::]:80;
    server_name gula-platform.org www.gula-platform.org;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check (allow over HTTP for monitoring)
    location /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gula-platform.org www.gula-platform.org;

    # SSL certificates (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/gula-platform.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gula-platform.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy everything to Docker api-gateway
    location / {
        limit_req zone=general burst=20 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
    }

    # Upload size limit
    client_max_body_size 50M;
}
