# =============================================================================
# GULA PLATFORM - System Nginx Reverse Proxy (HTTPS)
# Use after SSL certificates are issued with certbot.
#
# Install:
#   sudo cp config/nginx/system/gula-platform.conf /etc/nginx/sites-available/gula-platform
#   sudo ln -sf /etc/nginx/sites-available/gula-platform /etc/nginx/sites-enabled/gula-platform
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Architecture:
#   Internet (80)  → redirect to HTTPS
#   Internet (443) → System nginx (SSL termination) → Docker api-gateway (127.0.0.1:8080)
#   Docker api-gateway → gula-backend:8000 / frontend:80
# =============================================================================

# Rate limiting
limit_req_zone $binary_remote_addr zone=general:10m rate=100r/m;

# HTTP → HTTPS redirect + Let's Encrypt
server {
    listen 80;
    listen [::]:80;
    server_name gula-platform.org www.gula-platform.org;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check allowed over HTTP for monitoring/uptime checks
    location /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gula-platform.org www.gula-platform.org;

    # SSL certificates (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/gula-platform.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gula-platform.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:!aNULL:!eNULL:!EXPORT:!DES:!RC4:!MD5:!PSK:!SRP:!CAMELLIA;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy everything to Docker api-gateway on port 8080
    # Docker compose maps: api-gateway container port 80 → host port 8080
    location / {
        limit_req zone=general burst=20 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;

        # Serve maintenance page when Docker is down
        proxy_intercept_errors on;
        error_page 502 503 504 =200 /maintenance.html;
    }

    location = /maintenance.html {
        root /var/www/gula-maintenance;
        internal;
    }

    client_max_body_size 50M;
}
