# GULA DEMO API — isolated synthetic-data service.
# Prerequisites:
#   1. Create DNS A/AAAA record for demo-api.gula-platform.org.
#   2. Run: sudo certbot certonly --standalone -d demo-api.gula-platform.org
#   3. Start: docker compose --env-file .env.demo -f docker-compose.demo.yml up -d
# Install this file as a separate host nginx site; do NOT merge it into the live
# platform site and do NOT proxy it to the production api-gateway.

upstream gula_demo_api {
    server 127.0.0.1:8090 max_fails=2 fail_timeout=10s;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name demo-api.gula-platform.org;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name demo-api.gula-platform.org;

    server_tokens off;
    client_max_body_size 10M;

    ssl_certificate     /etc/letsencrypt/live/demo-api.gula-platform.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo-api.gula-platform.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-store" always;

    location ~ /\. {
        deny all;
        return 404;
    }
    location ~* (\.env|\.git|wp-admin|phpmyadmin|xmlrpc\.php|\.php$) {
        deny all;
        return 404;
    }

    location = /nginx-health {
        default_type application/json;
        return 200 '{"status":"ok","service":"gula-demo-api","data":"synthetic-only"}';
    }

    location / {
        proxy_pass         http://gula_demo_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        "";
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
    }

    error_page 502 503 504 = @demo_unavailable;
    location @demo_unavailable {
        default_type application/json;
        add_header Retry-After 15 always;
        return 503 '{"error":"Demo service temporarily unavailable","error_ar":"خدمة العرض التجريبي غير متاحة مؤقتاً"}';
    }
}
