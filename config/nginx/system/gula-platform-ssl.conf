# =============================================================================
# GULA PLATFORM — System Nginx (HTTPS + HTTP→HTTPS redirect)
#
# Prerequisites:
#   sudo certbot certonly --standalone -d gula-platform.org -d www.gula-platform.org
#
# Install:
#   sudo cp config/nginx/system/gula-platform-ssl.conf /etc/nginx/sites-available/gula-platform
#   sudo nginx -t && sudo systemctl reload nginx
#
# Architecture:
#   Internet :80  → 301 redirect to HTTPS
#   Internet :443 → SSL termination here → Docker api-gateway (127.0.0.1:8080)
#
# SSL is terminated at host nginx. Traffic to Docker travels over localhost (HTTP).
# =============================================================================

upstream docker_gateway {
    server 127.0.0.1:8080 max_fails=2 fail_timeout=10s;
    keepalive 8;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name gula-platform.org www.gula-platform.org;

    server_tokens off;

    # Let's Encrypt ACME renewal (must stay on HTTP)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Host health probe (no Docker dependency)
    location = /nginx-health {
        return 200 '{"status":"ok","server":"host-nginx"}';
        add_header Content-Type application/json always;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2  on;
    server_name gula-platform.org www.gula-platform.org;

    server_tokens off;
    client_max_body_size 50M;

    # ── SSL certificates (Let's Encrypt) ──────────────────────────────────────
    # Update the path suffix (-0001) to match your certbot output
    ssl_certificate     /etc/letsencrypt/live/gula-platform.org-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gula-platform.org-0001/privkey.pem;

    # ── TLS hardening ─────────────────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # HSTS — tells browsers to always use HTTPS for 1 year
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Block common scanning paths ────────────────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }
    location ~* (wp-admin|phpmyadmin|\.env|\.git|xmlrpc\.php|\.php$) {
        deny all;
        return 404;
    }

    # ── Host health probe ──────────────────────────────────────────────────────
    location = /nginx-health {
        return 200 '{"status":"ok","server":"host-nginx","tls":"yes"}';
        add_header Content-Type application/json always;
    }

    # ── Proxy everything to Docker api-gateway ─────────────────────────────────
    location / {
        proxy_pass         http://docker_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        "";

        proxy_connect_timeout  15s;
        proxy_read_timeout    120s;
        proxy_send_timeout     60s;

        proxy_next_upstream         error timeout;
        proxy_next_upstream_tries   2;
        proxy_next_upstream_timeout 20s;

        proxy_intercept_errors on;
    }

    # ── Friendly error pages ───────────────────────────────────────────────────
    error_page 502 503 504 = @gateway_error;
    location @gateway_error {
        default_type application/json;
        add_header Retry-After    15  always;
        add_header Cache-Control  "no-store" always;
        return 503 '{"error":"Service temporarily unavailable","error_ar":"\u0627\u0644\u062e\u062f\u0645\u0629 \u063a\u064a\u0631 \u0645\u062a\u0627\u062d\u0629 \u0645\u0624\u0642\u062a\u0627\u064b","retry_after":15}';
    }
}
