<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GULA — صيانة مؤقتة</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: #0f172a;
    color: #f1f5f9;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .logo {
    font-size: 3rem;
    font-weight: 900;
    background: linear-gradient(135deg, #6366f1, #22d3ee);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 0.5rem;
    letter-spacing: -1px;
  }
  .subtitle { color: #94a3b8; font-size: 1rem; margin-bottom: 3rem; }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 1rem;
    padding: 2.5rem;
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  .icon { font-size: 3rem; margin-bottom: 1rem; }
  h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.75rem; color: #f1f5f9; }
  p { color: #94a3b8; line-height: 1.7; font-size: 0.95rem; margin-bottom: 1.5rem; }
  .badge {
    display: inline-block;
    background: #1d4ed8;
    color: #bfdbfe;
    font-size: 0.75rem;
    padding: 0.3rem 0.8rem;
    border-radius: 9999px;
    margin-bottom: 1.5rem;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 0.9rem;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff;
    border: none;
    border-radius: 0.6rem;
    font-size: 1rem;
    cursor: pointer;
    text-decoration: none;
    transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.85; }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid #334155;
    border-top-color: #6366f1;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 1.5rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="logo">GULA</div>
  <div class="subtitle">منصة المختبرات الطبية الذكية</div>
  <div class="card">
    <div class="spinner"></div>
    <div class="badge">جاري التشغيل</div>
    <h1>النظام قيد الإقلاع</h1>
    <p>المنصة تعمل على الإقلاع الكامل. ستكون متاحة خلال دقيقة أو أقل. الرجاء تحديث الصفحة.</p>
    <a class="btn" href="javascript:location.reload()">تحديث الصفحة</a>
  </div>
  <script>
    // Auto-refresh every 15 seconds until the server is back
    setTimeout(() => location.reload(), 15000);
  </script>
</body>
</html>
