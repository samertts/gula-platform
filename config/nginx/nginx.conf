# =============================================================================
# GULA PLATFORM - Nginx API Gateway
# =============================================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time req_id=$request_id';

    access_log  /var/log/nginx/access.log  main;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Security: Hide nginx version
    server_tokens off;

    # Default request body size limit (overridden per-location where needed)
    client_max_body_size 1M;

    # =========================================================================
    # Rate Limiting Zones
    # =========================================================================
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=health_limit:1m  rate=60r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # =========================================================================
    # Upstream Services (only core services that must be running)
    # =========================================================================
    upstream gula_backend {
        server gula-backend:8000;
        keepalive 32;
    }

    upstream gula_frontend {
        server gula-frontend:80;
        keepalive 16;
    }

    # =========================================================================
    # IP Blocklist
    # =========================================================================
    geo $blocked_ip {
        default 0;
    }

    include /etc/nginx/conf.d/*.conf;
}
