# =============================================================================
# GULA PLATFORM - Nginx API Gateway
# =============================================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time req_id=$request_id upstream=$upstream_addr '
                    'upstream_status=$upstream_status upstream_rt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Docker DNS resolver for upstream container name resolution
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Global proxy resiliency defaults
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 20s;

    # Gzip compression (60-70% size reduction)
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # Open file cache for static assets
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Security: Hide nginx version
    server_tokens off;

    # Default request body size limit (overridden per-location where needed)
    client_max_body_size 1M;

    # =========================================================================
    # Rate Limiting Zones
    # =========================================================================
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=health_limit:1m  rate=60r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # =========================================================================
    # Upstream Services
    # NOTE: Using variables in proxy_pass forces runtime DNS re-resolution
    # via the resolver directive above. This prevents stale IPs after
    # container restarts (standard nginx doesn't support 'resolve' in upstream).
    # =========================================================================
    upstream gula_backend {
        server gula-backend:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream gula_frontend {
        server frontend:80 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # =========================================================================
    # IP Blocklist
    # =========================================================================
    geo $blocked_ip {
        default 0;
    }

    include /etc/nginx/conf.d/*.conf;
}
