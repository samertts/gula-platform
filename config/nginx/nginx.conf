# =============================================================================
# GULA PLATFORM - Nginx API Gateway
# Executive Order 15: Rate limiting, IP filtering, Security headers
# =============================================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format with request ID for tracing
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time '
                    'req_id=$request_id';

    access_log  /var/log/nginx/access.log  main;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Security: Hide nginx version
    server_tokens off;

    # =========================================================================
    # Rate Limiting Zones (Executive Order 15)
    # =========================================================================

    # Per IP rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=health_limit:1m  rate=60r/m;

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # =========================================================================
    # Upstream Services
    # =========================================================================

    upstream lab_service {
        server lab-service:8000;
        keepalive 32;
    }

    upstream patient_service {
        server patient-service:8000;
        keepalive 32;
    }

    upstream order_service {
        server order-service:8000;
        keepalive 32;
    }

    upstream result_service {
        server result-service:8000;
        keepalive 32;
    }

    upstream sample_service {
        server sample-service:8000;
        keepalive 32;
    }

    upstream ai_service {
        server ai-service:9000;
        keepalive 16;
    }

    upstream notification_service {
        server notification-service:8000;
        keepalive 16;
    }

    # =========================================================================
    # IP Blocklist (WAF - Basic)
    # =========================================================================
    geo $blocked_ip {
        default 0;
        # Add malicious IPs here
        # 192.168.1.100 1;
    }

    include /etc/nginx/conf.d/*.conf;
}
