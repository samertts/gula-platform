# =============================================================================
# GULA PLATFORM - Nginx API Gateway (Production-Hardened)
# =============================================================================

user  nginx;
# auto = one worker per CPU core (optimal for I/O-bound proxy workloads)
worker_processes  auto;
# Allow each worker to open 65535 file descriptors (connections + static files)
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    # Max simultaneous connections per worker process.
    # Total capacity = worker_processes × worker_connections.
    # On a 2-core VPS: 2 × 8192 = 16384 concurrent connections.
    worker_connections  8192;
    use epoll;
    multi_accept on;
    accept_mutex off;   # off is faster when multi_accept is on
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Structured Logging ─────────────────────────────────────────────────────
    log_format main
        '$remote_addr [$time_iso8601] "$request" '
        '$status $body_bytes_sent $request_time '
        'req_id=$request_id '
        'upstream=$upstream_addr upstream_status=$upstream_status upstream_rt=$upstream_response_time '
        '"$http_user_agent" "$http_x_forwarded_for"';

    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"bytes":$body_bytes_sent,'
            '"duration":$request_time,'
            '"req_id":"$request_id",'
            '"upstream":"$upstream_addr",'
            '"upstream_status":"$upstream_status",'
            '"upstream_rt":"$upstream_response_time",'
            '"user_agent":"$http_user_agent",'
            '"forwarded_for":"$http_x_forwarded_for"'
        '}';

    access_log  /var/log/nginx/access.log  main buffer=64k flush=5s;
    access_log  /var/log/nginx/access.json json_combined buffer=64k flush=5s;

    # ── Core Performance ───────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    # Keep connections alive for 65s (matches uvicorn --timeout-keep-alive 65)
    keepalive_timeout  65;
    keepalive_requests 1000;
    types_hash_max_size 2048;

    # ── Request Buffering ──────────────────────────────────────────────────────
    # Buffer small request bodies in memory (avoids temp files for normal POSTs)
    client_body_buffer_size    16k;
    client_header_buffer_size  1k;
    large_client_header_buffers 4 8k;
    # Timeout for reading the client request body
    client_body_timeout   30s;
    client_header_timeout 15s;
    # Timeout for sending response to slow clients (keeps connections from hanging)
    send_timeout          30s;

    # ── Proxy Buffering ────────────────────────────────────────────────────────
    # Buffer backend responses in memory — reduces latency for small responses
    proxy_buffering        on;
    proxy_buffer_size      16k;   # headers + first chunk
    proxy_buffers          8 32k; # body buffers
    proxy_busy_buffers_size 64k;
    # Large responses (PDF, batch exports) spill to temp files
    proxy_temp_file_write_size 64k;
    proxy_max_temp_file_size   1024m;

    # ── Docker DNS ─────────────────────────────────────────────────────────────
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # ── Global Proxy Resiliency ────────────────────────────────────────────────
    proxy_connect_timeout  10s;
    proxy_read_timeout     30s;
    proxy_send_timeout     30s;
    # Do NOT retry on http_500: retrying a 500 amplifies load under pressure.
    # Only retry on genuine network failures (error, timeout) and bad-gateway codes.
    proxy_next_upstream    error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries   2;
    proxy_next_upstream_timeout 15s;
    proxy_intercept_errors on;

    # ── Gzip Compression ───────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;      # 5 is sweet spot: good ratio, low CPU
    gzip_min_length   512;
    gzip_proxied      any;
    gzip_disable      "msie6";
    gzip_types
        text/plain text/css text/xml text/javascript text/x-component
        application/json application/javascript application/xml
        application/rss+xml application/atom+xml
        image/svg+xml font/woff2;

    # ── Open File Cache ────────────────────────────────────────────────────────
    open_file_cache          max=2000 inactive=60s;
    open_file_cache_valid    120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # ── Security ───────────────────────────────────────────────────────────────
    server_tokens off;
    # Prevent clickjacking at proxy level (also set per-server block)
    # Note: more_clear_headers requires nginx-extras; use add_header to override instead

    # Default request body limit (overridden per-location)
    client_max_body_size 2M;    # Reduced to mitigate DoS attacks

    # ── Rate Limiting Zones ────────────────────────────────────────────────────
    # Shared memory zones for rate limiting across all worker processes.
    # Zone sizes: 1MB holds ~16K IP addresses.
    limit_req_zone  $binary_remote_addr zone=api_limit:20m    rate=120r/m;
    limit_req_zone  $binary_remote_addr zone=auth_limit:10m   rate=10r/m;
    limit_req_zone  $binary_remote_addr zone=upload_limit:5m  rate=20r/m;
    limit_req_zone  $binary_remote_addr zone=health_limit:1m  rate=120r/m;
    limit_req_zone  $binary_remote_addr zone=public_limit:10m rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:20m;

    # Return 429 (not 503) for rate-limited requests
    limit_req_status  429;
    limit_conn_status 429;

    # ── Upstream Services ──────────────────────────────────────────────────────
    upstream gula_backend {
        # Single backend container — keepalive pool reduces connection overhead
        server gula-backend:8000 max_fails=5 fail_timeout=30s;
        keepalive          64;   # idle keepalive connections per worker
        keepalive_requests 500;  # reuse each keepalive connection up to 500 times
        keepalive_timeout  65s;  # matches uvicorn keepalive
    }

    upstream gula_frontend {
        server frontend:80 max_fails=3 fail_timeout=30s;
        keepalive          16;
        keepalive_requests 200;
        keepalive_timeout  30s;
    }

    # ── Proxy Cache ────────────────────────────────────────────────────────────
    # On-disk cache for public result pages and static assets.
    # Reduces backend load when patients share result links (viral traffic).
    proxy_cache_path /tmp/nginx_cache
        levels=1:2
        keys_zone=api_cache:20m
        max_size=256m
        inactive=10m
        use_temp_path=off;

    # ── IP Blocklist ───────────────────────────────────────────────────────────
    # Populated dynamically by the API firewall via Redis → nginx reload.
    # Format: "1.2.3.4 1;" to block.
    geo $blocked_ip {
        default 0;
    }

    include /etc/nginx/conf.d/*.conf;
}
