# =============================================================================
# GULA PLATFORM - Docker API Gateway (HTTP)
# =============================================================================
# This file handles HTTP traffic (port 80).
# After running scripts/setup-https.sh, ssl.conf is auto-generated alongside
# this file and takes over HTTPS (443) + HTTP→HTTPS redirect for the domain.
#
# Architecture (two-layer nginx):
#   Internet :80/:443
#       ↓
#   Host system nginx (Ubuntu package — handles SSL, certbot, blocks scanners)
#       ↓ 127.0.0.1:8080
#   Docker api-gateway (this container — routing, rate-limiting, security headers)
#       ↓
#   gula-backend:8000  /  frontend:80
# =============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # =========================================================================
    # Security headers (applied to all responses)
    # =========================================================================
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self' https://gula-platform.org; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; manifest-src 'self';" always;
    add_header X-Request-ID $request_id always;

    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # Block known malicious IPs
    if ($blocked_ip) {
        return 403 '{"error": "Access denied"}';
    }

    # Connection limit per IP
    limit_conn conn_limit 100;

    # =========================================================================
    # Let's Encrypt ACME challenge (certbot webroot)
    # Must work over HTTP — do NOT redirect this path
    # =========================================================================
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # =========================================================================
    # Block sensitive paths
    # =========================================================================
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~* (wp-admin|phpmyadmin|\.env|\.git|xmlrpc\.php) {
        deny all;
        return 404;
    }

    # =========================================================================
    # Internal-only endpoints (Prometheus scrapes backend directly — never expose externally)
    # =========================================================================
    location ~ ^/metrics {
        # Prometheus scrapes gula-backend:8000 directly inside Docker network.
        # This block ensures the endpoint is NEVER reachable via the public gateway.
        deny all;
        return 404;
    }

    # =========================================================================
    # Health Checks (always available)
    # =========================================================================
    # Health endpoints: NEVER cache, never buffer, direct pass-through
    # Caching a stale 200 would hide real failures from Docker healthcheck
    location = /health {
        # No rate limit — docker healthcheck and monitoring must always reach this
        proxy_pass http://gula_backend/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_buffering off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /health/ready {
        proxy_pass http://gula_backend/health/ready;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_buffering off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /health/live {
        return 200 '{"status":"alive","service":"gula-gateway"}';
        add_header Content-Type application/json;
        add_header Cache-Control "no-store" always;
    }

    location = /health/status {
        proxy_pass http://gula_backend/health/status;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_buffering off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /health/backend {
        proxy_pass http://gula_backend/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location /health/ {
        proxy_pass http://gula_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_buffering off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /health/frontend {
        proxy_pass http://gula_frontend/;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # =========================================================================
    # Backend API
    # =========================================================================
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://gula_backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        # Never cache authenticated API responses
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header X-API-Version "1.0" always;
    }

    # API v1 alias - stable versioned path for government and mobile integrations
    # /api/v1/patients -> /api/patients (same backend, versioned URL)
    location /api/v1/ {
        limit_req zone=api_limit burst=20 nodelay;
        rewrite ^/api/v1/(.*)$ /api/$1 last;
    }

    # Direct backend routes (no /api/ prefix — mobile apps and legacy clients)
    location /auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://gula_backend/auth/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 15s;
    }

    location /mobile/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://gula_backend/mobile/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Device-ID $http_x_device_id;
        proxy_set_header X-App-Version $http_x_app_version;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location /compliance/ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://gula_backend/compliance/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location /login {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://gula_backend/login;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 15s;
    }

    location /logout {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://gula_backend/logout;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 10s;
    }

    location /register {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://gula_backend/register;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 15s;
    }

    # QR code and public result pages (direct backend access)
    location ~ ^/r/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://gula_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /upload {
        limit_req zone=upload_limit burst=5 nodelay;
        client_max_body_size 50M;
        proxy_pass http://gula_backend/upload;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # =========================================================================
    # API Documentation
    # =========================================================================
    location /docs {
        proxy_pass http://gula_backend/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /redoc {
        proxy_pass http://gula_backend/redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://gula_backend/openapi.json;
        proxy_set_header Host $host;
    }

    # =========================================================================
    # Public result pages — API data (cached, immutable once published)
    # =========================================================================
    # Must be before generic /api/ block so it gets its own cache config
    location /api/r/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://gula_backend/r/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Lab results are immutable once created — safe to cache at nginx
        # for 2 minutes to absorb burst traffic (patient sharing links)
        proxy_cache          api_cache;
        proxy_cache_key      "$scheme$request_method$host$uri";
        proxy_cache_valid    200 2m;
        proxy_cache_valid    404 30s;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock     on;
        proxy_cache_lock_timeout 5s;
        # Never serve OR store a cached response for an authenticated request
        # access_token = httpOnly JWT cookie set by FastAPI /login
        proxy_cache_bypass   $http_authorization $cookie_access_token;
        proxy_no_cache       $http_authorization $cookie_access_token;
        add_header           X-Cache-Status $upstream_cache_status always;
    }

    # =========================================================================
    # Public result pages — HTML shell (cached from frontend)
    # =========================================================================
    location /r/ {
        proxy_pass http://gula_frontend/r/;
        proxy_set_header Host $host;

        # Cache the HTML shell for 1 min (static — token is client-side JS)
        proxy_cache        api_cache;
        proxy_cache_key    "$scheme$request_method$host$uri";
        proxy_cache_valid  200 1m;
        proxy_cache_use_stale error timeout;
        add_header         X-Cache-Status $upstream_cache_status always;
    }

    # =========================================================================
    # Static assets — long browser cache (fingerprinted by build tool)
    # =========================================================================
    location ~* \.(js|css|woff2?|ttf|eot|otf|png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        proxy_pass http://gula_frontend;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 7-day browser cache — safe because Vite/webpack uses content-hashed filenames
        expires 7d;
        add_header Cache-Control "public, immutable" always;
        add_header Vary "Accept-Encoding" always;

        # Serve from nginx cache (avoids round-trip to frontend container)
        proxy_cache        api_cache;
        proxy_cache_key    "$uri";
        proxy_cache_valid  200 10m;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock   on;
    }

    # =========================================================================
    # Frontend SPA — catchall (must be last)
    # =========================================================================
    location / {
        proxy_pass http://gula_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # =========================================================================
    # Error pages
    # =========================================================================
    error_page 429 /429.json;
    location = /429.json {
        return 429 '{"error":"Rate limit exceeded","retry_after":60}';
        add_header Content-Type application/json;
        add_header Retry-After 60;
    }

    error_page 502 503 504 /50x.json;
    location = /50x.json {
        default_type application/json;
        return 503 '{"error":"Service temporarily unavailable","error_ar":"\u062e\u062f\u0645\u0629 \u063a\u064a\u0631 \u0645\u062a\u0627\u062d\u0629 \u0645\u0624\u0642\u062a\u0627\u064b","retry_after":30}';
    }

    client_max_body_size 10M;
}
