# =============================================================================
# GULA PLATFORM - API Gateway Routes
# =============================================================================

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name gula-platform.org www.gula-platform.org;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check (allow over HTTP for load balancer)
    location /health {
        return 200 '{"status":"ok","service":"gula-gateway"}';
        add_header Content-Type application/json;
    }

    location /health/backend {
        proxy_pass http://gula_backend/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /health/frontend {
        proxy_pass http://gula_frontend/;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Redirect all other HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name gula-platform.org www.gula-platform.org;

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Block known malicious IPs
    if ($blocked_ip) {
        return 403 '{"error": "Access denied"}';
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; manifest-src 'self';" always;
    add_header X-Request-ID $request_id always;

    # Connection limit
    limit_conn conn_limit 100;

    # =========================================================================
    # Health Check
    # =========================================================================
    location /health {
        limit_req zone=health_limit burst=10 nodelay;
        return 200 '{"status":"ok","service":"gula-gateway"}';
        add_header Content-Type application/json;
    }

    location /health/backend {
        proxy_pass http://gula_backend/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /health/frontend {
        proxy_pass http://gula_frontend/;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # =========================================================================
    # Backend API - ALL /api/ requests go to the main backend
    # =========================================================================
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://gula_backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    # =========================================================================
    # Backend direct routes (login, register, health, etc.)
    # These are routes on the backend that don't start with /api/
    # =========================================================================
    location /login {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://gula_backend/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /register {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://gula_backend/register;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /patients {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://gula_backend/patients;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    location /results {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://gula_backend/results;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    location /dashboard {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://gula_backend/dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    location /labs {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://gula_backend/labs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    location /samples {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://gula_backend/samples;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    location /admin {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://gula_backend/admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    location /test-types {
        proxy_pass http://gula_backend/test-types;
        proxy_set_header Host $host;
    }

    location /notifications {
        proxy_pass http://gula_backend/notifications;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /qr {
        proxy_pass http://gula_backend/qr;
        proxy_set_header Host $host;
    }

    location /id-scan {
        limit_req zone=upload_limit burst=5 nodelay;
        client_max_body_size 10M;
        proxy_pass http://gula_backend/id-scan;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Public result pages - serve frontend HTML
    # The frontend JS calls /api/results/api/r/{token} for data
    location /r/ {
        proxy_pass http://gula_frontend/r/;
        proxy_set_header Host $host;
    }

    # =========================================================================
    # File Upload
    # =========================================================================
    location /upload {
        limit_req zone=upload_limit burst=5 nodelay;
        client_max_body_size 50M;
        proxy_pass http://gula_backend/upload;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # =========================================================================
    # Block sensitive paths
    # =========================================================================
    location ~ /\. {
        deny all;
        return 404;
    }

    # =========================================================================
    # Frontend - serve UI for all other requests
    # =========================================================================
    location / {
        proxy_pass http://gula_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # =========================================================================
    # Error pages
    # =========================================================================
    error_page 429 /429.json;
    location = /429.json {
        return 429 '{"error":"Rate limit exceeded","retry_after":60}';
        add_header Content-Type application/json;
        add_header Retry-After 60;
    }

    error_page 502 503 504 /50x.json;
    location = /50x.json {
        return 503 '{"error":"Service temporarily unavailable"}';
        add_header Content-Type application/json;
    }
}
