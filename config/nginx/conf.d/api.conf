# =============================================================================
# GULA PLATFORM - Docker API Gateway Routes (HTTP only)
# SSL/TLS is handled by the system nginx reverse proxy on the host
#
# Routing philosophy:
#   /api/*        → backend (all application API calls)
#   /auth/*       → backend (mobile token refresh)
#   /mobile/*     → backend (mobile app endpoints)
#   /compliance/* → backend (FHIR / government testing)
#   /health*      → backend (monitoring probes)
#   /r/*          → frontend (public result pages)
#   /upload       → backend (large file upload, separate timeout)
#   /docs /redoc  → backend (API documentation)
#   everything else → frontend (SPA / static files)
# =============================================================================

server {
    listen 80 default_server;
    server_name _;

    # =========================================================================
    # Security headers (applied to all responses)
    # =========================================================================
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://gula-platform.org; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; manifest-src 'self';" always;
    add_header X-Request-ID $request_id always;

    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;
    proxy_hide_header X-AspNet-Version;
    proxy_hide_header X-AspNetMvc-Version;

    # Block known malicious IPs
    if ($blocked_ip) {
        return 403 '{"error": "Access denied"}';
    }

    # Connection limit
    limit_conn conn_limit 100;

    # =========================================================================
    # Block sensitive paths
    # =========================================================================
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~* (wp-admin|phpmyadmin|\.env|\.git|xmlrpc\.php) {
        deny all;
        return 404;
    }

    # =========================================================================
    # Health Checks
    # =========================================================================
    location /health {
        limit_req zone=health_limit burst=10 nodelay;
        proxy_pass http://gula_backend/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ready {
        proxy_pass http://gula_backend/health/ready;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/live {
        return 200 '{"status":"alive","service":"gula-gateway"}';
        add_header Content-Type application/json;
    }

    location /health/backend {
        proxy_pass http://gula_backend/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /health/frontend {
        proxy_pass http://gula_frontend/;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # =========================================================================
    # Backend API — single unified entry point
    # All application endpoints must use /api/ prefix
    # =========================================================================
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://gula_backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }

    # =========================================================================
    # Mobile API
    # =========================================================================
    location /auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://gula_backend/auth/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 15s;
    }

    location /mobile/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://gula_backend/mobile/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Device-ID $http_x_device_id;
        proxy_set_header X-App-Version $http_x_app_version;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # =========================================================================
    # Compliance & FHIR (government testing)
    # =========================================================================
    location /compliance/ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://gula_backend/compliance/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # =========================================================================
    # File Upload (separate timeout + size limit)
    # =========================================================================
    location /upload {
        limit_req zone=upload_limit burst=5 nodelay;
        client_max_body_size 50M;
        proxy_pass http://gula_backend/upload;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # =========================================================================
    # API Documentation
    # =========================================================================
    location /docs {
        proxy_pass http://gula_backend/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /redoc {
        proxy_pass http://gula_backend/redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://gula_backend/openapi.json;
        proxy_set_header Host $host;
    }

    # =========================================================================
    # Public result pages (frontend)
    # =========================================================================
    location /r/ {
        proxy_pass http://gula_frontend/r/;
        proxy_set_header Host $host;
    }

    # =========================================================================
    # Frontend — serve UI for all other requests (SPA + static files)
    # =========================================================================
    location / {
        proxy_pass http://gula_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }

    # =========================================================================
    # Error pages
    # =========================================================================
    error_page 429 /429.json;
    location = /429.json {
        return 429 '{"error":"Rate limit exceeded","retry_after":60}';
        add_header Content-Type application/json;
        add_header Retry-After 60;
    }

    error_page 502 503 504 /50x.json;
    location = /50x.json {
        default_type application/json;
        return 503 '{"error":"Service temporarily unavailable","error_ar":"\u062e\u062f\u0645\u0629 \u063a\u064a\u0631 \u0645\u062a\u0627\u062d\u0629 \u0645\u0624\u0642\u062a\u0627\u064b \u2014 \u0646\u0639\u0645\u0644 \u0639\u0644\u0649 \u0627\u0633\u062a\u0639\u0627\u062f\u062a\u0647\u0627","retry_after":30}';
    }
}
