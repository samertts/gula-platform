# =============================================================================
# GULA PLATFORM - Docker API Gateway Routes (HTTP only)
# SSL/TLS is handled by the system nginx reverse proxy on the host
# =============================================================================

server {
    listen 80 default_server;
    server_name _;

    # =========================================================================
    # Health Checks (for government testing, load balancers, Kubernetes)
    # =========================================================================
    location /health {
        limit_req zone=health_limit burst=10 nodelay;
        proxy_pass http://gula_backend/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
    }

    location /health/ready {
        proxy_pass http://gula_backend/health/ready;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_set_header Host $host;
    }

    location /health/live {
        return 200 '{"status":"alive","service":"gula-gateway"}';
        add_header Content-Type application/json;
    }

    location /health/backend {
        proxy_pass http://gula_backend/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /health/frontend {
        proxy_pass http://gula_frontend/;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # =========================================================================
    # Security headers (applied to all responses)
    # =========================================================================
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://gula-platform.org; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; manifest-src 'self';" always;
    add_header X-Request-ID $request_id always;

    # Hide backend framework information from responses
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;
    proxy_hide_header X-AspNet-Version;
    proxy_hide_header X-AspNetMvc-Version;

    # Block known malicious IPs
    if ($blocked_ip) {
        return 403 '{"error": "Access denied"}';
    }

    # Connection limit
    limit_conn conn_limit 100;

    # =========================================================================
    # Backend API - ALL /api/ requests
    # =========================================================================
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://gula_backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }

    # =========================================================================
    # Backend direct routes
    # =========================================================================
    location /login {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://gula_backend/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /logout {
        proxy_pass http://gula_backend/logout;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /register {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://gula_backend/register;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    # =========================================================================
    # Mobile API - Token Refresh & Device Registration
    # =========================================================================
    location /auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://gula_backend/auth/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 15s;
    }

    location /mobile/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://gula_backend/mobile/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Device-ID $http_x_device_id;
        proxy_set_header X-App-Version $http_x_app_version;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # =========================================================================
    # API Documentation (for government testers and developers)
    # =========================================================================
    location /docs {
        proxy_pass http://gula_backend/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /redoc {
        proxy_pass http://gula_backend/redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://gula_backend/openapi.json;
        proxy_set_header Host $host;
    }

    location /patients {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://gula_backend/patients;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    location /results {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://gula_backend/results;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    location /dashboard {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://gula_backend/dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    location /labs {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://gula_backend/labs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    location /samples {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://gula_backend/samples;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    location /admin {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://gula_backend/admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    location /test-types {
        proxy_cache api_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_pass http://gula_backend/test-types;
        proxy_set_header Host $host;
    }

    location /notifications {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://gula_backend/notifications;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    location /identity {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://gula_backend/identity;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    location /orders {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://gula_backend/orders;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    location /batch {
        limit_req zone=api_limit burst=5 nodelay;
        proxy_pass http://gula_backend/batch;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    location /qr {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://gula_backend/qr;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    location /id-scan {
        limit_req zone=upload_limit burst=5 nodelay;
        client_max_body_size 10M;
        proxy_pass http://gula_backend/id-scan;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Public result pages
    location /r/ {
        proxy_pass http://gula_frontend/r/;
        proxy_set_header Host $host;
    }

    # =========================================================================
    # File Upload
    # =========================================================================
    location /upload {
        limit_req zone=upload_limit burst=5 nodelay;
        client_max_body_size 50M;
        proxy_pass http://gula_backend/upload;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # =========================================================================
    # Compliance & FHIR endpoints (government testing)
    # =========================================================================
    location /compliance/ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://gula_backend/compliance/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    # =========================================================================
    # Block sensitive paths
    # =========================================================================
    location ~ /\. {
        deny all;
        return 404;
    }

    # Block common attack paths
    location ~* (wp-admin|phpmyadmin|\.env|\.git|xmlrpc\.php) {
        deny all;
        return 404;
    }

    # =========================================================================
    # Frontend - serve UI for all other requests
    # =========================================================================
    location / {
        proxy_pass http://gula_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }

    # =========================================================================
    # Error pages
    # =========================================================================
    error_page 429 /429.json;
    location = /429.json {
        return 429 '{"error":"Rate limit exceeded","retry_after":60}';
        add_header Content-Type application/json;
        add_header Retry-After 60;
    }

    error_page 502 503 504 /50x.json;
    location = /50x.json {
        return 503 '{"error":"Service temporarily unavailable"}';
        add_header Content-Type application/json;
    }
}
