# =============================================================================
# GULA PLATFORM - Docker API Gateway (HTTP)
# =============================================================================
# This file handles HTTP traffic (port 80).
# After running scripts/setup-https.sh, ssl.conf is auto-generated alongside
# this file and takes over HTTPS (443) + HTTP→HTTPS redirect for the domain.
#
# Architecture (no double nginx):
#   Internet :80/:443
#       ↓
#   Docker api-gateway (this container)
#       ↓
#   gula-backend:8000  /  frontend:80
# =============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # =========================================================================
    # Security headers
    # =========================================================================
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://gula-platform.org; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; manifest-src 'self';" always;
    add_header X-Request-ID $request_id always;

    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # Block known malicious IPs
    if ($blocked_ip) {
        return 403 '{"error": "Access denied"}';
    }

    # Connection limit per IP
    limit_conn conn_limit 100;

    # =========================================================================
    # Let's Encrypt ACME challenge (certbot webroot)
    # Must work over HTTP — do NOT redirect this path
    # =========================================================================
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # =========================================================================
    # Block sensitive paths
    # =========================================================================
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~* (wp-admin|phpmyadmin|\.env|\.git|xmlrpc\.php) {
        deny all;
        return 404;
    }

    # =========================================================================
    # Health Checks (always available)
    # =========================================================================
    location = /health {
        limit_req zone=health_limit burst=10 nodelay;
        proxy_pass http://gula_backend/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health/ready {
        proxy_pass http://gula_backend/health/ready;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health/live {
        return 200 '{"status":"alive","service":"gula-gateway"}';
        add_header Content-Type application/json;
    }

    location = /health/backend {
        proxy_pass http://gula_backend/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location = /health/frontend {
        proxy_pass http://gula_frontend/;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # =========================================================================
    # Backend API
    # =========================================================================
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://gula_backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }

    # Direct backend routes (no /api/ prefix — mobile apps and legacy clients)
    location /auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://gula_backend/auth/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 15s;
    }

    location /mobile/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://gula_backend/mobile/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Device-ID $http_x_device_id;
        proxy_set_header X-App-Version $http_x_app_version;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location /compliance/ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://gula_backend/compliance/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location /login {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://gula_backend/login;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 15s;
    }

    location /upload {
        limit_req zone=upload_limit burst=5 nodelay;
        client_max_body_size 50M;
        proxy_pass http://gula_backend/upload;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # =========================================================================
    # API Documentation
    # =========================================================================
    location /docs {
        proxy_pass http://gula_backend/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /redoc {
        proxy_pass http://gula_backend/redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://gula_backend/openapi.json;
        proxy_set_header Host $host;
    }

    # =========================================================================
    # Public result pages
    # =========================================================================
    location /r/ {
        proxy_pass http://gula_frontend/r/;
        proxy_set_header Host $host;
    }

    # =========================================================================
    # Frontend SPA — catchall (must be last)
    # =========================================================================
    location / {
        proxy_pass http://gula_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # =========================================================================
    # Error pages
    # =========================================================================
    error_page 429 /429.json;
    location = /429.json {
        return 429 '{"error":"Rate limit exceeded","retry_after":60}';
        add_header Content-Type application/json;
        add_header Retry-After 60;
    }

    error_page 502 503 504 /50x.json;
    location = /50x.json {
        default_type application/json;
        return 503 '{"error":"Service temporarily unavailable","error_ar":"\u062e\u062f\u0645\u0629 \u063a\u064a\u0631 \u0645\u062a\u0627\u062d\u0629 \u0645\u0624\u0642\u062a\u0627\u064b","retry_after":30}';
    }

    client_max_body_size 10M;
}
