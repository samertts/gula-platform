# =============================================================================
# GULA PLATFORM - API Gateway Routes
# =============================================================================

server {
    listen 80;
    server_name _;

    # Block known malicious IPs
    if ($blocked_ip) {
        return 403 '{"error": "Access denied"}';
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" always;
    add_header X-Request-ID $request_id always;

    # Connection limit
    limit_conn conn_limit 100;

    # =========================================================================
    # Health Check
    # =========================================================================
    location /health {
        limit_req zone=health_limit burst=10 nodelay;
        return 200 '{"status":"ok","service":"gula-gateway"}';
        add_header Content-Type application/json;
    }

    # =========================================================================
    # Authentication endpoints - strict rate limit
    # =========================================================================
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://keycloak:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    # =========================================================================
    # Lab Service
    # =========================================================================
    location /api/labs/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://lab_service/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # =========================================================================
    # Patient Service
    # =========================================================================
    location /api/patients/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://patient_service/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # =========================================================================
    # Order Service
    # =========================================================================
    location /api/orders/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://order_service/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # =========================================================================
    # Result Service
    # =========================================================================
    location /api/results/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://result_service/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # =========================================================================
    # Sample Service
    # =========================================================================
    location /api/samples/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://sample_service/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # =========================================================================
    # AI Service
    # =========================================================================
    location /api/ai/ {
        limit_req zone=api_limit burst=5 nodelay;
        proxy_pass http://ai_service/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # =========================================================================
    # File Upload - lower rate limit
    # =========================================================================
    location /api/upload/ {
        limit_req zone=upload_limit burst=5 nodelay;
        client_max_body_size 50M;
        proxy_pass http://result_service/upload/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # =========================================================================
    # Block sensitive paths
    # =========================================================================
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~ ^/(admin|config|internal)/ {
        allow 172.20.0.0/16;
        deny all;
    }

    # =========================================================================
    # Error pages
    # =========================================================================
    error_page 429 /429.json;
    location = /429.json {
        return 429 '{"error":"Rate limit exceeded","retry_after":60}';
        add_header Content-Type application/json;
        add_header Retry-After 60;
    }

    error_page 502 503 504 /50x.json;
    location = /50x.json {
        return 503 '{"error":"Service temporarily unavailable"}';
        add_header Content-Type application/json;
    }
}
