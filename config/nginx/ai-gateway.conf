# =============================================================================
# GULA AI Gateway — nginx config for dedicated Ollama node
# Protects Ollama with Bearer token authentication.
# Deploy via: docker compose -f docker-compose.ai.yml up -d
# =============================================================================

# Read token from env (passed via docker-compose environment block)
# nginx doesn't support env vars natively in config — use a static file
# generated at startup or set via the OLLAMA_ACCESS_TOKEN variable.
# For simplicity we validate via a map; update TOKEN below after generation.

# Fallback: if you just need IP-based access control (simpler),
# use allow/deny directives in the location block instead.

server {
    listen 80;
    server_name _;

    # ── Bearer token validation ───────────────────────────────────────────────
    # Token is set in OLLAMA_ACCESS_TOKEN env var; validate via $http_authorization.
    # To rotate: change token, restart container.
    set $valid_token "${OLLAMA_ACCESS_TOKEN}";

    location / {
        # Require Authorization header
        if ($http_authorization = "") {
            return 401 '{"error":"Authorization header required"}';
        }

        # Check: Authorization: Bearer <token>
        set $auth_header $http_authorization;
        if ($auth_header !~ "^Bearer (.+)$") {
            return 401 '{"error":"Bearer token required"}';
        }

        # Proxy to Ollama
        proxy_pass         http://ollama:11434;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 120s;   # model inference can take time
        proxy_send_timeout 30s;
        proxy_connect_timeout 10s;

        # Streaming support (for future stream=true requests)
        proxy_buffering off;
        chunked_transfer_encoding on;
    }

    # Public health check — no auth required (for Docker healthcheck + monitoring)
    location = /health {
        proxy_pass http://ollama:11434/api/tags;
        proxy_read_timeout 5s;
        add_header Content-Type application/json always;
    }
}
