server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (defense-in-depth for static content)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Static assets - cache 1 year (immutable content)
    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Service Worker - never cache (must always be fresh)
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # PWA manifest
    location = /manifest.webmanifest {
        expires 7d;
        add_header Cache-Control "public";
    }

    # PWA offline shell
    location = /offline.html {
        try_files /offline.html =404;
        add_header Cache-Control "no-cache";
    }

    # PWA icons and favicon - cache 1 year (immutable)
    location ~* \.(png|svg|ico|webmanifest)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA fallback - HTML should revalidate
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Gzip (supplement global config)
    gzip on;
    gzip_types text/css application/javascript text/html text/xml image/svg+xml;
    gzip_min_length 256;
}
