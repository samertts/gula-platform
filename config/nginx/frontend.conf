server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets - cache 1 year (immutable content)
    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Service Worker - never cache (must always be fresh)
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # PWA manifest
    location = /manifest.json {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Login page
    location = /login.html {
        try_files /login.html =404;
        add_header Cache-Control "no-cache";
    }

    # Public result pages
    location ~ ^/r/ {
        try_files /result.html =404;
        add_header Cache-Control "no-cache";
    }

    # SPA fallback - HTML should revalidate
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Gzip (supplement global config)
    gzip on;
    gzip_types text/css application/javascript text/html text/xml image/svg+xml;
    gzip_min_length 256;
}
