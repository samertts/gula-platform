# GULA Platform — API Threat Protection Configuration
# WAF rules, rate limiting, request validation

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=strict:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=admin:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=concurrent:10m;

# IP blocklist
geo $blocked_ip {
    default 0;
    # Add blocked IPs here
}

map $http_user_agent $bad_bot {
    default 0;
    ~*(curl|wget|python-requests|go-http-client|scrapy|nmap|masscan|sqlmap) 1;
}

server {
    # Rate limiting
    location /api/ {
        limit_req zone=general burst=50 nodelay;
        limit_conn concurrent 50;
        
        if ($blocked_ip) {
            return 403;
        }
        
        if ($bad_bot) {
            return 403;
        }
    }
    
    # Strict rate limiting for auth
    location /api/login {
        limit_req zone=login burst=3 nodelay;
        limit_conn concurrent 5;
        
        if ($request_method !~ ^(POST)$) {
            return 405;
        }
        
        if ($http_content_type !~ ^application/json) {
            return 415;
        }
        
        if ($http_content_length ~ ^([0-9])$ || $http_content_length = "") {
            return 411 "Length Required";
        }
    }
    
    # Admin endpoints
    location /admin/ {
        limit_req zone=admin burst=2 nodelay;
        limit_conn concurrent 3;
        
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
    
    # Block common attack patterns
    location / {
        # SQL injection patterns
        if ($query_string ~* "(\bselect\b.*\bfrom\b|\bunion\b.*\bselect\b|\binsert\b.*\binto\b|\bdelete\b.*\bfrom\b|\bdrop\b.*\btable\b|'.*\bOR\b.*'=')") {
            return 403;
        }
        
        # XSS patterns
        if ($query_string ~* "(<script|<iframe|<embed|<object|onerror=|onload=|javascript:|alert\(|confirm\(|prompt\()") {
            return 403;
        }
        
        # Path traversal
        if ($uri ~* "\.\./|\.\.\\|/etc/passwd|/proc/self|/boot.ini") {
            return 403;
        }
        
        # Command injection
        if ($query_string ~* "(;|\||`|\$\{|%0a|%0d|%00)") {
            return 403;
        }
    }
    
    # Validate Content-Type for API requests
    location /api/ {
        if ($request_method ~ ^(POST|PUT|PATCH)$) {
            if ($http_content_type !~ ^application/json) {
                return 415 "Content-Type must be application/json";
            }
        }
    }
    
    # Restrict HTTP methods
    if ($request_method !~ ^(GET|POST|PUT|DELETE|PATCH|HEAD|OPTIONS)$) {
        return 405;
    }
    
    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}
