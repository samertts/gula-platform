# GULA Platform — Background Worker Configuration

workers:
  default:
    concurrency: 10
    max_retries: 5
    retry_delay: 60  # seconds
    max_backoff: 3600  # 1 hour
    queue: default
    
  high_priority:
    concurrency: 5
    max_retries: 3
    retry_delay: 30
    queue: high
    
  low_priority:
    concurrency: 20
    max_retries: 2
    retry_delay: 300
    queue: low

queues:
  default:
    max_size: 10000
    dead_letter: default-dlq
    visibility_timeout: 300
    
  high:
    max_size: 5000
    dead_letter: high-dlq
    visibility_timeout: 120
    
  low:
    max_size: 50000
    dead_letter: low-dlq
    visibility_timeout: 600

retry_policy:
  exponential_backoff: true
  initial_delay: 10
  multiplier: 2
  max_delay: 3600
  jitter: true

health:
  heartbeat_interval: 30
  stale_timeout: 120
  metrics_enabled: true

graceful_shutdown:
  timeout: 30
  force_kill_after: 60
