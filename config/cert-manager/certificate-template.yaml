# =============================================================================
# Certificate — Wildcard TLS Certificate for *.gula.health
# =============================================================================
# Path: config/cert-manager/certificate-template.yaml
# Managed by: Security Operations
# Applied via: kubectl apply -f certificate-template.yaml
# =============================================================================
# This Certificate resource requests a wildcard TLS certificate from
# Let's Encrypt using DNS01 challenge via Cloudflare API.
#
# The resulting certificate is stored in the secret 'gula-tls-cert'
# and automatically renewed 30 days before expiry (60-day window).
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gula-wildcard-tls
  namespace: default
  labels:
    app.kubernetes.io/name: gula-platform
    app.kubernetes.io/component: tls
spec:
  # Secret name that will store the issued certificate and key
  secretName: gula-tls-cert

  # Private key configuration
  privateKey:
    algorithm: RSA
    size: 2048
    encoding: PKCS1
    rotationPolicy: Always

  # Certificate duration and renewal
  duration: 2160h   # 90 days
  renewBefore: 720h # 30 days before expiry

  # Subject information
  subject:
    organizations:
      - GULA Health Technology
    organizationalUnits:
      - Security Operations
    countries:
      - IQ
    localities:
      - Baghdad
    provinces:
      - Baghdad
    postalCodes:
      - "10001"

  # Common Name
  commonName: "*.gula.health"

  # Subject Alternative Names (SANs)
  dnsNames:
    - "*.gula.health"
    - "gula.health"
    - "*.api.gula.health"
    - "api.gula.health"
    - "*.admin.gula.health"
    - "admin.gula.health"
    - "*.app.gula.health"
    - "app.gula.health"

  # Issuer reference
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io

  # Keystore configuration (optional, for Java apps)
  keystores:
    jks:
      create: false
    pkcs12:
      create: false

  # Enable revision history
  revisionHistoryLimit: 3

  # Additional output formats
  secretTemplate:
    labels:
      app.kubernetes.io/name: gula-platform
      app.kubernetes.io/component: tls
---
# =============================================================================
# Certificate for Internal Services (non-wildcard, specific FQDN)
# =============================================================================
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gula-internal-tls
  namespace: default
  labels:
    app.kubernetes.io/name: gula-platform
    app.kubernetes.io/component: tls
    app.kubernetes.io/part-of: internal
spec:
  secretName: gula-internal-tls-cert
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  duration: 2160h
  renewBefore: 720h
  commonName: "gula.internal"
  dnsNames:
    - "gula.internal"
    - "*.gula.internal"
    - "backend.gula.internal"
    - "api-gateway.gula.internal"
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
  revisionHistoryLimit: 3
---
# =============================================================================
# Ingress TLS Configuration — Usage Example
# =============================================================================
# This is an example of how to reference the certificate in an Ingress:
#
# apiVersion: networking.k8s.io/v1
# kind: Ingress
# metadata:
#   name: gula-api-ingress
#   annotations:
#     cert-manager.io/cluster-issuer: letsencrypt-prod
#     kubernetes.io/ingress.class: nginx
# spec:
#   tls:
#   - hosts:
#     - "*.gula.health"
#     secretName: gula-tls-cert
#   rules:
#   - host: "api.gula.health"
#     http:
#       paths:
#       - path: /
#         pathType: Prefix
#         backend:
#           service:
#             name: api-gateway
#             port:
#               number: 80
