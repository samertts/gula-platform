[databases]
labdb = host=postgres-primary port=5432 dbname=labdb pool_size=25
labdb_replica1 = host=postgres-replica-1 port=5432 dbname=labdb pool_size=20
labdb_replica2 = host=postgres-replica-2 port=5432 dbname=labdb pool_size=20
labdb_replica3 = host=postgres-replica-3 port=5432 dbname=labdb pool_size=20

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /tmp
auth_type = scram-sha-256
auth_user = pgbouncer_admin
auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename=$1
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 10
reserve_pool_timeout = 5
max_db_connections = 100
max_user_connections = 100
server_idle_timeout = 600
server_lifetime = 3600
server_connect_timeout = 10
server_login_retry = 3
query_timeout = 30
query_wait_timeout = 10
client_idle_timeout = 600
client_login_timeout = 60
idle_transaction_timeout = 30
pkt_buf = 4096
max_packet_size = 4194304
listen_backlog = 128
sbuf_loopcnt = 5
suspend_timeout = 10
tcp_defer_accept = 1
tcp_keepalive = 1
tcp_keepidle = 10
tcp_keepintvl = 10
tcp_keepcnt = 3
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60
verbose = 0
admin_users = postgres
stats_users = postgres, pgbouncer_admin
