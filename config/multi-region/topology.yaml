# GULA Platform — Multi-Region Topology

topology:
  name: gula-platform
  version: 1.0.0
  
regions:
  - id: me-central1
    name: Iraq (Primary)
    location: Baghdad, Iraq
    cloud_provider: digitalocean
    datacenter: fra1
    status: active
    priority: 100
    dns: api.gula.health
    failover:
      priority: 1
      automated: true
    
  - id: eu-west1
    name: EU (DR)
    location: Frankfurt, Germany
    cloud_provider: digitalocean
    datacenter: fra1-alt
    status: standby
    priority: 50
    dns: dr.gula.health
    failover:
      priority: 2
      automated: true

components:
  postgresql:
    ha_mode: patroni
    replication: synchronous
    cross_region: true
    dr_type: standby_cluster
    rpo: 5s
    rto: 30s
    
  redis:
    ha_mode: sentinel
    cross_region: false
    rpo: 0s (ephemeral)
    rto: 10s (local failover)
    
  rabbitmq:
    ha_mode: cluster
    cross_region: shovel
    rpo: 5s
    rto: 15s
    
  minio:
    ha_mode: distributed
    cross_region: bucket_replication
    rpo: 60s
    rto: 60s

networking:
  global_load_balancer: cloudflare
  dns_ttl:
    normal: 300
    failover: 60
  health_check:
    path: /health
    interval: 30s
    timeout: 5s
    unhealthy_threshold: 3
    healthy_threshold: 2
    
security:
  inter_region_tls: true
  encryption_in_transit: TLS 1.3
  network_isolation: vpc_peering

automation:
  failover: scripts/dr-failover.sh
  failback: scripts/dr-failback.sh
  test: scripts/dr-test.sh
  schedule: quarterly
