# GULA Platform — Container Scan Configuration

container-scan:
  tool: trivy
  severity:
    - CRITICAL
    - HIGH
  scanners:
    - vuln
    - secret
    - misconfig
  format: sarif

  images:
    - ghcr.io/samertts/gula-platform/backend:latest
    - ghcr.io/samertts/gula-platform/lab:latest
    - ghcr.io/samertts/gula-platform/order:latest
    - ghcr.io/samertts/gula-platform/patient:latest
    - ghcr.io/samertts/gula-platform/result:latest
    - ghcr.io/samertts/gula-platform/sample:latest
    - ghcr.io/samertts/gula-platform/notification:latest
    - ghcr.io/samertts/gula-platform/ai:latest

  ignore_unfixed: true

  output:
    format: sarif
    file: reports/container-scan.sarif

  fail_on:
    - CRITICAL
    - HIGH

  policy:
    - if: severity == CRITICAL
      action: block
    - if: severity == HIGH && package_type == "os"
      action: block
    - if: severity == HIGH && package_type == "library"
      action: warn
