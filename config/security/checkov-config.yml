# =============================================================================
# Checkov Configuration — IaC Security Scanning
# =============================================================================
# Path: config/security/checkov-config.yml
# Managed by: Security Operations
# Version: 1.0.0
# Last updated: 2026-07-15
# =============================================================================

# =============================================================================
# GENERAL SETTINGS
# =============================================================================
compact: true
quiet: false
download_external_modules: true
soft_fail: false

# =============================================================================
# FRAMEWORKS
# =============================================================================
framework:
  - "kubernetes"       # K8s manifests
  - "docker-compose"   # Docker Compose files
  - "dockerfile"       # Dockerfiles

# =============================================================================
# SCAN PATHS
# =============================================================================
scan:
  include:
    - "k8s/"
    - "helm/"
    - "docker-compose*.yml"
    - "docker-compose*.yaml"
    - "**/Dockerfile"
    - "**/Dockerfile.*"

  exclude:
    - "**/node_modules/"
    - "**/__pycache__/"
    - "**/*.test.*"
    - "**/tests/"

# =============================================================================
# CHECKS TO SKIP
# =============================================================================
skip_check:
  # Docker checks
  - "CKV_DOCKER_2"    # Healthcheck instruction (defined at runtime by compose)
  - "CKV_DOCKER_7"    # COPY instead of ADD (ADD needed for remote URLs)
  - "CKV_DOCKER_4"    # Label consistency (handled by CI tagging)
  - "CKV_DOCKER_11"   # Latest tag (uses specific CI-controlled tags)

  # Kubernetes checks
  - "CKV_K8S_10"      # Service account token mount (required by service mesh)
  - "CKV_K8S_11"      # cpu_limits (handled by namespace quotas)
  - "CKV_K8S_12"      # memory_limits (handled by namespace quotas)
  - "CKV_K8S_14"      # Container privilege escalation (handled by AppArmor)
  - "CKV_K8S_23"      # Seccomp profile (handled at node level)
  - "CKV_K8S_28"      # priority_class (not applicable for GULA services)
  - "CKV_K8S_29"      # Pod priority (not applicable for GULA services)
  - "CKV_K8S_30"      # Container security context (handled by mesh)
  - "CKV_K8S_31"      # Readiness probe (handled at container level)
  - "CKV_K8S_32"      # Liveness probe (handled at container level, app health endpoint)
  - "CKV_K8S_35"      # Resource requests (handled by cluster autoscaler)
  - "CKV_K8S_36"      # Resource limits (handled by cluster autoscaler)
  - "CKV_K8S_37"      # Pod priority (not applicable)
  - "CKV_K8S_38"      # Service account token (required for cloud integration)
  - "CKV_K8S_39"      # Shared process namespace (calico/cilium requirement)
  - "CKV_K8S_40"      # Host PID (Linkerd proxy requirement)
  - "CKV_K8S_41"      # Host IPC (Linkerd proxy requirement)
  - "CKV_K8S_42"      # NET_ADMIN capability (Linkerd proxy requirement)
  - "CKV_K8S_43"      # SYS_ADMIN capability (Linkerd proxy requirement)
  - "CKV_K8S_44"      # NET_RAW capability (Linkerd proxy requirement)

# =============================================================================
# BASELINE
# =============================================================================
# Use a baseline file to suppress known issues that have been reviewed
baseline:
  enabled: true
  file: ".checkov.baseline"

# =============================================================================
# OUTPUT
# =============================================================================
output:
  - "cli"             # Console output (human-readable)
  - "json"            # JSON output (machine-readable)
  - "sarif"           # SARIF output (GitHub Security)

  cli:
    compact: false
    # Show only failed checks
    show_passed: true

  json:
    path: "reports/checkov/checkov-report.json"

  sarif:
    path: "reports/checkov/checkov-report.sarif"
    upload_to_github: true

# =============================================================================
# PASS/FAIL CRITERIA
# =============================================================================
pass_fail:
  kubernetes:
    # Fail build on any ERROR in Kubernetes checks
    error: "fail"
    warning: "warn"
    passed: "pass"

  docker_compose:
    error: "fail"
    warning: "warn"
    passed: "pass"

  dockerfile:
    error: "fail"
    warning: "warn"
    passed: "pass"

# =============================================================================
# EXTERNAL CHECKS
# =============================================================================
external_checks:
  enabled: false
  # Directory containing custom Checkov policies
  dirs:
    - "config/security/checkov-custom-checks/"

# =============================================================================
# CONFIGURATION FILES
# =============================================================================
# Paths to configuration files that Checkov should use
config:
  # Kubernetes config files
  kubernetes_config:
    - "k8s/base/kustomization.yaml"
    - "k8s/overlays/production/kustomization.yaml"

# =============================================================================
# SCHEDULE
# =============================================================================
schedule:
  # Run on every PR
  run_on_pr: true

  # Full scan weekly
  weekly_scan:
    enabled: true
    day: "monday"
    time: "04:00 Baghdad"
