    skips:
      - B101  # Skip assert warnings (used in tests)

    severity:
      high: "fail"    # Block CI pipeline
      medium: "warn"  # Warning, non-blocking
      low: "info"     # Informational only

    paths:
      include:
        - "backend/app/"
        - "backend/migrations/"
        - "services/"
        - "scripts/"
      exclude:
        - "**/tests/"
        - "**/test_*.py"
        - "**/__pycache__/"
        - "**/*.pyc"
        - "**/node_modules/"

  semgrep:
    enabled: true
    version: 1.30+
    config:
      - ".semgrep/rules/security/sql-injection.yaml"
      - ".semgrep/rules/security/hardcoded-secrets.yaml"
      - ".semgrep/rules/security/path-traversal.yaml"
      - ".semgrep/rules/security/command-injection.yaml"
      - ".semgrep/rules/security/auth-bypass.yaml"
    severity:
      error: "fail"      # Block CI pipeline
      warning: "warn"    # Warning, non-blocking
      info: "info"       # Informational only

# =============================================================================
# PIPELINE INTEGRATION
# =============================================================================
pipeline:
  # Run on every PR
  run_on:
    - pull_request
    - push_to_main
    - schedule

  schedule:
    frequency: "weekly"
    day: "monday"
    time: "03:00 Baghdad"

  # Blocking rules
  blocking:
    - tool: "bandit"
      severity: "high"
      action: "block"
    - tool: "semgrep"
      severity: "error"
      action: "block"

# =============================================================================
# REPORTING
# =============================================================================
reporting:
  formats:
    - "text"       # Console output
    - "json"       # Machine-readable
    - "sarif"      # SARIF for GitHub Security
    - "html"       # Human-readable HTML

  output_dir: "reports/sast/"

  notify:
    on_block: true
    channels:
      - "github_checks"
      - "slack_security_alerts"

  # Upload SARIF to GitHub Security
  upload_sarif: true
  github_upload:
    enabled: true
    sarif_path: "reports/sast/results.sarif"

# =============================================================================
# EXCEPTIONS
# =============================================================================
exceptions:
  # Files that are allowed to have certain findings
  - path: "backend/migrations/"
    reason: "Alembic migration scripts follow specific patterns"
  - path: "backend/tests/"
    reason: "Test files may use mocks and test secrets"
  - path: "scripts/"
    reason: "Admin scripts with elevated privileges"
