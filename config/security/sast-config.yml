# =============================================================================
# TOOLS
# =============================================================================
tools:
  bandit:
    enabled: true
    version: 1.7.9+
    config_file: ".bandit.yml"
    # Extended rule set covering all relevant CWEs
    tests:
      # Authentication & Credentials
      - B101  # Assert used (informational)
      - B102  # exec used
      - B103  # set_bad_file_permissions
      - B105  # Hardcoded password strings
      - B106  # Hardcoded password (function def)
      - B107  # Hardcoded password (default)
      - B108  # Insecure usage of /tmp
      - B110  # Try, Except, Pass detected
      - B112  # Try, Except, Continue detected

      # Injection
      - B201  # Flask debug
      - B202  # Tar security
      - B301  # pickle
      - B302  # marshal
      - B303  # MD2/4 hash
      - B304  # Ciphers
      - B305  # cipher modes
      - B306  # mktemp / mktemp
      - B307  # eval
      - B308  # mark_safe
      - B309  # HTTPSConnection
      - B310  # urllib.urlopen
      - B311  # random
      - B312  # paramiko
      - B313  # xml parsing (bad)
