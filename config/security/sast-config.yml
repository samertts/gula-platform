      - B324  # hashlib.new with md4/md5
      - B325  # tempfile.mkstemp insecure
      - B326  # yaml load
      - B327  # Jinja2 template
      - B328  # cipher modes
      - B329  # ssl wrap socket
      - B330  # CGI
      - B331  # pickle deserialize
      - B332  # TroveSource
      - B333  # http.server
      - B334  # weak crypto key
      - B335  # sql injection
