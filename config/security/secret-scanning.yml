# =============================================================================
# Secret Scanning Configuration — GULA Platform
# =============================================================================
# Path: config/security/secret-scanning.yml
# Managed by: Security Operations
# Version: 1.0.0
# Last updated: 2026-07-15
# =============================================================================
#
# This configuration defines secret scanning policies using gitleaks.
# It detects hardcoded secrets, API keys, tokens, and credentials
# across the entire codebase, including git history.
#

# =============================================================================
# TOOL: GITLEAKS
# =============================================================================
tool:
  name: "gitleaks"
  version: "8.18+"
  config_file: ".gitleaks.toml"

  # Scan modes
  modes:
    - "path"       # Scan filesystem path
    - "git"        # Scan git history (full or commit range)
    - "no-git"     # Scan directory without git context

# =============================================================================
# CUSTOM PATTERNS — GULA-specific secret patterns
# =============================================================================
custom_patterns:
  # GULA Platform specific secrets
  - id: "gula-secret-key"
    description: "GULA SECRET_KEY (JWT signing key)"
    regex: "(?i)(SECRET_KEY|secret_key)\\s*[=:]\\s*[\"'][a-fA-F0-9]{32,}"
    severity: "high"
    tags: ["gula", "jwt", "authentication"]

  - id: "gula-encryption-key"
    description: "GULA ENCRYPTION_KEY (Fernet key)"
    regex: "(?i)(ENCRYPTION_KEY|encryption_key)\\s*[=:]\\s*[\"'][A-Za-z0-9+/=_-]{40,}"
    severity: "critical"
    tags: ["gula", "encryption", "phi"]

  - id: "gula-nid-hmac-key"
    description: "GULA NID_HMAC_KEY (National ID HMAC)"
    regex: "(?i)(NID_HMAC_KEY|nid_hmac_key|nid_hmac)\\s*[=:]\\s*[\"'][a-fA-F0-9]{32,}"
    severity: "critical"
    tags: ["gula", "national-id", "phi"]

  - id: "gula-metrics-token"
    description: "GULA METRICS_BEARER_TOKEN"
    regex: "(?i)(METRICS_BEARER_TOKEN|metrics_bearer_token)\\s*[=:]\\s*[\"'][A-Za-z0-9+/=_-]{20,}"
    severity: "high"
    tags: ["gula", "metrics", "monitoring"]

  - id: "gula-gemini-api-key"
    description: "GEMINI_API_KEY"
    regex: "(?i)(GEMINI_API_KEY|gemini_api_key)\\s*[=:]\\s*[\"'][A-Za-z0-9_-]{20,}"
    severity: "high"
    tags: ["gula", "ai", "gemini"]

  - id: "gula-groq-api-key"
    description: "GROQ_API_KEY"
    regex: "(?i)(GROQ_API_KEY|groq_api_key)\\s*[=:]\\s*[\"'][g][a-zA-Z0-9_-]{20,}"
    severity: "high"
    tags: ["gula", "ai", "groq"]

  - id: "gula-ghcr-token"
    description: "GHCR_TOKEN (GitHub Container Registry)"
    regex: "(?i)(GHCR_TOKEN|ghcr_token|ghcr_pat)\\s*[=:]\\s*[\"'][A-Za-z0-9_-]{30,}"
    severity: "high"
    tags: ["gula", "container", "registry"]

  - id: "gula-refresh-token-secret"
    description: "GULA REFRESH_TOKEN_SECRET"
    regex: "(?i)(REFRESH_TOKEN_SECRET|refresh_token_secret)\\s*[=:]\\s*[\"'][a-fA-F0-9]{32,}"
    severity: "high"
    tags: ["gula", "jwt", "refresh"]

  - id: "gula-device-hmac-key"
    description: "GULA DEVICE_HMAC_KEY"
    regex: "(?i)(DEVICE_HMAC_KEY|device_hmac_key)\\s*[=:]\\s*[\"'][a-fA-F0-9]{32,}"
    severity: "high"
    tags: ["gula", "device", "integration"]

  - id: "gula-sentry-dsn"
    description: "Sentry DSN with secret"
    regex: 'https://[a-fA-F0-9]{32}@[a-zA-Z0-9]+\.ingest\.sentry\.io/\d+'
    severity: "medium"
    tags: ["gula", "sentry", "error-tracking"]

  - id: "gula-openai-key"
    description: "OpenAI API key"
    regex: 'sk-[a-zA-Z0-9]{20,}'
    severity: "high"
    tags: ["gula", "ai", "openai"]

  - id: "gula-jwt-in-source"
    description: "Hardcoded JWT token or payload"
    regex: 'eyJ[a-zA-Z0-9_-]+\.eyJ[a-zA-Z0-9_-]+\.[a-zA-Z0-9_-]+'
    severity: "critical"
    tags: ["gula", "jwt", "token"]

# =============================================================================
# ALLOWLIST — Known exceptions
# =============================================================================
allowlist:
  description: "Files and patterns that are allowed to contain secret-like strings"

  paths:
    # Test files
    - "**/tests/"
    - "**/test_*.py"
    - "**/*.test.*"
    - "**/conftest.py"
    - "**/fixtures/"
    - "**/test_fixtures/"

    # Example files
    - "**/.env.example"
    - "**/.env.production"
    - "docs/"
    - "**/README.md"
    - "**/THIRD-PARTY-NOTICES.md"

    # Generated/compliance files
    - "reports/"
    - "config/security/license-config.yml"

    # Test data
    - "**/test_data/"
    - "**/testdata/"
    - "**/sample_data/"

    # Templates
    - "**/*.template"
    - "**/*.tmpl"

  # Regex patterns to ignore (allowlisted)
  regexes:
    # Placeholder values in example files
    - (?i)(placeholder|example|changeme|your-|your_|testpassword|test_key|dummy)
    # Hash values in lock files
    - sha256:[a-f0-9]{64}
    # Version strings
    - ^[0-9]+\.[0-9]+\.[0-9]+$
    # UUIDs
    - [a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}
    # Git SHA
    - [a-f0-9]{40}
    # Package hashes
    - --hash=sha256:[a-f0-9]{64}
    # Hex color codes
    - '#[a-f0-9]{6}'
    # Base64 image data
    - data:image/[a-z]+;base64
    # Pip editable installs
    - -e git\+https://
    # URLs with tokens
    - https://[^@]+@github\.com
    # CSS color values
    - rgba?\(

# =============================================================================
# PRE-COMMIT HOOK
# =============================================================================
pre_commit:
  enabled: true
  hook_type: "pre-commit"
  stages:
    - "commit"
    - "push"

  config:
    # Scan staged changes only (fast)
    mode: "staged"
    # Fail on any finding
    fail_on_finding: true
    # Verbose output
    verbose: false
    # Redact secrets in output
    redact: true

# =============================================================================
# CI INTEGRATION
# =============================================================================
ci:
  # Run on every PR
  run_on:
    - pull_request
    - push_to_main

  # Full git history scan on PR
  full_history_scan: true
  scan_range: "HEAD~10..HEAD"  # Last 10 commits + current

  # Fail pipeline on any finding
  fail_on_finding: true

  # Upload results to GitHub Security
  upload_sarif: true
  sarif_path: "reports/secret-scan/secret-scan-results.sarif"

  # Comment on PR with findings
  comment_on_pr: true
  comment_on_finding: true

# =============================================================================
# REPORTING
# =============================================================================
reporting:
  output_dir: "reports/secret-scan/"
  formats:
    - "json"
    - "sarif"
    - "text"
    - "csv"

  # Generate summary
  summary: true
  summary_file: "reports/secret-scan/scan-summary.json"

# =============================================================================
# SCHEDULE
# =============================================================================
schedule:
  # Full repository scan weekly
  full_scan:
    enabled: true
    frequency: "weekly"
    day: "monday"
    time: "02:00 Baghdad"

  # Historical scan monthly (entire git history)
  historical_scan:
    enabled: true
    frequency: "monthly"
    day: 1
    time: "02:00 Baghdad"
