# =============================================================================
# GULA PLATFORM - Grafana Tempo Configuration
# Executive Order 16: Distributed Tracing Storage
# =============================================================================

server:
  http_listen_port: 3200
  grpc_listen_port: 9095
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    jaeger:
      protocols:
        grpc:
          endpoint: 0.0.0.0:14250
        thrift_binary:
          endpoint: 0.0.0.0:6832
        thrift_compact:
          endpoint: 0.0.0.0:6831
        thrift_http:
          endpoint: 0.0.0.0:14268
    zipkin:
      endpoint: 0.0.0.0:9411

ingester:
  max_block_duration: 30m
  max_block_bytes: 500_000_000
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1

compactor:
  compaction:
    block_retention: 48h
    compacted_block_retention: 1h
    compaction_interval: 30m
    max_block_bytes: 100_000_000
    max_compaction_objects: 1_000_000

storage:
  trace:
    backend: s3
    s3:
      bucket: tempo-traces
      endpoint: ${MINIO_ENDPOINT:-minio:9000}
      access_key: ${MINIO_ACCESS_KEY:-minioadmin}
      secret_key: ${MINIO_SECRET_KEY:-minioadmin}
      insecure: ${MINIO_INSECURE:-true}
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks

querier:
  max_concurrent_queries: 10
  frontend_worker:
    frontend_address: tempo-query-frontend:9095
    grpc_client_config:
      max_recv_msg_size: 104857600

query_frontend:
  max_outstanding_per_tenant: 2000
  search:
    duration_slo: 5s
    throughput_bytes_slo: 1_073_741_824
  trace_by_id:
    duration_slo: 5s
  max_ou_retries: 2

metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: gula-platform
    stale_duration: 15m
  storage:
    path: /tmp/tempo/generator
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
        write_relabel_configs:
          - source_labels: [__name__]
            regex: '.*'
            action: keep
  span_metrics:
    histogram_buckets: [0.002, 0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10]
  service_graphs:
    max_items: 10000
    workers: 10

search_enabled: true

overrides:
  max_bytes_per_trace: 50_000_000
  max_search_bytes_per_trace: 50_000_000
  ingestion_burst_size_bytes: 20_000_000
  ingestion_rate_limit_bytes: 15_000_000
  max_global_exemplars_per_user: 1000
  block_retention: 48h
