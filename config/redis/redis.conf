# =============================================================================
# GULA Platform - Redis Primary Configuration
# HA: Primary + Replica + Sentinel
# =============================================================================

# Network
bind 0.0.0.0
protected-mode yes
port 6379

# Authentication
requirepass gula_redis_2024

# Persistence (Executive Order 6 equivalent: no data loss)
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB snapshots (additional safety)
save 900 1
save 300 10
save 60 1000

# Memory
maxmemory 512mb
maxmemory-policy allkeys-lru

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Clients
maxclients 10000
timeout 300

# Replication
min-replicas-to-write 0
min-replicas-max-lag 10

# Logging
loglevel notice
