apiVersion: 1

# GULA-managed alerting notification path.
# Grafana-managed alerts (see alert_rules.yml) are forwarded to the
# self-hosted Alertmanager, which owns the single delivery path to
# Telegram/Discord/Slack webhook (ALERT_WEBHOOK_URL) — no duplicate
# webhook config between Prometheus and Grafana.

# Contact point: forward to the platform Alertmanager
contactPoints:
  - orgId: 1
    name: gula-alertmanager
    receivers:
      - uid: gula_am_fwd
        type: prometheus-alertmanager
        settings:
          url: http://alertmanager:9093

# Whole notification policy tree routes everything to Alertmanager.
policies:
  - orgId: 1
    receiver: gula-alertmanager
    group_by: ['...']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
