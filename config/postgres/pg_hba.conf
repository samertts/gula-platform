# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     scram-sha-256
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256
# Docker bridge networks use 172.16.0.0/12 range (covers 172.16-31.x.x).
# Docker assigns subnets dynamically (172.17.x, 172.18.x, 172.20.x, etc.)
# so we allow the full RFC-1918 Docker range. Port 5432 is NOT published
# externally, so this does not expose postgres outside the container network.
host    all             all             172.16.0.0/12           scram-sha-256
host    replication     postgres        172.16.0.0/12           scram-sha-256
