# =============================================================================
# GULA PLATFORM - PostgreSQL Production Configuration
# Target: 4 GB RAM / 2 vCPU (DigitalOcean FRA1 — gula-core-server)
# Rule of thumb: shared_buffers = 25% RAM, effective_cache_size = 50% RAM
# =============================================================================

# ---------------------------------------------------------------------------
# CONNECTIONS
# ---------------------------------------------------------------------------
listen_addresses = '*'
# 3 workers × (6 pool + 12 overflow) = 54 app connections + 10 admin/monitoring
max_connections = 100

# ---------------------------------------------------------------------------
# MEMORY  (tuned for 4 GB RAM / PG container capped at 896 MB)
# ---------------------------------------------------------------------------
# 25% of container cap — largest single lever for query speed
shared_buffers = 512MB
# Per-query sort/hash limit — at 3 workers × 18 parallel queries = 54 slots
# 12MB × 54 = 648MB theoretical max — safe within 4GB
work_mem = 12MB
# VACUUM and index builds
maintenance_work_mem = 128MB
# OS disk cache estimate — helps query planner choose index scans
effective_cache_size = 2GB
huge_pages = try

# ---------------------------------------------------------------------------
# WRITE-AHEAD LOG (WAL)
# ---------------------------------------------------------------------------
wal_buffers = 16MB
synchronous_commit = on
checkpoint_completion_target = 0.9
min_wal_size = 512MB
max_wal_size = 2GB

# ---------------------------------------------------------------------------
# QUERY PLANNER
# ---------------------------------------------------------------------------
random_page_cost = 1.1        # SSD — keep low to prefer index scans
effective_io_concurrency = 200
max_parallel_workers_per_gather = 1   # 2 vCPU: 1 is safer than 2
max_parallel_workers = 2
max_worker_processes = 4

# ---------------------------------------------------------------------------
# LOGGING
# ---------------------------------------------------------------------------
log_timezone = 'UTC'
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 500   # log slow queries > 500ms
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_statement = 'none'

# ---------------------------------------------------------------------------
# AUTOVACUUM (prevent table bloat)
# ---------------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 2            # reduced from 3 — save CPU for queries
autovacuum_naptime = 1min
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.025
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 400

# ---------------------------------------------------------------------------
# IDLE SESSION MANAGEMENT
# ---------------------------------------------------------------------------
idle_in_transaction_session_timeout = 60000    # 60s — kill stuck transactions
idle_session_timeout = 600000                  # 10m — kill idle connections
statement_timeout = 30000                      # 30s — kill runaway queries
lock_timeout = 5000                            # 5s — fail fast on lock contention

# ---------------------------------------------------------------------------
# LOCALE & ENCODING
# ---------------------------------------------------------------------------
timezone = 'UTC'
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'
