# =============================================================================
# GULA PLATFORM - PostgreSQL Production Configuration
# Target: 1-2 GB RAM VPS  (adjust shared_buffers for larger servers)
# Rule of thumb: shared_buffers = 25% of RAM, effective_cache_size = 75% of RAM
# =============================================================================

# ---------------------------------------------------------------------------
# CONNECTIONS
# ---------------------------------------------------------------------------
# Accept connections from all interfaces — required for Docker container networking.
# Without this, postgres defaults to "localhost" and other containers can't connect.
listen_addresses = '*'
# Backend: 2 workers × (5 base + 15 overflow) = 40.  +10 for admin/monitoring.
max_connections = 100

# ---------------------------------------------------------------------------
# MEMORY
# ---------------------------------------------------------------------------
# 256MB for 1GB RAM server; use 512MB for 2GB RAM
shared_buffers = 256MB
# Per-query sort/hash limit — prevents runaway queries
work_mem = 16MB
# VACUUM and index builds
maintenance_work_mem = 64MB
# OS disk cache estimate (helps query planner)
effective_cache_size = 768MB
# Huge pages: try to use if available (reduces TLB pressure)
huge_pages = try

# ---------------------------------------------------------------------------
# WRITE-AHEAD LOG (WAL)
# ---------------------------------------------------------------------------
wal_buffers = 16MB
# Synchronous commit: on (safest).  Set to 'off' only for non-critical bulk imports.
synchronous_commit = on
# Checkpoint spacing: spread checkpoints over time to reduce I/O spikes
checkpoint_completion_target = 0.9
# Keep at least 1GB of WAL before checkpoint (reduce checkpoint frequency)
min_wal_size = 512MB
max_wal_size = 2GB

# ---------------------------------------------------------------------------
# QUERY PLANNER
# ---------------------------------------------------------------------------
# SSD: set to 1.1; spinning disk: 4.0
random_page_cost = 1.1
# SSD: 200; spinning disk: 1
effective_io_concurrency = 200
# Enable parallel query for large scans
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_worker_processes = 8

# ---------------------------------------------------------------------------
# LOGGING
# ---------------------------------------------------------------------------
log_timezone = 'UTC'
log_destination = 'stderr'
logging_collector = off
# Log slow queries (>500ms) for performance analysis
log_min_duration_statement = 500
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
# Never log passwords
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_statement = 'none'

# ---------------------------------------------------------------------------
# AUTOVACUUM (prevent table bloat)
# ---------------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
# Trigger autovacuum after 5% + 500 rows changed
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.025
# Throttle autovacuum to not impact query performance
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 400

# ---------------------------------------------------------------------------
# IDLE SESSION MANAGEMENT
# ---------------------------------------------------------------------------
# Kill sessions idle in transaction for more than 60 seconds
idle_in_transaction_session_timeout = 60000
# Kill completely idle sessions after 10 minutes (prevents connection leak)
idle_session_timeout = 600000
# Kill queries that run longer than 30 seconds
statement_timeout = 30000
# Lock wait timeout (fail fast instead of deadlock)
lock_timeout = 5000

# ---------------------------------------------------------------------------
# LOCALE & ENCODING
# ---------------------------------------------------------------------------
timezone = 'UTC'
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'
