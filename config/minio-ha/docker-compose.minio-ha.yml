# =============================================================================
# GULA Platform — MinIO 4-Node Distributed HA + Nginx Load Balancer
# =============================================================================
# Architecture:
#   - 4 MinIO nodes in distributed mode (erasure coding: 4 drives, 2 parity)
#   - Nginx load balancer fronting S3 API (9000) and Console (9001)
#   - Persistent volumes on each node
#   - KMS encryption, audit webhook, Prometheus metrics
#
# Usage:
#   docker compose -f config/minio-ha/docker-compose.minio-ha.yml up -d
#
# Requirements:
#   - 4+ persistent volumes (one per node)
#   - MINIO_ROOT_USER, MINIO_ROOT_PASSWORD in .env
#   - KMS endpoint configured (optional, falls back to master key)
# =============================================================================

services:

  # ── MinIO Node 1 ────────────────────────────────────────────────────────────
  minio-1:
    image: minio/minio:RELEASE.2026-04-15T18-00-00Z
    container_name: gula-minio-1
    hostname: minio-1
    restart: always
    mem_limit: 2g
    mem_reservation: 1g
    cpus: "2.0"
    command:
      - server
      - --console-address
      - ":9001"
      - --address
      - ":9000"
      - http://minio-{1...4}:9000/data{1...4}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MinIO root user required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MinIO root password required}
      MINIO_SITE_REGION: me-central
      MINIO_SITE_NAME: gula-minio-me-central
      MINIO_PROMETHEUS_AUTH_TYPE: public
      MINIO_KMS_KES_ENDPOINT: ${MINIO_KMS_KES_ENDPOINT:-}
      MINIO_KMS_KES_API_KEY: ${MINIO_KMS_KES_API_KEY:-}
      MINIO_KMS_KES_KEY_NAME: gula-minio-key
      MINIO_AUDIT_WEBHOOK_ENABLE: on
      MINIO_AUDIT_WEBHOOK_ENDPOINT: https://audit.gula.health/minio-events
      MINIO_AUDIT_WEBHOOK_AUTH_TOKEN: ${MINIO_AUDIT_TOKEN:-}
    volumes:
      - minio-1-data1:/data1
      - minio-1-data2:/data2
      - minio-1-data3:/data3
      - minio-1-data4:/data4
    expose:
      - "9000"
      - "9001"
    networks:
      - gula-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── MinIO Node 2 ────────────────────────────────────────────────────────────
  minio-2:
    image: minio/minio:RELEASE.2026-04-15T18-00-00Z
    container_name: gula-minio-2
    hostname: minio-2
    restart: always
    mem_limit: 2g
    mem_reservation: 1g
    cpus: "2.0"
    command:
      - server
      - --console-address
      - ":9001"
      - --address
      - ":9000"
      - http://minio-{1...4}:9000/data{1...4}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SITE_REGION: me-central
      MINIO_SITE_NAME: gula-minio-me-central
      MINIO_PROMETHEUS_AUTH_TYPE: public
      MINIO_KMS_KES_ENDPOINT: ${MINIO_KMS_KES_ENDPOINT:-}
      MINIO_KMS_KES_API_KEY: ${MINIO_KMS_KES_API_KEY:-}
      MINIO_KMS_KES_KEY_NAME: gula-minio-key
      MINIO_AUDIT_WEBHOOK_ENABLE: on
      MINIO_AUDIT_WEBHOOK_ENDPOINT: https://audit.gula.health/minio-events
      MINIO_AUDIT_WEBHOOK_AUTH_TOKEN: ${MINIO_AUDIT_TOKEN:-}
    volumes:
      - minio-2-data1:/data1
      - minio-2-data2:/data2
      - minio-2-data3:/data3
      - minio-2-data4:/data4
    expose:
      - "9000"
      - "9001"
    networks:
      - gula-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── MinIO Node 3 ────────────────────────────────────────────────────────────
  minio-3:
    image: minio/minio:RELEASE.2026-04-15T18-00-00Z
    container_name: gula-minio-3
    hostname: minio-3
    restart: always
    mem_limit: 2g
    mem_reservation: 1g
    cpus: "2.0"
    command:
      - server
      - --console-address
      - ":9001"
      - --address
      - ":9000"
      - http://minio-{1...4}:9000/data{1...4}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SITE_REGION: me-central
      MINIO_SITE_NAME: gula-minio-me-central
      MINIO_PROMETHEUS_AUTH_TYPE: public
      MINIO_KMS_KES_ENDPOINT: ${MINIO_KMS_KES_ENDPOINT:-}
      MINIO_KMS_KES_API_KEY: ${MINIO_KMS_KES_API_KEY:-}
      MINIO_KMS_KES_KEY_NAME: gula-minio-key
      MINIO_AUDIT_WEBHOOK_ENABLE: on
      MINIO_AUDIT_WEBHOOK_ENDPOINT: https://audit.gula.health/minio-events
      MINIO_AUDIT_WEBHOOK_AUTH_TOKEN: ${MINIO_AUDIT_TOKEN:-}
    volumes:
      - minio-3-data1:/data1
      - minio-3-data2:/data2
      - minio-3-data3:/data3
      - minio-3-data4:/data4
    expose:
      - "9000"
      - "9001"
    networks:
      - gula-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── MinIO Node 4 ────────────────────────────────────────────────────────────
  minio-4:
    image: minio/minio:RELEASE.2026-04-15T18-00-00Z
    container_name: gula-minio-4
    hostname: minio-4
    restart: always
    mem_limit: 2g
    mem_reservation: 1g
    cpus: "2.0"
    command:
      - server
      - --console-address
      - ":9001"
      - --address
      - ":9000"
      - http://minio-{1...4}:9000/data{1...4}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SITE_REGION: me-central
      MINIO_SITE_NAME: gula-minio-me-central
      MINIO_PROMETHEUS_AUTH_TYPE: public
      MINIO_KMS_KES_ENDPOINT: ${MINIO_KMS_KES_ENDPOINT:-}
      MINIO_KMS_KES_API_KEY: ${MINIO_KMS_KES_API_KEY:-}
      MINIO_KMS_KES_KEY_NAME: gula-minio-key
      MINIO_AUDIT_WEBHOOK_ENABLE: on
      MINIO_AUDIT_WEBHOOK_ENDPOINT: https://audit.gula.health/minio-events
      MINIO_AUDIT_WEBHOOK_AUTH_TOKEN: ${MINIO_AUDIT_TOKEN:-}
    volumes:
      - minio-4-data1:/data1
      - minio-4-data2:/data2
      - minio-4-data3:/data3
      - minio-4-data4:/data4
    expose:
      - "9000"
      - "9001"
    networks:
      - gula-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Nginx Load Balancer (MinIO S3 API + Console) ───────────────────────────
  minio-lb:
    image: nginx:1.28-alpine
    container_name: gula-minio-lb
    restart: always
    mem_limit: 128m
    mem_reservation: 64m
    cpus: "0.25"
    volumes:
      - ./nginx-minio.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    depends_on:
      minio-1:
        condition: service_healthy
      minio-2:
        condition: service_healthy
      minio-3:
        condition: service_healthy
      minio-4:
        condition: service_healthy
    networks:
      - gula-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── MinIO Client (mc) — one-shot setup container ───────────────────────────
  minio-setup:
    image: minio/mc:latest
    container_name: gula-minio-setup
    restart: "no"
    entrypoint: >
      /bin/sh -c "
        until (mc config host add gula http://minio-lb:9000 \${MINIO_ROOT_USER} \${MINIO_ROOT_PASSWORD}) 2>/dev/null; do echo 'waiting for minio...'; sleep 2; done;
        mc mb gula/gula-reports --region me-central --ignore-existing;
        mc mb gula/gula-results --region me-central --ignore-existing;
        mc mb gula/gula-db-backups --region me-central --ignore-existing;
        mc mb gula/gula-static --region me-central --ignore-existing;
        mc version enable gula/gula-reports;
        mc version enable gula/gula-results;
        mc version enable gula/gula-db-backups;
        mc policy set download gula/gula-static;
        echo 'MinIO buckets created successfully';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    depends_on:
      minio-lb:
        condition: service_healthy
    networks:
      - gula-net

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  minio-1-data1: { driver: local }
  minio-1-data2: { driver: local }
  minio-1-data3: { driver: local }
  minio-1-data4: { driver: local }
  minio-2-data1: { driver: local }
  minio-2-data2: { driver: local }
  minio-2-data3: { driver: local }
  minio-2-data4: { driver: local }
  minio-3-data1: { driver: local }
  minio-3-data2: { driver: local }
  minio-3-data3: { driver: local }
  minio-3-data4: { driver: local }
  minio-4-data1: { driver: local }
  minio-4-data2: { driver: local }
  minio-4-data3: { driver: local }
  minio-4-data4: { driver: local }

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  gula-net:
    external: true
