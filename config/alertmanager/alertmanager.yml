route:
  receiver: 'default'
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 1h
  group_by: ['alertname', 'severity']

receivers:
  - name: 'default'
    webhook_configs:
      - url: '${ALERTMANAGER_WEBHOOK_URL}'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
