# =============================================================================
# GULA PLATFORM - OpenTelemetry Collector Configuration
# Executive Order 15: Distributed Tracing & Metrics Pipeline
# =============================================================================

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - http://*
            - https://*
          allowed_headers:
            - content-type
            - authorization

  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          scrape_interval: 15s
          static_configs:
            - targets: ['0.0.0.0:8888']

  jaeger:
    protocols:
      grpc:
        endpoint: 0.0.0.0:14250
      thrift_binary:
        endpoint: 0.0.0.0:6832
      thrift_compact:
        endpoint: 0.0.0.0:6831
      thrift_http:
        endpoint: 0.0.0.0:14268

  zipkin:
    endpoint: 0.0.0.0:9411

  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      disk:
      network:
      load:
      filesystem:
        metrics:
          system.filesystem.utilization:
            enabled: true
      paging:
      processes:

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
    send_batch_max_size: 2048

  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128
    ballast_size_mib: 64

  attributes:
    actions:
      - key: environment
        value: production
        action: upsert
      - key: region
        value: me-central-1
        action: upsert
      - key: service
        from_attribute: service.name
        action: upsert
      - key: platform
        value: gula
        action: upsert
      - key: deployment
        value: docker-compose
        action: upsert

  filter:
    error_mode: ignore
    traces:
      span:
        - 'name == "/health"'
        - 'name == "/health/live"'
        - 'name == "/health/ready"'
        - 'name == "/health/status"'
        - 'name == "/health/deep"'
        - 'name matches "^/metrics.*"'

  span:
    name:
      to_attributes:
        rules:
          - ^/api/v[0-9]+/(.*)$ -> /api/$1
    # Sampling: 10% of traces, keep all errors
    policy:
      - type: probabilistic_sampler
        probabilistic_sampler:
          sampling_percentage: 10
          hash_seed: 42
      - type: status_code
        status_code:
          status_codes:
            - ERROR
          sampling_percentage: 100

  k8sattributes:
    passthrough: false
    extract:
      metadata:
        - k8s.pod.name
        - k8s.node.name
        - k8s.namespace.name
        - k8s.deployment.name
        - k8s.container.name
      labels:
        - tag_name: k8s_app_label
          key: app
          from: pod
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.name
      - sources:
          - from: resource_attribute
            name: k8s.deployment.name
      - sources:
          - from: connection

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: otel
    const_labels:
      environment: production
      platform: gula
    resource_to_telemetry_conversion:
      enabled: true

  otlp:
    endpoint: tempo:4317
    tls:
      insecure: true
    sending_queue:
      num_consumers: 10
      queue_size: 5000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    tls:
      insecure: true
    default_labels_enabled:
      - service
      - environment
      - region
      - trace_id

  logging:
    verbosity: detailed
    sampling_initial: 5
    sampling_thereafter: 100

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, pprof, zpages]

  pipelines:
    traces:
      receivers: [otlp, jaeger, zipkin]
      processors: [attributes, filter, span, batch, memory_limiter]
      exporters: [otlp, logging]

    metrics:
      receivers: [otlp, prometheus, hostmetrics]
      processors: [attributes, batch, memory_limiter]
      exporters: [prometheus]

    logs:
      receivers: [otlp]
      processors: [attributes, batch, memory_limiter]
      exporters: [loki]
