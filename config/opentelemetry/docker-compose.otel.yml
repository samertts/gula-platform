# =============================================================================
# GULA PLATFORM - OpenTelemetry Collector Stack
# Part of the Observability infrastructure (Phase 4)
# =============================================================================
# Usage: docker compose -f docker-compose.yml -f config/opentelemetry/docker-compose.otel.yml up -d

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.118.0
    container_name: otel-collector
    restart: unless-stopped
    command:
      - --config=/etc/otel/config.yml
    volumes:
      - ./config/opentelemetry/otel-collector-config.yml:/etc/otel/config.yml:ro
    ports:
      - "13133:13133"   # Health check
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      - "8888:8888"     # OTel own metrics
      - "8889:8889"     # Prometheus exporter
      - "9411:9411"     # Zipkin
      - "14250:14250"   # Jaeger gRPC
      - "14268:14268"   # Jaeger thrift HTTP
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=service.name=otel-collector,environment=production
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - gula-net
