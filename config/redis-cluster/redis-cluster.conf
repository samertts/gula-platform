# =============================================================================
# GULA Platform — Redis Cluster Configuration
# For deployments requiring automatic sharding across multiple nodes
# Port base: 6379 (one Redis Cluster node per port)
# Cluster bus port: 16379 (auto = base + 10000)
# =============================================================================

# ── Cluster Mode ─────────────────────────────────────────────────────────────
cluster-enabled yes
cluster-config-file nodes.conf
cluster-node-timeout 5000
cluster-require-full-coverage no
# cluster-migration-barrier 1

# ── Network ──────────────────────────────────────────────────────────────────
bind 0.0.0.0
port 6379
protected-mode yes

# ── Authentication ───────────────────────────────────────────────────────────
# requirepass is set via environment or command-line for security
# masterauth is for inter-node replication auth
# masterauth ${REDIS_PASSWORD}

# ── Persistence (AOF + RDB) ─────────────────────────────────────────────────
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

aof-load-truncated yes
aof-use-rdb-preamble yes

# RDB snapshots (additional safety layer)
save 900 1
save 300 10
save 60 1000

# ── Memory ───────────────────────────────────────────────────────────────────
maxmemory 256mb
maxmemory-policy volatile-lru

# ── Cluster Node Timeout & Replicas ──────────────────────────────────────────
# Node is considered failing if not reachable within timeout (ms)
# cluster-replica-validity-factor 10
# cluster-migration-barrier 1

# ── Client Limits ────────────────────────────────────────────────────────────
maxclients 10000
timeout 300

# ── Slow Log ─────────────────────────────────────────────────────────────────
slowlog-log-slower-than 10000
slowlog-max-len 128

# ── Latency Monitor ──────────────────────────────────────────────────────────
latency-monitor-threshold 100

# ── ACL (optional — Redis 6+) ────────────────────────────────────────────────
# aclfile /etc/redis/users.acl

# ── TLS (optional — for production) ──────────────────────────────────────────
# tls-port 6379
# tls-cert-file /etc/redis/ssl/redis.crt
# tls-key-file /etc/redis/ssl/redis.key
# tls-ca-cert-file /etc/redis/ssl/ca.crt
# tls-auth-clients yes
# tls-replication yes
# tls-cluster yes

# ── Logging ──────────────────────────────────────────────────────────────────
loglevel notice
logfile /var/log/redis/cluster.log
