# =============================================================================
# RabbitMQ Configuration - GULA Platform
# Executive Order 6: Durable queues, persistent messages, acknowledged delivery
# =============================================================================

# Load definitions on startup (creates queues, exchanges, bindings)
load_definitions = /etc/rabbitmq/definitions.json

# Management Plugin
management.tcp.port = 15672
management.tcp.ip = 0.0.0.0

# Heartbeat
heartbeat = 60

# Consumer timeout (ms) - unacked messages returned after 30 minutes
consumer_timeout = 1800000

# Memory and disk alarms
vm_memory_high_watermark.relative = 0.7
disk_free_limit.absolute = 2GB

# Logging
log.console = true
log.console.level = info
log.file = false

# Persistence
queue_master_locator = min-masters

# Clustering
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config
