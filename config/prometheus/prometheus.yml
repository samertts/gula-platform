# =============================================================================
# GULA PLATFORM - Prometheus Configuration
# Executive Order 14: Comprehensive Monitoring
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'gula-platform'
    environment: 'production'

# Alerting rules
rule_files:
  - "/etc/prometheus/rules/*.yml"

# Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # PostgreSQL metrics (requires postgres_exporter sidecar - not yet deployed)
  # - job_name: 'postgres-primary'
  #   static_configs:
  #     - targets: ['postgres-primary:9187']
  #   metrics_path: /metrics

  # Redis metrics (requires redis_exporter sidecar - not yet deployed)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis:9121']

  # RabbitMQ metrics via built-in Prometheus plugin
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
    metrics_path: /metrics

  # Lab Service
  - job_name: 'lab-service'
    static_configs:
      - targets: ['lab-service:8000']
    metrics_path: /metrics

  # Patient Service
  - job_name: 'patient-service'
    static_configs:
      - targets: ['patient-service:8000']
    metrics_path: /metrics

  # Order Service
  - job_name: 'order-service'
    static_configs:
      - targets: ['order-service:8000']
    metrics_path: /metrics

  # Result Service
  - job_name: 'result-service'
    static_configs:
      - targets: ['result-service:8000']
    metrics_path: /metrics

  # Sample Service
  - job_name: 'sample-service'
    static_configs:
      - targets: ['sample-service:8000']
    metrics_path: /metrics

  # AI Service
  - job_name: 'ai-service'
    static_configs:
      - targets: ['ai-service:9000']
    metrics_path: /metrics

  # Autonomous Manager
  - job_name: 'autonomous-manager'
    static_configs:
      - targets: ['autonomous-manager:8000']
    metrics_path: /metrics

  # Nginx API Gateway (requires nginx_exporter sidecar - not yet deployed)
  # - job_name: 'nginx'
  #   static_configs:
  #     - targets: ['api-gateway:9113']

  # Kafka
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9101']

  # ClickHouse (built-in metrics endpoint)
  - job_name: 'clickhouse'
    static_configs:
      - targets: ['clickhouse:8123']
    metrics_path: /metrics

  # MinIO
  - job_name: 'minio'
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ['minio:9000']

  # Node Exporter (host metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
