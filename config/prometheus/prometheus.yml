# =============================================================================
# GULA PLATFORM - Prometheus Configuration (MVP)
# Scrapes the actual services running in docker-compose.yml
# Full-stack services (commented out) used with docker-compose.full.yml
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: 'gula-platform'
    environment: 'production'

# Alert rules
rule_files:
  - "/etc/prometheus/rules/*.yml"

# Alertmanager — routes firing alerts to on-call channels.
# Comment the file_sd_configs block out for dev without alertmanager.
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'
      timeout: 10s
      scheme: http

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ─── MVP Backend ────────────────────────────────────────────────────────────
  - job_name: 'gula-backend'
    metrics_path: /metrics/prom
    # Bearer token secures /metrics/prom (set METRICS_BEARER_TOKEN in .env)
    # When token is empty the endpoint is open (dev mode)
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ['gula-backend:8000']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'python_.*|process_.*'
        action: drop

  # ─── Infrastructure ──────────────────────────────────────────────────────────
  # Node Exporter: host CPU, memory, disk, network
  # Start with: docker run -d --name=node-exporter --pid=host --network=gula-net
  #   -v /:/host:ro,rslave prom/node-exporter --path.rootfs=/host
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # PostgreSQL metrics (postgres_exporter sidecar)
  # Enable in .env: ENABLE_PG_EXPORTER=true
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    # Will fail silently if not running — that is OK
    honor_labels: true

  # Redis metrics (redis_exporter sidecar)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    honor_labels: true

  # Nginx metrics (nginx-exporter, reads stub_status)
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
    honor_labels: true

  # ─── Full-stack services (docker-compose.full.yml only) ───────────────────
  # Uncomment when running the full stack
  # - job_name: 'rabbitmq'
  #   static_configs:
  #     - targets: ['rabbitmq:15692']

  # - job_name: 'clickhouse'
  #   static_configs:
  #     - targets: ['clickhouse:8123']

  # - job_name: 'minio'
  #   metrics_path: /minio/v2/metrics/cluster
  #   static_configs:
  #     - targets: ['minio:9000']
