# =============================================================================
# GULA PLATFORM - Prometheus Configuration (Full Stack)
# Extends the MVP config with full observability targets
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: 'gula-platform'
    environment: 'production'
    region: 'me-central-1'

rule_files:
  - "/etc/prometheus/rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'
      timeout: 10s
      scheme: http

scrape_configs:
  # ─── Self-monitoring ────────────────────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ─── Backend ────────────────────────────────────────────────────────────────
  - job_name: 'gula-backend'
    metrics_path: /metrics/prom
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ['gula-backend:8000']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'python_.*|process_.*'
        action: drop

  # ─── OpenTelemetry Collector ────────────────────────────────────────────────
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'otelcol_.*'
        action: keep

  - job_name: 'otel-collector-prometheus'
    static_configs:
      - targets: ['otel-collector:8889']

  # ─── Tempo ──────────────────────────────────────────────────────────────────
  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']
    metrics_path: /metrics

  # ─── Alertmanager ───────────────────────────────────────────────────────────
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
    metrics_path: /metrics

  # ─── HAProxy ────────────────────────────────────────────────────────────────
  - job_name: 'haproxy'
    static_configs:
      - targets: ['haproxy:8405']
    metrics_path: /metrics

  # ─── PgBouncer ─────────────────────────────────────────────────────────────
  - job_name: 'pgbouncer'
    static_configs:
      - targets: ['pgbouncer-exporter:9127']
    honor_labels: true

  # ─── Patroni ────────────────────────────────────────────────────────────────
  - job_name: 'patroni'
    static_configs:
      - targets: ['patroni:8008']
    metrics_path: /metrics

  # ─── Infrastructure ─────────────────────────────────────────────────────────
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    honor_labels: true

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    honor_labels: true

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
    honor_labels: true

  # ─── Message Queue ──────────────────────────────────────────────────────────
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']

  # ─── Object Storage ─────────────────────────────────────────────────────────
  - job_name: 'minio'
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ['minio:9000']

  # ─── ClickHouse ─────────────────────────────────────────────────────────────
  - job_name: 'clickhouse'
    static_configs:
      - targets: ['clickhouse:8123']
    metrics_path: /metrics

# ─── Remote Write (long-term storage) ──────────────────────────────────────────
remote_write:
  - url: 'http://victoriametrics:8428/api/v1/write'
    queue_config:
      capacity: 5000
      max_samples_per_send: 1000
      min_shards: 3
      max_shards: 10
    basic_auth:
      username: 'gula'
      password: 'remote-write-password-placeholder'
    write_relabel_configs:
      - source_labels: [__name__]
        regex: 'gula_.*|otel_.*|slo_.*'
        action: keep

# ─── Federation (multi-region) ─────────────────────────────────────────────────
- job_name: 'federate-baghdad'
  scrape_interval: 60s
  honor_labels: true
  metrics_path: '/federate'
  params:
    'match[]':
      - '{__name__=~"gula_.*"}'
      - '{__name__=~"slo_.*"}'
      - '{__name__=~"otel_.*"}'
  static_configs:
    - targets: ['baghdad-prometheus:9090']

- job_name: 'federate-basra'
  scrape_interval: 60s
  honor_labels: true
  metrics_path: '/federate'
  params:
    'match[]':
      - '{__name__=~"gula_.*"}'
      - '{__name__=~"slo_.*"}'
  static_configs:
    - targets: ['basra-prometheus:9090']
