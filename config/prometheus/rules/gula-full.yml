groups:
  # ===========================================================================
  # BUSINESS-LEVEL ALERTS
  # ===========================================================================
  - name: gula_business
    interval: 60s
    rules:
      - alert: OrderBacklogIncreasing
        expr: |
          avg_over_time(increase(gula_orders_pending[30m])[1h:5m]) > 0
          and gula_orders_pending > 50
        for: 10m
        labels:
          severity: warning
          service: business
        annotations:
          summary: "Order backlog growing: {{ $value | humanize }} pending"
          description: |
            Order backlog is increasing over the last hour with 50+ orders pending.
            Check outbox worker and downstream integrations.

      - alert: ResultValidationFailures
        expr: increase(gula_result_validation_failures_total[15m]) > 10
        for: 5m
        labels:
          severity: warning
          service: business
        annotations:
          summary: "Result validation failures: {{ $value }} in 15min"
          description: |
            More than 10 lab result validation failures in 15 minutes.
            Check reference ranges and instrument data format.

      - alert: PatientRegistrationErrors
        expr: increase(gula_patient_registration_errors_total[15m]) > 5
        for: 2m
        labels:
          severity: warning
          service: business
        annotations:
          summary: "Patient registration errors: {{ $value }} in 15min"
          description: |
            Elevated patient registration errors. Check MPI matcher and
            national ID validation service.

      - alert: CriticalResultRateHigh
        expr: rate(gula_critical_results_total[1h]) > 100
        for: 10m
        labels:
          severity: info
          service: business
        annotations:
          summary: "High critical result rate: {{ $value }}/hr"
          description: |
            More than 100 critical results per hour. May indicate a
            public health event or lab instrument calibration issue.

  # ===========================================================================
  # PIPELINE ALERTS
  # ===========================================================================
  - name: gula_pipeline
    interval: 60s
    rules:
      - alert: OutboxWorkerDown
        expr: gula_outbox_worker_up == 0
        for: 1m
        labels:
          severity: critical
          service: pipeline
        annotations:
          summary: "Outbox worker DOWN"
          description: |
            The outbox worker process is not running. Events are not being
            delivered. Order processing and notifications will stall.

      - alert: EventBusLatencyHigh
        expr: gula_event_bus_latency_ms > 1000
        for: 5m
        labels:
          severity: warning
          service: pipeline
        annotations:
          summary: "Event bus latency: {{ $value }}ms"
          description: |
            Event bus publish latency exceeds 1 second. Check RabbitMQ
            queue depth and consumer health.

      - alert: NotificationsBacklog
        expr: gula_notifications_pending > 1000
        for: 5m
        labels:
          severity: warning
          service: pipeline
        annotations:
          summary: "Notifications backlog: {{ $value }} pending"
          description: |
            More than 1000 pending notifications. Check push notification
            service and email delivery.

      - alert: OutboxEventAgeHigh
        expr: gula_outbox_oldest_event_age_seconds > 300
        for: 2m
        labels:
          severity: warning
          service: pipeline
        annotations:
          summary: "Oldest outbox event age: {{ $value | humanizeDuration }}"
          description: |
            Events in the outbox are not being processed within 5 minutes.
            Check worker health and downstream service availability.

  # ===========================================================================
  # SECURITY ALERTS
  # ===========================================================================
  - name: gula_security
    interval: 30s
    rules:
      - alert: AuthFailuresSpike
        expr: increase(gula_auth_failures_total[5m]) > 50
        for: 1m
        labels:
          severity: critical
          service: security
        annotations:
          summary: "Auth failure spike: {{ $value }} in 5min"
          description: |
            More than 50 authentication failures in 5 minutes. Possible
            brute-force attack in progress. Check rate limiting and
            consider IP blocking.

      - alert: RateLimitBlocks
        expr: increase(gula_rate_limit_blocks_total[15m]) > 100
        for: 5m
        labels:
          severity: warning
          service: security
        annotations:
          summary: "Rate limit blocks: {{ $value }} in 15min"
          description: |
            More than 100 rate limit blocks in 15 minutes. May indicate
            an abuse pattern or misconfigured client.

      - alert: IntrusionDetectionTrigger
        expr: increase(gula_intrusion_detection_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
          service: security
        annotations:
          summary: "Intrusion detection triggered"
          description: |
            An intrusion detection event has been triggered. Check the
            security audit log for details. Alert: {{ $labels.rule }}.

      - alert: JWTValidationFailures
        expr: increase(gula_jwt_validation_failures_total[15m]) > 20
        for: 2m
        labels:
          severity: warning
          service: security
        annotations:
          summary: "JWT validation failures: {{ $value }} in 15min"
          description: |
            Elevated JWT validation failures. Possible token forgery
            attempt or expired tokens with aggressive retry.

      - alert: PermissionDeniedSpike
        expr: increase(gula_permission_denied_total[15m]) > 30
        for: 5m
        labels:
          severity: warning
          service: security
        annotations:
          summary: "Permission denied spike: {{ $value }} in 15min"
          description: |
            More than 30 permission denied events in 15 minutes. May
            indicate probe activity or RBAC misconfiguration.

      - alert: PolicyEngineBlocks
        expr: increase(gula_policy_block_total[5m]) > 20
        for: 2m
        labels:
          severity: warning
          service: security
        annotations:
          summary: "Policy engine blocks: {{ $value }} in 5min"
          description: |
            High rate of policy engine blocks. Check for autonomous action
            loops or misconfigured policies.

  # ===========================================================================
  # CAPACITY PLANNING ALERTS
  # ===========================================================================
  - name: gula_capacity_planning
    interval: 300s
    rules:
      - alert: DiskGrowthRate
        expr: |
          predict_linear(node_filesystem_avail_bytes{mountpoint="/"}[7d], 7*24*3600) < 0
        for: 1h
        labels:
          severity: warning
          service: capacity
        annotations:
          summary: "Disk growth rate: full in {{ $value | humanizeDuration }}"
          description: |
            Based on 7-day trend, disk will be full within 7 days.
            Plan storage expansion or cleanup.

      - alert: MemoryTrendGrowth
        expr: |
          predict_linear(gula_memory_rss_mb[14d], 14*24*3600) > 800
        for: 6h
        labels:
          severity: warning
          service: capacity
        annotations:
          summary: "Memory growth trend: {{ $value }}MB projected in 14 days"
          description: |
            Backend memory usage is growing. Projected to exceed 800MB
            within 14 days. Consider increasing memory limits.

      - alert: ConnectionGrowth
        expr: |
          predict_linear(pg_stat_activity_count{datname="labdb"}[14d], 14*24*3600) > 90
        for: 6h
        labels:
          severity: warning
          service: capacity
        annotations:
          summary: "DB connection growth: {{ $value }} projected in 14 days"
          description: |
            Database connection count is trending upward. Projected to
            exceed 90 connections within 14 days. Check for connection leaks.

      - alert: ThroughputGrowth
        expr: |
          predict_linear(rate(gula_requests_total[30d])[14d:1h], 14*24*3600)
          > rate(gula_requests_total[30d]) * 1.5
        for: 24h
        labels:
          severity: info
          service: capacity
        annotations:
          summary: "Request throughput growing: {{ $value | humanize }} req/s projected"
          description: |
            Request throughput is growing faster than 50% over 30-day
            average. Plan capacity scale-up.

  # ===========================================================================
  # OTEL PIPELINE HEALTH
  # ===========================================================================
  - name: gula_observability
    interval: 60s
    rules:
      - alert: OtelCollectorDown
        expr: up{job="otel-collector"} == 0
        for: 1m
        labels:
          severity: warning
          service: observability
        annotations:
          summary: "OpenTelemetry Collector DOWN"
          description: |
            The OTel collector is unreachable. Traces and metrics
            pipeline is broken. Restart with: docker compose restart otel-collector

      - alert: TempoDown
        expr: up{job="tempo"} == 0
        for: 2m
        labels:
          severity: warning
          service: observability
        annotations:
          summary: "Tempo DOWN"
          description: |
            Grafana Tempo is unreachable. Distributed tracing storage
            is unavailable. Restart with: docker compose restart tempo

      - alert: LokiDown
        expr: up{job="loki"} == 0
        for: 2m
        labels:
          severity: warning
          service: observability
        annotations:
          summary: "Loki DOWN"
          description: |
            Loki is unreachable. Log aggregation is unavailable.
