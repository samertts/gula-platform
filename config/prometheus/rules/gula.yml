groups:
  # ===========================================================================
  # SLO RECORDING RULES
  # ===========================================================================
  - name: gula_slo_recording
    interval: 30s
    rules:
      - record: slo:gula_availability
        expr: gula_up

      - record: slo:gula_db_health
        expr: |
          gula_db_up
          * clamp_max(1.0, 300 / clamp_min(gula_db_latency_ms, 1))

      - record: slo:gula_redis_health
        expr: |
          gula_redis_up
          * clamp_max(1.0, 50 / clamp_min(gula_redis_latency_ms, 1))

      - record: slo:gula_queue_pressure
        expr: |
          clamp_max(gula_orders_pending / clamp_min(gula_orders_total, 1), 1)

      # DB error ratio — fraction of health checks that failed in last 5min
      - record: slo:gula_db_error_ratio
        expr: gula_db_error_ratio_5m

  # ===========================================================================
  # SERVICE AVAILABILITY (uses actual /metrics/prom metric names)
  # ===========================================================================
  - name: gula_availability
    interval: 30s
    rules:

      - alert: BackendDown
        expr: gula_up == 0
        for: 1m
        labels:
          severity: critical
          service: backend
        annotations:
          summary: "🔴 GULA Platform DOWN"
          description: "gula_up=0 for >1m. Platform unreachable. Patients cannot access results."

      - alert: DatabaseDown
        expr: gula_db_up == 0
        for: 1m
        labels:
          severity: critical
          service: database
        annotations:
          summary: "🔴 PostgreSQL unreachable"
          description: "gula_db_up=0. All write operations are blocked."

      - alert: RedisDown
        expr: gula_redis_up == 0
        for: 2m
        labels:
          severity: warning
          service: cache
        annotations:
          summary: "🟡 Redis unreachable"
          description: "Rate limiting and session cache are degraded (in-memory fallback)."

  # ===========================================================================
  # PERFORMANCE — latency SLOs
  # ===========================================================================
  - name: gula_performance
    interval: 60s
    rules:

      - alert: DatabaseSlow
        expr: gula_db_up == 1 and gula_db_latency_ms > 200
        for: 3m
        labels:
          severity: warning
          service: database
        annotations:
          summary: "🟡 DB slow {{ $value | humanize }}ms"
          description: "DB ping >200ms for 3min. Queries may time out under load."

      - alert: DatabaseVerySlow
        expr: gula_db_up == 1 and gula_db_latency_ms > 500
        for: 2m
        labels:
          severity: critical
          service: database
        annotations:
          summary: "🔴 DB critically slow {{ $value | humanize }}ms"
          description: "DB ping >500ms. Requests are timing out. Check PG slow query log."

      - alert: RedisSlow
        expr: gula_redis_up == 1 and gula_redis_latency_ms > 50
        for: 3m
        labels:
          severity: warning
          service: cache
        annotations:
          summary: "🟡 Redis slow {{ $value | humanize }}ms"
          description: "Redis ping >50ms for 3min. Rate-limiting accuracy reduced."

  # ===========================================================================
  # CAPACITY — concurrency, memory, order backlog
  # ===========================================================================
  - name: gula_capacity
    interval: 60s
    rules:

      - alert: HighConcurrency
        expr: gula_active_requests > 150
        for: 2m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "🟡 {{ $value }} active requests (limit: 200)"
          description: "Approaching concurrency limit. New requests may be rejected."

      - alert: ConcurrencyLimitReached
        expr: gula_active_requests > 190
        for: 30s
        labels:
          severity: critical
          service: backend
        annotations:
          summary: "🔴 Concurrency limit reached ({{ $value }}/200)"
          description: "System at capacity. New requests are being rejected with 503."

      - alert: HighMemory
        expr: gula_memory_rss_mb > 600
        for: 5m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "🟡 Backend memory {{ $value }}MB RSS"
          description: "Memory RSS >600MB for 5min. Risk of OOM."

      - alert: OrderBacklog
        expr: gula_orders_pending > 100
        for: 5m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "🟡 Order backlog: {{ $value }} pending"
          description: "100+ orders pending for >5min. Check outbox worker health."

  # ===========================================================================
  # INFRASTRUCTURE (requires node-exporter running)
  # ===========================================================================
  - name: gula_infrastructure
    interval: 60s
    rules:

      - alert: DiskSpaceWarning
        expr: |
          (1 - (node_filesystem_avail_bytes{mountpoint="/"} /
                node_filesystem_size_bytes{mountpoint="/"})) > 0.80
        for: 5m
        labels:
          severity: warning
          service: host
        annotations:
          summary: "🟡 Disk {{ $value | humanizePercentage }}"
          description: "Disk >80%. Run 'make backup' and clear old logs."

      - alert: DiskSpaceCritical
        expr: |
          (1 - (node_filesystem_avail_bytes{mountpoint="/"} /
                node_filesystem_size_bytes{mountpoint="/"})) > 0.92
        for: 1m
        labels:
          severity: critical
          service: host
        annotations:
          summary: "🔴 Disk nearly full {{ $value | humanizePercentage }}"
          description: "Disk >92%. DB writes WILL fail. Emergency cleanup required."

      - alert: HighSystemMemory
        expr: |
          (1 - (node_memory_MemAvailable_bytes /
                node_memory_MemTotal_bytes)) > 0.90
        for: 5m
        labels:
          severity: warning
          service: host
        annotations:
          summary: "🟡 System memory {{ $value | humanizePercentage }}"
          description: "Available memory critically low. OOM killer may terminate containers."

      - alert: HighCPU
        expr: |
          100 - (avg by(instance)
            (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
          service: host
        annotations:
          summary: "🟡 CPU {{ $value | humanize }}% for 10min"
          description: "Sustained high CPU. Check for runaway processes."

  # ===========================================================================
  # DATABASE CONNECTIONS (requires postgres-exporter)
  # ===========================================================================
  - name: gula_database
    interval: 60s
    rules:

      - alert: PostgresConnectionsHigh
        expr: pg_stat_activity_count{datname="labdb"} > 70
        for: 5m
        labels:
          severity: warning
          service: database
        annotations:
          summary: "🟡 Postgres connections {{ $value }}/100"
          description: "Connection count >70. Risk of exhaustion. Check for leaks."

      - alert: PostgresConnectionsExhausted
        expr: pg_stat_activity_count{datname="labdb"} > 90
        for: 2m
        labels:
          severity: critical
          service: database
        annotations:
          summary: "🔴 Postgres connections critical {{ $value }}/100"
          description: "Near-full connection pool. New connections will be rejected."

  # ===========================================================================
  # DB CONNECTION ERROR TYPE ALERTS
  # These fire on per-error-type counters from /metrics/prom.
  # auth_failed is CRITICAL immediately — it is a misconfiguration that will
  # NEVER self-heal and requires operator action.
  # refused / timeout fire after a sustained period (transient is OK).
  # ===========================================================================
  - name: gula_db_error_types
    interval: 30s
    rules:

      - alert: DatabaseAuthFailed
        expr: increase(gula_db_auth_failed_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
          service: database
          action: stop_and_alert
        annotations:
          summary: "🔴 DB authentication failure — IMMEDIATE action required"
          description: |
            PostgreSQL rejected authentication. This is a permanent misconfiguration —
            retries will never succeed. Fix POSTGRES_PASSWORD or pg_hba.conf and redeploy.
            The backend will NOT become healthy until this is resolved.

      - alert: DatabaseConnectionRefused
        expr: increase(gula_db_refused_total[10m]) > 5
        for: 2m
        labels:
          severity: warning
          service: database
          action: retry
        annotations:
          summary: "🟡 DB connection refused {{ $value }} times in 10min"
          description: |
            Backend cannot reach PostgreSQL (TCP refused). Possible causes:
            listen_addresses misconfiguration, postgres container restart, or
            network issue. Check: docker-compose ps && docker-compose logs postgres

      - alert: DatabaseConnectionRefusedCritical
        expr: increase(gula_db_refused_total[10m]) > 20
        for: 1m
        labels:
          severity: critical
          service: database
          action: retry
        annotations:
          summary: "🔴 DB connection refused {{ $value }} times — system degraded"
          description: |
            High rate of TCP-refused DB connections. Backend is running in degraded
            mode. All write operations are failing. Check postgres container health.

      - alert: DatabaseTimeout
        expr: increase(gula_db_timeout_total[10m]) > 3
        for: 2m
        labels:
          severity: warning
          service: database
          action: retry_with_backoff
        annotations:
          summary: "🟡 DB connection timeouts {{ $value }} in 10min"
          description: |
            DB connections are timing out. PostgreSQL may be overloaded or the
            network is congested. Check pg_stat_activity and system load.

      # ── Ratio-based alerts (sliding-window gauges from /metrics/prom) ────────
      # These fire based on the *fraction* of DB checks failing, not raw counts.
      # They're immune to stale history — the window resets every 5 minutes.

      - alert: DatabaseErrorRatioHigh
        expr: gula_db_error_ratio_5m > 0.25
        for: 2m
        labels:
          severity: warning
          service: database
          action: retry
        annotations:
          summary: "🟡 DB error ratio {{ $value | humanizePercentage }} in last 5min"
          description: |
            More than 25% of DB health checks failed in the last 5 minutes.
            Transient blips are normal; sustained >25% indicates a real outage.

      - alert: DatabaseErrorRatioCritical
        expr: gula_db_error_ratio_5m > 0.75
        for: 1m
        labels:
          severity: critical
          service: database
          action: retry_with_backoff
        annotations:
          summary: "🔴 DB error ratio {{ $value | humanizePercentage }} — system degraded"
          description: |
            Over 75% of DB health checks failed in the last 5 minutes.
            Backend is likely running in degraded/read-only mode.
            Check: docker-compose ps && docker-compose logs postgres

      - alert: DatabaseRefusedRateHigh
        expr: gula_db_refused_rate_5m > 6
        for: 1m
        labels:
          severity: warning
          service: database
          action: retry
        annotations:
          summary: "🟡 DB refused {{ $value }}/min — circuit may open"
          description: |
            Connection-refused rate exceeds 6/min. If sustained, the circuit
            breaker will open automatically at 20 events/5min.

  # ===========================================================================
  # POLICY / CONTROL LAYER ALERTS
  # ===========================================================================
  - name: gula_control_layer
    interval: 60s
    rules:

      - alert: PolicyBlockSpike
        expr: increase(gula_policy_block_total[15m]) > 10
        for: 0m
        labels:
          severity: warning
          service: control_layer
        annotations:
          summary: "🟡 {{ $value }} autonomous actions blocked in 15min"
          description: |
            The policy engine is blocking many autonomous actions. This may indicate
            a repair loop or misconfigured automation. Check /admin/control-layer/stats

      - alert: KillSwitchActive
        expr: gula_kill_switch_active == 1
        for: 0m
        labels:
          severity: critical
          service: control_layer
        annotations:
          summary: "🔴 Kill switch ACTIVE — all autonomous actions halted"
          description: |
            The platform kill switch is active. No auto-repair, scaling, or AI actions
            will execute. To deactivate: POST /admin/kill-switch/deactivate

      - alert: DegradationL2ReadOnly
        expr: gula_degradation_level == 2
        for: 0m
        labels:
          severity: warning
          service: degradation
        annotations:
          summary: "🟡 System L2_READ_ONLY — writes blocked (DB circuit open)"
          description: |
            DB circuit breaker opened after sustained connection-refused errors.
            Write endpoints return 503. GET requests still pass.
            Recovery: DB will be probed every 10s; circuit closes automatically.

      - alert: DegradationL3CriticalOnly
        expr: gula_degradation_level == 3
        for: 0m
        labels:
          severity: critical
          service: degradation
        annotations:
          summary: "🔴 System L3_CRITICAL_ONLY — DB storm, only essential paths reachable"
          description: |
            50+ DB connection-refused errors in 5 minutes. Only /health, /auth/login,
            /admin/kill-switch/deactivate, and /metrics/prom are reachable.
            Immediate action required: check postgres container and network.

  # ===========================================================================
  # AI LAYER
  # ===========================================================================
  - name: gula_ai
    interval: 30s
    rules:

      - alert: AICircuitOpen
        expr: gula_ai_circuit_open == 1
        for: 1m
        labels:
          severity: warning
          service: ai
        annotations:
          summary: "🟡 AI circuit open: {{ $labels.provider }}"
          description: |
            Provider {{ $labels.provider }} has failed ≥3 times in the last 30s.
            The circuit breaker is open — requests are being routed to the next
            provider in the fallback chain.
            Check: docker logs gula-backend 2>&1 | grep "Circuit open"

      - alert: AIAllCircuitsOpen
        expr: sum(gula_ai_circuit_open) == count(gula_ai_circuit_open)
        for: 1m
        labels:
          severity: critical
          service: ai
        annotations:
          summary: "🔴 All AI providers down — /interpret returning 503"
          description: |
            Every configured AI provider has an open circuit. The patient-facing
            interpretation endpoint (/api/ai/interpret) is returning 503.
            Check OPENROUTER_API_KEY, GEMINI_API_KEY, GROQ_API_KEY in .env.

      - alert: AIBudgetExhaustedSpike
        expr: increase(gula_ai_budget_exhausted_total[5m]) > 3
        for: 2m
        labels:
          severity: warning
          service: ai
        annotations:
          summary: "🟡 AI budget exhausted {{ $value }} times in 5 min"
          description: |
            The 6s hard budget for the AI provider chain is being hit repeatedly.
            This means all providers are slow or failing within the budget window.
            Consider increasing AI_BUDGET_SECONDS or checking provider status.

      - alert: AICacheHitRateLow
        expr: gula_ai_cache_hit_rate < 0.30
        for: 10m
        labels:
          severity: warning
          service: ai
        annotations:
          summary: "🟡 AI cache hit rate {{ $value | humanizePercentage }} (< 30%)"
          description: |
            AI response cache hit rate has dropped below 30% for 10 minutes.
            This increases API call volume and latency.
            Possible causes: Redis restart (cache cleared), highly varied result panels,
            or AI_CACHE_TTL_SECONDS set too low.
            Check: docker logs gula-backend 2>&1 | grep "cache=hit"

      - alert: AIErrorSpike
        expr: increase(gula_ai_errors_total[5m]) > 10
        for: 2m
        labels:
          severity: warning
          service: ai
        annotations:
          summary: "🟡 AI errors: {{ $value }} in 5 min (provider={{ $labels.provider }})"
          description: |
            High rate of AI provider errors. The circuit breaker may open soon.
            Check provider key validity and rate limits.
