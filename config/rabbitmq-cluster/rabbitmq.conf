# =============================================================================
# GULA Platform — RabbitMQ Cluster Configuration (3-node HA)
# Peer discovery via K8s DNS or Docker DNS
# Queue mirroring: ha-mode=all, ha-sync-mode=automatic
# =============================================================================

# ── Node Identity ────────────────────────────────────────────────────────────
# Node name is derived from hostname in Docker/K8s
# cluster_name is the rabbit@hostname

# ── Cluster Formation via Peer Discovery ─────────────────────────────────────
# Use Docker DNS (A record lookup) for peer discovery.
# Resolves rabbitmq-1, rabbitmq-2, rabbitmq-3 DNS records.
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2
cluster_formation.classic_config.nodes.3 = rabbit@rabbitmq-3

# Alternative: K8s DNS discovery
# cluster_formation.peer_discovery_backend = rabbit_peer_discovery_k8s
# cluster_formation.k8s.host = kubernetes.default.svc.cluster.local
# cluster_formation.k8s.address_type = hostname
# cluster_formation.k8s.service_name = rabbitmq
# cluster_formation.k8s.namespace = gula

# Alternative: AWS EC2 discovery
# cluster_formation.peer_discovery_backend = rabbit_peer_discovery_aws
# cluster_formation.aws.region = me-central-1
# cluster_formation.aws.tags.Cluster = gula-rabbitmq

# ── Erlang Cookie ────────────────────────────────────────────────────────────
# Must be identical on all cluster nodes.
# Set via RABBITMQ_ERLANG_COOKIE environment variable or file.
# Default location: /var/lib/rabbitmq/.erlang.cookie

# ── Queue Mirroring (HA) ────────────────────────────────────────────────────
# Mirrored queues across all nodes: ha-mode=all, ha-sync-mode=automatic
# Applied via policy (see definitions.json):
#   Pattern: .*
#   ha-mode: all
#   ha-sync-mode: automatic
#   ha-promote-on-shutdown: when-synced

# ── Memory & Disk ────────────────────────────────────────────────────────────
# Memory high watermark: 0.6 of available RAM
vm_memory_high_watermark.relative = 0.6
vm_memory_calculation_strategy = rss

# Disk free limit
disk_free_limit.absolute = 500MB

# ── Connections ──────────────────────────────────────────────────────────────
# Heartbeat interval (seconds)
heartbeat = 60

# Consumer timeout — unacknowledged messages returned after 30min
consumer_timeout = 1800000

# Connection backlog
tcp_listen_options.backlog = 4096

# ── Channels & Queues ────────────────────────────────────────────────────────
# Max number of channels per connection
channel_max = 2047

# Max queue length (soft limit — triggers flow control)
queue_master_locator = min-masters

# ── Performance Tuning ───────────────────────────────────────────────────────
# Number of Erlang processes to spawn for message handling
hipe_compile = false

# TCP buffer sizes (bytes)
tcp_listen_options.nodelay = true
tcp_listen_options.sendbuf = 65536
tcp_listen_options.recbuf = 65536
tcp_listen_options.sndbuf = 65536

# Default queue type: quorum for HA, classic for transient
default_queue_type = quorum

# ── Management Plugin (HTTP API + UI) ────────────────────────────────────────
management.tcp.port = 15672
management.tcp.ip = 0.0.0.0

# Stats aggregation interval (ms)
management.stats.event_max_samples = 100

# ── Prometheus Metrics Plugin ────────────────────────────────────────────────
prometheus.tcp.port = 15692
prometheus.tcp.ip = 0.0.0.0
prometheus.return_per_object_metrics = true

# ── Shovel Plugin (cross-cluster replication) ────────────────────────────────
# Dynamic shovels can be configured via management API or definitions.
# Static shovel config for DR:
# shovel.dr-shovel.source = amqp://source-cluster/%
# shovel.dr-shovel.dest = amqp://dr-cluster/%
# shovel.dr-shovel.reconnect-delay = 5

# ── Federation Plugin (upstream exchange/queue linking) ──────────────────────
# Configured via runtime parameters (management UI or CLI).
# federation-upstream set gula-dr upstream --uri amqp://dr-cluster

# ── Auth Mechanisms ──────────────────────────────────────────────────────────
# Use PLAIN (password-based) + rabbitmq_auth_mechanism_ssl if TLS
auth_mechanisms.1 = PLAIN
auth_mechanisms.2 = AMQPLAIN

# ── TLS (optional — for production with encrypted inter-node traffic) ───────
# listeners.ssl.default = 5671
# ssl_options.cacertfile = /etc/rabbitmq/ssl/ca.pem
# ssl_options.certfile = /etc/rabbitmq/ssl/server.pem
# ssl_options.keyfile = /etc/rabbitmq/ssl/server-key.pem
# ssl_options.verify = verify_peer
# ssl_options.fail_if_no_peer_cert = true

# ── Load Definitions (queues, exchanges, bindings, users) ────────────────────
# See definitions.json
load_definitions = /etc/rabbitmq/definitions.json

# ── Logging ──────────────────────────────────────────────────────────────────
log.console = true
log.console.level = info
log.file = /var/log/rabbitmq/rabbit.log
log.file.level = info
log.file.rotation.date = $D0
log.file.rotation.size = 104857600
log.file.number = 10

# ── Collection Policy ────────────────────────────────────────────────────────
# Collect statistics more aggressively for Prometheus
collect_statistics_interval = 10000
