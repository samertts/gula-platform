# =============================================================================
# GULA Platform — RabbitMQ 3-Node HA Cluster + HAProxy Load Balancer
# =============================================================================
# Usage:
#   docker compose -f config/rabbitmq-cluster/docker-compose.rabbitmq-ha.yml up -d
#
# Architecture:
#   - 3 RabbitMQ nodes (quorum queue mirroring across all)
#   - HAProxy load balancer fronting AMQP (5672) and management (15672)
#   - All nodes joined via classic config peer discovery
#   - Prometheus metrics on port 15692
#
# Environment variables required:
#   RABBITMQ_ERLANG_COOKIE  — Shared Erlang cookie for cluster formation
#   RABBITMQ_DEFAULT_PASS   — Password for 'gula' admin user
#   RABBITMQ_APP_PASS       — Password for 'gula_app' service user
#   RABBITMQ_MONITOR_PASS   — Password for 'gula_monitor' monitoring user
# =============================================================================

services:

  # ── RabbitMQ Node 1 ─────────────────────────────────────────────────────────
  rabbitmq-1:
    image: rabbitmq:3.13-management-alpine
    container_name: gula-rabbitmq-1
    hostname: rabbitmq-1
    restart: always
    mem_limit: 512m
    mem_reservation: 256m
    cpus: "1.0"
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?Erlang cookie required}
      RABBITMQ_DEFAULT_USER: gula
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Default pass required}
      RABBITMQ_NODENAME: rabbit@rabbitmq-1
      RABBITMQ_USE_LONGNAME: "true"
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbitmq-1-data:/var/lib/rabbitmq
    expose:
      - "5672"
      - "15672"
      - "15692"
      - "25672"
    networks:
      - gula-net
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── RabbitMQ Node 2 ─────────────────────────────────────────────────────────
  rabbitmq-2:
    image: rabbitmq:3.13-management-alpine
    container_name: gula-rabbitmq-2
    hostname: rabbitmq-2
    restart: always
    mem_limit: 512m
    mem_reservation: 256m
    cpus: "1.0"
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
      RABBITMQ_DEFAULT_USER: gula
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_NODENAME: rabbit@rabbitmq-2
      RABBITMQ_USE_LONGNAME: "true"
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbitmq-2-data:/var/lib/rabbitmq
    expose:
      - "5672"
      - "15672"
      - "15692"
      - "25672"
    depends_on:
      - rabbitmq-1
    networks:
      - gula-net
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── RabbitMQ Node 3 ─────────────────────────────────────────────────────────
  rabbitmq-3:
    image: rabbitmq:3.13-management-alpine
    container_name: gula-rabbitmq-3
    hostname: rabbitmq-3
    restart: always
    mem_limit: 512m
    mem_reservation: 256m
    cpus: "1.0"
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
      RABBITMQ_DEFAULT_USER: gula
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_NODENAME: rabbit@rabbitmq-3
      RABBITMQ_USE_LONGNAME: "true"
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbitmq-3-data:/var/lib/rabbitmq
    expose:
      - "5672"
      - "15672"
      - "15692"
      - "25672"
    depends_on:
      - rabbitmq-1
    networks:
      - gula-net
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── HAProxy Load Balancer ──────────────────────────────────────────────────
  rabbitmq-lb:
    image: haproxy:2.8-alpine
    container_name: gula-rabbitmq-lb
    restart: always
    mem_limit: 128m
    mem_reservation: 64m
    cpus: "0.25"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    expose:
      - "5672"
      - "15672"
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    depends_on:
      rabbitmq-1:
        condition: service_healthy
      rabbitmq-2:
        condition: service_healthy
      rabbitmq-3:
        condition: service_healthy
    networks:
      - gula-net
    healthcheck:
      test: ["CMD-SHELL", "haproxy -vv 2>&1 | grep -q 'HA-Proxy'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  rabbitmq-1-data:
    driver: local
  rabbitmq-2-data:
    driver: local
  rabbitmq-3-data:
    driver: local

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  gula-net:
    external: true
