apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gula

bases:
  - ../../base

# Prod-specific overrides
patchesStrategicMerge:
  - patch-replicas.yaml
  - patch-resources.yaml

# Prod image tag is injected by the fail-closed render/deploy target; do not commit a mutable tag.
images:
  - name: ghcr.io/samertts/gula-platform/backend
    newTag: IMAGE_TAG_REQUIRED


# Prod ConfigMap overrides
configMapGenerator:
  - name: gula-config
    namespace: gula
    behavior: merge
    literals:
      - ENV=production
      - ENABLE_API_DOCS=false
      - BASE_URL=https://gula-platform.org
