apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gula

bases:
  - ../../base

patchesStrategicMerge:
  - patch-region-labels.yaml
  - patch-topology-spread.yaml

patches:
  - patch: |-
      - op: replace
        path: /metadata/annotations/region
        value: me
    target:
      kind: Namespace
      name: gula

images:
  - name: ghcr.io/samertts/gula-platform/backend
    newTag: latest-region-me
  - name: ghcr.io/samertts/gula-platform/svc-lab
    newTag: latest-region-me
  - name: ghcr.io/samertts/gula-platform/svc-order
    newTag: latest-region-me
  - name: ghcr.io/samertts/gula-platform/svc-patient
    newTag: latest-region-me
  - name: ghcr.io/samertts/gula-platform/svc-result
    newTag: latest-region-me
  - name: ghcr.io/samertts/gula-platform/svc-sample
    newTag: latest-region-me
  - name: ghcr.io/samertts/gula-platform/svc-notification
    newTag: latest-region-me
  - name: ghcr.io/samertts/gula-platform/svc-ai
    newTag: latest-region-me

configMapGenerator:
  - name: gula-config
    behavior: merge
    literals:
      - ENV=production
      - REGION=me
      - ZONE=me-central1
      - BASE_URL=https://gula-platform.org
      - RUNTIME_MODE=api
