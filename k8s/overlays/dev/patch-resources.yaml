# Dev: relaxed resource limits
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gula-backend
  namespace: gula
spec:
  template:
    spec:
      containers:
        - name: gula-backend
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gula-backend-hpa
  namespace: gula
spec:
  minReplicas: 1
  maxReplicas: 3
