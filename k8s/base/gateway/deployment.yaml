apiVersion: apps/v1
kind: Deployment
metadata:
  name: gula-api-gateway
  namespace: gula
  labels:
    app: gula-api-gateway
    component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gula-api-gateway
  template:
    metadata:
      labels:
        app: gula-api-gateway
        component: gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: nginx-conf-d
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: nginx-conf
          configMap:
            name: gula-nginx-conf
        - name: nginx-conf-d
          configMap:
            name: gula-nginx-conf-d
