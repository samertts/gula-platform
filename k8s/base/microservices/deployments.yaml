---
# AI Service (:9000) — wraps local Ollama
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-ai
  namespace: gula
  labels:
    app: svc-ai
    component: microservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: svc-ai
  template:
    metadata:
      labels:
        app: svc-ai
        component: microservice
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: svc-ai
          image: ghcr.io/samertts/gula-platform/svc-ai:latest
          imagePullPolicy: Always
          env:
            - name: AI_PROVIDER
              value: ollama
            - name: AI_FALLBACK
              value: "false"
            - name: OLLAMA_BASE_URL
              value: http://ollama:11434
          ports:
            - containerPort: 9000
              name: http
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
      imagePullSecrets:
        - name: ghcr-credentials
