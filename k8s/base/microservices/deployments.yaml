# GULA Microservices — Deployments
# All services use port 8000 internally (except AI: 9000)
# External ports per ARCHITECTURE.md:
#   lab:8001  patient:8002  order:8003  result:8004  sample:8005  notification:8006  ai:9000

# ─────────────────────────────────────────────────────────────────────────────
# Shared env vars template (used by all data-plane microservices)
# ─────────────────────────────────────────────────────────────────────────────

---
# Lab Service (:8001)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-lab
  namespace: gula
  labels:
    app: svc-lab
    component: microservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: svc-lab
  template:
    metadata:
      labels:
        app: svc-lab
        component: microservice
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres-primary 5432; do sleep 2; done"]
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z rabbitmq 5672; do sleep 2; done"]
      containers:
        - name: svc-lab
          image: ghcr.io/samertts/gula-platform/svc-lab:latest
          imagePullPolicy: Always
          env:
            - name: DATABASE_URL
              value: postgresql://postgres:$(POSTGRES_PASSWORD)@postgres-primary:5432/labdb
            - name: RABBITMQ_URL
              value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASS)@rabbitmq:5672/gula
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gula-secrets
                  key: POSTGRES_PASSWORD
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: gula-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: gula-secrets
                  key: RABBITMQ_PASS
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
      imagePullSecrets:
        - name: ghcr-credentials

