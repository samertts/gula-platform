# ClusterIP services for all 7 microservices
# The gateway routes /lab/, /patients/, /orders/, /results/, /samples/, /notifications/ to these.

---
apiVersion: v1
kind: Service
metadata:
  name: svc-lab
  namespace: gula
  labels:
    app: svc-lab
    component: microservice
spec:
  type: ClusterIP
  selector:
    app: svc-lab
  ports:
    - port: 8001
      targetPort: 8000
      name: http

