# HPAs for data-plane microservices (2-6 replicas based on CPU)
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: svc-lab-hpa
  namespace: gula
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: svc-lab
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

