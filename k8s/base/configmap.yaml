apiVersion: v1
kind: ConfigMap
metadata:
  name: gula-config
  namespace: gula
data:
  ENV: "production"
  BASE_URL: "https://gula-platform.org"
  ENABLE_API_DOCS: "false"
  MAX_REQUEST_BODY_MB: "10"
  JWT_EXPIRE_HOURS: "8"
  JWT_EXPIRE_MINUTES: "30"
  REFRESH_TOKEN_EXPIRE_DAYS: "30"
  # Service discovery (internal DNS)
  DATABASE_HOST: "postgres-primary"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "labdb"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
