apiVersion: v1
kind: ConfigMap
metadata:
  name: gula-config
  namespace: gula-platform
data:
  AI_PROVIDER: "ollama"
  AI_FALLBACK: "false"
  OLLAMA_MODEL: "llama3"
  OLLAMA_HOST: "http://gula-ollama:11434"
  RABBITMQ_URL: "amqp://gula:$(RABBITMQ_PASS)@gula-rabbitmq:5672/gula"
  KAFKA_BOOTSTRAP_SERVERS: "gula-kafka:9092"
  CLICKHOUSE_URL: "http://gula-clickhouse:8123"
  MINIO_ENDPOINT: "gula-minio:9000"
  REDIS_URL: "redis://gula-redis:6379"
  JAEGER_ENDPOINT: "http://gula-jaeger:14268/api/traces"
  CIRCUIT_BREAKER_FAILURE_THRESHOLD: "5"
  CIRCUIT_BREAKER_RECOVERY_TIMEOUT: "30"
  RETRY_MAX_ATTEMPTS: "3"
