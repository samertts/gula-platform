apiVersion: v1
kind: Service
metadata:
  name: gula-backend
  namespace: gula
  labels:
    app: gula-backend
    component: api
spec:
  type: ClusterIP
  selector:
    app: gula-backend
  ports:
    - port: 8000
      targetPort: 8000
      name: http
---
# Blue-Green: active service — routes to the live slot (blue or green).
# The deploy pipeline patches the selector.slot label.
apiVersion: v1
kind: Service
metadata:
  name: gula-backend-active
  namespace: gula
  labels:
    app: gula-backend
    component: api
    role: active
  annotations:
    blue-green/active-slot: "blue"
spec:
  type: ClusterIP
  selector:
    app: gula-backend
    slot: blue          # patched by blue-green pipeline
  ports:
    - port: 8000
      targetPort: 8000
      name: http
