# NOTE: In production, use Vault + External Secrets Operator (ESO) instead of
# plain Kubernetes Secrets.  This file provides the *structure* only.
# Values must be injected by your secrets management pipeline.
#
# To inject via kubectl:
#   kubectl create secret generic gula-secrets -n gula \
#     --from-literal=POSTGRES_PASSWORD=<val> \
#     --from-literal=REDIS_PASSWORD=<val> \
#     --from-literal=SECRET_KEY=<val> \
#     --from-literal=ENCRYPTION_KEY=<val> \
#     --from-literal=NID_HMAC_KEY=<val> \
#     --from-literal=RABBITMQ_USER=<val> \
#     --from-literal=RABBITMQ_PASS=<val> \
#     --from-literal=MINIO_ACCESS_KEY=<val> \
#     --from-literal=MINIO_SECRET_KEY=<val> \
#     --from-literal=FCM_SERVER_KEY=<val>
#
apiVersion: v1
kind: Secret
metadata:
  name: gula-secrets
  namespace: gula
  annotations:
    # Signal that actual values come from an external source
    secret-management: "external-vault"
type: Opaque
# stringData intentionally empty — filled by CI/CD or ESO at deploy time
stringData: {}
