apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gula-backend-ingress
  namespace: gula
spec:
  podSelector:
    matchLabels:
      app: gula-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - podSelector:
            matchLabels:
              app: gula-api-gateway
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gula-frontend-ingress
  namespace: gula
spec:
  podSelector:
    matchLabels:
      app: gula-frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gula-data-services-ingress
  namespace: gula
spec:
  podSelector:
    matchExpressions:
      - key: component
        operator: In
        values:
          - database
          - cache
          - messaging
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              component: api
        - podSelector:
            matchLabels:
              component: microservice
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 5672
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gula-microservices-ingress
  namespace: gula
spec:
  podSelector:
    matchLabels:
      component: microservice
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              component: api
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 9000
