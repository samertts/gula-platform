# RabbitMQ configuration — durable queues with persistent delivery (Executive Order 6)
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-definitions
  namespace: gula
data:
  rabbitmq.conf: |
    # Persist messages to disk
    vm_memory_high_watermark.relative = 0.4
    disk_free_limit.relative = 1.0
    # Enable management plugin
    management.tcp.port = 15672
    # Durable definitions
    load_definitions = /etc/rabbitmq/conf.d/definitions.json

  definitions.json: |
    {
      "vhosts": [{"name": "gula"}],
      "queues": [
        {"name": "orders.events",   "vhost": "gula", "durable": true, "arguments": {"x-message-ttl": 86400000}},
        {"name": "samples.events",  "vhost": "gula", "durable": true, "arguments": {"x-message-ttl": 86400000}},
        {"name": "results.events",  "vhost": "gula", "durable": true, "arguments": {"x-message-ttl": 86400000}},
        {"name": "alerts.events",   "vhost": "gula", "durable": true, "arguments": {"x-message-ttl": 86400000}},
        {"name": "audit.events",    "vhost": "gula", "durable": true, "arguments": {"x-message-ttl": 604800000}},
        {"name": "retry.queue",     "vhost": "gula", "durable": true, "arguments": {"x-message-ttl": 3600000}}
      ],
      "exchanges": [
        {"name": "gula.events", "vhost": "gula", "type": "topic", "durable": true}
      ],
      "bindings": [
        {"source": "gula.events", "vhost": "gula", "destination": "orders.events",  "destination_type": "queue", "routing_key": "orders.#"},
        {"source": "gula.events", "vhost": "gula", "destination": "samples.events", "destination_type": "queue", "routing_key": "samples.#"},
        {"source": "gula.events", "vhost": "gula", "destination": "results.events", "destination_type": "queue", "routing_key": "results.#"},
        {"source": "gula.events", "vhost": "gula", "destination": "alerts.events",  "destination_type": "queue", "routing_key": "alerts.#"},
        {"source": "gula.events", "vhost": "gula", "destination": "audit.events",   "destination_type": "queue", "routing_key": "audit.#"}
      ]
    }
