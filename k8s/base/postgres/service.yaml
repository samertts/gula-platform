apiVersion: v1
kind: Service
metadata:
  name: postgres-primary
  namespace: gula
  labels:
    app: postgres-primary
    component: database
spec:
  # ClusterIP only — no external exposure
  type: ClusterIP
  selector:
    app: postgres-primary
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
