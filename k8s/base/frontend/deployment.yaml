apiVersion: apps/v1
kind: Deployment
metadata:
  name: gula-frontend
  namespace: gula
  labels:
    app: gula-frontend
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gula-frontend
  template:
    metadata:
      labels:
        app: gula-frontend
        component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101     # nginx user
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: html
          configMap:
            name: gula-frontend-html
        - name: nginx-conf
          configMap:
            name: gula-frontend-nginx-conf
