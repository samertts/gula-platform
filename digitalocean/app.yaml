# =============================================================================
# GULA Platform — DigitalOcean App Platform spec
# منصة غولا الصحية — مخطط النشر على DigitalOcean App Platform
#
# Architecture (managed):
#   Browser → DO App Platform Static Site (frontend)
#           → DO App Platform Service (FastAPI, Docker, autoscaling 1–3)
#           → Supabase Postgres (external, managed)
#           → DO Managed Redis (optional — falls back to in-memory)
#
# ── ONE-SHOT DEPLOY ─────────────────────────────────────────────────────────
# 1. Install doctl:        https://docs.digitalocean.com/reference/doctl/
# 2. doctl auth init
# 3. doctl apps create --spec digitalocean/app.yaml
# 4. Set the *encrypted* secrets in the dashboard (or via doctl):
#       DATABASE_URL    (Supabase pooled URI, port 6543, sslmode=require)
#       ENCRYPTION_KEY  (Fernet key)
#       NID_HMAC_KEY    (32-byte hex)
#       GULA_ADMIN_PASSWORD
# 5. doctl apps create-deployment <APP_ID> --force-rebuild
#
# Updating after the first deploy:
#       doctl apps update <APP_ID> --spec digitalocean/app.yaml
# =============================================================================

name: gula-platform
region: fra                 # frankfurt — closest to GCC; switch if needed
features:
  - buildpack-stack=ubuntu-22

# ── Backend service ─────────────────────────────────────────────────────────
services:
  - name: gula-backend
    dockerfile_path: backend/Dockerfile
    source_dir: backend
    github:
      repo: samertts/gula-platform
      branch: main
      deploy_on_push: true

    instance_size_slug: basic-xs        # 1 vCPU shared, 1 GB RAM, $12/mo
    instance_count: 1
    autoscaling:
      min_instance_count: 1
      max_instance_count: 3
      metrics:
        cpu:
          percent: 75

    http_port: 8000

    health_check:
      http_path: /health
      initial_delay_seconds: 45
      period_seconds: 15
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 5

    # Run migrations once before the deploy is promoted (DO supports this
    # natively via `pre_deploy`).
    pre_deploy:
      - command: alembic upgrade head

    envs:
      - { key: ENV,                          value: production }
      - { key: ENVIRONMENT,                  value: production }
      - { key: DEBUG,                        value: "false" }

      # Server sizing
      - { key: WEB_CONCURRENCY,              value: "2" }
      - { key: DB_POOL_SIZE,                 value: "5" }
      - { key: DB_MAX_OVERFLOW,              value: "10" }
      - { key: DB_POOL_RECYCLE,              value: "1800" }
      - { key: DB_POOL_TIMEOUT,              value: "10" }
      - { key: DB_STMT_TIMEOUT,              value: "25s" }
      - { key: MAX_CONCURRENT_REQUESTS,      value: "50" }
      - { key: MAX_REQUEST_BODY_MB,          value: "2" }
      - { key: AI_BUDGET_SECONDS,            value: "6" }

      # Public URL + CORS — replace post-deploy with the assigned APP URL
      - { key: BASE_URL,    value: "https://gula-platform.org" }
      - { key: CORS_ORIGINS, value: "https://gula-platform.org,https://www.gula-platform.org" }

      # Feature flags
      - { key: ENABLE_API_DOCS,       value: "false" }
      - { key: CONTROL_LAYER_ENABLED, value: "true" }
      - { key: KILL_SWITCH,           value: "false" }
      - { key: GULA_AUTO_FIX,         value: "false" }
      - { key: SENTRY_TRACES_RATE,    value: "0.05" }
      - { key: HEALTH_ALERT_INTERVAL_SECONDS, value: "60" }

      # Bootstrap admin (set the password as a secret below)
      - { key: GULA_ADMIN_EMAIL, value: "admin@gula-platform.org" }
      - { key: GULA_ADMIN_NAME,  value: "GULA Platform Admin" }

      # ── SECRETS ────────────────────────────────────────────────────────
      # Set after `apps create` via:
      #   doctl apps update <APP_ID> --spec digitalocean/app.yaml
      # or via dashboard. `EVAL` cannot be used until DO renders the value
      # below; place actual values in the Dashboard and remove the placeholder
      # markers (`type: SECRET` keeps them encrypted at rest).
      - { key: DATABASE_URL,           value: "REPLACE_VIA_DASHBOARD", type: SECRET }
      - { key: ENCRYPTION_KEY,         value: "REPLACE_VIA_DASHBOARD", type: SECRET }
      - { key: NID_HMAC_KEY,           value: "REPLACE_VIA_DASHBOARD", type: SECRET }
      - { key: DEVICE_HMAC_KEY,        value: "REPLACE_VIA_DASHBOARD", type: SECRET }
      - { key: SECRET_KEY,             value: "REPLACE_VIA_DASHBOARD", type: SECRET }
      - { key: REFRESH_TOKEN_SECRET,   value: "REPLACE_VIA_DASHBOARD", type: SECRET }
      - { key: METRICS_BEARER_TOKEN,   value: "REPLACE_VIA_DASHBOARD", type: SECRET }
      - { key: GULA_ADMIN_PASSWORD,    value: "REPLACE_VIA_DASHBOARD", type: SECRET }

      # Optional secrets (leave blank to disable)
      - { key: GEMINI_API_KEY,    value: "", type: SECRET }
      - { key: GROQ_API_KEY,      value: "", type: SECRET }
      - { key: SENTRY_DSN,        value: "", type: SECRET }
      - { key: ALERT_WEBHOOK_URL, value: "", type: SECRET }

      # Redis URL is auto-injected by the database binding below.

# ── Static frontend ────────────────────────────────────────────────────────
static_sites:
  - name: gula-frontend
    source_dir: frontend
    github:
      repo: samertts/gula-platform
      branch: main
      deploy_on_push: true
    output_dir: .
    index_document: index.html
    error_document: index.html
    catchall_document: index.html
    routes:
      - path: /
    cors:
      allow_origins:
        - exact: https://gula-platform.org
        - exact: https://www.gula-platform.org

# ── Managed Redis (Valkey-compatible) ─────────────────────────────────────
# Cheapest dev plan = $7/mo; bumps to $15/mo for HA. Skip and let the backend
# fall back to the in-memory store if cost is critical.
databases:
  - name: gula-redis
    engine: REDIS
    production: true
    cluster_name: gula-redis
    db_name: gula
    db_user: gula

# ── Domains (configure after first deploy) ────────────────────────────────
# domains:
#   - domain: gula-platform.org
#     type: PRIMARY
#   - domain: www.gula-platform.org
#     type: ALIAS

# ── Alerts ────────────────────────────────────────────────────────────────
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
  - rule: CPU_UTILIZATION
    value: 85
    operator: GREATER_THAN
    window: TEN_MINUTES
  - rule: MEM_UTILIZATION
    value: 85
    operator: GREATER_THAN
    window: TEN_MINUTES
