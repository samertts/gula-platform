<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GULA Platform - Pitch Deck</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #F8FAFC;
        }

        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: linear-gradient(135deg, #2563EB 0%, #1E40AF 50%, #1E293B 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Decorative elements */
        .decoration-circle-1 {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            top: -100px;
            right: -100px;
        }

        .decoration-circle-2 {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(245, 158, 11, 0.15);
            bottom: -50px;
            left: -50px;
        }

        .decoration-line {
            position: absolute;
            height: 3px;
            background: #F59E0B;
            top: 50%;
            left: 0;
            width: 200px;
        }

        /* Header section (66% of slide) */
        .header-section {
            flex: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding: 80px 100px;
            position: relative;
            z-index: 2;
        }

        .main-title {
            font-size: 96px;
            font-weight: 800;
            color: #FFFFFF;
            line-height: 1.1;
            margin-bottom: 20px;
            letter-spacing: -2px;
        }

        .subtitle {
            font-size: 32px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.4;
            max-width: 700px;
        }

        /* Body section (33% of slide) */
        .body-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-start;
            padding: 40px 100px 60px 100px;
            position: relative;
            z-index: 2;
        }

        .tagline {
            font-size: 20px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
            max-width: 600px;
            line-height: 1.6;
        }

        /* Accent pill */
        .accent-pill {
            display: inline-block;
            background: rgba(245, 158, 11, 0.2);
            border: 2px solid #F59E0B;
            border-radius: 50px;
            padding: 8px 20px;
            margin-top: 20px;
            font-size: 14px;
            font-weight: 600;
            color: #F59E0B;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media (max-width: 1280px) {
            .slide-container {
                width: 100%;
            }

            .header-section {
                padding: 60px 80px;
            }

            .body-section {
                padding: 30px 80px 50px 80px;
            }

            .main-title {
                font-size: 72px;
            }

            .subtitle {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <!-- Decorative elements -->
        <div class="decoration-circle-1"></div>
        <div class="decoration-circle-2"></div>
        <div class="decoration-line"></div>

        <!-- Header section -->
        <div class="header-section">
            <h1 class="main-title">GULA Platform</h1>
            <p class="subtitle">Revolutionary Healthcare Laboratory Management System</p>
        </div>

        <!-- Body section -->
        <div class="body-section">
            <p class="tagline">Transforming Medical Labs Across Iraq, MENA, and the World</p>
            <div class="accent-pill">Healthcare Innovation</div>
        </div>
    </div>
</body>
</html>
