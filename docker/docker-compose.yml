version: "3"

services:

  gula-backend:
    build: ..
    container_name: gula-backend
    ports:
      - "8000:8000"

  redis:
    image: redis
    container_name: gula-redis
    ports:
      - "6379:6379"

  nginx:
    image: nginx
    container_name: gula-nginx
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf
