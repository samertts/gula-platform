services:

  gula-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: gula-backend
    restart: always
    mem_limit: 512m
    mem_reservation: 128m
    cpus: "0.5"
    security_opt:
      - no-new-privileges:true
    expose:
      - "8000"
    volumes:
      - ../shared:/app/shared:ro
    environment:
      RUNTIME_MODE: ${RUNTIME_MODE:-api}
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: ${REDIS_URL:-}
      SECRET_KEY: ${SECRET_KEY:-}
      PYTHONPATH: /app
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: gula-redis
    restart: always
    mem_limit: 256m
    mem_reservation: 64m
    cpus: "0.3"
    security_opt:
      - no-new-privileges:true
    command: redis-server --appendonly yes --maxmemory 192mb --maxmemory-policy volatile-lru
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.28-alpine
    container_name: gula-nginx
    restart: always
    mem_limit: 64m
    mem_reservation: 16m
    cpus: "0.2"
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ../config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  redis-data:
    driver: local
