plugins {
    id 'com.android.application'
}

android {
    namespace 'io.gula.health'
    compileSdk 34

    defaultConfig {
        applicationId "io.gula.health"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            // Configured for Google Play Console Play App Signing
            storeFile file("gula-release-key.jks")
            storePassword System.getenv("GULA_KEYSTORE_PASSWORD") ?: "placeholder"
            keyAlias System.getenv("GULA_KEY_ALIAS") ?: "gula"
            keyPassword System.getenv("GULA_KEY_PASSWORD") ?: "placeholder"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.9.0'
}
