title = "Gula Platform secret scanning"

[extend]
useDefault = true

[allowlist]
description = "Only redacted security reports and explicitly synthetic fixtures are excluded. Never add live credentials here."
paths = [
  '''^security-audit/2026-08-12/''',
  '''^docs/security/''',
  '''^backend/tests/fixtures/''',
  '''^frontend-v2/src/test/fixtures/''',
  '''^frontend-v3/src/test/fixtures/''',
  '''^mobile/.*/test/fixtures/'''
]
regexes = [
  '''6TJUTgJxBREYK9_yDy6VMXBw1HPwwxv1kiynV0WaAdw='''
]
stopwords = [
  # False positive in a documentation scope sentence from commit 5079d67d:
  # gitleaks generic-api-key treated "dependency/vulnerability" as a secret.
  # No credential material is present; the sentence was rephrased in HEAD.
  '''dependency/vulnerability'''
]
