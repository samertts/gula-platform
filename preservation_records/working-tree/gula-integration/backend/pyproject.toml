[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gula-backend"
version = "2.5.0"
description = "GULA Platform Backend — FastAPI monolith for laboratory management"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
    "gunicorn>=26.0.0",
    "sqlalchemy>=2.0.51",
    "alembic>=1.18.5",
    "psycopg2-binary>=2.9.12",
    "python-multipart>=0.0.32",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1.3,<4.2.0",
    "joserfc>=1.7.6",
    "cryptography>=49.0.0",
    "qrcode>=8.2",
    "Pillow>=13.0.0",
    "reportlab>=5.0.0",
    "arabic-reshaper>=3.0.1",
    "python-bidi>=0.6.11",
    "httpx>=0.28.1",
    "redis>=8.0.1",
    "sentry-sdk[fastapi]>=2.66.0",
    # Transitive security floors — keep aligned with requirements.txt and
    # requirements-lock.txt (AUD-SUP-001). uv resolves from this manifest, so
    # omitting these here left uv.lock pinned to vulnerable pre-remediation
    # versions even though the pip path was clean.
    "certifi>=2026.10.18",
    "dnspython>=2.9.2",
    "idna>=3.20",
    "pyasn1>=0.6.5",
    "urllib3>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-timeout>=2.4.0,<3.0.0",
    "factory_boy>=3.3.0",
    "chevron>=0.14.0",
    "webauthn>=2.0.0",
    "email-validator>=2.1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
