[package]
name = "nhop-kernel"
version = "1.0.0"
edition = "2021"
authors = ["NHOP System"]
description = "NHOP Sovereign Kernel Core Runtime"

# ==============================
# Dependencies
# ==============================

[dependencies]

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Environment
dotenvy = "0.15"

# PostgreSQL
tokio-postgres = "0.7"

# SQL toolkit (FIXED INLINE TABLE)
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "macros", "tls-native-tls"] }

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Internal Messaging System
rustyline = "13"
uuid = { version = "1", features = ["serde", "v4"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
reqwest = { version = "0.13.2", features = ["json"] }
