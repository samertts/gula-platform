{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.redis.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "gula.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache
spec:
  serviceName: {{ .Values.redis.name }}
  replicas: {{ .Values.redis.sentinel.replicaCount }}
  selector:
    matchLabels:
      {{- include "gula.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: cache
  template:
    metadata:
      labels:
        {{- include "gula.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cache
      annotations:
        {{- if .Values.serviceMesh.linkerd.enabled }}
        linkerd.io/inject: disabled
        {{- end }}
    spec:
      {{- include "gula.imagePullSecrets" .Values.redis | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      terminationGracePeriodSeconds: 60
      containers:
        - name: redis
          image: "{{ .Values.redis.sentinel.image.repository }}:{{ .Values.redis.sentinel.image.tag }}"
          imagePullPolicy: {{ .Values.redis.sentinel.image.pullPolicy }}
          command:
            - redis-server
            - --appendonly
            - {{ .Values.redis.config.appendonly | quote }}
            - --maxmemory
            - {{ .Values.redis.config.maxmemory }}
            - --maxmemory-policy
            - {{ .Values.redis.config.maxmemoryPolicy }}
            - --save
            - {{ .Values.redis.config.save }}
            - --requirepass
            - $(REDIS_PASSWORD)
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379
              name: redis
              protocol: TCP
          resources:
            requests:
              memory: {{ .Values.redis.sentinel.resources.requests.memory }}
              cpu: {{ .Values.redis.sentinel.resources.requests.cpu }}
            limits:
              memory: {{ .Values.redis.sentinel.resources.limits.memory }}
              cpu: {{ .Values.redis.sentinel.resources.limits.cpu }}
          livenessProbe:
            exec:
              command: ["redis-cli", "-a", "$(REDIS_PASSWORD)", "ping"]
            initialDelaySeconds: {{ .Values.redis.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.redis.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.redis.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.redis.probes.liveness.failureThreshold }}
          readinessProbe:
            exec:
              command: ["redis-cli", "-a", "$(REDIS_PASSWORD)", "ping"]
            initialDelaySeconds: {{ .Values.redis.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.redis.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.redis.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.redis.probes.readiness.failureThreshold }}
          volumeMounts:
            - name: redis-data
              mountPath: /data
        - name: sentinel
          image: "{{ .Values.redis.sentinel.image.repository }}:{{ .Values.redis.sentinel.image.tag }}"
          imagePullPolicy: {{ .Values.redis.sentinel.image.pullPolicy }}
          command:
            - redis-sentinel
            - /etc/redis/sentinel.conf
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: REDIS_PASSWORD
            - name: SENTINEL_QUORUM
              value: {{ .Values.redis.sentinel.quorum | quote }}
            - name: SENTINEL_ANNOUNCE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - containerPort: 26379
              name: sentinel
              protocol: TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          volumeMounts:
            - name: sentinel-config
              mountPath: /etc/redis
      volumes:
        - name: sentinel-config
          configMap:
            name: {{ .Values.redis.name }}-sentinel-config
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - cache
                topologyKey: kubernetes.io/hostname
      {{- include "gula.topologySpreadConstraints" (dict "constraints" .Values.redis.topologySpreadConstraints) | nindent 6 }}
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: {{ toYaml .Values.redis.storage.accessModes | nindent 8 }}
        {{- if .Values.redis.storage.storageClass }}
        storageClassName: {{ .Values.redis.storage.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.redis.storage.size }}
{{- end }}
