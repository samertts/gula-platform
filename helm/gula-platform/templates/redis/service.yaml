{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.redis.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "gula.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache
    role: primary
spec:
  type: ClusterIP
  selector:
    {{- include "gula.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: cache
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.redis.name }}-sentinel
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "gula.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache
    role: sentinel
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "gula.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: cache
  ports:
    - port: 26379
      targetPort: 26379
      name: sentinel
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.redis.name }}-headless
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "gula.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "gula.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: cache
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
{{- end }}
