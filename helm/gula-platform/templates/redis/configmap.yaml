{{- if .Values.redis.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.redis.name }}-sentinel-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "gula.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache
data:
  sentinel.conf: |
    sentinel monitor gula-cluster {{ .Values.redis.name }}.{{ .Values.global.namespace }}.svc.cluster.local 6379 {{ .Values.redis.sentinel.quorum }}
    sentinel down-after-milliseconds gula-cluster 5000
    sentinel failover-timeout gula-cluster 15000
    sentinel parallel-syncs gula-cluster 1
    sentinel auth-pass gula-cluster $(REDIS_PASSWORD)
    bind 0.0.0.0
    port 26379
    loglevel notice
{{- end }}
