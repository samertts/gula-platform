{{- if and .Values.backend.enabled .Values.backend.blueGreen.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.backend.name }}-blue
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "gula.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
    slot: blue
spec:
  type: ClusterIP
  selector:
    {{- include "gula.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
    slot: blue
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.targetPort }}
      name: {{ .Values.backend.service.name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.backend.name }}-green
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "gula.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
    slot: green
spec:
  type: ClusterIP
  selector:
    {{- include "gula.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
    slot: green
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.targetPort }}
      name: {{ .Values.backend.service.name }}
{{- end }}
