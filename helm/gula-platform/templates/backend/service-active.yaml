{{- if and .Values.backend.enabled .Values.backend.blueGreen.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.backend.name }}-active
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "gula.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
    role: active
  annotations:
    blue-green/active-slot: {{ .Values.global.slot | default "blue" }}
spec:
  type: ClusterIP
  selector:
    {{- include "gula.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
    slot: {{ .Values.global.slot | default "blue" }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.targetPort }}
      name: {{ .Values.backend.service.name }}
{{- end }}
