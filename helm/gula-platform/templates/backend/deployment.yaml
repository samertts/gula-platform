{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.backend.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "gula.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
    slot: {{ .Values.global.slot | default "blue" }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "gula.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  strategy:
    type: {{ .Values.backend.strategy.type }}
    rollingUpdate:
      maxSurge: {{ .Values.backend.strategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.backend.strategy.rollingUpdate.maxUnavailable }}
  template:
    metadata:
      labels:
        {{- include "gula.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
        slot: {{ .Values.global.slot | default "blue" }}
      annotations:
        {{- with .Values.global.annotations }}
        {{ toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.serviceMesh.linkerd.enabled }}
        linkerd.io/inject: {{ .Values.serviceMesh.linkerd.autoInject | default "enabled" }}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- include "gula.podSecurityContext" . | nindent 6 }}
      {{- include "gula.imagePullSecrets" .Values.backend | nindent 6 }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      terminationGracePeriodSeconds: {{ .Values.backend.terminationGracePeriodSeconds }}
      initContainers:
        {{- if .Values.backend.initContainers.waitForPostgres.enabled }}
        - name: wait-for-postgres
          image: {{ .Values.backend.initContainers.waitForPostgres.image }}
          command: {{ toJson .Values.backend.initContainers.waitForPostgres.command }}
        {{- end }}
        {{- if .Values.backend.initContainers.waitForRedis.enabled }}
        - name: wait-for-redis
          image: {{ .Values.backend.initContainers.waitForRedis.image }}
          command: {{ toJson .Values.backend.initContainers.waitForRedis.command }}
        {{- end }}
      containers:
        - name: {{ .Values.backend.name }}
          {{- include "gula.image" (dict "Values" .Values "repository" .Values.backend.image.repository "tag" (default .Values.global.imageTag .Values.backend.image.tag) "pullPolicy" (default .Values.global.imagePullPolicy .Values.backend.image.pullPolicy)) | nindent 10 }}
          {{- include "gula.containerSecurityContext" . | nindent 10 }}
          {{- include "gula.envFromConfigMap" . | nindent 10 }}
          env:
            {{- toYaml .Values.backend.env | nindent 12 }}
            {{- include "gula.envSecretRefs" .Values.backend.secrets | nindent 12 }}
          ports:
            - containerPort: {{ .Values.backend.service.targetPort }}
              name: {{ .Values.backend.service.name }}
              protocol: TCP
          {{- include "gula.resources" .Values.backend | nindent 10 }}
          livenessProbe:
            {{- include "gula.probe" (dict "probe" .Values.backend.probes.liveness "path" .Values.backend.probes.liveness.path "port" .Values.backend.probes.liveness.port) | nindent 12 }}
          readinessProbe:
            {{- include "gula.probe" (dict "probe" .Values.backend.probes.readiness "path" .Values.backend.probes.readiness.path "port" .Values.backend.probes.readiness.port) | nindent 12 }}
          startupProbe:
            {{- include "gula.probe" (dict "probe" .Values.backend.probes.startup "path" .Values.backend.probes.startup.path "port" .Values.backend.probes.startup.port) | nindent 12 }}
          volumeMounts:
            {{- if .Values.backend.persistence.auditAnchors.enabled }}
            - name: audit-anchors
              mountPath: /app/data
            {{- end }}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep {{ .Values.backend.preStopHookSeconds }}"]
      volumes:
        {{- if .Values.backend.persistence.auditAnchors.enabled }}
        - name: audit-anchors
          persistentVolumeClaim:
            claimName: {{ .Values.backend.name }}-audit-anchors
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{ toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - api
                topologyKey: kubernetes.io/hostname
        {{- with .Values.affinity }}
        {{ toYaml . | nindent 8 }}
        {{- end }}
      {{- include "gula.topologySpreadConstraints" (dict "constraints" .Values.topologySpreadConstraints) | nindent 6 }}
{{- end }}
