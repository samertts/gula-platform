apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "gula.labels" . | nindent 4 }}
  {{- with .Values.secrets.annotations }}
  annotations:
    {{ toYaml . | nindent 4 }}
  {{- end }}
type: {{ .Values.secrets.type }}
stringData: {}
