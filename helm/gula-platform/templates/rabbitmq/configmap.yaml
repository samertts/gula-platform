{{- if .Values.rabbitmq.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.rabbitmq.name }}-definitions
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "gula.labels" . | nindent 4 }}
    app.kubernetes.io/component: messaging
data:
  rabbitmq.conf: |
    vm_memory_high_watermark.relative = {{ .Values.rabbitmq.config.vmMemoryHighWatermark }}
    disk_free_limit.relative = {{ .Values.rabbitmq.config.diskFreeLimit }}
    management.tcp.port = {{ .Values.rabbitmq.config.managementPort }}
    load_definitions = /etc/rabbitmq/conf.d/definitions.json
    cluster_formation.peer_discovery_backend = rabbit_peer_discovery_k8s
    cluster_formation.k8s.host = kubernetes.default.svc.cluster.local
    cluster_formation.k8s.address_type = hostname
    cluster_formation.k8s.service_name = {{ .Values.rabbitmq.name }}
    cluster_formation.k8s.hostname_suffix = .{{ .Values.rabbitmq.name }}.{{ .Values.global.namespace }}.svc.cluster.local
    cluster_partition_handling = pause_minority
    queue_master_locator = min-masters
  definitions.json: |
    {
      "vhosts": [{"name": "gula"}],
      "queues": [
        {{- range $i, $queue := .Values.rabbitmq.queues }}
        {"name": {{ $queue.name | quote }}, "vhost": "gula", "durable": {{ $queue.durable }}, "arguments": {"x-message-ttl": {{ $queue.ttl }} }}{{ if lt $i (sub (len $.Values.rabbitmq.queues) 1) }},{{ end }}
        {{- end }}
      ],
      "exchanges": [
        {"name": "gula.events", "vhost": "gula", "type": "topic", "durable": true}
      ],
      "bindings": [
        {"source": "gula.events", "vhost": "gula", "destination": "orders.events",  "destination_type": "queue", "routing_key": "orders.#"},
        {"source": "gula.events", "vhost": "gula", "destination": "samples.events", "destination_type": "queue", "routing_key": "samples.#"},
        {"source": "gula.events", "vhost": "gula", "destination": "results.events", "destination_type": "queue", "routing_key": "results.#"},
        {"source": "gula.events", "vhost": "gula", "destination": "alerts.events",  "destination_type": "queue", "routing_key": "alerts.#"},
        {"source": "gula.events", "vhost": "gula", "destination": "audit.events",   "destination_type": "queue", "routing_key": "audit.#"}
      ]
    }
{{- end }}
