{{- if .Values.rabbitmq.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.rabbitmq.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "gula.labels" . | nindent 4 }}
    app.kubernetes.io/component: messaging
spec:
  serviceName: {{ .Values.rabbitmq.name }}
  replicas: {{ .Values.rabbitmq.cluster.replicaCount }}
  selector:
    matchLabels:
      {{- include "gula.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: messaging
  template:
    metadata:
      labels:
        {{- include "gula.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: messaging
      annotations:
        {{- if .Values.serviceMesh.linkerd.enabled }}
        linkerd.io/inject: disabled
        {{- end }}
    spec:
      {{- include "gula.imagePullSecrets" .Values.rabbitmq | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      terminationGracePeriodSeconds: 180
      containers:
        - name: rabbitmq
          image: "{{ .Values.rabbitmq.image.repository }}:{{ .Values.rabbitmq.image.tag }}"
          imagePullPolicy: {{ .Values.rabbitmq.image.pullPolicy }}
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: RABBITMQ_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: RABBITMQ_PASS
            - name: RABBITMQ_DEFAULT_VHOST
              value: gula
            - name: RABBITMQ_ERLANG_COOKIE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: RABBITMQ_ERLANG_COOKIE
                  optional: true
            - name: K8S_SERVICE_NAME
              value: {{ .Values.rabbitmq.name }}
            - name: K8S_NAMESPACE
              value: {{ .Values.global.namespace }}
            - name: ERL_EPMD_PORT
              value: "4369"
            - name: RABBITMQ_NODENAME
              value: rabbit@{{ .Values.rabbitmq.name }}-$(POD_HOSTNAME)
            - name: POD_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 5672
              name: amqp
              protocol: TCP
            - containerPort: 15672
              name: management
              protocol: TCP
            - containerPort: 25672
              name: distribution
              protocol: TCP
            - containerPort: 4369
              name: epmd
              protocol: TCP
          resources:
            requests:
              memory: {{ .Values.rabbitmq.resources.requests.memory }}
              cpu: {{ .Values.rabbitmq.resources.requests.cpu }}
            limits:
              memory: {{ .Values.rabbitmq.resources.limits.memory }}
              cpu: {{ .Values.rabbitmq.resources.limits.cpu }}
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: {{ .Values.rabbitmq.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.rabbitmq.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.rabbitmq.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.rabbitmq.probes.liveness.failureThreshold }}
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            initialDelaySeconds: {{ .Values.rabbitmq.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.rabbitmq.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.rabbitmq.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.rabbitmq.probes.readiness.failureThreshold }}
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
            - name: rabbitmq-definitions
              mountPath: /etc/rabbitmq/conf.d
              readOnly: true
      volumes:
        - name: rabbitmq-definitions
          configMap:
            name: {{ .Values.rabbitmq.name }}-definitions
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - messaging
                topologyKey: kubernetes.io/hostname
      {{- include "gula.topologySpreadConstraints" (dict "constraints" .Values.rabbitmq.topologySpreadConstraints) | nindent 6 }}
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-data
      spec:
        accessModes: {{ toYaml .Values.rabbitmq.storage.accessModes | nindent 8 }}
        {{- if .Values.rabbitmq.storage.storageClass }}
        storageClassName: {{ .Values.rabbitmq.storage.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.rabbitmq.storage.size }}
{{- end }}
