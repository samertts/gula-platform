{{- if .Values.rabbitmq.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.rabbitmq.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "gula.labels" . | nindent 4 }}
    app.kubernetes.io/component: messaging
spec:
  type: ClusterIP
  selector:
    {{- include "gula.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: messaging
  ports:
    - port: {{ .Values.rabbitmq.config.amqpPort }}
      targetPort: {{ .Values.rabbitmq.config.amqpPort }}
      name: amqp
      protocol: TCP
    - port: {{ .Values.rabbitmq.config.managementPort }}
      targetPort: {{ .Values.rabbitmq.config.managementPort }}
      name: management
      protocol: TCP
    - port: 25672
      targetPort: 25672
      name: distribution
      protocol: TCP
{{- end }}
