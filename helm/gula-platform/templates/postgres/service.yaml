{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.postgres.name }}-primary
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "gula.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
    role: primary
spec:
  type: ClusterIP
  selector:
    {{- include "gula.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: database
    role: primary
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
---
{{- if .Values.postgres.patroni.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.postgres.name }}-patroni
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "gula.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
    application: spilo
spec:
  type: ClusterIP
  selector:
    application: spilo
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
    - port: 8008
      targetPort: 8008
      name: patroni
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.postgres.name }}-replicas
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "gula.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
    role: replica
spec:
  type: ClusterIP
  selector:
    application: spilo
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.postgres.name }}-headless
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "gula.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    application: spilo
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
{{- end }}
{{- end }}
