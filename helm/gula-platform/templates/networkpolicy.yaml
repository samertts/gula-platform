{{- if .Values.global.networkPolicy.enabled }}
{{- if .Values.backend.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.backend.name }}-ingress
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "gula.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gula.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.global.networkPolicy.ingressNamespace | quote }}
        - podSelector:
            matchLabels:
              {{- include "gula.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: gateway
      ports:
        - protocol: TCP
          port: {{ .Values.backend.service.targetPort }}
---
{{- end }}
{{- if .Values.frontend.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.frontend.name }}-ingress
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "gula.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gula.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.global.networkPolicy.ingressNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.frontend.service.targetPort }}
---
{{- end }}
{{- if .Values.microservices }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gula.fullname" . }}-microservices-ingress
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "gula.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gula.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: microservice
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "gula.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 9000
---
{{- end }}
{{- end }}
