# ─── ConfigMap Data ───────────────────────────────────────────────────────
configMap:
  name: gula-config
  data:
    ENV: production
    BASE_URL: https://gula-platform.org
    ENABLE_API_DOCS: "false"
    MAX_REQUEST_BODY_MB: "10"
    JWT_EXPIRE_HOURS: "8"
    JWT_EXPIRE_MINUTES: "30"
    REFRESH_TOKEN_EXPIRE_DAYS: "30"
    DATABASE_HOST: postgres-primary
    DATABASE_PORT: "5432"
    DATABASE_NAME: labdb
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    SNDHS_ENABLE_VISITS: "false"
    SNDHS_ENABLE_NATIONAL_ID: "false"
    ENABLE_FINANCIAL_ENGINE: "false"
    ENABLE_ADS: "false"
    FEATURE_BACKGROUND_TASKS: "true"
    RUNTIME_MODE: api

# ─── Secrets (External) ───────────────────────────────────────────────────
secrets:
  name: gula-secrets
  annotations:
    secret-management: external-vault
  type: Opaque
  keys:
    - POSTGRES_PASSWORD
    - REDIS_PASSWORD
    - SECRET_KEY
    - ENCRYPTION_KEY
    - NID_HMAC_KEY
    - DEVICE_HMAC_KEY
    - REFRESH_TOKEN_SECRET
    - RABBITMQ_USER
    - RABBITMQ_PASS
    - MINIO_ACCESS_KEY
    - MINIO_SECRET_KEY
    - FCM_SERVER_KEY
    - SENTRY_DSN
  externalSecret:
    enabled: false
    provider: vault
    vault:
      path: secret/gula-platform
      role: gula-platform
    aws:
      region: me-central-1
      secretName: gula-platform/secrets
    gcp:
      projectId: gula-platform
      secretName: gula-platform-secrets
