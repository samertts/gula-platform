# GULA Platform - Global Helm Values
# All configurable parameters for the GULA Platform Helm chart

global:
  environment: production
  region: me
  zone: me-central1
  imageRegistry: ghcr.io/samertts/gula-platform
  imageTag: latest
  imagePullPolicy: Always
  slot: blue
  namespace: gula
  dnsDomain: gula-platform.org
  labels:
    app.kubernetes.io/part-of: gula-platform
    app.kubernetes.io/managed-by: helm
  annotations: {}

namespace:
  enabled: true
  name: gula
  labels:
    linkerd.io/inject: enabled
    pod-security.kubernetes.io/enforce: restricted
  annotations: {}

serviceAccount:
  create: true
  name: gula-platform
  annotations:
    eks.amazonaws.com/role-arn: ""
    iam.gke.io/gcp-service-account: ""
  # Keep pod service-account tokens disabled by default; enable only for a workload that needs projected identity.
  automountServiceAccountToken: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault

nodeSelector: {}

tolerations: []

affinity: {}

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/part-of: gula-platform

# ─── Backend ──────────────────────────────────────────────────────────────
backend:
  enabled: true
  name: gula-backend
  replicaCount: 2
  slot: blue
  image:
    repository: backend
    tag: ""
    pullPolicy: ""
    pullSecrets:
      - name: ghcr-credentials
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  blueGreen:
    enabled: true
    autoPromote: true
    analysisPeriodSeconds: 180
    prePromoteSmokeTest: true
  canary:
    enabled: true
    weight: 0
    maxWeight: 100
    stepWeight: 10
    stepIntervalSeconds: 300
  probes:
    liveness:
      path: /health
      port: 8000
      initialDelaySeconds: 30
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 5
      successThreshold: 1
    readiness:
      path: /health
      port: 8000
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
      successThreshold: 1
    startup:
      path: /health
      port: 8000
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 30
      successThreshold: 1
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
    name: http
    annotations: {}
  resources:
    requests:
      memory: "192Mi"
      cpu: "200m"
    limits:
      memory: "384Mi"
      cpu: "1000m"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 60
        policies:
          - type: Pods
            value: 2
            periodSeconds: 60
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Pods
            value: 1
            periodSeconds: 120
  pdb:
    enabled: true
    minAvailable: 1
    maxUnavailable: ""
  initContainers:
    waitForPostgres:
      enabled: true
      image: busybox:1.37
      command: ["sh", "-c", "until nc -z postgres-primary 5432; do echo 'Waiting for postgres...'; sleep 2; done"]
    waitForRedis:
      enabled: true
      image: busybox:1.37
      command: ["sh", "-c", "until nc -z redis 6379; do echo 'Waiting for redis...'; sleep 2; done"]
  env:
    - name: ENV
      valueFrom:
        configMapKeyRef:
          name: gula-config
          key: ENV
    - name: BASE_URL
      valueFrom:
        configMapKeyRef:
          name: gula-config
          key: BASE_URL
    - name: DATABASE_URL
      value: postgresql://postgres:$(POSTGRES_PASSWORD)@postgres-primary:5432/labdb
    - name: REDIS_URL
      value: redis://:$(REDIS_PASSWORD)@redis:6379
  secrets:
    - name: POSTGRES_PASSWORD
      secretRef: gula-secrets
      key: POSTGRES_PASSWORD
    - name: REDIS_PASSWORD
      secretRef: gula-secrets
      key: REDIS_PASSWORD
    - name: SECRET_KEY
      secretRef: gula-secrets
      key: SECRET_KEY
    - name: ENCRYPTION_KEY
      secretRef: gula-secrets
      key: ENCRYPTION_KEY
    - name: NID_HMAC_KEY
      secretRef: gula-secrets
      key: NID_HMAC_KEY
    - name: DEVICE_HMAC_KEY
      secretRef: gula-secrets
      key: DEVICE_HMAC_KEY
    - name: REFRESH_TOKEN_SECRET
      secretRef: gula-secrets
      key: REFRESH_TOKEN_SECRET
  persistence:
    auditAnchors:
      enabled: true
      size: 1Gi
      storageClass: ""
      accessModes:
        - ReadWriteOnce
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    path: /metrics
    port: http
    labels: {}
    annotations: {}
  terminationGracePeriodSeconds: 60
  preStopHookSeconds: 15

# ─── Frontend ──────────────────────────────────────────────────────────────
frontend:
  enabled: true
  name: gula-frontend
  replicaCount: 2
  image:
    repository: frontend-v2
    tag: ""
    pullPolicy: ""
    pullSecrets:
      - name: ghcr-credentials
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  probes:
    liveness:
      path: /
      port: 80
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 5
    readiness:
      path: /
      port: 80
      initialDelaySeconds: 3
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
    name: http
    annotations: {}
  resources:
    requests:
      memory: "32Mi"
      cpu: "50m"
    limits:
      memory: "64Mi"
      cpu: "250m"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  initContainers: []
  env: []
  volumeMounts: []
  volumes: []
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    path: /metrics
    port: http

# ─── PostgreSQL (Patroni HA) ──────────────────────────────────────────────
postgres:
  enabled: true
  name: postgres
  image:
    repository: postgres
    tag: 17-alpine
    pullPolicy: IfNotPresent
  patroni:
    enabled: true
    image:
      repository: registry.opensource.zalan.do/acid/spilo
      tag: 3.0-p1
      pullPolicy: IfNotPresent
    scope: gula
    useLoadBalancer: false
    maximumLagOnFailover: 1048576
    retryTimeout: 10
    loopWait: 10
    ttl: 30
    pgParameters:
      max_connections: "200"
      shared_buffers: "256MB"
      work_mem: "16MB"
      maintenance_work_mem: "128MB"
      effective_cache_size: "1GB"
      wal_level: replica
      max_wal_senders: "5"
      max_replication_slots: "5"
      hot_standby: "on"
      wal_log_hints: "on"
  primary:
    replicaCount: 1
    resources:
      requests:
        memory: "512Mi"
        cpu: "500m"
      limits:
        memory: "2Gi"
        cpu: "2000m"
    nodeSelector: {}
    tolerations: []
    affinity: {}
  replica:
    enabled: true
    replicaCount: 2
    resources:
      requests:
        memory: "512Mi"
        cpu: "500m"
      limits:
        memory: "2Gi"
        cpu: "2000m"
  storage:
    size: 50Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  backup:
    enabled: true
    schedule: "0 2 * * *"
    retentionDays: 30
    s3Bucket: gula-postgres-backups
    s3Endpoint: ""
    walArchive: true
    pgbackrest:
      enabled: true
      stanza: gula
      compressionType: gz
      archivePush: true
      archiveCheck: true
  probes:
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 5
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
  serviceMonitor:
    enabled: true
    interval: 15s
    scrapeTimeout: 10s
    parameters:
      - name: pg_stat_database
        version: 1.0
      - name: pg_stat_replication
        version: 1.0
      - name: pg_stat_bgwriter
        version: 1.0
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule

# ─── Redis (Sentinel HA) ──────────────────────────────────────────────────
redis:
  enabled: true
  name: redis
  sentinel:
    enabled: true
    replicaCount: 3
    quorum: 2
    image:
      repository: redis
      tag: 7-alpine
      pullPolicy: IfNotPresent
    resources:
      requests:
        memory: "128Mi"
        cpu: "200m"
      limits:
        memory: "256Mi"
        cpu: "500m"
  cluster:
    enabled: false
    replicaCount: 6
  config:
    maxmemory: "256mb"
    maxmemoryPolicy: volatile-lru
    appendonly: "yes"
    save: '900 1 300 10 60 10000'
  storage:
    size: 10Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  probes:
    liveness:
      initialDelaySeconds: 15
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 5
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
  serviceMonitor:
    enabled: true
    interval: 15s
    scrapeTimeout: 10s
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule

# ─── RabbitMQ (Clustered) ─────────────────────────────────────────────────
rabbitmq:
  enabled: true
  name: rabbitmq
  cluster:
    enabled: true
    replicaCount: 3
    erlangCookie: ""
  image:
    repository: rabbitmq
    tag: 4.1-management-alpine
    pullPolicy: IfNotPresent
  config:
    vmMemoryHighWatermark: 0.4
    diskFreeLimit: 1.0
    managementPort: 15672
    amqpPort: 5672
  queues:
    - name: orders.events
      durable: true
      ttl: 86400000
    - name: samples.events
      durable: true
      ttl: 86400000
    - name: results.events
      durable: true
      ttl: 86400000
    - name: alerts.events
      durable: true
      ttl: 86400000
    - name: audit.events
      durable: true
      ttl: 604800000
    - name: retry.queue
      durable: true
      ttl: 3600000
  storage:
    size: 10Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2000m"
  probes:
    liveness:
      initialDelaySeconds: 60
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 5
    readiness:
      initialDelaySeconds: 20
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 3
  serviceMonitor:
    enabled: true
    interval: 15s
    scrapeTimeout: 10s
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule

# ─── MinIO (S3-compatible Storage) ────────────────────────────────────────
minio:
  enabled: true
  name: minio
  image:
    repository: minio/minio
    tag: RELEASE.2026-07-12T22-51-28Z
    pullPolicy: IfNotPresent
  mode: distributed
  replicaCount: 4
  drivesPerNode: 1
  storage:
    size: 100Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  buckets:
    - name: lab-results
      policy: private
    - name: audit-logs
      policy: private
    - name: patient-documents
      policy: private
  serviceMonitor:
    enabled: true
    interval: 15s
    scrapeTimeout: 10s
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule

# ─── API Gateway ──────────────────────────────────────────────────────────
gateway:
  enabled: true
  name: gula-api-gateway
  replicaCount: 2
  image:
    repository: nginx
    tag: 1.28-alpine
    pullPolicy: IfNotPresent
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  probes:
    liveness:
      path: /health
      port: 80
      initialDelaySeconds: 5
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 5
    readiness:
      path: /health
      port: 80
      initialDelaySeconds: 3
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
  service:
    type: LoadBalancer
    port: 80
    targetPort: 80
    name: http
    portHTTPS: 443
    targetPortHTTPS: 443
    nameHTTPS: https
    annotations: {}
  resources:
    requests:
      memory: "32Mi"
      cpu: "50m"
    limits:
      memory: "64Mi"
      cpu: "250m"
  configMaps:
    nginxConf:
      name: gula-nginx-conf
      mountPath: /etc/nginx/nginx.conf
      subPath: nginx.conf
    nginxConfD:
      name: gula-nginx-conf-d
      mountPath: /etc/nginx/conf.d

# ─── Ingress ──────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/limit-rpm: "100"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "2"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/waf: "owasp-crs"
    nginx.ingress.kubernetes.io/modsecurity: "on"
  hosts:
    - host: gula-platform.org
      paths:
        - path: /api
          pathType: Prefix
          serviceName: gula-backend-active
          servicePort: 8000
        - path: /
          pathType: Prefix
          serviceName: gula-frontend
          servicePort: 80
    - host: www.gula-platform.org
      paths:
        - path: /
          pathType: Prefix
          serviceName: gula-frontend
          servicePort: 80
    - host: api.gula-platform.org
      paths:
        - path: /
          pathType: Prefix
          serviceName: gula-backend-active
          servicePort: 8000
  tls:
    - hosts:
        - gula-platform.org
        - www.gula-platform.org
        - api.gula-platform.org
      secretName: gula-tls-cert
  canary:
    enabled: true
    weight: "0"
    header: "X-Canary"
    headerValue: "true"

# ─── Monitoring ───────────────────────────────────────────────────────────
monitoring:
  prometheus:
    enabled: true
    server:
      retention: 15d
      retentionSize: 50GB
      resources:
        requests:
          memory: "1Gi"
          cpu: "500m"
    nodeExporter:
      enabled: true
    kubeStateMetrics:
      enabled: true
    alertmanager:
      enabled: true
      config:
        global:
          resolve_timeout: 5m
        route:
          receiver: default
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
        receivers:
          - name: default
            slack_configs:
              - api_url: ""
                channel: "#gula-alerts"
                send_resolved: true
            webhook_configs:
              - url: ""
  grafana:
    enabled: true
    adminPassword: ""
    persistence:
      enabled: true
      size: 10Gi
    dashboards:
      enabled: true
      labels:
        grafana_dashboard: gula
    datasources:
      enabled: true
    ingress:
      enabled: false
      hostname: grafana.gula-platform.org
  loki:
    enabled: true
    config:
      auth_enabled: false
      ingester:
        lifecycler:
          ring:
            kvstore:
              store: inmemory
        chunk_idle_period: 15m
        chunk_retain_period: 15m
    persistence:
      enabled: true
      size: 50Gi
    resources:
      requests:
        memory: "512Mi"
        cpu: "200m"
  tempo:
    enabled: true
    search:
      enabled: true
    metrics:
      enabled: true
    storage:
      trace:
        backend: s3
        s3:
          bucket: gula-tempo-traces
          endpoint: minio:9000
          access_key: ""
          secret_key: ""
    resources:
      requests:
        memory: "512Mi"
        cpu: "200m"
  alertmanager:
    enabled: true
    config:
      global:
        resolve_timeout: 5m
      route:
        group_by: [alertname, severity]
        group_wait: 10s
        group_interval: 2m
        repeat_interval: 6h
        receiver: default
      receivers:
        - name: default
          slack_configs:
            - api_url: ""
              channel: "#gula-alerts"
              title: '{{ template "slack.title" . }}'
              text: '{{ template "slack.text" . }}'
          webhook_configs:
            - url: ""

# ─── Service Mesh (Linkerd) ───────────────────────────────────────────────
serviceMesh:
  linkerd:
    enabled: true
    autoInject: enabled
    serviceProfile:
      enabled: true
      routes:
        - name: "GET /health"
          condition:
            method: GET
            pathRegex: /health
          isRetryable: true
          timeout: 3s
        - name: "POST /api/login"
          condition:
            method: POST
            pathRegex: /api/login
          isRetryable: false
          timeout: 10s
        - name: "GET /api/.*"
          condition:
            method: GET
            pathRegex: /api/.*
          isRetryable: true
          timeout: 15s
          retryBudget:
            retryRatio: 0.2
            minRetriesPerSecond: 10
            ttl: 10s
        - name: "POST /api/.*"
          condition:
            method: POST
            pathRegex: /api/.*
          isRetryable: false
          timeout: 30s
        - name: "POST /api/results"
          condition:
            method: POST
            pathRegex: /api/results
          isRetryable: false
          timeout: 60s
    trafficSplit:
      enabled: true
      backends:
        - service: gula-backend-blue
          weight: 100
        - service: gula-backend-green
          weight: 0
  annotations:
    linkerd.io/inject: enabled
    config.linkerd.io/proxy-cpu-limit: "200m"
    config.linkerd.io/proxy-memory-limit: "256Mi"
    config.linkerd.io/proxy-require-identity-on-inbound-ports: "8000"

# ─── Microservices ───────────────────────────────────────────────────────
microservices:
  lab:
    enabled: true
    name: svc-lab
    replicaCount: 2
    image:
      repository: svc-lab
      tag: ""
      pullPolicy: ""
    port: 8000
    servicePort: 8001
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "500m"
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    probes:
      liveness:
        path: /health
        port: 8000
        initialDelaySeconds: 30
        periodSeconds: 15
      readiness:
        path: /health
        port: 8000
        initialDelaySeconds: 15
        periodSeconds: 10
    initContainers:
      - name: wait-for-postgres
        image: busybox:1.37
        command: ["sh", "-c", "until nc -z postgres-primary 5432; do sleep 2; done"]
      - name: wait-for-rabbitmq
        image: busybox:1.37
        command: ["sh", "-c", "until nc -z rabbitmq 5672; do sleep 2; done"]
    env:
      - name: DATABASE_URL
        value: postgresql://postgres:$(POSTGRES_PASSWORD)@postgres-primary:5432/labdb
      - name: RABBITMQ_URL
        value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASS)@rabbitmq:5672/gula
      - name: POSTGRES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: gula-secrets
            key: POSTGRES_PASSWORD
      - name: RABBITMQ_USER
        valueFrom:
          secretKeyRef:
            name: gula-secrets
            key: RABBITMQ_USER
      - name: RABBITMQ_PASS
        valueFrom:
          secretKeyRef:
            name: gula-secrets
            key: RABBITMQ_PASS
  order:
    enabled: true
    name: svc-order
    replicaCount: 2
    image:
      repository: svc-order
      tag: ""
      pullPolicy: ""
    port: 8000
    servicePort: 8003
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "500m"
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    probes:
      liveness:
        path: /health
        port: 8000
        initialDelaySeconds: 30
        periodSeconds: 15
      readiness:
        path: /health
        port: 8000
        initialDelaySeconds: 15
        periodSeconds: 10
    initContainers:
      - name: wait-for-postgres
        image: busybox:1.37
        command: ["sh", "-c", "until nc -z postgres-primary 5432; do sleep 2; done"]
      - name: wait-for-rabbitmq
        image: busybox:1.37
        command: ["sh", "-c", "until nc -z rabbitmq 5672; do sleep 2; done"]
    env:
      - name: DATABASE_URL
        value: postgresql://postgres:$(POSTGRES_PASSWORD)@postgres-primary:5432/labdb
      - name: RABBITMQ_URL
        value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASS)@rabbitmq:5672/gula
      - name: POSTGRES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: gula-secrets
            key: POSTGRES_PASSWORD
      - name: RABBITMQ_USER
        valueFrom:
          secretKeyRef:
            name: gula-secrets
            key: RABBITMQ_USER
      - name: RABBITMQ_PASS
        valueFrom:
          secretKeyRef:
            name: gula-secrets
            key: RABBITMQ_PASS
  patient:
    enabled: true
    name: svc-patient
    replicaCount: 2
    image:
      repository: svc-patient
      tag: ""
      pullPolicy: ""
    port: 8000
    servicePort: 8002
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "500m"
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    probes:
      liveness:
        path: /health
        port: 8000
        initialDelaySeconds: 30
        periodSeconds: 15
      readiness:
        path: /health
