<!DOCTYPE html>
<!-- @dsCard group="Components" name="Form Inputs" subtitle="Text, select, search — default, focus, error states" viewport="700x170" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Poppins', sans-serif; background: #F8FAFC; padding: 20px; }
.form-group { margin-bottom: 14px; }
label { display: block; font-size: 12px; font-weight: 500; color: #0F172A; margin-bottom: 5px; }
input, select { width: 100%; padding: 8px 12px; border: 1.5px solid #E2E8F0; border-radius: 8px; font-size: 13px; font-family: 'Poppins', sans-serif; color: #0F172A; background: #fff; outline: none; }
input:focus, select:focus { border-color: #2563EB; box-shadow: 0 0 0 3px rgb(37 99 235 / 0.12); }
input.error { border-color: #EF4444; }
.error-msg { font-size: 11px; color: #EF4444; margin-top: 4px; }
.hint { font-size: 11px; color: #94A3B8; margin-top: 4px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
</style>
</head>
<body>
<div class="cols">
  <div class="form-group">
    <label>Patient Name</label>
    <input type="text" placeholder="Full name" value="Ahmed Al-Rashidi">
  </div>
  <div class="form-group">
    <label>National ID</label>
    <input type="text" placeholder="Iraqi NID" value="19841204012345">
  </div>
  <div class="form-group">
    <label>Sample Type</label>
    <select><option>Blood — CBC</option><option>Urine</option><option>Serum</option></select>
  </div>
  <div class="form-group">
    <label>Priority</label>
    <input class="error" type="text" placeholder="Required" value="">
    <div class="error-msg">Priority is required</div>
  </div>
</div>
<div class="form-group" style="max-width:260px">
  <label>Search Patients</label>
  <input type="text" placeholder="Search by name or NID…">
  <div class="hint">Search by full name or national ID number</div>
</div>
</body>
</html>
