<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Brand Colors" subtitle="Primary blue, secondary gold, semantic palette" viewport="700x150" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Poppins', sans-serif; background: #fff; padding: 20px; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 60px; text-align: center; }
.swatch-block { height: 48px; border-radius: 8px; margin-bottom: 6px; }
.swatch-label { font-size: 10px; color: #475569; font-weight: 500; }
.swatch-hex { font-size: 9px; color: #94A3B8; }
.section { margin-bottom: 16px; }
.section-title { font-size: 10px; font-weight: 600; color: #94A3B8; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="section">
  <div class="section-title">Brand</div>
  <div class="swatches">
    <div class="swatch"><div class="swatch-block" style="background:#2563EB"></div><div class="swatch-label">Primary</div><div class="swatch-hex">#2563EB</div></div>
    <div class="swatch"><div class="swatch-block" style="background:#1D4ED8"></div><div class="swatch-label">Primary Dark</div><div class="swatch-hex">#1D4ED8</div></div>
    <div class="swatch"><div class="swatch-block" style="background:#3B82F6"></div><div class="swatch-label">Primary Lt</div><div class="swatch-hex">#3B82F6</div></div>
    <div class="swatch"><div class="swatch-block" style="background:#F59E0B"></div><div class="swatch-label">Secondary</div><div class="swatch-hex">#F59E0B</div></div>
    <div class="swatch"><div class="swatch-block" style="background:#D97706"></div><div class="swatch-label">Secondary Dk</div><div class="swatch-hex">#D97706</div></div>
  </div>
</div>
<div class="section">
  <div class="section-title">Semantic</div>
  <div class="swatches">
    <div class="swatch"><div class="swatch-block" style="background:#10B981"></div><div class="swatch-label">Success</div><div class="swatch-hex">#10B981</div></div>
    <div class="swatch"><div class="swatch-block" style="background:#F59E0B"></div><div class="swatch-label">Warning</div><div class="swatch-hex">#F59E0B</div></div>
    <div class="swatch"><div class="swatch-block" style="background:#EF4444"></div><div class="swatch-label">Danger</div><div class="swatch-hex">#EF4444</div></div>
    <div class="swatch"><div class="swatch-block" style="background:#8B5CF6"></div><div class="swatch-label">Info</div><div class="swatch-hex">#8B5CF6</div></div>
  </div>
</div>
</body>
</html>
