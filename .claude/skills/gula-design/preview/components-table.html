<!DOCTYPE html>
<!-- @dsCard group="Components" name="Data Table" subtitle="Samples table with status badges and actions" viewport="700x200" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Poppins', sans-serif; background: #F8FAFC; padding: 20px; }
table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 3px rgb(0 0 0 / 0.08); font-size: 12px; }
thead tr { background: #F8FAFC; border-bottom: 1.5px solid #E2E8F0; }
th { padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 600; color: #94A3B8; text-transform: uppercase; letter-spacing: 0.06em; }
td { padding: 10px 14px; color: #0F172A; border-bottom: 1px solid #F1F5F9; }
tr:last-child td { border-bottom: none; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 9999px; font-size: 10px; font-weight: 600; }
.dot { width: 5px; height: 5px; border-radius: 50%; }
.action-btn { background: none; border: none; font-family: 'Poppins'; font-size: 11px; font-weight: 500; color: #2563EB; cursor: pointer; padding: 0; }
</style>
</head>
<body>
<table>
  <thead>
    <tr>
      <th>Sample ID</th>
      <th>Patient</th>
      <th>Test</th>
      <th>Status</th>
      <th>Date</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td style="font-weight:600;color:#2563EB">#S-0041</td>
      <td>Ahmed Al-Rashidi</td>
      <td>CBC — Blood</td>
      <td><span class="badge" style="background:#DCFCE7;color:#15803D"><span class="dot" style="background:#10B981"></span>Completed</span></td>
      <td style="color:#94A3B8">Apr 28, 2026</td>
      <td><button class="action-btn">View</button></td>
    </tr>
    <tr>
      <td style="font-weight:600;color:#2563EB">#S-0042</td>
      <td>Sara Khalil</td>
      <td>Lipid Panel</td>
      <td><span class="badge" style="background:#FEF9C3;color:#A16207"><span class="dot" style="background:#F59E0B"></span>Pending</span></td>
      <td style="color:#94A3B8">Apr 28, 2026</td>
      <td><button class="action-btn">View</button></td>
    </tr>
    <tr>
      <td style="font-weight:600;color:#2563EB">#S-0043</td>
      <td>Omar Hassan</td>
      <td>Urine Culture</td>
      <td><span class="badge" style="background:#EFF6FF;color:#1D4ED8"><span class="dot" style="background:#2563EB"></span>Processing</span></td>
      <td style="color:#94A3B8">Apr 27, 2026</td>
      <td><button class="action-btn">View</button></td>
    </tr>
    <tr>
      <td style="font-weight:600;color:#2563EB">#S-0044</td>
      <td>Fatima Al-Amiri</td>
      <td>Thyroid Panel</td>
      <td><span class="badge" style="background:#FEE2E2;color:#B91C1C"><span class="dot" style="background:#EF4444"></span>Failed</span></td>
      <td style="color:#94A3B8">Apr 27, 2026</td>
      <td><button class="action-btn">Retry</button></td>
    </tr>
  </tbody>
</table>
</body>
</html>
