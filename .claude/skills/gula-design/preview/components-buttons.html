<!DOCTYPE html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Primary, outline, ghost, destructive, secondary; all sizes" viewport="700x110" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Poppins', sans-serif; background: #fff; padding: 20px; }
.row { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: 'Poppins', sans-serif; border: none; }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.btn-lg { padding: 11px 22px; font-size: 15px; }
.btn-primary { background: #2563EB; color: #fff; }
.btn-outline { background: transparent; color: #2563EB; border: 1.5px solid #2563EB; }
.btn-ghost { background: transparent; color: #475569; border: none; }
.btn-danger { background: #EF4444; color: #fff; }
.btn-gold { background: #F59E0B; color: #fff; }
.label { font-size: 9px; color: #94A3B8; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; display: block; margin-top: 6px; text-align: center; }
.item { display: flex; flex-direction: column; align-items: center; }
</style>
</head>
<body>
<div class="row">
  <div class="item"><button class="btn btn-primary">Register Patient</button><span class="label">Primary</span></div>
  <div class="item"><button class="btn btn-outline">Add Sample</button><span class="label">Outline</span></div>
  <div class="item"><button class="btn btn-ghost">Cancel</button><span class="label">Ghost</span></div>
  <div class="item"><button class="btn btn-danger">Delete</button><span class="label">Destructive</span></div>
  <div class="item"><button class="btn btn-gold">Upgrade</button><span class="label">Secondary</span></div>
</div>
<div style="margin-top: 16px; display: flex; gap: 8px; align-items: center;">
  <button class="btn btn-sm btn-primary">Small</button>
  <button class="btn btn-primary">Medium</button>
  <button class="btn btn-lg btn-primary">Large</button>
</div>
</body>
</html>
