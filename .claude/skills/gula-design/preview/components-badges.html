<!DOCTYPE html>
<!-- @dsCard group="Components" name="Badges" subtitle="Status, plan, and role badges" viewport="700x140" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Poppins', sans-serif; background: #F8FAFC; padding: 20px; display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 9999px; font-size: 11px; font-weight: 600; }
.dot { width: 6px; height: 6px; border-radius: 50%; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.label { font-size: 9px; color: #94A3B8; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
</style>
</head>
<body>
<div>
  <div class="label">Status Badges</div>
  <div class="row">
    <span class="badge" style="background:#DCFCE7;color:#15803D"><span class="dot" style="background:#10B981"></span>Completed</span>
    <span class="badge" style="background:#FEF9C3;color:#A16207"><span class="dot" style="background:#F59E0B"></span>Pending</span>
    <span class="badge" style="background:#FEE2E2;color:#B91C1C"><span class="dot" style="background:#EF4444"></span>Failed</span>
    <span class="badge" style="background:#EFF6FF;color:#1D4ED8"><span class="dot" style="background:#2563EB"></span>In Progress</span>
    <span class="badge" style="background:#F3E8FF;color:#7E22CE"><span class="dot" style="background:#8B5CF6"></span>Processing</span>
  </div>
  <div class="label">Plan Badges</div>
  <div class="row">
    <span class="badge" style="background:#F1F5F9;color:#475569">Basic</span>
    <span class="badge" style="background:#EFF6FF;color:#2563EB">Standard</span>
    <span class="badge" style="background:#F3E8FF;color:#7E22CE">Advanced</span>
    <span class="badge" style="background:linear-gradient(135deg,#2563EB,#8B5CF6);color:#fff">Enterprise</span>
  </div>
  <div class="label">Role Badges</div>
  <div class="row">
    <span class="badge" style="background:#FEF3C7;color:#92400E">Admin</span>
    <span class="badge" style="background:#E0F2FE;color:#0369A1">Lab Manager</span>
    <span class="badge" style="background:#F0FDF4;color:#166534">Technician</span>
  </div>
</div>
</body>
</html>
