<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Neutral & Text Colors" subtitle="Surface, border, and text scale (light mode)" viewport="700x220" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Poppins', sans-serif; background: #fff; padding: 20px; }
.row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.swatch { width: 36px; height: 36px; border-radius: 6px; flex-shrink: 0; }
.info { display: flex; flex-direction: column; gap: 1px; }
.name { font-size: 11px; font-weight: 600; color: #0F172A; }
.hex { font-size: 10px; color: #94A3B8; }
.desc { font-size: 10px; color: #475569; }
.section-title { font-size: 10px; font-weight: 600; color: #94A3B8; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; margin-top: 4px; }
</style>
</head>
<body>
<div class="section-title">Neutral / Surface</div>
<div class="row"><div class="swatch" style="background:#F8FAFC;border:1px solid #E2E8F0"></div><div class="info"><div class="name">BG</div><div class="hex">#F8FAFC</div><div class="desc">Page background (slate-50)</div></div></div>
<div class="row"><div class="swatch" style="background:#F1F5F9;border:1px solid #E2E8F0"></div><div class="info"><div class="name">BG Alt</div><div class="hex">#F1F5F9</div><div class="desc">Gradient end (slate-100)</div></div></div>
<div class="row"><div class="swatch" style="background:#FFFFFF;border:1px solid #E2E8F0"></div><div class="info"><div class="name">Surface</div><div class="hex">#FFFFFF</div><div class="desc">Card / panel surface</div></div></div>
<div class="row"><div class="swatch" style="background:#E2E8F0"></div><div class="info"><div class="name">Border</div><div class="hex">#E2E8F0</div><div class="desc">Dividers, card borders</div></div></div>
<div class="section-title">Text</div>
<div class="row"><div class="swatch" style="background:#0F172A"></div><div class="info"><div class="name">FG1</div><div class="hex">#0F172A</div><div class="desc">Primary text (slate-900)</div></div></div>
<div class="row"><div class="swatch" style="background:#475569"></div><div class="info"><div class="name">FG2</div><div class="hex">#475569</div><div class="desc">Secondary text (slate-600)</div></div></div>
<div class="row"><div class="swatch" style="background:#94A3B8"></div><div class="info"><div class="name">FG3</div><div class="hex">#94A3B8</div><div class="desc">Muted / placeholder (slate-400)</div></div></div>
</body>
</html>
