<!DOCTYPE html>
<!-- @dsCard group="Components" name="Charts" subtitle="Chart color palette and weekly trend line" viewport="700x220" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Poppins', sans-serif; background: #F8FAFC; padding: 20px; display: flex; gap: 12px; flex-direction: column; }
.label { font-size: 9px; font-weight: 600; color: #94A3B8; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }

/* Chart colors showcase */
.chart-colors { display: flex; gap: 8px; }
.cc { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.cc-bar { width: 32px; border-radius: 4px 4px 0 0; }
.cc-label { font-size: 9px; color: #475569; font-weight: 500; }

/* Mini line */
.sparkline { background: #fff; border-radius: 10px; padding: 14px; box-shadow: 0 1px 3px rgb(0 0 0 / 0.08); }
.sparkline-title { font-size: 11px; font-weight: 600; color: #0F172A; margin-bottom: 10px; }
svg.chart { overflow: visible; }
</style>
</head>
<body>
<div>
  <div class="label">Chart Color Palette</div>
  <div class="chart-colors">
    <div class="cc"><div class="cc-bar" style="height:50px;background:#3B82F6"></div><div class="cc-label">Blue</div><div style="font-size:9px;color:#94A3B8">#3B82F6</div></div>
    <div class="cc"><div class="cc-bar" style="height:38px;background:#8B5CF6"></div><div class="cc-label">Purple</div><div style="font-size:9px;color:#94A3B8">#8B5CF6</div></div>
    <div class="cc"><div class="cc-bar" style="height:60px;background:#10B981"></div><div class="cc-label">Green</div><div style="font-size:9px;color:#94A3B8">#10B981</div></div>
    <div class="cc"><div class="cc-bar" style="height:30px;background:#F59E0B"></div><div class="cc-label">Amber</div><div style="font-size:9px;color:#94A3B8">#F59E0B</div></div>
    <div class="cc"><div class="cc-bar" style="height:20px;background:#EF4444"></div><div class="cc-label">Red</div><div style="font-size:9px;color:#94A3B8">#EF4444</div></div>
  </div>
</div>
<div class="sparkline">
  <div class="sparkline-title">Weekly Patient Trend</div>
  <svg class="chart" width="320" height="70" viewBox="0 0 320 70">
    <!-- Grid lines -->
    <line x1="0" y1="70" x2="320" y2="70" stroke="#E2E8F0" stroke-width="1"/>
    <line x1="0" y1="35" x2="320" y2="35" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="0" y1="0" x2="320" y2="0" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3"/>
    <!-- Area fill blue -->
    <path d="M0,52 L46,46 L92,40 L138,50 L184,32 L230,58 L276,62 L320,62 L320,70 L0,70 Z" fill="#3B82F6" opacity="0.1"/>
    <!-- Blue line: patients -->
    <polyline points="0,52 46,46 92,40 138,50 184,32 230,58 276,62" fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Purple line: samples -->
    <polyline points="0,62 46,57 92,52 138,59 184,45 230,65 276,68" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="4 2" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Dots -->
    <circle cx="184" cy="32" r="3" fill="#3B82F6"/>
    <!-- Labels -->
    <text x="0" y="82" font-size="9" fill="#94A3B8" font-family="Poppins">Mon</text>
    <text x="43" y="82" font-size="9" fill="#94A3B8" font-family="Poppins">Tue</text>
    <text x="89" y="82" font-size="9" fill="#94A3B8" font-family="Poppins">Wed</text>
    <text x="135" y="82" font-size="9" fill="#94A3B8" font-family="Poppins">Thu</text>
    <text x="181" y="82" font-size="9" fill="#94A3B8" font-family="Poppins">Fri</text>
    <text x="227" y="82" font-size="9" fill="#94A3B8" font-family="Poppins">Sat</text>
    <text x="273" y="82" font-size="9" fill="#94A3B8" font-family="Poppins">Sun</text>
  </svg>
  <div style="display:flex;gap:16px;margin-top:14px">
    <div style="display:flex;align-items:center;gap:5px;font-size:10px;color:#475569"><div style="width:16px;height:2.5px;background:#3B82F6;border-radius:2px"></div>Patients</div>
    <div style="display:flex;align-items:center;gap:5px;font-size:10px;color:#475569"><div style="width:16px;height:2px;background:#8B5CF6;border-radius:2px;border-top:2px dashed #8B5CF6;background:none"></div>Samples</div>
  </div>
</div>
</body>
</html>
