name: gula_sdk
description: Dart SDK for the GULA Platform — medical laboratory LIMS API client for Flutter mobile apps.
version: 1.0.0
homepage: https://github.com/samertts/gula-platform
repository: https://github.com/samertts/gula-platform

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  json_annotation: ^4.8.1
  connectivity_plus: ^5.0.2
  shared_preferences: ^2.2.2
  uuid: ^4.2.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  mockito: ^5.4.4
  flutter_lints: ^3.0.1
