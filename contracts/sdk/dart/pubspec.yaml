name: gula_sdk
description: Dart SDK for the GULA Platform — medical laboratory LIMS API client for Flutter mobile apps.
version: 1.0.0
homepage: https://github.com/samertts/gula-platform
repository: https://github.com/samertts/gula-platform

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.8.0+1
  json_annotation: ^4.9.0
  connectivity_plus: ^6.1.4
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.14
  json_serializable: ^6.9.4
  mockito: ^5.4.6
  flutter_lints: ">=5.0.0 <7.0.0"
