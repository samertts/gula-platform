# Pre-commit hooks for GULA Platform.
# Install once:  pip install pre-commit && pre-commit install
# Run manually:  pre-commit run --all-files

repos:
  # Generic hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
        exclude: ^config/
      - id: check-toml
      - id: check-json
        exclude: ^backend/.*\.ipynb$
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: ^(client/src/|frontend/)
      - id: trailing-whitespace
        exclude: ^(client/src/|frontend/)
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: detect-private-key

  # Secret scanning (mirrors CI secret-scanning.yml)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  # Python: syntax + undefined-name gate (mirror of CI syntax-gate)
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        files: ^backend/app/
        args: ["--select=E9,F821", "--max-line-length=200"]

  # Migration policy: forbid editing existing alembic revisions
  - repo: local
    hooks:
      - id: forbid-edit-existing-migrations
        name: forbid editing existing alembic migrations
        entry: scripts/check_migration_policy.sh
        language: script
        files: ^backend/migrations/versions/.+\.py$
        stages: [commit]

      - id: backend-py-compile
        name: byte-compile changed backend python files
        entry: python3 -m py_compile
        language: system
        files: ^backend/.*\.py$
