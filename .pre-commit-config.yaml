# Pre-commit hooks for GULA Platform.
# Install:  pip install pre-commit detect-secrets && pre-commit install
# Run:      pre-commit run --all-files

repos:
  # ── Generic Hygiene ──────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        exclude: ^config/
      - id: check-toml
      - id: check-json
        exclude: ^backend/.*\.ipynb$
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: check-case-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: forbid-submodules

  # ── Secret Scanning (detect-secrets + Gitleaks) ──────────────────────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: >
          (?x)^(
            .*\.env\.example|
            .*test.*|
            .*tests.*|
            .*\.min\.(js|css)|
            venv/.*|
            .venv/.*|
            node_modules/.*
          )$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks-docker
      - id: gitleaks
        stages: [manual]

  # ── Python: Linting ──────────────────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ── Python: Type Checking ────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        additional_dependencies: [types-all]
        exclude: ^(venv/|\.venv/|node_modules/|backend/tests/)

  # ── YAML ─────────────────────────────────────────────────────────────────────
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [--format, parsable, --strict]

  # ── Docker ───────────────────────────────────────────────────────────────────
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker

  # ── Security: Checkov (IaC scanning) ─────────────────────────────────────────
  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.2.0
    hooks:
      - id: checkov
        verbose: true
        args: [--quiet]

  # ── Local Hooks ──────────────────────────────────────────────────────────────
  - repo: local
    hooks:
      # Fail on any .env file being staged
      - id: forbid-env-files
        name: forbid .env files in commits
        entry: python3 -c "import subprocess,sys;r=subprocess.run(['git','diff','--cached','--name-only'],capture_output=True,text=True);envs=[f for f in r.stdout.split('\n') if f and (f=='.env' or '.env.local' in f or '.env.production' in f)];exit(1) if envs else exit(0)"
        language: system
        stages: [commit]

      # Check for hardcoded secrets in staged files
      - id: check-hardcoded-secrets
        name: check hardcoded secrets
        entry: python3 scripts/pre-commit-check-secrets.py
        language: system
        stages: [commit]

      # Migration policy: forbid editing existing alembic revisions
      - id: forbid-edit-existing-migrations
        name: forbid editing existing alembic migrations
        entry: bash scripts/pre-commit-check-migrations.sh
        language: system
        files: ^backend/migrations/versions/.+\.py$
        stages: [commit]

      # Byte-compile changed backend files
      - id: backend-py-compile
        name: byte-compile changed backend python files
        entry: python3 -m py_compile
        language: system
        files: ^backend/.*\.py$
