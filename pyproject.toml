[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gula-platform"
version = "2.5.0"
description = "GULA National Healthcare Platform — Unified Engineering Factory"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.scripts]
gula = "cli.main:main"

[tool.ruff]
target-version = "py312"
line-length = 100
fix = true
show-fixes = true

exclude = [
    ".git", ".venv", "node_modules", "build", "dist",
    "__pycache__", "archive", "frontend", "frontend-v2", "test_library",
    "scripts/", "nhop-platform/", "client/",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "C4", "PIE", "RET", "T20", "RUF", "Q", "SLF"]
ignore = ["E501", "B008", "N818", "RUF012", "SLF001", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["T20", "N", "F401", "F841", "SLF001"]
"**/engineering/productivity/*" = ["T20"]
"**/migrations/**" = ["T20", "N", "I001", "F401", "F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin", "pydantic.mypy"]
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
ignore_missing_imports = true
no_implicit_optional = true
explicit_package_bases = true
exclude = ["tests/", "build/", "dist/", "archive/", "frontend/", "frontend-v2/"]

[[tool.mypy.overrides]]
module = ["backend.app.routes.*", "backend.app.migrations.*", "backend.app.services.*", "app.routes.*", "migrations.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["backend.app.engineering.*", "app.engineering.*"]
ignore_errors = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["backend/tests", "services/device_bridge/tests", "tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
norecursedirs = ["archive", "docs", "frontend", "frontend-v2", "node_modules",
    ".git", ".venv", "build", "dist", "test_library", "ai", "nhop-platform", "sample_tracking"]
addopts = "-ra --strict-markers --strict-config -v --tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: isolated logic tests (no DB, no network)",
    "integration: tests that require a DB session",
    "routes: full HTTP integration tests via TestClient",
    "stress: concurrency / throughput tests (slow)",
    "security: security-related tests",
    "smoke: quick smoke tests",
    "kernel: Kernel subsystem tests (no DB, no network)",
    "slow: tests that take more than a few seconds",
    "performance: performance baseline tests",
]

[tool.coverage.run]
source = ["backend/app", "shared", "services", "scripts"]
omit = ["*/tests/*", "*/migrations/*", "*__pycache__*", "*/archive/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover", "def __repr__", "if self.debug:",
    "if __name__ == .__main__.:", "raise AssertionError",
    "raise NotImplementedError", "if 0:", "if False:", "if TYPE_CHECKING:",
]
fail_under = 25
