[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gula-platform"
version = "0.1.0"
description = "GULA National Healthcare Platform"
requires-python = ">=3.11"
license = { text = "Proprietary" }

[tool.ruff]
target-version = "py311"
line-length = 100
fix = true
show-fixes = true

exclude = [
    ".git",
    ".venv",
    "node_modules",
    "build",
    "dist",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "N",
    "PIE",
    "RET",
]

ignore = [
    "E501"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

exclude = [
    "tests",
    "build",
    "dist",
]

[tool.pytest.ini_options]
testpaths = [
    "backend/tests",
    "tests"
]

asyncio_mode = "auto"

addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]

markers = [
    "unit",
    "integration",
    "routes",
    "stress",
]
