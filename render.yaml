# =============================================================================
# GULA Platform — Render Deployment Blueprint
# مخطط نشر منصة غولا على Render
# =============================================================================

services:
  # ── Backend (FastAPI / gunicorn-uvicorn, Docker runtime) ──────────────────
  - type: web
    name: gula-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: frankfurt
    branch: main
    autoDeploy: true
    port: 10000
    healthCheckPath: /health
    preDeployCommand: "alembic upgrade head"

    envVars:
      - key: ENV
        value: production
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "10"
      - key: DATABASE_URL
        fromDatabase:
          name: gula-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: gula-redis
          type: keyvalue
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://gula-frontend.onrender.com,https://gula-platform.org,https://www.gula-platform.org,https://gula-platform.vercel.app"
      - key: BASE_URL
        value: "https://gula-platform.org"
      - key: GULA_ADMIN_EMAIL
        value: admin@gula-platform.org
      - key: GULA_ADMIN_NAME
        value: GULA Platform Admin
      # Randomly generated secrets by Render on first deploy
      - key: SECRET_KEY
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: NID_HMAC_KEY
        generateValue: true
      - key: GULA_ADMIN_PASSWORD
        generateValue: true

  # ── Frontend (Static site - Optional, Vercel is already used) ─────────────
  - type: web
    name: gula-frontend
    runtime: static
    branch: main
    autoDeploy: true
    staticPublishPath: ./frontend-v3/dist
    buildCommand: "npm install && npm run build"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://gula-backend.onrender.com/:splat
      - type: rewrite
        source: /*
        destination: /index.html

# ── Managed Database (PostgreSQL) ──────────────────────────────────────────
databases:
  - name: gula-db
    plan: free
    region: frankfurt
    postgresMajorVersion: 16

# ── Managed Redis (KeyValue) ───────────────────────────────────────────────
keyValues:
  - name: gula-redis
    plan: free
    region: frankfurt
