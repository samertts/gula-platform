# =============================================================================
# GULA Platform — Render Deployment Blueprint
# مخطط نشر منصة غولا على Render
# =============================================================================

services:
  # ── Backend (FastAPI / gunicorn-uvicorn, Docker runtime) ──────────────────
  - type: web
    name: gula-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: frankfurt
    branch: main
    autoDeploy: true
    port: 10000
    healthCheckPath: /health
    preDeployCommand: "alembic upgrade head"

    envVars:
      - key: ENV
        value: production
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "10"
      - key: DATABASE_URL
        fromDatabase:
          name: gula-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: gula-redis
          type: keyvalue
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://gula-frontend.onrender.com,https://gula-platform.org,https://www.gula-platform.org,https://gula-platform.vercel.app"
      - key: BASE_URL
        value: "https://gula-platform.org"
      - key: GULA_ADMIN_EMAIL
        value: admin@gula-platform.org
      - key: GULA_ADMIN_NAME
        value: GULA Platform Admin
      # Randomly generated secrets by Render on first deploy
      - key: SECRET_KEY
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: NID_HMAC_KEY
        generateValue: true
      - key: GULA_ADMIN_PASSWORD
        generateValue: true

  # ── Public demo backend — isolated DB/Redis and stubbed integrations ────────
  - type: web
    name: gula-demo-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: frankfurt
    branch: main
    autoDeploy: true
    port: 10000
    healthCheckPath: /health
    preDeployCommand: "alembic upgrade head"

    envVars:
      - key: ENV
        value: demo
      - key: ENVIRONMENT
        value: demo
      - key: RUNTIME_MODE
        value: api
      - key: DEBUG
        value: "false"
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_DATA_ISOLATION_ACK
        value: "true"
      - key: ENABLE_BOOTSTRAP
        value: "true"
      - key: ENABLE_DEMO_DATA
        value: "true"
      - key: GULA_ADAPTER_MODE
        value: stub
      - key: GULA_ADAPTER_MODE_NID
        value: stub
      - key: GULA_ADAPTER_MODE_INSURANCE
        value: stub
      - key: GULA_ADAPTER_MODE_RESIDENCY
        value: stub
      - key: GULA_ADAPTER_MODE_CLOUDFLARE
        value: stub
      - key: DATABASE_URL
        fromDatabase:
          name: gula-demo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: gula-demo-redis
          type: keyvalue
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://gula-demo-frontend.onrender.com,https://demo.gula-platform.org"
      - key: BASE_URL
        value: "https://demo.gula-platform.org"
      - key: GULA_ADMIN_EMAIL
        value: demo-admin@gula-platform.org
      - key: GULA_ADMIN_NAME
        value: GULA Demo Bootstrap
      - key: SECRET_KEY
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: NID_HMAC_KEY
        generateValue: true
      - key: GULA_ADMIN_PASSWORD
        generateValue: true

  # ── Public demo frontend — points only at gula-demo-backend ────────────────
  - type: web
    name: gula-demo-frontend
    runtime: static
    branch: main
    autoDeploy: true
    buildCommand: "cd frontend-v3 && npm ci && npm run build"
    staticPublishPath: ./frontend-v3/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://gula-demo-backend.onrender.com
    routes:
      - type: rewrite
        source: /api/*
        destination: https://gula-demo-backend.onrender.com/:splat
      - type: rewrite
        source: /*
        destination: /index.html

  # ── Frontend (Static site - Optional, Vercel is already used) ─────────────
  - type: web
    name: gula-frontend
    runtime: static
    branch: main
    autoDeploy: true
    staticPublishPath: ./frontend-v3/dist
    buildCommand: "npm install && npm run build"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://gula-backend.onrender.com/:splat
      - type: rewrite
        source: /*
        destination: /index.html

# ── Managed databases — production and demo are never shared ────────────────
databases:
  - name: gula-db
    plan: free
    region: frankfurt
    postgresMajorVersion: 16
  - name: gula-demo-db
    plan: free
    region: frankfurt
    postgresMajorVersion: 16

# ── Managed Redis instances — production and demo are never shared ──────────
keyValues:
  - name: gula-redis
    plan: free
    region: frankfurt
  - name: gula-demo-redis
    plan: free
    region: frankfurt
