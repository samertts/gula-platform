password_policy:
  minimum_length: 14
  maximum_length: 128
  minimum_complexity_score: 3

  complexity_requirements:
    require_uppercase: true
    require_lowercase: true
    require_digits: true
    require_special_characters: true
    special_characters: "!@#$%^&*()-_=+[]{}|;:,.<>?/~`"
    minimum_character_categories: 3

  expiration:
    enabled: true
    max_age_days: 90
    warn_before_days: 14
    force_change_on_first_login: true
    force_change_on_reset: true

  history:
    remember_count: 12
    prevent_reuse: true
    prevent_reuse_months: 24

  account_lockout:
    enabled: true
    max_attempts: 5
    lockout_duration_minutes: 30
    lockout_duration_increment_minutes: 15
    max_lockout_duration_minutes: 480
    reset_counter_after_minutes: 30
    lockout_notification: true

  mfa:
    enforcement_rules:
      - condition: role == "admin" OR role == "super_admin"
        require_mfa: true
        allowed_methods:
          - TOTP
          - WEBAUTHN
      - condition: access_level == "phi" OR access_level == "restricted"
        require_mfa: true
        allowed_methods:
          - TOTP
          - WEBAUTHN
      - condition: true
        require_mfa: false
        recommended: true
    totp:
      enabled: true
      algorithm: SHA1
      digits: 6
      period_seconds: 30
      skew_seconds: 30
      issuer: "GULA Platform"
    webauthn:
      enabled: true
      require_resident_key: false
      user_verification: preferred
      attachment: cross-platform
      timeout_ms: 60000

  session:
    idle_timeout_minutes: 15
    absolute_timeout_minutes: 480
    extend_on_activity: true
    concurrent_sessions_allowed: 3
    require_reauthentication_for:
      - password_change
      - mfa_disabled
      - phi_access
      - role_escalation
      - data_export

  api_keys:
    max_keys_per_user: 5
    minimum_length: 32
    expiration_days: 365
    allowed_scopes:
      - read:patients
      - write:patients
      - read:analytics
      - admin:system

  breach_detection:
    check_against_known_breaches: true
    breach_db_sources:
      - haveibeenpwned
      - internal_breach_db
    reject_compromised_passwords: true
    cache_duration_hours: 24
