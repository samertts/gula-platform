# GULA Medical Ontology — Multilingual Synonyms + Iraqi Aliases
#
# Every entry becomes a row in `medical_ontology_synonyms`, keyed to a
# `concept_key` from concepts.yaml.
#
# locale values:
#   en        — English (any variant)
#   ar        — Modern Standard Arabic
#   ar-IQ     — Iraqi dialect / spoken forms
#   arabizi   — Arabic written with Latin characters + digits (chat form)
#
# variant values:
#   preferred      — the primary display term
#   abbreviation   — short form (HbA1c, WBC)
#   colloquial     — everyday/spoken form ("السكر التراكمي")
#   phonetic       — phonetic transliteration variant
#   misspelling    — common wrong spelling that should still resolve
#
# The normaliser lowercases English, strips Arabic diacritics, and folds
# arabizi digits (3→ع, 7→ح, 2→ء, 5→خ, 8→غ, 6→ط, 9→ق). Entries here should
# be the canonical spelling — the normaliser handles trivial variants.

version: 1
