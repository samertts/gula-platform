    description_en: >-
      HbA1c reflects average glycemia over ~3 months. Diagnostic thresholds
      (ADA): ≥6.5% diabetes, 5.7–6.4% prediabetes.
    description_ar: >-
      يعكس HbA1c متوسط سكر الدم خلال ثلاثة أشهر تقريباً. عتبات التشخيص
      (ADA): ≥٦٫٥٪ سكري، ٥٫٧–٦٫٤٪ ما قبل السكري.

