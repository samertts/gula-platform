# GULA Medical Ontology — Canonical Concepts
#
# Every entry becomes a row in `medical_ontology_concepts`. `concept_key` is
# the stable slug that migrations, relations, synonyms, and reference ranges
# reference. Never rename an existing key.
#
# Category taxonomy: biomarker | symptom | disease | medication | panel |
#                    organ_system | specimen | unit
#
# `codes` lists external code-system mappings written into
# `medical_ontology_codes`. Every biomarker should have a LOINC code where one
# exists; every disease an ICD-10 and SNOMED code; every medication an RxNorm
# code.
#
# `canonical_unit` (biomarkers only) points to a unit concept_key; ranges and
# unit conversions normalise into it.

version: 1
