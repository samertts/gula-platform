    category: biomarker
    display_en: Fasting plasma glucose
    display_ar: سكر الدم الصائم
    canonical_unit: unit:mg_per_dL
    default_specimen: specimen:plasma
    codes:
      - {system: LOINC, code: "1558-6", display: "Fasting glucose [Mass/volume] in Serum or Plasma"}
      - {system: SNOMEDCT, code: "271062006"}
    description_en: >-
      Fasting plasma glucose reflects short-term glycemic status; used for
      diabetes screening and diagnosis (ADA criteria).
    description_ar: >-
      يعكس سكر الدم الصائم الحالة السكرية قصيرة المدى، ويُستخدم لفحص وتشخيص
      داء السكري وفق معايير جمعية السكري الأمريكية.

