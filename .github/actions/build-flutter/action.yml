name: 'Build Flutter App'
description: 'Composite action to build Flutter desktop app'

inputs:
  target-os:
    description: 'Target OS (windows/linux/macos)'
    required: true
  build-type:
    description: 'Build type (debug/release/profile)'
    required: true
    default: 'release'
  flutter-version:
    description: 'Flutter SDK version'
    required: false
    default: '3.27.0'
  project-path:
    description: 'Path to Flutter project'
    required: true
    default: 'mobile/desktop'
  signing-identity:
    description: 'Code signing identity (macOS)'
    required: false
    default: ''
  certificate-base64:
    description: 'Base64-encoded certificate (macOS)'
    required: false
    default: ''
  certificate-password:
    description: 'Certificate password (macOS)'
    required: false
    default: ''

outputs:
  artifact-path:
    description: 'Path to built artifact'
    value: ${{ steps.set-paths.outputs.artifact-path }}

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

    - name: Setup Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: ${{ inputs.flutter-version }}
        cache: true

    - name: Cache pub
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          ${{ github.workspace }}/${{ inputs.project-path }}/.dart_tool/
          ~/.pub-cache
        key: pub-${{ inputs.target-os }}-${{ hashFiles(format('{0}/pubspec.yaml', inputs.project-path)) }}
        restore-keys: |
          pub-${{ inputs.target-os }}-

    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.project-path }}
      run: flutter pub get

    - name: Analyze
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.project-path }}
      run: flutter analyze

    - name: Test
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.project-path }}
      run: flutter test

    - name: Setup macOS signing
      if: inputs.target-os == 'macos' && inputs.signing-identity != ''
      shell: bash
      env:
        CERTIFICATE_BASE64: ${{ inputs.certificate-base64 }}
        CERTIFICATE_PASSWORD: ${{ inputs.certificate-password }}
      run: |
        printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12
        security create-keychain -p temp build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p temp build.keychain
        security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple: -s -k temp build.keychain

    - name: Build Flutter app
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.project-path }}
      env:
        TARGET_OS: ${{ inputs.target-os }}
        BUILD_TYPE: ${{ inputs.build-type }}
      run: |
        case "$TARGET_OS" in windows|linux|macos) ;; *) echo "Unsupported Flutter target OS" >&2; exit 2 ;; esac
        case "$BUILD_TYPE" in debug|release|profile) ;; *) echo "Unsupported Flutter build type" >&2; exit 2 ;; esac
        flutter build "$TARGET_OS" "--$BUILD_TYPE"

    - name: Sign macOS app
      if: inputs.target-os == 'macos' && inputs.signing-identity != ''
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.project-path }}
      env:
        SIGNING_IDENTITY: ${{ inputs.signing-identity }}
        BUILD_TYPE: ${{ inputs.build-type }}
      run: |
        case "$BUILD_TYPE" in
          release) BUILD_VARIANT="Release" ;;
          debug) BUILD_VARIANT="Debug" ;;
          profile) BUILD_VARIANT="Profile" ;;
          *) echo "Unsupported macOS build type" >&2; exit 2 ;;
        esac
        /usr/bin/codesign --force --sign "$SIGNING_IDENTITY" \
          --options runtime \
          "build/macos/Build/Products/$BUILD_VARIANT/gula_platform.app"

    - name: Create Windows MSIX
      if: inputs.target-os == 'windows'
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.project-path }}
      run: |
        dart run msix:create

    - name: Create Linux packages
      if: inputs.target-os == 'linux'
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.project-path }}
      env:
        REF_NAME: ${{ github.ref_name }}
      run: |
        mkdir -p packaging/deb/usr/bin
        cp -r build/linux/x64/release/bundle/* packaging/deb/usr/bin/
        SAFE_REF_NAME=$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9._-' '-')
        dpkg-deb --build packaging/deb "gula-platform_${SAFE_REF_NAME}_amd64.deb"

    - name: Create macOS DMG
      if: inputs.target-os == 'macos'
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.project-path }}
      run: |
        brew install create-dmg 2>/dev/null || true
        create-dmg \
          --volname "GULA Platform" \
          --window-pos 200 120 \
          --window-size 600 400 \
          --icon-size 100 \
          --app-drop-link 450 200 \
          "GULA_Platform.dmg" \
          "build/macos/Build/Products/Release/"

    - name: Set output paths
      id: set-paths
      shell: bash
      env:
        TARGET_OS: ${{ inputs.target-os }}
        PROJECT_PATH: ${{ inputs.project-path }}
      run: |
        case "$TARGET_OS" in
          windows) ARTIFACT_PATH="$GITHUB_WORKSPACE/$PROJECT_PATH/build/windows/msix/" ;;
          linux) ARTIFACT_PATH="$GITHUB_WORKSPACE/$PROJECT_PATH/*.deb" ;;
          macos) ARTIFACT_PATH="$GITHUB_WORKSPACE/$PROJECT_PATH/GULA_Platform.dmg" ;;
          *) echo "Unsupported Flutter target OS" >&2; exit 2 ;;
        esac
        echo "artifact-path=$ARTIFACT_PATH" >> "$GITHUB_OUTPUT"

    - name: Upload artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: flutter-build-${{ inputs.target-os }}-${{ inputs.build-type }}
        path: ${{ github.workspace }}/${{ inputs.project-path }}/build/
        if-no-files-found: warn
        retention-days: 7
