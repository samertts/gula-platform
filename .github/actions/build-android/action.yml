name: 'Build Android App'
description: 'Composite action to build Android APK and AAB'

inputs:
  build-type:
    description: 'Build type (debug/release)'
    required: true
    default: 'release'
  signing-enabled:
    description: 'Enable signing'
    required: false
    default: 'false'
  keystore-base64:
    description: 'Base64-encoded keystore'
    required: false
    default: ''
  keystore-password:
    description: 'Keystore password'
    required: false
    default: ''
  key-alias:
    description: 'Key alias'
    required: false
    default: ''
  key-password:
    description: 'Key password'
    required: false
    default: ''
  gradle-cache-key:
    description: 'Cache key for Gradle'
    required: false
    default: 'gradle'

outputs:
  apk-path:
    description: 'Path to built APK'
    value: ${{ steps.set-paths.outputs.apk-path }}
  aab-path:
    description: 'Path to built AAB'
    value: ${{ steps.set-paths.outputs.aab-path }}

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

    - name: Set up JDK 17
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
      with:
        gradle-home-cache-cleanup: true
        cache-read-only: false
        build-root-directory: ${{ github.workspace }}/mobile/android

    - name: Make gradlew executable
      shell: bash
      run: chmod +x "$GITHUB_WORKSPACE/mobile/android/gradlew"

    - name: Decode keystore
      if: inputs.signing-enabled == 'true' && inputs.keystore-base64 != ''
      shell: bash
      env:
        KEYSTORE_BASE64: ${{ inputs.keystore-base64 }}
      run: |
        printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/mobile/android/keystore.jks"

    - name: Build AAB
      shell: bash
      working-directory: ${{ github.workspace }}/mobile/android
      env:
        BUILD_TYPE: ${{ inputs.build-type }}
        SIGNING_ENABLED: ${{ inputs.signing-enabled }}
        KEYSTORE_PASSWORD: ${{ inputs.keystore-password }}
        KEY_ALIAS: ${{ inputs.key-alias }}
        KEY_PASSWORD: ${{ inputs.key-password }}
      run: |
        case "$BUILD_TYPE" in
          release) GRADLE_VARIANT="Release" ;;
          debug) GRADLE_VARIANT="Debug" ;;
          *) echo "Unsupported Android build type" >&2; exit 2 ;;
        esac
        if [ "$SIGNING_ENABLED" = "true" ]; then
          ./gradlew "bundle$GRADLE_VARIANT" \
            "-Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/mobile/android/keystore.jks" \
            "-Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$KEY_PASSWORD"
        else
          ./gradlew "bundle$GRADLE_VARIANT"
        fi

    - name: Build APK
      shell: bash
      working-directory: ${{ github.workspace }}/mobile/android
      env:
        BUILD_TYPE: ${{ inputs.build-type }}
        SIGNING_ENABLED: ${{ inputs.signing-enabled }}
        KEYSTORE_PASSWORD: ${{ inputs.keystore-password }}
        KEY_ALIAS: ${{ inputs.key-alias }}
        KEY_PASSWORD: ${{ inputs.key-password }}
      run: |
        case "$BUILD_TYPE" in
          release) GRADLE_VARIANT="Release" ;;
          debug) GRADLE_VARIANT="Debug" ;;
          *) echo "Unsupported Android build type" >&2; exit 2 ;;
        esac
        if [ "$SIGNING_ENABLED" = "true" ]; then
          ./gradlew "assemble$GRADLE_VARIANT" \
            "-Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/mobile/android/keystore.jks" \
            "-Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$KEY_PASSWORD"
        else
          ./gradlew "assemble$GRADLE_VARIANT"
        fi

    - name: Set output paths
      id: set-paths
      shell: bash
      env:
        BUILD_TYPE_INPUT: ${{ inputs.build-type }}
      run: |
        case "$BUILD_TYPE_INPUT" in
          release|debug) BUILD_TYPE_LOWER="$BUILD_TYPE_INPUT" ;;
          *) echo "Unsupported Android build type" >&2; exit 2 ;;
        esac
        {
          echo "apk-path=$GITHUB_WORKSPACE/mobile/android/app/build/outputs/apk/$BUILD_TYPE_LOWER/app-$BUILD_TYPE_LOWER.apk"
          echo "aab-path=$GITHUB_WORKSPACE/mobile/android/app/build/outputs/bundle/$BUILD_TYPE_LOWER/app-$BUILD_TYPE_LOWER.aab"
        } >> "$GITHUB_OUTPUT"

    - name: Upload build outputs
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: android-build-${{ inputs.build-type }}
        path: |
          ${{ github.workspace }}/mobile/android/app/build/outputs/apk/
          ${{ github.workspace }}/mobile/android/app/build/outputs/bundle/
        if-no-files-found: error
        retention-days: 7
