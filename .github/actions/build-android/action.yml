name: 'Build Android App'
description: 'Composite action to build Android APK and AAB'

inputs:
  build-type:
    description: 'Build type (debug/release)'
    required: true
    default: 'release'
  signing-enabled:
    description: 'Enable signing'
    required: false
    default: 'false'
  keystore-base64:
    description: 'Base64-encoded keystore'
    required: false
    default: ''
  keystore-password:
    description: 'Keystore password'
    required: false
    default: ''
  key-alias:
    description: 'Key alias'
    required: false
    default: ''
  key-password:
    description: 'Key password'
    required: false
    default: ''
  gradle-cache-key:
    description: 'Cache key for Gradle'
    required: false
    default: 'gradle'

outputs:
  apk-path:
    description: 'Path to built APK'
    value: ${{ steps.set-paths.outputs.apk-path }}
  aab-path:
    description: 'Path to built AAB'
    value: ${{ steps.set-paths.outputs.aab-path }}

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-home-cache-cleanup: true
        cache-read-only: false
        build-root-directory: ${{ github.workspace }}/mobile/android

    - name: Make gradlew executable
      shell: bash
      run: chmod +x ${{ github.workspace }}/mobile/android/gradlew

    - name: Decode keystore
      if: inputs.signing-enabled == 'true' && inputs.keystore-base64 != ''
      shell: bash
      run: |
        echo "${{ inputs.keystore-base64 }}" | base64 -d > ${{ github.workspace }}/mobile/android/keystore.jks

    - name: Build AAB
      shell: bash
      working-directory: ${{ github.workspace }}/mobile/android
      run: |
        if [ "${{ inputs.signing-enabled }}" = "true" ]; then
          ./gradlew bundle${{ inputs.build-type == 'release' && 'Release' || 'Debug' }} \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/mobile/android/keystore.jks \
            -Pandroid.injected.signing.store.password=${{ inputs.keystore-password }} \
            -Pandroid.injected.signing.key.alias=${{ inputs.key-alias }} \
            -Pandroid.injected.signing.key.password=${{ inputs.key-password }}
        else
          ./gradlew bundle${{ inputs.build-type == 'release' && 'Release' || 'Debug' }}
        fi

    - name: Build APK
      shell: bash
      working-directory: ${{ github.workspace }}/mobile/android
      run: |
        if [ "${{ inputs.signing-enabled }}" = "true" ]; then
          ./gradlew assemble${{ inputs.build-type == 'release' && 'Release' || 'Debug' }} \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/mobile/android/keystore.jks \
            -Pandroid.injected.signing.store.password=${{ inputs.keystore-password }} \
            -Pandroid.injected.signing.key.alias=${{ inputs.key-alias }} \
            -Pandroid.injected.signing.key.password=${{ inputs.key-password }}
        else
          ./gradlew assemble${{ inputs.build-type == 'release' && 'Release' || 'Debug' }}
        fi

    - name: Set output paths
      id: set-paths
      shell: bash
      run: |
        BUILD_TYPE_LOWER=$(echo "${{ inputs.build-type }}" | tr '[:upper:]' '[:lower:]')
        BUILD_TYPE_UPPER=$(echo "${{ inputs.build-type }}" | tr '[:lower:]' '[:upper:]')
        echo "apk-path=${{ github.workspace }}/mobile/android/app/build/outputs/apk/${BUILD_TYPE_LOWER}/app-${BUILD_TYPE_LOWER}.apk" >> $GITHUB_OUTPUT
        echo "aab-path=${{ github.workspace }}/mobile/android/app/build/outputs/bundle/${BUILD_TYPE_LOWER}/app-${BUILD_TYPE_LOWER}.aab" >> $GITHUB_OUTPUT

    - name: Upload build outputs
      uses: actions/upload-artifact@v4
      with:
        name: android-build-${{ inputs.build-type }}
        path: |
          ${{ github.workspace }}/mobile/android/app/build/outputs/apk/
          ${{ github.workspace }}/mobile/android/app/build/outputs/bundle/
        if-no-files-found: error
        retention-days: 7
