name: 'Build iOS App'
description: 'Composite action to build and archive iOS app'

inputs:
  build-type:
    description: 'Build type (debug/release)'
    required: true
    default: 'release'
  workspace-path:
    description: 'Path to Xcode workspace'
    required: true
    default: 'mobile/ios/Gula.xcworkspace'
  scheme:
    description: 'Xcode scheme'
    required: true
    default: 'Gula'
  export-method:
    description: 'Export method (app-store/ad-hoc/development)'
    required: false
    default: 'app-store'
  certificate-base64:
    description: 'Base64-encoded build certificate'
    required: false
    default: ''
  certificate-password:
    description: 'Certificate P12 password'
    required: false
    default: ''
  provisioning-profile-base64:
    description: 'Base64-encoded provisioning profile'
    required: false
    default: ''
  team-id:
    description: 'Apple Team ID'
    required: false
    default: ''

outputs:
  ipa-path:
    description: 'Path to built IPA'
    value: ${{ steps.set-paths.outputs.ipa-path }}
  archive-path:
    description: 'Path to xcarchive'
    value: ${{ steps.set-paths.outputs.archive-path }}

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      shell: bash
      run: sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer

    - name: Setup provisioning
      if: inputs.certificate-base64 != ''
      shell: bash
      run: |
        KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
        KEYCHAIN_PASSWORD=$(openssl rand -base64 12)

        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

        echo "${{ inputs.certificate-base64 }}" | base64 -d > $RUNNER_TEMP/certificate.p12
        security import $RUNNER_TEMP/certificate.p12 \
          -k "$KEYCHAIN_PATH" \
          -P "${{ inputs.certificate-password }}" \
          -T /usr/bin/codesign

        echo "${{ inputs.provisioning-profile-base64 }}" | base64 -d > $RUNNER_TEMP/profile.mobileprovision
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        cp $RUNNER_TEMP/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

        security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

    - name: Resolve SPM packages
      shell: bash
      working-directory: ${{ github.workspace }}/mobile/ios
      run: |
        xcodebuild -resolvePackageDependencies \
          -workspace "${{ inputs.workspace-path }}" \
          -scheme "${{ inputs.scheme }}" \
          -derivedDataPath /tmp/GulaDerivedData

    - name: Archive
      shell: bash
      working-directory: ${{ github.workspace }}/mobile/ios
      run: |
        xcodebuild archive \
          -workspace "${{ inputs.workspace-path }}" \
          -scheme "${{ inputs.scheme }}" \
          -configuration ${{ inputs.build-type == 'release' && 'Release' || 'Debug' }} \
          -derivedDataPath /tmp/GulaDerivedData \
          -archivePath $RUNNER_TEMP/Gula.xcarchive \
          -allowProvisioningUpdates

    - name: Export IPA
      shell: bash
      working-directory: ${{ github.workspace }}/mobile/ios
      run: |
        EXPORT_OPTIONS=$RUNNER_TEMP/ExportOptions.plist
        cat > $EXPORT_OPTIONS << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>method</key>
          <string>${{ inputs.export-method }}</string>
          <key>teamID</key>
          <string>${{ inputs.team-id }}</string>
          <key>signingStyle</key>
          <string>manual</string>
          <key>stripSwiftSymbols</key>
          <true/>
          <key>uploadSymbols</key>
          <true/>
          <key>uploadBitcode</key>
          <false/>
          <key>compileBitcode</key>
          <false/>
        </dict>
        </plist>
        EOF

        xcodebuild -exportArchive \
          -archivePath $RUNNER_TEMP/Gula.xcarchive \
          -exportPath $RUNNER_TEMP/Gula.ipa \
          -exportOptionsPlist $EXPORT_OPTIONS \
          -allowProvisioningUpdates

    - name: Set output paths
      id: set-paths
      shell: bash
      run: |
        echo "ipa-path=$RUNNER_TEMP/Gula.ipa/Gula.ipa" >> $GITHUB_OUTPUT
        echo "archive-path=$RUNNER_TEMP/Gula.xcarchive" >> $GITHUB_OUTPUT

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: ios-build-${{ inputs.build-type }}
        path: ${{ runner.temp }}/Gula.ipa/*
        if-no-files-found: error
        retention-days: 7

    - name: Upload dSYMs
      uses: actions/upload-artifact@v4
      with:
        name: ios-dsyms-${{ inputs.build-type }}
        path: ${{ runner.temp }}/Gula.xcarchive/dSYMs/
        if-no-files-found: warn
        retention-days: 7
