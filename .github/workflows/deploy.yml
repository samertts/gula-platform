name: Deploy GULA Platform

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "Host gula-server
            HostName $SERVER_HOST
            User ${{ secrets.SERVER_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking yes
          " > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Deploy to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh gula-server << 'DEPLOY_SCRIPT'
            set -e
            cd /home/samertts/gula-platform

            # Preserve .env file before git reset (contains production secrets)
            if [ -f .env ]; then
              cp .env /tmp/.env.gula.backup
              echo "Backed up .env file"
            fi

            # Reset to match remote exactly
            git fetch origin main
            git reset --hard origin/main
            git clean -fd -e .env

            # Restore .env file
            if [ -f /tmp/.env.gula.backup ]; then
              cp /tmp/.env.gula.backup .env
              rm -f /tmp/.env.gula.backup
              echo "Restored .env file"
            fi

            # Verify .env exists - if not, create from example
            if [ ! -f .env ]; then
              if [ -f .env.example ]; then
                cp .env.example .env
                echo "WARNING: Created .env from .env.example - passwords are defaults!"
              else
                echo "ERROR: No .env file found. Create one manually."
                exit 1
              fi
            fi

            # Auto-generate missing required variables (simple inline checks)
            if ! grep -q "^SECRET_KEY=" .env; then
              echo "SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(64))')" >> .env
              echo "Generated missing SECRET_KEY"
            fi

            if ! grep -q "^ENCRYPTION_KEY=" .env; then
              echo "ENCRYPTION_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')" >> .env
              echo "Generated missing ENCRYPTION_KEY"
            fi

            if ! grep -q "^NID_HMAC_KEY=" .env; then
              echo "NID_HMAC_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')" >> .env
              echo "Generated missing NID_HMAC_KEY"
            fi

            if ! grep -q "^MINIO_ACCESS_KEY=" .env; then
              echo "MINIO_ACCESS_KEY=gula_minio" >> .env
              echo "Generated missing MINIO_ACCESS_KEY"
            fi

            if ! grep -q "^MINIO_SECRET_KEY=" .env; then
              echo "MINIO_SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')" >> .env
              echo "Generated missing MINIO_SECRET_KEY"
            fi

            if ! grep -q "^RABBITMQ_URL=" .env; then
              RABBIT_PASS=$(grep -oP 'RABBITMQ_PASS=\K.*' .env | head -1 || echo "changeme")
              echo "RABBITMQ_URL=amqp://gula:${RABBIT_PASS}@rabbitmq:5672/gula" >> .env
              echo "Generated missing RABBITMQ_URL"
            fi

            if ! grep -q "^DATABASE_URL=" .env; then
              PG_PASS=$(grep -oP 'POSTGRES_PASSWORD=\K.*' .env | head -1 || echo "changeme")
              echo "DATABASE_URL=postgresql://postgres:${PG_PASS}@postgres:5432/labdb" >> .env
              echo "Generated missing DATABASE_URL"
            fi

            echo "=== .env verification ==="
            echo "Variables set: $(grep -c '=' .env)"
            grep -oP '^[A-Z_]+(?==)' .env | sort
            echo "========================="

            # Detect docker compose command (v2 plugin or v1 standalone)
            if docker compose version &> /dev/null; then
              COMPOSE="docker compose"
            elif command -v docker-compose &> /dev/null; then
              COMPOSE="docker-compose"
            else
              echo "ERROR: Neither 'docker compose' nor 'docker-compose' found"
              exit 1
            fi
            echo "Using: $COMPOSE"

            $COMPOSE build
            $COMPOSE down --remove-orphans
            $COMPOSE up -d

            # Clean up old images
            docker image prune -f

            # Verify containers are running
            echo "=== Container Status ==="
            $COMPOSE ps

            echo "Deployment completed successfully"
          DEPLOY_SCRIPT

      - name: Wait for services to start
        run: sleep 20

      - name: Health Check
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -sf --max-time 10 "http://$SERVER_HOST/health" > /dev/null 2>&1; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 6 attempts"

          # Show service logs for debugging
          ssh gula-server 'cd /home/samertts/gula-platform && if docker compose version &>/dev/null; then COMPOSE="docker compose"; else COMPOSE="docker-compose"; fi && $COMPOSE ps && $COMPOSE logs --tail=20 api-gateway gula-backend' || true
          exit 1

      - name: Verify API endpoint
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          response=$(curl -sf --max-time 10 "http://$SERVER_HOST/health" 2>/dev/null || echo "FAILED")
          echo "API Response: $response"
          if echo "$response" | grep -q '"status"'; then
            echo "API is healthy!"
          else
            echo "WARNING: API health check returned unexpected response"
          fi
