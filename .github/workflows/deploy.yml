name: Deploy GULA Platform

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: gula-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat > ~/.ssh/config << SSHEOF
          Host gula-server
            HostName $SERVER_HOST
            User ${{ secrets.SERVER_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking yes
          SSHEOF
          chmod 600 ~/.ssh/config

      - name: Deploy to server
        run: |
          ssh gula-server << 'DEPLOY_SCRIPT'
            set -euo pipefail

            REPO_DIR="/home/samertts/gula-platform"
            cd "$REPO_DIR"

            log() { printf '[deploy] %s\n' "$*"; }

            # Detect docker compose
            COMPOSE="docker compose"
            if ! $COMPOSE version >/dev/null 2>&1; then
              COMPOSE="docker-compose"
            fi
            if ! command -v docker >/dev/null 2>&1; then
              log "ERROR: docker not found"
              exit 2
            fi

            # Preserve .env before git reset
            if [ -f .env ]; then
              cp .env /tmp/.env.gula.backup
              log "Backed up .env"
            fi

            # Store current commit for rollback
            PREVIOUS_COMMIT="$(git rev-parse HEAD)"

            # Sync to latest main
            git fetch origin main
            git reset --hard origin/main
            git clean -fd -e .env

            # Restore .env
            if [ -f /tmp/.env.gula.backup ]; then
              cp /tmp/.env.gula.backup .env
              rm -f /tmp/.env.gula.backup
              log "Restored .env"
            fi

            # Verify .env exists
            if [ ! -f .env ]; then
              log "ERROR: No .env file. Production requires a configured .env."
              exit 1
            fi

            # Auto-generate missing required variables
            for var in SECRET_KEY ENCRYPTION_KEY NID_HMAC_KEY MINIO_SECRET_KEY; do
              if ! grep -q "^${var}=" .env; then
                echo "${var}=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')" >> .env
                log "Generated missing $var"
              fi
            done

            if ! grep -q "^MINIO_ACCESS_KEY=" .env; then
              echo "MINIO_ACCESS_KEY=gula_minio" >> .env
            fi

            if ! grep -q "^RABBITMQ_URL=" .env; then
              RABBIT_PASS=$(grep -oP 'RABBITMQ_PASS=\K.*' .env | head -1 || echo "changeme")
              echo "RABBITMQ_URL=amqp://gula:${RABBIT_PASS}@rabbitmq:5672/gula" >> .env
            fi

            if ! grep -q "^DATABASE_URL=" .env; then
              PG_PASS=$(grep -oP 'POSTGRES_PASSWORD=\K.*' .env | head -1 || echo "changeme")
              echo "DATABASE_URL=postgresql://postgres:${PG_PASS}@postgres:5432/labdb" >> .env
            fi

            if ! grep -q "^REDIS_PASSWORD=" .env; then
              echo "REDIS_PASSWORD=$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')" >> .env
              log "Generated missing REDIS_PASSWORD"
            fi

            log "Variables set: $(grep -c '=' .env)"

            # ── Configure system nginx to proxy to Docker (port 8080) ──
            if command -v nginx >/dev/null 2>&1 && [ -d /etc/nginx/sites-available ]; then
              log "Configuring system nginx reverse proxy"

              # Use HTTP-only config (simpler, works without SSL certs)
              if [ -f "$REPO_DIR/config/nginx/system/gula-platform-http.conf" ]; then
                sudo cp "$REPO_DIR/config/nginx/system/gula-platform-http.conf" \
                  /etc/nginx/sites-available/gula-platform
                sudo ln -sf /etc/nginx/sites-available/gula-platform \
                  /etc/nginx/sites-enabled/gula-platform
                sudo rm -f /etc/nginx/sites-enabled/default

                if sudo nginx -t 2>/dev/null; then
                  sudo systemctl reload nginx
                  log "System nginx configured and reloaded"
                else
                  log "WARNING: nginx config test failed, skipping reload"
                fi
              fi
            fi

            # ── Deploy Docker services ──
            $COMPOSE config >/dev/null
            $COMPOSE pull --ignore-pull-failures
            $COMPOSE up -d --build --remove-orphans
            docker image prune -f

            log "Waiting for services to become healthy..."
            sleep 15

            # Show container status
            $COMPOSE ps

            # Health check with retry (up to 3 minutes)
            ok=0
            for i in $(seq 1 36); do
              # Check Docker api-gateway directly (port 8080)
              if curl -fsS --max-time 5 http://127.0.0.1:8080/health >/dev/null 2>&1; then
                ok=1
                log "Health check passed on attempt $i"
                break
              fi
              sleep 5
            done

            if [ "$ok" -ne 1 ]; then
              log "Health check failed after 3 minutes"
              log "Container status:"
              $COMPOSE ps
              log "Backend logs:"
              $COMPOSE logs --tail=20 gula-backend 2>/dev/null || true
              log "API gateway logs:"
              $COMPOSE logs --tail=20 api-gateway 2>/dev/null || true

              log "Rolling back to $PREVIOUS_COMMIT"
              git reset --hard "$PREVIOUS_COMMIT"
              $COMPOSE up -d --build --remove-orphans
              exit 1
            fi

            log "Deployment completed successfully"
          DEPLOY_SCRIPT

      - name: Health Check
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          echo "Waiting 30s for services to stabilize..."
          sleep 30

          for i in 1 2 3 4 5 6 7 8; do
            if curl -sf --max-time 10 "http://$SERVER_HOST/health" > /dev/null 2>&1; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt $i/8 failed, retrying in 15s..."
            sleep 15
          done
          echo "Health check failed after 8 attempts"

          # Debug: show what the server sees
          ssh gula-server 'cd /home/samertts/gula-platform && docker compose ps 2>/dev/null || docker-compose ps' || true
          exit 1

      - name: Verify API
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          response=$(curl -sf --max-time 10 "http://$SERVER_HOST/health" 2>/dev/null || echo "FAILED")
          echo "API Response: $response"
          if echo "$response" | grep -q '"status"'; then
            echo "API is healthy!"
          else
            echo "WARNING: Unexpected health response"
          fi
