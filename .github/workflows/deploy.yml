name: Deploy GULA Platform

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "Host gula-server
            HostName $SERVER_HOST
            User ${{ secrets.SERVER_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking yes
          " > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Deploy to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh gula-server << 'DEPLOY_SCRIPT'
            set -e
            cd /home/samertts/gula-platform

            # Preserve .env file before git reset (contains production secrets)
            if [ -f .env ]; then
              cp .env /tmp/.env.gula.backup
              echo "Backed up .env file"
            fi

            # Reset to match remote exactly
            git fetch origin main
            git reset --hard origin/main
            git clean -fd -e .env

            # Restore .env file
            if [ -f /tmp/.env.gula.backup ]; then
              cp /tmp/.env.gula.backup .env
              rm -f /tmp/.env.gula.backup
              echo "Restored .env file"
            fi

            # Verify .env exists before proceeding
            if [ ! -f .env ]; then
              echo "ERROR: .env file is missing! Cannot deploy without production secrets."
              echo "Create .env from .env.example and set all required values."
              exit 1
            fi

            # Auto-generate missing required variables
            ensure_env_var() {
              local var_name="$1"
              local generator="$2"
              if ! grep -q "^${var_name}=" .env; then
                local value
                value=$(eval "$generator")
                echo "${var_name}=${value}" >> .env
                echo "Generated missing ${var_name}"
              fi
            }

            ensure_env_var "SECRET_KEY" "python3 -c \"import secrets; print(secrets.token_urlsafe(64))\""
            ensure_env_var "ENCRYPTION_KEY" "python3 -c \"from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())\" 2>/dev/null || python3 -c \"import secrets; print(secrets.token_urlsafe(32))\""
            ensure_env_var "NID_HMAC_KEY" "python3 -c \"import secrets; print(secrets.token_urlsafe(32))\""
            ensure_env_var "MINIO_ACCESS_KEY" "echo gula_minio"
            ensure_env_var "MINIO_SECRET_KEY" "python3 -c \"import secrets; print(secrets.token_urlsafe(32))\""
            ensure_env_var "RABBITMQ_URL" "grep -oP 'RABBITMQ_PASS=\K.*' .env | head -1 | xargs -I{} echo 'amqp://gula:{}@rabbitmq:5672/gula' 2>/dev/null || echo 'amqp://gula:changeme@rabbitmq:5672/gula'"

            # Detect docker compose command (v2 plugin or v1 standalone)
            if docker compose version &> /dev/null; then
              COMPOSE="docker compose"
            elif command -v docker-compose &> /dev/null; then
              COMPOSE="docker-compose"
            else
              echo "ERROR: Neither 'docker compose' nor 'docker-compose' found"
              exit 1
            fi
            echo "Using: $COMPOSE"

            $COMPOSE build
            $COMPOSE down --remove-orphans
            $COMPOSE up -d

            # Clean up old images
            docker image prune -f

            # Verify containers are running
            echo "=== Container Status ==="
            $COMPOSE ps

            echo "Deployment completed successfully"
          DEPLOY_SCRIPT

      - name: Wait for services to start
        run: sleep 20

      - name: Health Check
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -sf --max-time 10 "http://$SERVER_HOST/health" > /dev/null 2>&1; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 6 attempts"

          # Show service logs for debugging
          ssh gula-server 'cd /home/samertts/gula-platform && if docker compose version &>/dev/null; then COMPOSE="docker compose"; else COMPOSE="docker-compose"; fi && $COMPOSE ps && $COMPOSE logs --tail=20 api-gateway gula-backend' || true
          exit 1

      - name: Verify API endpoint
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          response=$(curl -sf --max-time 10 "http://$SERVER_HOST/health" 2>/dev/null || echo "FAILED")
          echo "API Response: $response"
          if echo "$response" | grep -q '"status"'; then
            echo "API is healthy!"
          else
            echo "WARNING: API health check returned unexpected response"
          fi
