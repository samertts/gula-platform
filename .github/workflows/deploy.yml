name: Deploy GULA Platform

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: gula-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy to GULA server with health validation and autofix
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/gula_deploy_key
          chmod 600 ~/.ssh/gula_deploy_key

          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/gula_deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" <<'REMOTE_EOF'
          set -euo pipefail
          cd /home/samertts/gula-platform
          ./gula_update.sh
          ./gula_autofix.sh
          ./gula_health.sh
          REMOTE_EOF
