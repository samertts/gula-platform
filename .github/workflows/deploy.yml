name: Deploy GULA Platform

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "Host gula-server
            HostName $SERVER_HOST
            User ${{ secrets.SERVER_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking yes
          " > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Deploy to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh gula-server << 'DEPLOY_SCRIPT'
            set -e
            cd /home/samertts/gula-platform

            # Reset to match remote exactly (discard any manual changes on server)
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            # Build and deploy (force rebuild to ensure fresh images)
            docker compose build --no-cache
            docker compose down --remove-orphans
            docker compose up -d

            # Clean up old images
            docker image prune -f

            # Verify containers are running
            echo "=== Container Status ==="
            docker compose ps

            echo "Deployment completed successfully"
          DEPLOY_SCRIPT

      - name: Wait for services to start
        run: sleep 20

      - name: Health Check
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -sf --max-time 10 "http://$SERVER_HOST/health" > /dev/null 2>&1; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 6 attempts"

          # Show service logs for debugging
          ssh gula-server "cd /home/samertts/gula-platform && docker compose ps && docker compose logs --tail=20 api-gateway gula-backend" || true
          exit 1

      - name: Verify API endpoint
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          response=$(curl -sf --max-time 10 "http://$SERVER_HOST/health" 2>/dev/null || echo "FAILED")
          echo "API Response: $response"
          if echo "$response" | grep -q "healthy"; then
            echo "API is healthy!"
          else
            echo "WARNING: API health check returned unexpected response"
          fi
