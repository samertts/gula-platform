name: Deploy GULA Platform

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GULA server with health validation and autofix
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REPO_URL: https://github.com/samertts/gula-platform.git
          REPO_DIR: /home/samertts/gula-platform
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/gula_deploy_key
          chmod 600 ~/.ssh/gula_deploy_key

          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/gula_deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" \
            "REPO_URL='$REPO_URL' REPO_DIR='$REPO_DIR' bash -se" <<'REMOTE_EOF'
          set -euo pipefail

          if [ ! -d "$REPO_DIR/.git" ]; then
            rm -rf "$REPO_DIR"
            git clone "$REPO_URL" "$REPO_DIR"
          fi

          cd "$REPO_DIR"
          git fetch --all --prune
          git reset --hard origin/main
          chmod +x gula_update.sh gula_autofix.sh gula_health.sh

          ./gula_update.sh
          ./gula_autofix.sh
          ./gula_health.sh
          REMOTE_EOF
