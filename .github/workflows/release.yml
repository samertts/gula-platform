name: Release - Unified Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version to release (e.g. 2.1.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (skip uploads and store submissions)'
        required: false
        default: false
        type: boolean
      skip_stores:
        description: 'Skip store uploads'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: none
  pull-requests: none

env:
  REGISTRY: ghcr.io
  NODE_VERSION: '24'
  FLUTTER_VERSION: '3.27.0'

jobs:
  validate-version:
    name: Validate Version
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate semantic version
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $RELEASE_VERSION"
            echo "Version must be a semantic version (e.g. 2.1.0)"
            exit 1
          fi

      - name: Check version not already tagged
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          if git rev-parse "refs/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Tag v$RELEASE_VERSION already exists"
            exit 1
          fi

      - name: Check changelog exists for version
        run: |
          if [ ! -f "mobile/CHANGELOG.md" ]; then
            echo "No CHANGELOG.md found"
            exit 1
          fi

  bump-version:
    name: Bump Version
    needs: [validate-version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "GULA Release Bot"
          git config user.email "releases@gulaplatform.com"

      - name: Update mobile version file
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="$RELEASE_VERSION"
          cat > mobile/version.json << EOF
          {
            "version": "$VERSION",
            "versionCode": $(echo $VERSION | awk -F. '{print $1*10000+$2*100+$3}'),
            "buildNumber": $(date +%s),
            "releaseDate": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "minimumOSVersion": "16.0",
            "minimumAndroidSDK": 26
          }
          EOF

      - name: Update Android version
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="$RELEASE_VERSION"
          VERSION_CODE=$(echo $VERSION | awk -F. '{print $1*10000+$2*100+$3}')
          cd mobile/android
          sed -i "s/versionName = \".*\"/versionName = \"$VERSION\"/" app/build.gradle.kts
          sed -i "s/versionCode = [0-9]*/versionCode = $VERSION_CODE/" app/build.gradle.kts

      - name: Update iOS version
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="$RELEASE_VERSION"
          VERSION_CODE=$(echo $VERSION | awk -F. '{print $1*10000+$2*100+$3}')
          cd mobile/ios
          sed -i "s/MARKETING_VERSION = [0-9.]*;/MARKETING_VERSION = $VERSION;/" Gula.xcodeproj/project.pbxproj 2>/dev/null || \
          plutil -replace CFBundleShortVersionString -string "$VERSION" Gula/Info.plist
          plutil -replace CFBundleVersion -string "$VERSION_CODE" Gula/Info.plist

      - name: Update backend config
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="$RELEASE_VERSION"
          sed -i "s/APP_VERSION = \".*\"/APP_VERSION = \"$VERSION\"/" backend/app/config.py

      - name: Update Flutter desktop version
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="$RELEASE_VERSION"
          cd mobile/desktop
          sed -i "s/^version: .*/version: $VERSION/" pubspec.yaml

      - name: Commit and tag version bump
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          git add -A
          git commit -m "chore(release): bump version to v$RELEASE_VERSION"
          git tag -a "v$RELEASE_VERSION" -m "Release v$RELEASE_VERSION"
          git push origin HEAD --tags

  build-all:
    name: Build All Artifacts
    needs: [bump-version]
    # Callee's dependency-submission job needs contents: write and the
    # workflow needs packages: read; a caller granting less is a startup_failure.
    permissions:
      contents: write
      packages: read
    uses: ./.github/workflows/mobile-android.yml
    with:
      build_type: release
    secrets:
      GULA_ANDROID_UPLOAD_KEY_BASE64: ${{ secrets.GULA_ANDROID_UPLOAD_KEY_BASE64 }}
      GULA_ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.GULA_ANDROID_UPLOAD_KEY_PASSWORD }}
      GULA_ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.GULA_ANDROID_UPLOAD_KEY_ALIAS }}
      GULA_ANDROID_UPLOAD_KEY_ENTRY_PASSWORD: ${{ secrets.GULA_ANDROID_UPLOAD_KEY_ENTRY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_KEY }}

  build-ios:
    name: Build iOS
    needs: [bump-version]
    uses: ./.github/workflows/mobile-ios.yml
    with:
      build_type: release
    secrets:
      IOS_BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
      IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
      IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
      IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
      APP_STORE_CONNECT_USERNAME: ${{ secrets.APP_STORE_CONNECT_USERNAME }}
      APP_STORE_CONNECT_PASSWORD: ${{ secrets.APP_STORE_CONNECT_PASSWORD }}
      APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}

  build-desktop:
    name: Build Desktop
    needs: [bump-version]
    uses: ./.github/workflows/mobile-flutter-desktop.yml
    secrets:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      MACOS_APP_PASSWORD: ${{ secrets.MACOS_APP_PASSWORD }}
      MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}

  generate-changelog:
    name: Generate Changelog
    needs: [bump-version]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5
        with:
          config: cliff.toml
          args: --verbose --latest --strip header
        env:
          OUTPUT: CHANGELOG.md

      - name: Upload changelog
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-changelog
          path: CHANGELOG.md
          retention-days: 7

  create-github-release:
    name: Create GitHub Release
    needs: [build-all, build-ios, build-desktop, generate-changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: release-artifacts/

      - name: Download changelog
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-changelog

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: GULA Platform v${{ github.event.inputs.version }}
          body_path: CHANGELOG.md
          draft: true
          prerelease: false
          files: |
            release-artifacts/gula-android-release-aab/*.aab
            release-artifacts/gula-android-release-apk/*.apk
            release-artifacts/gula-ios-release/*.ipa
            release-artifacts/gula-desktop-windows-msix/*.msix
            release-artifacts/gula-desktop-linux-appimage/*.AppImage
            release-artifacts/gula-desktop-linux-deb/*.deb
            release-artifacts/gula-desktop-linux-rpm/*.rpm
            release-artifacts/gula-desktop-macos-dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-to-stores:
    name: Deploy to Stores
    needs: [create-github-release]
    if: ${{ !github.event.inputs.skip_stores && !github.event.inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download Android AAB
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: gula-android-release-aab
          path: mobile/android/app/build/outputs/bundle/release/

      - name: Download iOS IPA
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: gula-ios-release
          path: mobile/ios/build/

      - name: Deploy Android to Google Play
        env:
          PLAY_SERVICE_ACCOUNT_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_KEY }}
        run: |
          cd mobile/android
          echo "$PLAY_SERVICE_ACCOUNT_KEY" | base64 -d > play-service-account.json
          bundle exec fastlane supply \
            --json_key play-service-account.json \
            --package_name "io.gula.android" \
            --aab app/build/outputs/bundle/release/app-release.aab \
            --track production \
            --release_status completed \
            --skip_upload_metadata true \
            --skip_upload_images true \
            --skip_upload_screenshots true

      - name: Deploy iOS to TestFlight
        env:
          APP_STORE_CONNECT_USERNAME: ${{ secrets.APP_STORE_CONNECT_USERNAME }}
          APP_STORE_CONNECT_PASSWORD: ${{ secrets.APP_STORE_CONNECT_PASSWORD }}
        run: |
          xcrun altool --upload-app \
            --file mobile/ios/build/Gula.ipa \
            --type ios \
            --username "$APP_STORE_CONNECT_USERNAME" \
            --password "$APP_STORE_CONNECT_PASSWORD"

  notify:
    name: Send Release Notification
    needs: [build-all, build-ios, build-desktop, deploy-to-stores, create-github-release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d
        with:
          payload: |
            {
              "channel": "#releases",
              "username": "GULA Release Bot",
              "icon_emoji": ":rocket:",
              "attachments": [{
                "color": "${{ needs.create-github-release.result == 'success' && 'good' || 'danger' }}",
                "title": "Release v${{ github.event.inputs.version }} ${{ needs.create-github-release.result == 'success' && 'published' || 'failed' }}",
                "fields": [
                  { "title": "Version", "value": "${{ github.event.inputs.version }}", "short": true },
                  { "title": "Android", "value": "${{ needs.build-all.result }}", "short": true },
                  { "title": "iOS", "value": "${{ needs.build-ios.result }}", "short": true },
                  { "title": "Desktop", "value": "${{ needs.build-desktop.result }}", "short": true },
                  { "title": "GitHub Release", "value": "${{ needs.create-github-release.result }}", "short": true },
                  { "title": "Store Deploy", "value": "${{ needs.deploy-to-stores.result }}", "short": true }
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        continue-on-error: true

      - name: Send Telegram notification
        uses: appleboy/telegram-action@221e6b684967abe813051ee4a37dd61770a83ad3
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 *GULA Platform Release v${{ github.event.inputs.version }}*

            Status: ${{ needs.create-github-release.result == 'success' && '✅ Published' || '❌ Failed' }}
            Android: ${{ needs.build-all.result }}
            iOS: ${{ needs.build-ios.result }}
            Desktop: ${{ needs.build-desktop.result }}
            Store Deploy: ${{ needs.deploy-to-stores.result }}
            Release: https://github.com/${{ github.repository }}/releases/tag/v${{ github.event.inputs.version }}
        continue-on-error: true
