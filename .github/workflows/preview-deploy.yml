name: Preview Deploy

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend-v2/**'
      - 'vercel.json'
  push:
    branches: [develop, preview]
    paths:
      - 'frontend-v2/**'
      - 'vercel.json'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'

jobs:
  validate:
    name: Build Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend-v2/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint || true
      - run: npm run build
        env:
          VITE_APP_ENV: preview
          VITE_USE_MOCK: 'true'
          VITE_DEMO_MODE: 'true'
          VITE_TELEMETRY_DISABLED: 'true'
      - name: Cache build
        uses: actions/cache@v4
        with:
          path: frontend-v2/dist
          key: build-${{ github.sha }}

  deploy-preview:
    name: Deploy Preview
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel (Preview)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prebuilt'
          github-comment: true
          github-deployment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

  deploy-branch:
    name: Deploy Branch
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel (Branch)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prebuilt'

  qa-checks:
    name: QA Checks
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend-v2/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: TypeScript Check
        run: npx tsc --noEmit || true
      - name: Bundle Size Check
        run: |
          du -sh dist/ 2>/dev/null || echo "Build not found"
      - name: Check for Production Secrets
        run: |
          if grep -r "production" --include="*.ts" --include="*.tsx" --include="*.js" -l frontend-v2/src/ 2>/dev/null | xargs grep -l "api\.gula-platform\.org\|secret\|password" 2>/dev/null; then
            echo "WARNING: Possible production references found"
          fi
