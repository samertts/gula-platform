name: Preview Deploy

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Build frontend
        run: |
          cd frontend-v3
          npm install --ignore-scripts 2>/dev/null || true
          echo "Frontend install attempted"
