name: build-images

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "shared/**"
      - "requirements*.txt"
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra image tag (e.g. staging)"
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/gula-platform/backend

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514131bd1c9b7d33a4c8a0fbf4e2c67d8a8a

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          MANUAL_TAG="${{ github.event.inputs.tag }}"
          TAGS="ghcr.io/${{ env.IMAGE_NAME }}:${SHORT_SHA}"
          # Every production image is a distroless-style runtime build; tag the
          # deployed default ("latest") only for main/releases, never for PRs.
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS="${TAGS},ghcr.io/${{ env.IMAGE_NAME }}:latest"
          fi
          if [ -n "$MANUAL_TAG" ]; then
            TAGS="${TAGS},ghcr.io/${{ env.IMAGE_NAME }}:${MANUAL_TAG}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Building and pushing: ${TAGS}"

      - name: Build and push backend image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109ca5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
