name: IAM Hardening Gate

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/iam/**"

permissions:
  contents: read

concurrency:
  group: iam-hardening-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend

jobs:
  backend-identity:
    name: Backend identity unit and compile gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run read-only Ruff identity and clinical gateway gate
        run: ruff check --no-fix backend/app/identity backend/app/clinical_gateway backend/tests/identity backend/tests/test_clinical_gateway_contracts.py backend/tests/test_clinical_gateway_service.py
      - name: Run identity tests
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m pytest backend/tests/identity backend/tests/test_clinical_gateway_contracts.py backend/tests/test_clinical_gateway_service.py backend/tests/test_extensibility_guards.py backend/tests/test_capability_generator.py backend/tests/test_engineering_tooling_imports.py -m "not integration" -q --junitxml=artifacts/pytest-identity.xml 2>&1 | tee artifacts/pytest-identity.log
      - name: Compile backend source
        run: python -m compileall -q backend/app backend/migrations
      - name: Upload backend evidence
        if: always()
        # Evidence archival must not fail the gate it merely documents.
        # The account's artifact storage quota is exhausted, which was
        # turning every job red at this step while ruff, pytest, alembic
        # and compileall all passed. Those gates stay blocking.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: iam-backend-evidence-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  migration:
    name: PostgreSQL migration and schema gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gula_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d gula_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gula_test
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gula_test
      RUNTIME_MODE: migration
      ENV: migration
      SECRET_KEY: ci-migration-secret-key-not-for-production
      ENCRYPTION_KEY: ci-test-encryption-fixture-not-secret
      NID_HMAC_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      REDIS_URL: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Apply migration head
        run: |
          set -o pipefail
          mkdir -p artifacts
          cd backend
          alembic upgrade head 2>&1 | tee ../artifacts/alembic-upgrade.log
          alembic current 2>&1 | tee ../artifacts/alembic-current.log
      - name: Verify workspace schema on PostgreSQL
        run: |
          set -o pipefail
          cd backend
          python -m pytest tests/identity/test_workspace_migration_phase5.py tests/identity/test_membership_migration_phase6.py tests/identity/test_security_audit_migration_phase9.py tests/identity/test_clinical_gateway_migration_phase10b.py tests/test_schema_fidelity.py tests/test_identity_link_and_assurance.py -q --junitxml=../artifacts/pytest-migration.xml 2>&1 | tee ../artifacts/pytest-migration.log
      - name: Verify reversible workspace migration
        run: |
          set -o pipefail
          cd backend
          alembic downgrade 20260814_0002 2>&1 | tee ../artifacts/alembic-downgrade.log
          alembic upgrade head 2>&1 | tee ../artifacts/alembic-reupgrade.log
          alembic current 2>&1 | tee ../artifacts/alembic-reupgrade-current.log
      - name: Upload migration evidence
        if: always()
        # Evidence archival must not fail the gate it merely documents.
        # The account's artifact storage quota is exhausted, which was
        # turning every job red at this step while ruff, pytest, alembic
        # and compileall all passed. Those gates stay blocking.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: iam-migration-evidence-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  frontend-v3:
    name: Frontend v3 contract, type and build gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-v3/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend-v3 ci --ignore-scripts
      - name: Run frontend tests
        run: |
          set -o pipefail
          mkdir -p artifacts
          npm --prefix frontend-v3 run test -- --run 2>&1 | tee artifacts/vitest.log
      - name: Run frontend lint
        run: |
          set -o pipefail
          npm --prefix frontend-v3 run lint 2>&1 | tee artifacts/eslint.log
      - name: Run frontend typecheck
        run: npm --prefix frontend-v3 run typecheck
      - name: Build frontend production bundle
        run: |
          set -o pipefail
          npm --prefix frontend-v3 run build 2>&1 | tee artifacts/frontend-build.log
      - name: Upload frontend evidence
        if: always()
        # Evidence archival must not fail the gate it merely documents.
        # The account's artifact storage quota is exhausted, which was
        # turning every job red at this step while ruff, pytest, alembic
        # and compileall all passed. Those gates stay blocking.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: iam-frontend-evidence-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  security-regression:
    name: Security and tenant isolation regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RUNTIME_MODE: test
      ENV: test
      FEATURE_BACKGROUND_TASKS: "false"
      DATABASE_URL: "sqlite:///:memory:"
      REDIS_URL: ""
      SECRET_KEY: ci-security-test-secret-key-not-for-production
      ENCRYPTION_KEY: ci-test-encryption-fixture-not-secret
      NID_HMAC_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run security regression and tenant isolation
        run: |
          set -o pipefail
          mkdir -p artifacts
          cd backend
          python -m pytest tests/test_security_regression.py tests/test_auth_identity_discriminator.py tests/test_identity_assurance_boundaries.py tests/test_identity_platform_runtime.py tests/test_tenant_isolation_matrix.py tests/test_clinical_gateway_contracts.py tests/test_clinical_gateway_service.py -q --junitxml=../artifacts/pytest-security-regression.xml 2>&1 | tee ../artifacts/pytest-security-regression.log
      - name: Upload security evidence
        if: always()
        # Evidence archival must not fail the gate it merely documents.
        # The account's artifact storage quota is exhausted, which was
        # turning every job red at this step while ruff, pytest, alembic
        # and compileall all passed. Those gates stay blocking.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: iam-security-evidence-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
