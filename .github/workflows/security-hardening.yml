name: Security Hardening

on:
  push:
    branches: [main, 'release/*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan
    permissions:
      contents: read
      security-events: write
      # IA-090. gitleaks-action calls GET /repos/{o}/{r}/pulls/{n}/commits to
      # scope a pull_request scan to that PR's commits. Without this the call
      # returns 403 "Resource not accessible by integration" and the action
      # exits non-zero before scanning anything, so the gate has been reporting
      # a failure that is a permission error rather than a secret. GitHub names
      # the exact grant in the response it rejects us with:
      #   x-accepted-github-permissions: pull_requests=read
      # Read-only, and the narrowest scope that makes the scan run at all. The
      # repository's own `check_public_secrets.py` step was already passing
      # ("OK: no likely public secrets found in tracked source files"); it is
      # the history scan that never started.
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Repository source guard
        run: python3 scripts/security/check_public_secrets.py
      - name: Gitleaks history scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-dependency-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - backend/requirements-lock.txt
          - edge_agent/requirements.txt
          - nhop-platform/requirements.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check --no-cache-dir pip-audit
      - name: Audit pinned manifest
        run: |
          if [ ! -f "${{ matrix.manifest }}" ]; then
            echo "Missing manifest: ${{ matrix.manifest }}"
            exit 1
          fi
          pip-audit -r "${{ matrix.manifest }}" --strict --progress-spinner off

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0,AGPL-3.0
