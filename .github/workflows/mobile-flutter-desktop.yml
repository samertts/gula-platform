name: Mobile - Flutter Desktop CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'mobile/desktop/**'
      - '.github/workflows/mobile-flutter-desktop.yml'
      - '.github/actions/build-flutter/**'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/desktop/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
          - profile

env:
  FLUTTER_VERSION: '3.27.0'

permissions:
  contents: read

jobs:
  analyze:
    name: Dart Analyze (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile/desktop

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            mobile/desktop/.dart_tool/
            mobile/desktop/.packages
            ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('mobile/desktop/pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Run dart analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Check formatting
        run: dart format --set-exit-if-changed lib/

  test:
    name: Flutter Test (${{ matrix.os }})
    needs: [analyze]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile/desktop

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            mobile/desktop/.dart_tool/
            ~/.pub-cache
          key: pub-test-${{ runner.os }}-${{ hashFiles('mobile/desktop/pubspec.yaml') }}
          restore-keys: |
            pub-test-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Run flutter tests with coverage
        run: flutter test --coverage --machine > test-results.json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-results-${{ matrix.os }}
          path: mobile/desktop/test-results.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage-${{ matrix.os }}
          path: mobile/desktop/coverage/
          if-no-files-found: warn
          retention-days: 14

  build-windows:
    name: Build Windows MSIX
    needs: [test]
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile/desktop

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            mobile/desktop/.dart_tool/
            ~/.pub-cache
          key: pub-win-${{ hashFiles('mobile/desktop/pubspec.yaml') }}
          restore-keys: |
            pub-win-

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows MSIX
        run: |
          flutter build windows --release
          dart run msix:create --store

      - name: Upload Windows MSIX
        uses: actions/upload-artifact@v4
        with:
          name: gula-desktop-windows-msix
          path: mobile/desktop/build/windows/msix/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: gula-desktop-windows-exe
          path: mobile/desktop/build/windows/runner/Release/
          if-no-files-found: warn
          retention-days: 30

  build-linux:
    name: Build Linux (AppImage + deb + rpm)
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile/desktop

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libstdc++-12-dev libsecret-1-dev libjsoncpp-dev \
            librpm-dev rpm

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            mobile/desktop/.dart_tool/
            ~/.pub-cache
          key: pub-linux-${{ hashFiles('mobile/desktop/pubspec.yaml') }}
          restore-keys: |
            pub-linux-

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release

      - name: Build AppImage
        run: |
          sudo snap install appimagecraft
          appimagecraft build

      - name: Build deb package
        run: |
          sudo apt-get install -y dpkg-dev
          flutter build linux --release
          mkdir -p packaging/deb/usr/bin
          cp -r build/linux/x64/release/bundle/* packaging/deb/usr/bin/
          dpkg-deb --build packaging/deb gula-platform_${{ github.ref_name }}_amd64.deb

      - name: Build rpm package
        run: |
          mkdir -p ~/rpmbuild/SOURCES/
          tar czf ~/rpmbuild/SOURCES/gula-platform.tar.gz build/linux/x64/release/bundle/
          rpmbuild -ba packaging/gula-platform.spec

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: gula-desktop-linux-appimage
          path: mobile/desktop/build/appimage/*.AppImage
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Linux deb
        uses: actions/upload-artifact@v4
        with:
          name: gula-desktop-linux-deb
          path: mobile/desktop/*.deb
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Linux rpm
        uses: actions/upload-artifact@v4
        with:
          name: gula-desktop-linux-rpm
          path: mobile/desktop/*.rpm
          if-no-files-found: warn
          retention-days: 30

  build-macos:
    name: Build macOS DMG
    needs: [test]
    runs-on: macos-14
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile/desktop

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            mobile/desktop/.dart_tool/
            ~/.pub-cache
          key: pub-macos-${{ hashFiles('mobile/desktop/pubspec.yaml') }}
          restore-keys: |
            pub-macos-

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS release
        run: flutter build macos --release

      - name: Sign macOS app
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_APP_PASSWORD: ${{ secrets.MACOS_APP_PASSWORD }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 -d > certificate.p12
          security create-keychain -p temp temp.keychain
          security default-keychain -s temp.keychain
          security unlock-keychain -p temp temp.keychain
          security import certificate.p12 -k temp.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k temp temp.keychain
          /usr/bin/codesign --force --sign "Developer ID Application: GULA Platform" \
            --options runtime \
            --entitlements macos/Runner/Release.entitlements \
            build/macos/Build/Products/Release/gula_platform.app

      - name: Build DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "GULA Platform" \
            --volicon "macos/Runner/AppIcon.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "gula_platform.app" 150 200 \
            --hide-extension "gula_platform.app" \
            --app-drop-link 450 200 \
            --no-internet-enable \
            "GULA_Platform-${{ github.ref_name }}.dmg" \
            "build/macos/Build/Products/Release/"

      - name: Notarize DMG
        if: github.ref == 'refs/heads/main'
        env:
          MACOS_APP_PASSWORD: ${{ secrets.MACOS_APP_PASSWORD }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          xcrun notarytool submit \
            "GULA_Platform-${{ github.ref_name }}.dmg" \
            --apple-id "apps@gulaplatform.com" \
            --team-id "$MACOS_TEAM_ID" \
            --password "$MACOS_APP_PASSWORD" \
            --wait
          xcrun stapler staple "GULA_Platform-${{ github.ref_name }}.dmg"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: gula-desktop-macos-dmg
          path: mobile/desktop/GULA_Platform-*.dmg
          if-no-files-found: error
          retention-days: 30
