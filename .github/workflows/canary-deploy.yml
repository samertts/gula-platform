name: Canary Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy'
        required: true
      canary_percent:
        description: 'Initial canary traffic percent (10-50)'
        required: false
        default: '10'
      analysis_minutes:
        description: 'Analysis period per step (minutes)'
        required: false
        default: '5'

concurrency:
  group: gula-canary-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/gula-platform
  NAMESPACE: gula
  ANALYSIS_PERIOD_MIN: ${{ github.event.inputs.analysis_minutes || 5 }}

jobs:
  canary-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with: { version: 'v1.28.0' }

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config

      - name: Deploy canary (10% traffic)
        id: canary-10
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          IMAGE="${{ env.IMAGE_PREFIX }}/backend:${TAG}"

          kubectl set image deployment/gula-backend-canary gula-backend="${IMAGE}" \
            -n ${{ env.NAMESPACE }} 2>/dev/null || true

          kubectl patch trafficsplit gula-backend-split \
            -n ${{ env.NAMESPACE }} \
            --type=json \
            -p '[
              {"op":"replace","path":"/spec/backends/0/weight","value":90},
              {"op":"replace","path":"/spec/backends/1/weight","value":10}
            ]' 2>/dev/null || echo "TrafficSplit not available"

          echo "Canary deployed at 10% traffic"

      - name: Port forward to canary
        run: |
          kubectl port-forward deployment/gula-backend-canary 8080:8000 &
          sleep 3
          trap "kill %1 2>/dev/null || true" EXIT

      - name: Monitor canary (10%)
        run: |
          for i in $(seq 1 ${{ env.ANALYSIS_PERIOD_MIN }}); do
            STATUS=$(curl -sf --max-time 5 http://localhost:8080/health 2>/dev/null || echo "FAIL")
            echo "Minute $i: $STATUS"
            sleep 60
          done

      - name: Promote to 25%
        if: success()
        run: |
          kubectl patch trafficsplit gula-backend-split \
            -n ${{ env.NAMESPACE }} \
            --type=json \
            -p '[
              {"op":"replace","path":"/spec/backends/0/weight","value":75},
              {"op":"replace","path":"/spec/backends/1/weight","value":25}
            ]' 2>/dev/null || true
          echo "Canary promoted to 25%"

      - name: Monitor canary (25%)
        run: |
          for i in $(seq 1 ${{ env.ANALYSIS_PERIOD_MIN }}); do
            STATUS=$(curl -sf --max-time 5 http://localhost:8080/health 2>/dev/null || echo "FAIL")
            echo "Minute $i: $STATUS"
            sleep 60
          done

      - name: Promote to 50%
        if: success()
        run: |
          kubectl patch trafficsplit gula-backend-split \
            -n ${{ env.NAMESPACE }} \
            --type=json \
            -p '[
              {"op":"replace","path":"/spec/backends/0/weight","value":50},
              {"op":"replace","path":"/spec/backends/1/weight","value":50}
            ]' 2>/dev/null || true
          echo "Canary promoted to 50%"

      - name: Promote to 100%
        if: success()
        run: |
          kubectl patch trafficsplit gula-backend-split \
            -n ${{ env.NAMESPACE }} \
            --type=json \
            -p '[
              {"op":"replace","path":"/spec/backends/0/weight","value":0},
              {"op":"replace","path":"/spec/backends/1/weight","value":100}
            ]' 2>/dev/null || true

          kubectl patch deployment gula-backend \
            -n ${{ env.NAMESPACE }} \
            -p "{\"spec\":{\"template\":{\"metadata\":{\"labels\":{\"slot\":\"green\"}}}}}"

          echo "Canary promoted to 100% — full rollout complete"

      - name: Rollback on failure
        if: failure()
        run: |
          kubectl patch trafficsplit gula-backend-split \
            -n ${{ env.NAMESPACE }} \
            --type=json \
            -p '[
              {"op":"replace","path":"/spec/backends/0/weight","value":100},
              {"op":"replace","path":"/spec/backends/1/weight","value":0}
            ]' 2>/dev/null || true
          echo "Canary rollback complete — traffic restored to stable slot"

      - name: Summary
        if: always()
        run: |
          echo "## Canary Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "Image: ${{ env.IMAGE_PREFIX }}/backend:${{ github.event.inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
