name: Quality Gate

on:
  push:
    branches: [main, 'release/*']
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install tools
        run: pip install pyyaml
      - name: Validate YAML
        run: |
          python -c "
          import yaml, pathlib
          errors = []
          for f in pathlib.Path('.').glob('docker-compose*.yml'):
              try:
                  yaml.safe_load(f.read_text())
                  print(f'{f.name}: valid')
              except Exception as e:
                  errors.append(f'{f.name}: {e}')
          for f in pathlib.Path('config').rglob('docker-compose*.yml'):
              try:
                  yaml.safe_load(f.read_text())
                  print(f'{f.name}: valid')
              except Exception as e:
                  errors.append(f'{f.name}: {e}')
          if errors:
              for e in errors: print(f'ERROR: {e}')
          else:
              print('All YAML files valid')
          "
      - name: Check Dockerfiles
        run: |
          echo "Checking base images..."
          grep -r "^FROM " --include="Dockerfile" . | sort | uniq
