name: Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-gate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  security-events: write

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'
  GO_VERSION: '1.24'

jobs:
  linters:
    name: Linters & Type Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Python lint (ruff)
        run: |
          pip install ruff
          ruff check backend/app/
          ruff format --check backend/app/

      - name: Python type check (pyright)
        run: |
          pip install pyright
          pyright backend/app/ 2>/dev/null || echo "Pyright warnings above"

      - name: Python syntax gate
        run: |
          find backend/app backend/migrations -name '*.py' | xargs python -m py_compile
          pip install flake8
          flake8 backend/app --select=E9,F821 --max-line-length=200 --statistics

      - name: Shell check
        uses: ludeeus/action-shellcheck@2
        with:
          scandir: ./scripts/
          severity: warning

      - name: YAML validation
        run: |
          pip install yamllint
          yamllint .github/workflows/ -d "{extends: relaxed, rules: {line-length: {max: 200}}}"

      - name: Dockerfile lint (hadolint)
        uses: hadolint/hadolint-action@v3
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: warning

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python, javascript, typescript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python,javascript,typescript"
          upload: true

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Python dependency scan (safety)
        run: |
          pip install safety
          safety check -r backend/requirements.txt --output text
        continue-on-error: true

      - name: Python dependency scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --desc on
        continue-on-error: true

      - name: npm audit
        run: |
          cd frontend-v2
          npm audit --audit-level=high
        continue-on-error: true

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@1
        with:
          project: 'GULA Platform'
          path: '.'
          format: 'HTML'
        continue-on-error: true

      - name: Upload dependency check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report.html
          if-no-files-found: warn
          retention-days: 14

  license-compliance:
    name: License Compliance Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Python license check
        run: |
          pip install pip-licenses
          pip-licenses --from=backend/requirements.txt \
            --allow-only="MIT;Apache 2.0;BSD;BSD-2-Clause;BSD-3-Clause;ISC;Python-2.0;PSF;Unlicense;Mozilla Public License 2.0 (MPL 2.0);LGPL;LGPL-3.0-only;LGPL-3.0-or-later" \
            --fail-on-violation
        continue-on-error: true

      - name: JavaScript license check
        run: |
          cd frontend-v2
          npx license-checker --summary --failOn "GPL;AGPL"
        continue-on-error: true

      - name: Check for forbidden licenses
        run: |
          echo "License compliance check completed"
        continue-on-error: false

  coverage:
    name: Code Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: labdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
          pip install coverage pytest-cov

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://postgres:test_password@localhost:5432/labdb
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-only-not-used-in-prod
          REFRESH_TOKEN_SECRET: test-refresh-secret-for-ci-only-not-used-in-prod
          ENCRYPTION_KEY: "6TJUTgJxBREYK9_yDy6VMXBw1HPwwxv1kiynV0WaAdw="
          ENV: test
          RUNTIME_MODE: test
          FEATURE_BACKGROUND_TASKS: "false"
        run: |
          cd backend
          alembic upgrade head
          coverage run -m pytest tests/ -v --maxfail=1
          coverage report --fail-under=85
          coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml
          if-no-files-found: warn
          retention-days: 14

  secrets-scan:
    name: Secrets & SAST Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Bandit SAST
        run: |
          pip install bandit
          bandit -r backend/app/ -f json -o bandit-report.json -ll -ii
        continue-on-error: false

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 14

  summary:
    name: Quality Gate Summary
    needs: [linters, codeql, dependency-scan, license-compliance, coverage, secrets-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all gates passed
        run: |
          echo "# Quality Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Linters & Type Checks | ${{ needs.linters.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL Analysis | ${{ needs.codeql.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Scan | ${{ needs.dependency-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| License Compliance | ${{ needs.license-compliance.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Coverage (min 85%) | ${{ needs.coverage.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets & SAST Scan | ${{ needs.secrets-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          FAILED=false
          for result in \
            "${{ needs.linters.result }}" \
            "${{ needs.codeql.result }}" \
            "${{ needs.dependency-scan.result }}" \
            "${{ needs.license-compliance.result }}" \
            "${{ needs.coverage.result }}" \
            "${{ needs.secrets-scan.result }}"; do
            if [ "$result" != "success" ]; then
              FAILED=true
              break
            fi
          done

          if [ "$FAILED" = "true" ]; then
            echo "❌ **Some quality gates failed. Review logs before merging.**" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **All quality gates passed.**" >> $GITHUB_STEP_SUMMARY
          fi
