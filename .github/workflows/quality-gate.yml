name: Production Quality Gates

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-gate:
    name: Architecture Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python3 config/quality-gates/architecture-gate.py
      - name: Report
        if: always()
        run: echo "## Architecture Gate" >> $GITHUB_STEP_SUMMARY

  performance-gate:
    name: Performance Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python3 config/quality-gates/performance-gate.py
      - name: Report
        if: always()
        run: echo "## Performance Gate" >> $GITHUB_STEP_SUMMARY

  security-gate:
    name: Security Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python3 config/quality-gates/security-gate.py
      - name: Report
        if: always()
        run: echo "## Security Gate" >> $GITHUB_STEP_SUMMARY

  database-gate:
    name: Database Validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install sqlalchemy psycopg2-binary alembic
      - run: python3 config/quality-gates/database-gate.py
        env:
          DATABASE_URL: postgresql://postgres:testpass@localhost:5432/testdb

  api-gate:
    name: API Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python3 config/quality-gates/api-gate.py

  fhir-gate:
    name: FHIR Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python3 config/quality-gates/fhir-gate.py

  scalability-gate:
    name: Scalability Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python3 config/quality-gates/scalability-gate.py

  accessibility-gate:
    name: Accessibility Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node config/quality-gates/accessibility-gate.js

  offline-gate:
    name: Offline Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python3 config/quality-gates/offline-gate.py

  combined-report:
    name: Combined Gate Report
    if: always()
    needs:
      - architecture-gate
      - performance-gate
      - security-gate
      - database-gate
      - api-gate
      - fhir-gate
      - scalability-gate
      - accessibility-gate
      - offline-gate
    runs-on: ubuntu-latest
    steps:
      - name: Summarize gate results
        run: |
          echo "### Quality Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Architecture | ${{ needs.architecture-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance | ${{ needs.performance-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Database | ${{ needs.database-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API | ${{ needs.api-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| FHIR | ${{ needs.fhir-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Scalability | ${{ needs.scalability-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Accessibility | ${{ needs.accessibility-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Offline | ${{ needs.offline-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          has_failure=false
          for result in "${{ needs.architecture-gate.result }}" "${{ needs.performance-gate.result }}" "${{ needs.security-gate.result }}" "${{ needs.database-gate.result }}" "${{ needs.api-gate.result }}" "${{ needs.fhir-gate.result }}" "${{ needs.scalability-gate.result }}" "${{ needs.accessibility-gate.result }}" "${{ needs.offline-gate.result }}"; do
            if [ "$result" = "failure" ]; then
              has_failure=true
              break
            fi
          done
          if [ "$has_failure" = true ]; then
            echo "❌ **RELEASE BLOCKED** — One or more quality gates failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ **All gates pass** — Release ready" >> $GITHUB_STEP_SUMMARY
          fi
