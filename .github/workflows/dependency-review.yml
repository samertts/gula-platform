name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Dependency Review
        uses: actions/dependency-review-action@5a2ce3f5b92ee19cbb1541a4984c76ba92198ea0
        with:
          fail-on-severity: high
          deny-licenses: >
            AGPL-1.0, AGPL-3.0, GPL-1.0, GPL-2.0, GPL-3.0,
            LGPL-1.0, LGPL-2.0, LGPL-2.1, LGPL-3.0,
            BUSL-1.0, BSL-1.0, SSPL-1.0, RPL-1.5, RPL-2.0
          comment-summary-in-pr: on-failure
