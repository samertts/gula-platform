name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
        with:
          fail-on-severity: high
          deny-licenses: >
            AGPL-1.0-only, AGPL-3.0-only,
            GPL-1.0-only, GPL-2.0-only, GPL-3.0-only,
            LGPL-2.0-only, LGPL-2.1-only, LGPL-3.0-only,
            BUSL-1.1, BSL-1.0, SSPL-1.0, RPL-1.1, RPL-1.5
          # JNA is an indirect Android/Gradle dependency with Apache-2.0 OR LGPL-2.1-or-later.
          # Keep the deny list active; allow only this reviewed dependency to avoid a false-positive license block.
          allow-dependencies: net.java.dev.jna:jna
          comment-summary-in-pr: on-failure
