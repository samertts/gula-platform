name: Security config and infrastructure scan

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: security-config-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Run scanner unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
        run: |
          python -m pip install --disable-pip-version-check --no-input pytest ruff
          ruff check scripts/security_scan_config.py backend/tests/test_security_scan_config.py
          python -m compileall -q scripts/security_scan_config.py backend/tests/test_security_scan_config.py
          pytest -q backend/tests/test_security_scan_config.py

      - name: Scan configuration and infrastructure
        run: |
          mkdir -p security-audit/ci
          python3 scripts/security_scan_config.py . \
            --fail-on HIGH \
            --json security-audit/ci/security-config-findings.json

      - name: Upload redacted findings on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-config-findings
          path: security-audit/ci/security-config-findings.json
          if-no-files-found: ignore
          retention-days: 7
