name: Formatting Check

on:
  push:
    branches: [main, 'release/*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ruff-format:
    name: Ruff Format (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Check Python formatting
        run: ruff format --check backend/app/ shared/ scripts/ || echo "Formatting issues found — run 'ruff format backend/app/ shared/ scripts/' to fix"

  prettier:
    name: Prettier (TypeScript/JSON/MD)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: "24"
      - name: Check formatting with Prettier
        run: npx --yes prettier@3 --check "**/*.{ts,tsx,json,md}" --ignore-path .gitignore 2>/dev/null || echo "Formatting issues found — run 'npx prettier --write \"**/*.{ts,tsx,json,md}\"' to fix"
