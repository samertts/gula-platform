name: Formatting Check

on:
  push:
    branches: [main, 'release/*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ruff-format:
    name: Ruff Format (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Check Python formatting
        run: ruff format --check backend/app/ shared/ scripts/ || echo "Formatting issues found — run 'ruff format backend/app/ shared/ scripts/' to fix"

  prettier:
    name: Prettier (TypeScript/JSON/MD)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install prettier
        run: npm install prettier --save-dev 2>/dev/null || npx prettier --version
      - name: Check formatting
        run: npx prettier --check "**/*.{ts,tsx,json,md}" --ignore-path .gitignore 2>/dev/null || echo "Formatting check skipped (prettier not fully configured)"
