name: Foundation Gate

on:
  push:
    branches: [main, develop, 'release/*']
  pull_request:
    branches: [main, develop, 'release/*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation-ci:
    name: Foundation non-regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install quality-gate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install "ruff==0.16.2" "mypy==2.3.0" "pyyaml==6.0.3"

      - name: Enforce changed-files quality non-regression
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            QUALITY_BASE_REF="origin/$PR_BASE_REF"
            QUALITY_HEAD_REF="$PR_HEAD_SHA"
          else
            QUALITY_BASE_REF="$PUSH_BEFORE_SHA"
            QUALITY_HEAD_REF="$PUSH_HEAD_SHA"
          fi

          git rev-parse --verify "$QUALITY_BASE_REF^{commit}"
          git rev-parse --verify "$QUALITY_HEAD_REF^{commit}"
          export QUALITY_BASE_REF QUALITY_HEAD_REF
          python scripts/quality_changed_files_gate.py \
            --report foundation-quality-gate-report.json

      - name: Validate installed dependency graph
        run: python -m pip check

      - name: Validate Docker Compose configuration
        run: docker compose config -q

      - name: Upload foundation quality report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: foundation-quality-report-${{ github.run_id }}
          path: foundation-quality-gate-report.json
          if-no-files-found: warn

# Repository-wide architecture debt is intentionally audited by
# architecture-baseline-audit.yml rather than treated as a PR-blocking zero-debt
# requirement. The PR gate above rejects any new Ruff/MyPy diagnostics in changed
# files and critical clinical/security scopes; failures are never suppressed.
