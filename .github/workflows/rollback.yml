name: Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to rollback'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
      target:
        description: 'Deployment ID or alias to rollback to'
        required: false

jobs:
  rollback-vercel:
    name: Rollback Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Rollback Vercel Deployment
        uses: amondnet/vercel-action@6b1202dcb41104ea8b90a4211ed03e206bb5d4b9
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--rollback ${{ github.event.inputs.target }}'
