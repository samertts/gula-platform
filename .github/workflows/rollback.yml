name: Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to rollback'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
      target:
        description: 'Deployment ID or alias to rollback to'
        required: false

jobs:
  rollback-vercel:
    name: Rollback Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate rollback target
        id: validate-target
        env:
          ROLLBACK_TARGET: ${{ github.event.inputs.target }}
        shell: bash
        run: |
          if [ -z "$ROLLBACK_TARGET" ]; then
            echo "A deployment target is required." >&2
            exit 2
          fi
          case "$ROLLBACK_TARGET" in
            *[!A-Za-z0-9._-]*) echo "Invalid rollback target." >&2; exit 2 ;;
          esac
          echo "target=$ROLLBACK_TARGET" >> "$GITHUB_OUTPUT"

      - name: Rollback Vercel Deployment
        uses: amondnet/vercel-action@16e87c0a08142b0d0d33b76aeaf20823c381b9b9
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--rollback ${{ steps.validate-target.outputs.target }}'
