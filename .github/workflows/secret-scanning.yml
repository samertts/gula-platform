name: Secret Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * 1" # Every Monday 06:00 UTC

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  detect-secrets:
    name: detect-secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.10"

      - name: Install detect-secrets
        run: pip install detect-secrets==1.5.0

      - name: Scan for secrets
        run: |
          cp .secrets.baseline /tmp/secrets-baseline-snapshot
          detect-secrets scan \
            --baseline .secrets.baseline \
            --exclude-files '.*\.env\.example$' \
            --exclude-files '.*test.*' \
            --exclude-files '.*tests.*' \
            --exclude-files 'node_modules/.*' \
            --exclude-files 'venv/.*' \
            --exclude-files '\.venv/.*' \
            --all-files

      - name: Check baseline freshness
        run: |
          echo "Checking if .secrets.baseline is current..."
          if ! diff -q /tmp/secrets-baseline-snapshot .secrets.baseline > /dev/null 2>&1; then
            echo "❌ .secrets.baseline is out of date."
            echo "   Run: detect-secrets scan --baseline .secrets.baseline --all-files"
            diff /tmp/secrets-baseline-snapshot .secrets.baseline
            exit 1
          fi
          echo "✅ Baseline is current"

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@833f6d7bf4250e5c2eb505b3f4c3b2f4c0b7c0b3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD: "false"
          GITLEAKS_ENABLE_COMMENTS: "true"

  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Generate Backend SBOM
        uses: cyclonedx/gh-python-generator@v2
        with:
          path: backend/
          output: sbom-backend.json

      - name: Generate Frontend SBOM
        uses: cyclonedx/gh-node-generate-bom@v2
        with:
          path: frontend-v3/
          output: sbom-frontend.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: sbom
          path: |
            sbom-backend.json
            sbom-frontend.json

  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: TruffleHog Scan
        uses: trufflesecurity/trufflehog@3e29b1df94f490704f12223a8351f67eb6e4e5a3
        with:
          extra_args: --only-verified --results=verified,unknown
