name: Secret Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * 1" # Every Monday 06:00 UTC

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  detect-secrets:
    name: detect-secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Scan for secrets
        run: |
          detect-secrets scan \
            --baseline .secrets.baseline \
            --exclude-files '.*\.env\.example$' \
            --exclude-files '.*test.*' \
            --exclude-files '.*tests.*' \
            --exclude-files 'node_modules/.*' \
            --exclude-files 'venv/.*' \
            --exclude-files '\.venv/.*' \
            --all-files

      - name: Check baseline freshness
        run: |
          echo "Checking if .secrets.baseline is current..."
          if git status --porcelain .secrets.baseline | grep -q .; then
            echo "❌ .secrets.baseline is out of date. Run: detect-secrets scan --baseline .secrets.baseline --all-files"
            exit 1
          fi
          echo "✅ Baseline is current"

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD: "false"
          GITLEAKS_ENABLE_COMMENTS: "true"

  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Backend SBOM
        uses: cyclonedx/gh-python-generator@v2
        with:
          path: backend/
          output: sbom-backend.json

      - name: Generate Frontend SBOM
        uses: cyclonedx/gh-node-generate-bom@v2
        with:
          path: frontend-v3/
          output: sbom-frontend.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom-backend.json
            sbom-frontend.json

  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Scan
        uses: trufflesecurity/trufflehog@v3
        with:
          extra_args: --only-verified --results=verified,unknown
