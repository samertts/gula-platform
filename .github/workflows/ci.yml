name: CI Pipeline

on:
  push:
    branches: [main, develop, staging, 'release/*']
  pull_request:
    branches: [main, develop, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep CI aligned with the Python version used by the Railway backend.
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  POSTGRES_VERSION: "17-alpine"
  REDIS_VERSION: "7-alpine"
  REGISTRY: ghcr.io
  IMAGE_OWNER: samertts

jobs:
  syntax-gate:
    name: Syntax Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Check Python syntax
        run: |
          python - <<'PYEOF'
          import pathlib
          import sys

          errors = []
          for p in sorted(pathlib.Path('backend/app').rglob('*.py')):
              if '__pycache__' in str(p):
                  continue
              try:
                  compile(p.read_text(), str(p), 'exec')
              except SyntaxError as e:
                  errors.append(f'{p}: {e}')
          if errors:
              for e in errors:
                  print(e)
              sys.exit(1)
          total = sum(1 for _ in pathlib.Path('backend/app').rglob('*.py'))
          print(f'OK: {total} Python files pass syntax check')
          PYEOF
      - name: Check service Python syntax
        run: |
          python - <<'PYEOF'
          import pathlib
          import sys

          errors = []
          for root in ['services', 'nhop-platform', 'edge_agent', 'shared']:
              base = pathlib.Path(root)
              if not base.exists():
                  continue
              for p in sorted(base.rglob('*.py')):
                  if '__pycache__' in str(p) or 'node_modules' in str(p):
                      continue
                  if p.stat().st_size == 0:
                      continue
                  try:
                      compile(p.read_text(), str(p), 'exec')
                  except SyntaxError as e:
                      errors.append(f'{p}: {e}')
          if errors:
              for e in errors:
                  print(e)
              sys.exit(1)
          print('OK: All service Python files pass syntax check')
          PYEOF
      - name: Lint with flake8
        run: |
          pip install flake8
          # Fail on syntax and functional Pyflakes errors, but do not block on
          # legacy package re-exports (F401) or dead locals (F841).
          flake8 backend/app/ --select=E9,F --ignore=F401,F841 --count

  data-preservation-gate:
    name: Data Preservation Gate
    runs-on: ubuntu-latest
    needs: [syntax-gate]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run Data Preservation Quality Gate
        run: |
          # Preserve the gate status explicitly: code 1 is a review warning,
          # while code 2 is the only merge-blocking preservation failure.
          set +e
          python scripts/data_preservation_gate.py --ci
          status=$?
          set -e
          # Exit code 2 = FAIL (merge blocked), 1 = WARNING, 0 = PASS
          if [ $status -eq 2 ]; then
            echo "❌ DATA_PRESERVATION_GATE: FAILED — Merge blocked"
            echo "   One or more Data Preservation Constitution rules violated."
            echo "   See output above for details."
            exit 1
          elif [ $status -eq 1 ]; then
            echo "⚠️  DATA_PRESERVATION_GATE: WARNING — Review before merging"
          else
            echo "✅ DATA_PRESERVATION_GATE: PASSED"
          fi

  migration-check:
    name: Migration Check
    runs-on: ubuntu-latest
    needs: [syntax-gate]
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gula_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install alembic psycopg2-binary
      - name: Test migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gula_test
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: |
          cd backend
          alembic upgrade head
          python - <<'PYEOF'
          import os
          import psycopg2

          conn = psycopg2.connect(os.environ['DATABASE_URL'])
          try:
              with conn.cursor() as cur:
                  required = ['labs', 'lab_users', 'patients', 'lab_orders', 'lab_results']
                  for table in required:
                      cur.execute(
                          "SELECT EXISTS (SELECT FROM information_schema.tables WHERE table_name=%s)",
                          (table,),
                      )
                      exists = cur.fetchone()[0]
                      assert exists, f'Missing table: {table}'
                      print(f'Table {table}: OK')
                  print('All required tables verified')
          finally:
              conn.close()
          PYEOF
          alembic downgrade -1 || echo "Downgrade not possible (base migration)"
          alembic upgrade head
          echo "Migration round-trip: OK"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [syntax-gate]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check backend/app/ --select=E9,F --ignore=F401,F841 --statistics
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend-v3/package-lock.json
      - name: Install Node deps (frontend-v3)
        run: npm ci
        working-directory: frontend-v3
      - name: ESLint (frontend-v3)
        run: npm run lint
        working-directory: frontend-v3
      - name: TypeScript check (frontend-v3)
        run: npx tsc --noEmit
        working-directory: frontend-v3
      - name: Build (frontend-v3)
        run: npm run build
        working-directory: frontend-v3

  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [syntax-gate]
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gula_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: |
          cd backend
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest pytest-asyncio pytest-timeout factory_boy
      - name: Generate ephemeral test secrets
        id: test_secrets
        shell: bash
        run: |
          set -euo pipefail
          echo "secret_key=$(openssl rand -hex 32)" >> "$GITHUB_OUTPUT"
          echo "encryption_key=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_OUTPUT"
          echo "nid_hmac_key=$(openssl rand -hex 32)" >> "$GITHUB_OUTPUT"
          echo "refresh_token_secret=$(openssl rand -hex 32)" >> "$GITHUB_OUTPUT"
          echo "device_hmac_key=$(openssl rand -hex 32)" >> "$GITHUB_OUTPUT"
      - name: Apply migrations to test database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gula_test
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: |
          cd backend
          alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gula_test
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gula_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ${{ steps.test_secrets.outputs.secret_key }}
          ENCRYPTION_KEY: ${{ steps.test_secrets.outputs.encryption_key }}
          NID_HMAC_KEY: ${{ steps.test_secrets.outputs.nid_hmac_key }}
          REFRESH_TOKEN_SECRET: ${{ steps.test_secrets.outputs.refresh_token_secret }}
          DEVICE_HMAC_KEY: ${{ steps.test_secrets.outputs.device_hmac_key }}
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: |
          cd backend
          python -m pytest tests/ -v --timeout=60 -x 2>&1

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [syntax-gate]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Repository source guard
        run: python3 scripts/security/check_public_secrets.py
      - name: Client transport security guard
        run: python3 scripts/security/check_client_transport.py
      - name: Install safety
        run: pip install safety
      - name: Safety check
        run: |
          cd backend
          safety check -r requirements.txt --full-report
      - name: Bandit check
        run: |
          pip install bandit
          # Block high-severity findings with medium-or-higher confidence.
          # Lower-severity legacy findings remain visible in local security reports.
          bandit -lll -ii -r backend/app/ -f txt
