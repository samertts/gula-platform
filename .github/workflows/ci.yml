name: CI - Build, Test & Security Scan

on:
  push:
    branches: [main, develop, "claude/**"]
  pull_request:
    branches: [main, develop]

jobs:
  # ─── Backend Tests ──────────────────────────────────────────────────────────
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:14.11-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: labdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://postgres:test_password@localhost:5432/labdb
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-only-not-used-in-prod
          REFRESH_TOKEN_SECRET: test-refresh-secret-for-ci-only-not-used-in-prod
          ENCRYPTION_KEY: "6TJUTgJxBREYK9_yDy6VMXBw1HPwwxv1kiynV0WaAdw="
          ENV: test
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

  # ─── Security Scanning ─────────────────────────────────────────────────────
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: |
          pip install safety bandit

      - name: Check Python dependencies for known CVEs
        run: |
          safety check -r backend/requirements.txt --output text
        continue-on-error: true

      - name: Run Bandit SAST (fail on HIGH/CRITICAL severity)
        run: |
          bandit -r backend/app/ -f json -o bandit-report.json -ll -ii
        continue-on-error: false

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30

      - name: Scan Dockerfiles with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: error
        continue-on-error: true

      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true

      - name: Verify no /tmp password files
        run: |
          echo "Checking for insecure /tmp file writes..."
          if grep -r '/tmp/' backend/app/ --include="*.py" | grep -v '#' | grep -v 'nginx_cache'; then
            echo "⚠ Found /tmp writes in backend code - review required"
            exit 1
          else
            echo "✓ No insecure /tmp writes found"
          fi

      - name: Verify no /tmp password files
        run: |
          echo "Checking for insecure /tmp file writes..."
          if grep -r '/tmp/' backend/app/ --include="*.py" | grep -v '#' | grep -v 'nginx_cache'; then
            echo "⚠ Found /tmp writes in backend code - review required"
            exit 1
          else
            echo "✓ No insecure /tmp writes found"
          fi

  # ─── Docker Build & Container Security Scan ────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          load: true
          tags: gula-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan backend image with Trivy (fail on CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: gula-backend:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Verify container runs as non-root
        run: |
          USER=$(docker run --rm --entrypoint whoami gula-backend:ci 2>/dev/null || echo "unknown")
          echo "Container user: $USER"
          if [ "$USER" = "root" ]; then
            echo "SECURITY FAIL: Container is running as root!"
            exit 1
          fi
          echo "✓ Container runs as non-root user: $USER"
