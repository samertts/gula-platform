name: CI Pipeline

on:
  push:
    branches: [main, 'release/*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep CI aligned with the Python version used by the Railway backend.
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  POSTGRES_VERSION: "17-alpine"
  REDIS_VERSION: "7-alpine"
  REGISTRY: ghcr.io
  IMAGE_OWNER: samertts

jobs:
  syntax-gate:
    name: Syntax Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Check Python syntax
        run: |
          python -c "
          import pathlib, sys
          errors = []
          for p in sorted(pathlib.Path('backend/app').rglob('*.py')):
              if '__pycache__' in str(p): continue
              try:
                  compile(p.read_text(), str(p), 'exec')
              except SyntaxError as e:
                  errors.append(f'{p}: {e}')
          if errors:
              for e in errors: print(e)
              sys.exit(1)
          else:
              total = sum(1 for _ in pathlib.Path('backend/app').rglob('*.py'))
              print(f'OK: {total} Python files pass syntax check')
          "
      - name: Check service Python syntax
        run: |
          python -c "
          import pathlib, sys
          errors = []
          for root in ['services', 'nhop-platform', 'edge_agent', 'shared']:
              base = pathlib.Path(root)
              if not base.exists(): continue
              for p in sorted(base.rglob('*.py')):
                  if '__pycache__' in str(p): continue
                  if 'node_modules' in str(p): continue
                  if p.stat().st_size == 0: continue
                  try:
                      compile(p.read_text(), str(p), 'exec')
                  except SyntaxError as e:
                      errors.append(f'{p}: {e}')
          if errors:
              for e in errors: print(e)
              sys.exit(1)
          else:
              print('OK: All service Python files pass syntax check')
          "
      - name: Lint with flake8
        run: |
          pip install flake8
          # Fail on syntax and functional Pyflakes errors, but do not block on
          # legacy package re-exports (F401) or dead locals (F841).
          flake8 backend/app/ --select=E9,F --ignore=F401,F841 --count

  data-preservation-gate:
    name: Data Preservation Gate
    runs-on: ubuntu-latest
    needs: [syntax-gate]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run Data Preservation Quality Gate
        run: |
          # Preserve the gate status explicitly: code 1 is a review warning,
          # while code 2 is the only merge-blocking preservation failure.
          set +e
          python scripts/data_preservation_gate.py --ci
          status=$?
          set -e
          # Exit code 2 = FAIL (merge blocked), 1 = WARNING, 0 = PASS
          if [ $status -eq 2 ]; then
            echo "❌ DATA_PRESERVATION_GATE: FAILED — Merge blocked"
            echo "   One or more Data Preservation Constitution rules violated."
            echo "   See output above for details."
            exit 1
          elif [ $status -eq 1 ]; then
            echo "⚠️  DATA_PRESERVATION_GATE: WARNING — Review before merging"
          else
            echo "✅ DATA_PRESERVATION_GATE: PASSED"
          fi

  migration-check:
    name: Migration Check
    runs-on: ubuntu-latest
    needs: [syntax-gate]
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gula_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install alembic psycopg2-binary
      - name: Test migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gula_test
        run: |
          cd backend
          alembic upgrade head
          python -c "
          import os, psycopg2
          conn = psycopg2.connect(os.environ['DATABASE_URL'])
          cur = conn.cursor()
          required = ['labs', 'lab_users', 'patients', 'lab_orders', 'lab_results']
          for table in required:
              cur.execute("SELECT EXISTS (SELECT FROM information_schema.tables WHERE table_name=%s)", (table,))
              exists = cur.fetchone()[0]
              assert exists, f'Missing table: {table}'
              print(f'Table {table}: OK')
          print('All required tables verified')
          "
          alembic downgrade -1 || echo "Downgrade not possible (base migration)"
          alembic upgrade head
          echo "Migration round-trip: OK"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [syntax-gate]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check backend/app/ --select=E9,F --ignore=F401,F841 --statistics
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend-v3/package-lock.json
      - name: Install Node deps (frontend-v3)
        run: npm ci
        working-directory: frontend-v3
      - name: ESLint (frontend-v3)
        run: npm run lint
        working-directory: frontend-v3
      - name: TypeScript check (frontend-v3)
        run: npx tsc --noEmit
        working-directory: frontend-v3
      - name: Build (frontend-v3)
        run: npm run build
        working-directory: frontend-v3

  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [syntax-gate]
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gula_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio factory_boy
      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gula_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-12345678
          # Deterministic 32-byte test material encoded for Fernet; never used in production.
          ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          NID_HMAC_KEY: test-nid-hmac-key-for-ci-12345678
          REFRESH_TOKEN_SECRET: test-refresh-token-secret-for-ci
          DEVICE_HMAC_KEY: test-device-hmac-key-for-ci-1234
        run: |
          cd backend
          python -m pytest tests/ -v --timeout=60 -x 2>&1

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [syntax-gate]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install safety
        run: pip install safety
      - name: Safety check
        run: |
          cd backend
          safety check -r requirements.txt --full-report
      - name: Bandit check
        run: |
          pip install bandit
          bandit -ll -ii -r backend/app/ -f txt
