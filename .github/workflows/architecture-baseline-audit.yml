name: Architecture Baseline Audit

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-baseline-audit:
    name: Repository-wide architecture baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install architecture-audit dependency
        run: python -m pip install "pyyaml==6.0.3"

      - name: Audit repository-wide architecture baseline
        run: python scripts/architecture_compliance_engine.py --json > architecture-baseline-report.json

      - name: Upload architecture baseline report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: architecture-baseline-report-${{ github.run_id }}
          path: architecture-baseline-report.json
          if-no-files-found: warn

# This workflow deliberately fails visibly until the historical architecture
# baseline is remediated. It is separated from pull-request gating so historical
# debt cannot make unrelated, safe clinical fixes impossible to merge.
