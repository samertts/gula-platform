name: Frontend - PWA Build & Deploy

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend-v2/**'
      - 'frontend-v3/**'
      - '.github/workflows/frontend-pwa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend-v2/**'
      - 'frontend-v3/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy environment'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
      run_lighthouse:
        description: 'Run Lighthouse CI audit'
        required: false
        default: true
        type: boolean

env:
  NODE_VERSION: '24'
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PWA_PROJECT_ID }}

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  build:
    name: Build PWA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend-v3

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend-v3/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend-v3/node_modules
          key: node-modules-${{ hashFiles('frontend-v3/package-lock.json') }}
          restore-keys: |
            node-modules-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Verify browser bundle does not reference server secrets
        run: |
          if rg -n --hidden --glob '!node_modules' 'VITE_(GEMINI|OPENAI|ANTHROPIC|GROQ|.*_SECRET|.*_PRIVATE_KEY|.*_TOKEN)' src; then
            echo 'A server-side secret-like VITE variable is referenced by browser code.' >&2
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --run

      - name: Build PWA
        run: npm run build
        env:
          CI: true
          VITE_API_BASE_URL: /api
          VITE_WS_URL: wss://api.gula-platform.org
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pwa-build
          path: frontend-v3/dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload source maps
        uses: actions/upload-artifact@v4
        with:
          name: pwa-source-maps
          path: frontend-v3/dist/assets/*.map
          if-no-files-found: warn
          retention-days: 3

  lighthouse:
    name: Lighthouse CI Audit
    needs: [build]
    if: github.event_name == 'pull_request' || github.event.inputs.run_lighthouse == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend-v3

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: pwa-build
          path: frontend-v3/dist/

      - name: Run Lighthouse CI
        uses: GoogleChrome/lighthouse-ci-action@v12
        with:
          configPath: frontend-v3/lighthouserc.json
          temporaryPublicStorage: true
          uploadArtifacts: true
          runs: 3

  deploy-vercel-preview:
    name: Deploy Preview to Vercel
    needs: [build]
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: pwa-build
          path: frontend-v3/dist/

      - name: Deploy to Vercel (Preview)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --token=$VERCEL_TOKEN > vercel-url.txt
          echo "VERCEL_URL=$(cat vercel-url.txt)" >> $GITHUB_ENV

      - name: Write preview deployment summary
        run: |
          {
            echo "## Preview deployment"
            echo
            echo "URL: ${VERCEL_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-vercel-production:
    name: Deploy Production to Vercel
    needs: [build]
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: pwa-build
          path: frontend-v3/dist/

      - name: Deploy to Vercel (Production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel deploy --prod --prebuilt --token=$VERCEL_TOKEN

      - name: Upload source maps to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: gula-platform
          SENTRY_PROJECT: frontend-pwa
        run: |
          npx @sentry/cli releases new ${{ github.ref_name }}
          npx @sentry/cli releases files ${{ github.ref_name }} upload-sourcemaps frontend-v3/dist/assets/
          npx @sentry/cli releases set-commits ${{ github.ref_name }} --auto
          npx @sentry/cli releases finalize ${{ github.ref_name }}
