# Sentry Configuration for GULA Platform Mobile Apps
# This file configures the Sentry SDK for error tracking and crash reporting.

# Default properties - override via environment variables or build configuration
defaults.url=https://sentry.io/
defaults.org=gula-platform

# Android Project
android.defaults.project=android
android.defaults.dsn=https://xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx@sentry.io/xxxxxx

# iOS Project
ios.defaults.project=ios
ios.defaults.dsn=https://xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx@sentry.io/xxxxxx

# Flutter Desktop Project
flutter.defaults.project=flutter-desktop
flutter.defaults.dsn=https://xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx@sentry.io/xxxxxx

# Common Settings
http.proxy=
http.keepalive=true
http.connect-timeout=5000
http.read-timeout=5000

# Release Management
release=$VERSION
dist=$BUILD_NUMBER
environment=$ENVIRONMENT

# Upload Options
upload.sourcemaps=true
upload.symbols=true
upload.proguard=true
upload.dsyms=true

# CLI Authentication
auth.token=$SENTRY_AUTH_TOKEN

# Android ProGuard/R8 mapping file upload
android.upload.mapping=true
android.mapping.path=app/build/outputs/mapping/release/mapping.txt

# iOS dSYM upload
ios.dsym.path=*.dSYM.zip
ios.dsym.searchPaths=build/

# Flutter symbol upload
flutter.symbol.path=build/

# Sampling
traces-sample-rate=0.2
profiles-sample-rate=0.1

# Performance
enable-tracing=true
attach-stacktrace=true
normalize-depth=10
max-breadcrumbs=100

# User Feedback
attach-screenshot=false
enabled=true
debug=false
diagnostics-level=info
