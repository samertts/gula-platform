<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d47a1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#002171;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e676;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00c853;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Rounded rect for iOS icon mask -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- Microscope -->
  <g transform="translate(512,540)">
    <rect x="-120" y="120" width="240" height="40" rx="12" fill="url(#accent)" opacity="0.9"/>
    <rect x="-30" y="-180" width="60" height="300" rx="10" fill="#e8eaf6" opacity="0.95"/>
    <rect x="-50" y="-220" width="150" height="60" rx="12" fill="#e8eaf6" opacity="0.95"/>
    <rect x="-30" y="-270" width="110" height="60" rx="10" fill="#e8eaf6" opacity="0.85"/>
    <rect x="-100" y="10" width="200" height="20" rx="6" fill="#e8eaf6" opacity="0.9"/>
    <rect x="-45" y="-60" width="20" height="70" rx="6" fill="#aed581" opacity="0.9"/>
    <rect x="-10" y="-55" width="20" height="65" rx="6" fill="#aed581" opacity="0.85"/>
    <rect x="25" y="-50" width="20" height="60" rx="6" fill="#aed581" opacity="0.8"/>
  </g>
  <!-- DNA helix -->
  <g transform="translate(780,180)" opacity="0.7">
    <path d="M0,0 C30,-25 -30,-55 0,-80 C30,-55 -30,-25 0,0" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <path d="M0,-80 C30,-105 -30,-135 0,-160 C30,-135 -30,-105 0,-80" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <circle cx="0" cy="0" r="6" fill="#00e676"/>
    <circle cx="0" cy="-80" r="6" fill="#00e676"/>
    <circle cx="0" cy="-160" r="6" fill="#00e676"/>
    <circle cx="16" cy="-40" r="4" fill="#69f0ae"/>
    <circle cx="-16" cy="-120" r="4" fill="#69f0ae"/>
  </g>
  <!-- Healthcare cross -->
  <g transform="translate(240,180)">
    <rect x="-10" y="-35" width="20" height="70" rx="4" fill="#ff5252" opacity="0.85"/>
    <rect x="-35" y="-10" width="70" height="20" rx="4" fill="#ff5252" opacity="0.85"/>
  </g>
  <!-- Title -->
  <g transform="translate(512,890)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="18">GULA</text>
  </g>
</svg>
