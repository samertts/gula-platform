<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d47a1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#002171;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e676;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00c853;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bg)" stroke="#1a73e8" stroke-width="8"/>
  <!-- Microscope body -->
  <g transform="translate(256,280)">
    <!-- Base -->
    <rect x="-80" y="80" width="160" height="30" rx="8" fill="url(#accent)" opacity="0.9"/>
    <!-- Arm -->
    <rect x="-20" y="-120" width="40" height="200" rx="6" fill="#e8eaf6" opacity="0.95"/>
    <!-- Head -->
    <rect x="-30" y="-140" width="100" height="40" rx="8" fill="#e8eaf6" opacity="0.95"/>
    <!-- Eyepiece -->
    <rect x="-15" y="-175" width="70" height="40" rx="6" fill="#e8eaf6" opacity="0.85"/>
    <!-- Stage -->
    <rect x="-70" y="10" width="140" height="12" rx="4" fill="#e8eaf6" opacity="0.9"/>
    <!-- Objective lenses -->
    <rect x="-30" y="-40" width="14" height="50" rx="4" fill="#aed581" opacity="0.9"/>
    <rect x="-6" y="-35" width="14" height="45" rx="4" fill="#aed581" opacity="0.85"/>
    <rect x="18" y="-30" width="14" height="40" rx="4" fill="#aed581" opacity="0.8"/>
  </g>
  <!-- DNA helix decoration -->
  <g transform="translate(380,100)" opacity="0.8">
    <path d="M0,0 C20,-15 -20,-35 0,-50 C20,-35 -20,-15 0,0" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <path d="M0,-50 C20,-65 -20,-85 0,-100 C20,-85 -20,-65 0,-50" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="0" cy="0" r="4" fill="#00e676"/>
    <circle cx="0" cy="-50" r="4" fill="#00e676"/>
    <circle cx="0" cy="-100" r="4" fill="#00e676"/>
    <circle cx="10" cy="-25" r="3" fill="#69f0ae"/>
    <circle cx="-10" cy="-75" r="3" fill="#69f0ae"/>
  </g>
  <!-- GULA text -->
  <g transform="translate(256,420)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="12">GULA</text>
  </g>
  <!-- Plus/cross symbol for healthcare -->
  <g transform="translate(140,110)">
    <rect x="-6" y="-22" width="12" height="44" rx="2" fill="#ff5252" opacity="0.9"/>
    <rect x="-22" y="-6" width="44" height="12" rx="2" fill="#ff5252" opacity="0.9"/>
  </g>
</svg>
