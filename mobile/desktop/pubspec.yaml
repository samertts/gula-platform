name: gula_desktop
description: GULA Platform Desktop Application — Medical Laboratory LIMS for Windows, Linux, macOS.
version: 2.1.0
homepage: https://github.com/samertts/gula-platform
repository: https://github.com/samertts/gula-platform
publish_to: 'none'

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # HTTP & API
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.4

  # Local Database
  drift: ^2.26.0
  sqlite3_flutter_libs: ^0.5.17
  sqlite3: ^2.1.0
  path_provider: ^2.1.5
  path: ^1.8.3

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Auth & Security
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  crypto: ^3.0.6
  pointycastle: ^3.9.1

  # Desktop
  window_manager: ^0.4.3
  system_tray: ^2.0.5
  local_notifier: ^0.1.6
  auto_updater: ^0.1.0
  launch_at_startup: ^0.2.2
  tray_manager: ^0.2.1

  # Printing
  printing: ^5.14.2
  esc_pos_bluetooth: ^2.1.1
  esc_pos_utils: ^1.1.0
  flutter_blue_plus: ^1.35.4
  bluetooth_low_energy: ^5.0.0

  # PDF
  pdf: ^3.11.2

  # Barcode
  barcode: ^2.3.0
  barcode_widget: ^2.0.4
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0

  # UI
  google_fonts: ^6.2.1
  flex_color_scheme: ^8.1.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.16
  cached_network_image: ^3.4.1
  animations: ^2.0.8
  flutter_animate: ^4.5.2

  # Charts
  fl_chart: ^0.70.2

  # Tables
  pluto_grid: ^8.0.2

  # Calendar
  table_calendar: ^3.0.9

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  logger: ^2.5.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  open_file: ^3.3.2
  file_picker: ^8.3.7
  permission_handler: ^11.3.1
  package_info_plus: ^8.1.5
  collection: ^1.19.1
  meta: ^1.9.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.7

  # Push Notifications
  flutter_local_notifications: ^18.0.1

  # Crash Reporting
  sentry_flutter: ^8.13.0

  # Localization
  flutter_oss_licenses: ^2.0.2

  # Context
  universal_platform: ^1.0.1

  # Device Info
  device_info_plus: ^11.3.3

  # QR
  qr: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.4.7
  drift_dev: ^2.26.0
  json_serializable: ^6.9.4
  freezed: ^2.5.7
  riverpod_generator: ^2.6.3
  riverpod_annotation: ^2.6.1
  mockito: ^5.4.6
  mocktail: ^1.0.4
  flutter_lints: ^5.0.0
  test: ^1.25.15

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
