<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>GULA — نتائجي</title>
<link rel="manifest" href="/manifest.json">
<style>
/* ── Reset & Tokens ─────────────────────────────────────────────────────── */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0e1a; --surface:#111827; --surface2:#1a2235; --surface3:#1e2a3d;
  --primary:#2563eb; --accent:#3b82f6;
  --text:#f1f5f9; --text-sub:#94a3b8; --text-dim:#475569;
  --border:#1e2d45;
  --green:#16a34a; --green-bg:rgba(22,163,74,.12); --green-fg:#4ade80;
  --amber:#d97706; --amber-bg:rgba(217,119,6,.12); --amber-fg:#fbbf24;
  --red:#dc2626;   --red-bg:rgba(220,38,38,.15);   --red-fg:#f87171;
  --radius:16px; --radius-sm:12px;
  --shadow:0 4px 24px rgba(0,0,0,.4);
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:16px;line-height:1.6}

/* ── Top bar ─────────────────────────────────────────────────────────────── */
.topbar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:14px 20px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{
  width:38px;height:38px;border-radius:10px;
  background:linear-gradient(145deg,#1a3a8f,#2563eb);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.logo-icon svg{width:20px;height:20px;fill:#fff}
.logo-name{font-size:1.1rem;font-weight:800;letter-spacing:-.02em}
.btn-logout{
  padding:8px 16px;border-radius:8px;font-size:.82rem;font-weight:600;
  cursor:pointer;border:1px solid var(--border);background:none;color:var(--text-sub);
  font-family:var(--font);transition:all .18s;min-height:38px;
}
.btn-logout:hover{border-color:var(--red);color:var(--red)}

/* ── Page body ───────────────────────────────────────────────────────────── */
.page{max-width:600px;margin:0 auto;padding:24px 16px 80px}

/* ── Greeting ────────────────────────────────────────────────────────────── */
.greeting{margin-bottom:24px}
.greeting-name{font-size:1.5rem;font-weight:800;margin-bottom:4px}
.greeting-sub{font-size:.9rem;color:var(--text-sub)}

/* ── Summary strip ───────────────────────────────────────────────────────── */
.summary{display:flex;gap:10px;margin-bottom:24px}
.sum-chip{
  flex:1;padding:12px 10px;border-radius:var(--radius-sm);text-align:center;
  border:1px solid var(--border);background:var(--surface);
}
.sum-n{font-size:1.4rem;font-weight:800;line-height:1}
.sum-l{font-size:.72rem;color:var(--text-sub);margin-top:4px;font-weight:600}
.sum-normal .sum-n{color:var(--green-fg)}
.sum-warning .sum-n{color:var(--amber-fg)}
.sum-critical .sum-n{color:var(--red-fg)}

/* ── Section label ────────────────────────────────────────────────────────── */
.section-label{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-dim);margin-bottom:14px}

/* ── Result card ─────────────────────────────────────────────────────────── */
.r-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);margin-bottom:14px;overflow:hidden;
}
.r-card-head{
  display:flex;align-items:center;gap:12px;
  padding:16px 18px;border-bottom:1px solid var(--border);
}
.r-status-dot{
  width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:2px;
}
.dot-normal{background:var(--green-fg)}
.dot-warning{background:var(--amber-fg);animation:pulse-dot 2s infinite}
.dot-critical{background:var(--red-fg);animation:pulse-dot 1s infinite}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(1.3)}}
.r-test-name{font-size:1rem;font-weight:700;flex:1}
.r-badge{
  font-size:.74rem;font-weight:700;padding:4px 10px;border-radius:20px;flex-shrink:0;
}
.badge-normal{background:var(--green-bg);color:var(--green-fg);border:1px solid rgba(74,222,128,.2)}
.badge-warning{background:var(--amber-bg);color:var(--amber-fg);border:1px solid rgba(251,191,36,.2)}
.badge-critical{background:var(--red-bg);color:var(--red-fg);border:1px solid rgba(248,113,113,.2)}

.r-body{padding:16px 18px}
.r-value-row{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:10px}
.r-value{font-size:2rem;font-weight:800;font-family:monospace;direction:ltr;letter-spacing:-.03em}
.r-unit{font-size:.85rem;color:var(--text-sub);margin-right:4px;margin-bottom:4px}
.r-range{font-size:.78rem;color:var(--text-dim);direction:ltr}
.r-meta{font-size:.78rem;color:var(--text-sub);margin-bottom:14px}

/* Progress bar showing deviation */
.r-bar-wrap{background:var(--surface2);border-radius:4px;height:6px;margin-bottom:14px;position:relative;overflow:visible}
.r-bar-fill{height:100%;border-radius:4px;position:relative;transition:width .4s ease}
.r-bar-marker{
  position:absolute;right:-1px;top:-3px;width:12px;height:12px;
  border-radius:50%;border:2px solid var(--bg);transform:translateX(50%);
}

/* Actions */
.r-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn-explain{
  flex:1;min-width:140px;padding:12px 16px;border-radius:var(--radius-sm);
  font-size:.88rem;font-weight:700;cursor:pointer;border:none;
  background:var(--primary);color:#fff;font-family:var(--font);
  transition:background .18s;min-height:46px;
}
.btn-explain:hover{background:var(--accent)}
.btn-explain:disabled{background:var(--surface3);color:var(--text-sub);cursor:default}
.btn-report{
  padding:12px 16px;border-radius:var(--radius-sm);
  font-size:.88rem;font-weight:600;cursor:pointer;
  border:1px solid var(--border);background:var(--surface2);color:var(--text-sub);
  font-family:var(--font);transition:all .18s;min-height:46px;text-decoration:none;
  display:inline-flex;align-items:center;gap:6px;
}
.btn-report:hover{border-color:var(--accent);color:var(--accent)}

/* ── AI section (inside card) ────────────────────────────────────────────── */
.ai-box{
  margin-top:14px;padding:14px;background:var(--surface2);
  border-radius:var(--radius-sm);border:1px solid var(--border);
  display:none;
}
.ai-header{
  font-size:.75rem;font-weight:700;color:var(--accent);
  margin-bottom:10px;display:flex;align-items:center;gap:6px;
}
.ai-header span{color:var(--text-dim);margin-right:auto;font-weight:400}
.ai-critical-banner{
  padding:10px 12px;background:var(--red-bg);border:1px solid rgba(220,38,38,.3);
  border-radius:8px;color:var(--red-fg);font-size:.84rem;font-weight:700;
  margin-bottom:10px;display:none;
}
.ai-action-box{
  padding:10px 12px;border-radius:8px;font-size:.85rem;font-weight:700;
  margin-bottom:10px;display:none;
}
.ai-text{font-size:.88rem;color:var(--text);line-height:1.85;white-space:pre-wrap}
.ai-confidence{margin-top:10px;font-size:.72rem;color:var(--text-dim);display:none}

/* ── Skeleton ────────────────────────────────────────────────────────────── */
@keyframes shimmer{
  0%{background-position:200% 0}
  100%{background-position:-200% 0}
}
.skel{
  background:linear-gradient(90deg,var(--surface2) 25%,var(--surface3) 50%,var(--surface2) 75%);
  background-size:200% 100%;
  animation:shimmer 1.4s ease infinite;
  border-radius:8px;
}
.skel-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px 18px;margin-bottom:14px;
}
.skel-line{height:14px;margin-bottom:10px}
.skel-line.w-60{width:60%}
.skel-line.w-40{width:40%}
.skel-line.w-80{width:80%}
.skel-val{height:40px;width:120px;border-radius:8px;margin-bottom:14px}
.skel-btn{height:46px;border-radius:var(--radius-sm)}

/* ── Empty & Error ───────────────────────────────────────────────────────── */
.state-box{text-align:center;padding:56px 20px;color:var(--text-sub)}
.state-icon{font-size:3.5rem;margin-bottom:16px;display:block;opacity:.6}
.state-title{font-size:1.1rem;font-weight:700;color:var(--text);margin-bottom:8px}
.state-msg{font-size:.88rem;line-height:1.6;margin-bottom:20px}
.btn-retry{
  padding:12px 28px;border-radius:var(--radius-sm);font-size:.9rem;font-weight:700;
  cursor:pointer;border:1px solid var(--primary);background:var(--primary);color:#fff;
  font-family:var(--font);transition:background .18s;min-height:46px;
}
.btn-retry:hover{background:var(--accent)}

/* ── History (collapsible) ───────────────────────────────────────────────── */
.history-toggle{
  width:100%;padding:14px 18px;text-align:center;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  font-size:.85rem;font-weight:600;color:var(--text-sub);cursor:pointer;
  font-family:var(--font);transition:all .18s;margin-bottom:14px;min-height:46px;
}
.history-toggle:hover{border-color:var(--accent);color:var(--accent)}
.history-list{display:none}
.h-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 18px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);margin-bottom:8px;
}
.h-date{font-size:.82rem;color:var(--text-sub)}
.h-status{font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:20px}

/* ── Toast ───────────────────────────────────────────────────────────────── */
.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;pointer-events:none}
.toast{
  padding:12px 24px;border-radius:24px;font-size:.88rem;font-weight:600;color:#fff;
  box-shadow:var(--shadow);white-space:nowrap;
}
.toast-ok{background:#16a34a}
.toast-err{background:#dc2626}
.toast-info{background:#2563eb}

/* ── Offline banner ──────────────────────────────────────────────────────── */
.offline-banner{
  display:none;align-items:center;gap:10px;
  background:#1c1a07;border:1px solid #ca8a04;border-radius:var(--radius-sm);
  padding:12px 16px;margin-bottom:16px;
  font-size:.84rem;color:#fde047;font-weight:600;
}

/* ── Trust badge ─────────────────────────────────────────────────────────── */
.trust-badge{
  font-size:.68rem;font-weight:600;color:var(--green-fg);opacity:.75;
  display:inline-flex;align-items:center;gap:4px;margin-top:3px;
}

/* ── Emotional message ───────────────────────────────────────────────────── */
.r-emotion{
  font-size:.83rem;padding:9px 12px;border-radius:8px;margin-bottom:12px;
  line-height:1.5;font-weight:500;
}
.emo-ok  {background:var(--green-bg);color:#bbf7d0;border:1px solid rgba(74,222,128,.15)}
.emo-warn{background:rgba(217,119,6,.08);color:#fde68a;border:1px solid rgba(217,119,6,.2)}
.emo-crit{background:rgba(220,38,38,.08);color:#fecaca;border:1px solid rgba(220,38,38,.2)}

/* ── Secondary action buttons ────────────────────────────────────────────── */
.r-actions-2{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn-act{
  padding:9px 14px;border-radius:var(--radius-sm);
  font-size:.8rem;font-weight:600;cursor:pointer;
  border:1px solid var(--border);background:var(--surface2);color:var(--text-sub);
  font-family:var(--font);transition:all .18s;min-height:40px;text-decoration:none;
  display:inline-flex;align-items:center;gap:6px;
}
.btn-act:hover{border-color:var(--accent);color:var(--accent)}

/* ── Low-end device & reduced-motion ─────────────────────────────────────── */
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
.low-end .skel{animation:none!important;background:var(--surface3)}
.low-end .dot-warning,.low-end .dot-critical{animation:none!important}
.low-end .r-bar-fill{transition:none!important}
</style>
</head>
<body>

<!-- Header -->
<header class="topbar">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.25 3.75 10.15 9 11.35C17.25 21.15 21 16.25 21 11V5l-9-4z"/></svg>
    </div>
    <span class="logo-name">GULA</span>
  </div>
  <button class="btn-logout" onclick="doLogout()">خروج</button>
</header>

<main class="page">
  <!-- Offline indicator -->
  <div class="offline-banner" id="offlineBanner">
    <span>📵</span>
    <span>أنت الآن بدون اتصال — يتم عرض آخر نتائج محفوظة</span>
  </div>

  <div class="greeting">
    <div class="greeting-name" id="gName">أهلاً بك</div>
    <div class="greeting-sub" id="gSub">يسعدنا أن نقدم لك نتائج تحاليلك بشكل واضح</div>
  </div>

  <!-- Summary chips -->
  <div class="summary" id="summaryStrip" style="display:none">
    <div class="sum-chip sum-normal">
      <div class="sum-n" id="sumNormal">0</div>
      <div class="sum-l">طبيعي</div>
    </div>
    <div class="sum-chip sum-warning">
      <div class="sum-n" id="sumWarning">0</div>
      <div class="sum-l">تحتاج متابعة</div>
    </div>
    <div class="sum-chip sum-critical">
      <div class="sum-n" id="sumCritical">0</div>
      <div class="sum-l">يستوجب مراجعة</div>
    </div>
  </div>

  <!-- Results -->
  <div class="section-label">نتائج آخر تحاليل</div>
  <div id="resultArea"></div>

  <!-- History -->
  <button class="history-toggle" id="historyBtn" style="display:none" onclick="toggleHistory()">
    عرض التحاليل السابقة ▾
  </button>
  <div class="history-list" id="historyList"></div>
</main>

<div class="toast-wrap" id="toastWrap"></div>

<script>
'use strict';
const API = '/api';
let citizen = null;
let aiCache = {};

/* ── Utilities ─────────────────────────────────────────────────────────── */
function esc(s){ return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
function toast(msg,type='info'){
  const w=document.getElementById('toastWrap');
  const t=document.createElement('div');
  t.className='toast toast-'+type;t.textContent=msg;w.appendChild(t);
  setTimeout(()=>t.remove(),3200);
}
function doLogout(){
  fetch(API+'/citizen/logout',{method:'POST',credentials:'include'}).catch(()=>{});
  sessionStorage.removeItem('citizen');
  location.replace('/citizen/login.html');
}
async function apiFetch(path,opts={}){
  const r=await fetch(API+path,{credentials:'include',...opts});
  if(r.status===401){doLogout();return null;}
  if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.detail||'خطأ '+r.status);}
  return r.json().catch(()=>null);
}

/* ── Severity helpers ──────────────────────────────────────────────────── */
function sevFrom(value,low,high){
  if(value==null)return'pending';
  const v=parseFloat(value),l=parseFloat(low),h=parseFloat(high);
  if(isNaN(v)||isNaN(l)||isNaN(h))return'normal';
  const span=h-l;
  if(l<=v&&v<=h)return'normal';
  const dev=(v<l?l-v:v-h)/span;
  return dev>=0.75?'critical':dev>=0.25?'warning':'abnormal';
}
const SEV_LABEL={'normal':'طبيعي','abnormal':'خارج المدى','warning':'يحتاج متابعة','critical':'يستوجب مراجعة فورية','pending':'في الانتظار'};
const SEV_BADGE={'normal':'badge-normal','abnormal':'badge-warning','warning':'badge-warning','critical':'badge-critical','pending':'badge-warning'};
const SEV_DOT  ={'normal':'dot-normal','abnormal':'dot-warning','warning':'dot-warning','critical':'dot-critical','pending':'dot-warning'};

/* Emotional reassurance text — reduces patient anxiety */
const SEV_EMOTION={
  normal:   {cls:'emo-ok',  msg:'✅ هذه النتيجة ضمن الحدود الطبيعية — لا داعي للقلق.'},
  abnormal: {cls:'emo-warn',msg:'لا داعي للقلق — هذه النتيجة تحتاج فقط لمتابعة بسيطة مع طبيبك.'},
  warning:  {cls:'emo-warn',msg:'لا داعي للقلق — هذه النتيجة تحتاج لمناقشتها مع طبيبك في أقرب وقت.'},
  critical: {cls:'emo-crit',msg:'هذه النتيجة تستوجب مراجعة طبيبك — يُنصح بالتواصل معه قريباً، ولا مبرر للهلع.'},
  pending:  {cls:'emo-warn',msg:'⏳ نتيجتك قيد التجهيز — ستظهر هنا بمجرد اكتمالها.'},
};

/* ── Deviation bar ─────────────────────────────────────────────────────── */
function deviationBar(value,low,high){
  if(value==null||low==null||high==null)return'';
  const v=parseFloat(value),l=parseFloat(low),h=parseFloat(high);
  if(isNaN(v)||isNaN(l)||isNaN(h))return'';
  const span=h-l;
  // Map value to a 0–100% bar (0=2× below low, 50=midpoint, 100=2× above high)
  const totalSpan=span*2;
  const pos=Math.max(0,Math.min(100,((v-(l-span/2))/totalSpan)*100));
  const normal_start=25,normal_end=75; // normal zone occupies middle 50%
  let color='var(--green-fg)';
  if(v<l||v>h)color=((v<l?(l-v):v-h)/span)>=0.75?'var(--red-fg)':'var(--amber-fg)';
  return `
  <div class="r-bar-wrap">
    <div style="position:absolute;right:${100-normal_end}%;left:${normal_start}%;top:0;bottom:0;background:var(--green-bg);border-radius:4px"></div>
    <div class="r-bar-fill" style="width:${pos}%;background:${color}"></div>
    <div class="r-bar-marker" style="right:${100-pos}%;background:${color}"></div>
  </div>`;
}

/* ── Skeleton ──────────────────────────────────────────────────────────── */
function renderSkeleton(){
  return [1,2,3].map(()=>`
  <div class="skel-card">
    <div class="skel skel-line w-60"></div>
    <div class="skel skel-val"></div>
    <div class="skel skel-line w-40"></div>
    <div class="skel skel-line w-80" style="margin-top:6px"></div>
    <div class="skel skel-btn" style="margin-top:14px"></div>
  </div>`).join('');
}

/* ── Error state ───────────────────────────────────────────────────────── */
function renderError(msg){
  return `
  <div class="state-box">
    <span class="state-icon">⚠️</span>
    <div class="state-title">تعذّر تحميل نتائجك</div>
    <div class="state-msg">${esc(msg)}</div>
    <button class="btn-retry" onclick="loadResults()">حاول مرة أخرى</button>
  </div>`;
}

/* ── Empty state ───────────────────────────────────────────────────────── */
function renderEmpty(){
  return `
  <div class="state-box">
    <span class="state-icon">🔬</span>
    <div class="state-title">لا توجد نتائج بعد</div>
    <div class="state-msg">بمجرد اكتمال تحاليلك سيظهر تقريرك هنا تلقائياً</div>
  </div>`;
}

/* ── AI explanation (per card) ─────────────────────────────────────────── */
async function explainResult(token, cardId){
  if(aiCache[token]){ showAI(cardId, aiCache[token]); return; }
  const btn=document.getElementById('exBtn_'+cardId);
  const box=document.getElementById('aiBox_'+cardId);
  const txt=document.getElementById('aiTxt_'+cardId);
  if(!btn||!box||!txt)return;
  btn.disabled=true;btn.textContent='⏳ جاري الشرح…';
  box.style.display='block';txt.textContent='';
  try{
    const r=await fetch(API+'/ai/interpret/'+encodeURIComponent(token));
    const d=await r.json();
    if(!r.ok){txt.textContent=d.detail||'تعذر الحصول على الشرح.';btn.textContent='اشرح لي النتيجة';btn.disabled=false;return;}
    aiCache[token]=d;
    showAI(cardId,d);
  }catch{
    txt.textContent='تعذر الاتصال. تحقق من الشبكة وحاول مجدداً.';
    btn.textContent='اشرح لي النتيجة';btn.disabled=false;
  }
}

function showAI(cardId, d){
  const btn=document.getElementById('exBtn_'+cardId);
  const critBanner=document.getElementById('aiCrit_'+cardId);
  const actionBox=document.getElementById('aiAct_'+cardId);
  const txt=document.getElementById('aiTxt_'+cardId);
  const conf=document.getElementById('aiConf_'+cardId);

  if(critBanner&&d.critical_flags&&d.critical_flags.length){
    critBanner.textContent='⚠️ تستوجب مراجعة فورية: '+d.critical_flags.join('، ');
    critBanner.style.display='block';
  }
  if(actionBox&&d.action_guidance){
    const ag=d.action_guidance;
    const s=ag.urgency==='immediate'?'background:var(--red-bg);color:var(--red-fg);border:1px solid rgba(220,38,38,.3)'
            :ag.urgency==='soon'    ?'background:var(--amber-bg);color:var(--amber-fg);border:1px solid rgba(217,119,6,.3)'
                                    :'background:var(--green-bg);color:var(--green-fg);border:1px solid rgba(22,163,74,.3)';
    actionBox.setAttribute('style','display:block;'+s+';padding:10px 12px;border-radius:8px;font-size:.85rem;font-weight:700;margin-bottom:10px');
    actionBox.textContent=ag.ar||'';
  }
  if(txt)txt.textContent=d.interpretation||'';
  if(conf&&d.confidence){
    const cl=d.confidence.level;
    conf.textContent=(cl==='high'?'🟢 ثقة عالية':cl==='medium'?'🟡 ثقة متوسطة':'🔴 ثقة منخفضة')
      +' ('+Math.round(d.confidence.score*100)+'%) — '+esc(d.provider);
    conf.style.display='block';
  }
  const sev=d.severity;
  if(btn)btn.textContent=(sev==='حرج'?'⚠️ حرج':sev==='تنبيه'?'🔔 تنبيه':'✅ طبيعي')+'  — تم الشرح';
}

/* ── Render result cards ───────────────────────────────────────────────── */
function renderResults(results){
  const area=document.getElementById('resultArea');
  if(!results.length){area.innerHTML=renderEmpty();return;}

  let nNorm=0,nWarn=0,nCrit=0;
  const html=results.map((r,i)=>{
    const sev=sevFrom(r.value,r.reference_low??r.normal_range_low,r.reference_high??r.normal_range_high);
    if(sev==='normal')nNorm++;else if(sev==='critical')nCrit++;else nWarn++;
    const cid='rc'+i;
    const token=r.result_token||r.token||'';
    const val=r.value!=null?r.value:'—';
    const unit=r.unit||'';
    const low=r.reference_low??r.normal_range_low;
    const high=r.reference_high??r.normal_range_high;
    const date=(r.collected_at||r.created_at||'').slice(0,10);
    const lab=r.lab_name||'';
    const labPhone=r.lab_phone||'';
    const hasAI=token.length>=10;
    const emo=SEV_EMOTION[sev]||SEV_EMOTION.abnormal;
    const reportUrl=token?'/r/'+encodeURIComponent(token):'';
    const waMsg=token?encodeURIComponent('نتائجي من '+esc(lab)+': https://'+location.host+reportUrl):'';
    return `
    <article class="r-card" id="${cid}">
      <div class="r-card-head">
        <span class="r-status-dot ${SEV_DOT[sev]||'dot-warning'}"></span>
        <div style="flex:1;min-width:0">
          <div class="r-test-name">${esc(r.test_name||r.name||'تحليل')}</div>
          ${lab?`<div class="trust-badge">✔ معتمد من ${esc(lab)}</div>`:''}
        </div>
        <span class="r-badge ${SEV_BADGE[sev]||'badge-warning'}">${SEV_LABEL[sev]||sev}</span>
      </div>
      <div class="r-body">
        <!-- Emotional reassurance -->
        <div class="r-emotion ${emo.cls}">${emo.msg}</div>

        <div class="r-value-row">
          <div>
            <span class="r-value" dir="ltr">${esc(String(val))}</span>
            <span class="r-unit">${esc(unit)}</span>
          </div>
          ${low!=null&&high!=null?`<div class="r-range" dir="ltr">${esc(String(low))} – ${esc(String(high))}</div>`:''}
        </div>
        ${deviationBar(r.value,low,high)}
        ${date?`<div class="r-meta">📅 ${date}</div>`:''}

        <!-- Primary actions -->
        <div class="r-actions">
          ${hasAI?`<button class="btn-explain" id="exBtn_${cid}" onclick="explainResult('${esc(token)}','${cid}')">🤖 اشرح لي النتيجة</button>`:''}
          ${reportUrl?`<a class="btn-report" href="${reportUrl}" target="_blank" rel="noopener">📄 التقرير</a>`:''}
        </div>

        <!-- Secondary actions -->
        <div class="r-actions-2">
          ${labPhone?`<a class="btn-act" href="tel:${esc(labPhone)}">📞 اتصل بالمختبر</a>`:''}
          ${reportUrl?`<a class="btn-act" href="https://wa.me/?text=${waMsg}" target="_blank" rel="noopener">📤 أرسل للطبيب</a>`:''}
          ${reportUrl?`<button class="btn-act" onclick="copyLink('${esc(reportUrl)}')">🔗 نسخ الرابط</button>`:''}
        </div>

        <!-- AI box (hidden until clicked) -->
        <div class="ai-box" id="aiBox_${cid}">
          <div class="ai-header">🤖 الشرح بالذكاء الاصطناعي <span>للتوعية فقط — ليس تشخيصاً</span></div>
          <div class="ai-critical-banner" id="aiCrit_${cid}"></div>
          <div id="aiAct_${cid}"></div>
          <div class="ai-text" id="aiTxt_${cid}"></div>
          <div class="ai-confidence" id="aiConf_${cid}"></div>
        </div>
      </div>
    </article>`;
  }).join('');

  area.innerHTML=html;

  // Summary strip
  document.getElementById('sumNormal').textContent=nNorm;
  document.getElementById('sumWarning').textContent=nWarn;
  document.getElementById('sumCritical').textContent=nCrit;
  document.getElementById('summaryStrip').style.display='flex';
}

/* ── Copy link helper ──────────────────────────────────────────────────── */
function copyLink(path){
  const url=location.origin+path;
  navigator.clipboard?.writeText(url).then(()=>toast('تم نسخ الرابط','ok')).catch(()=>{
    const inp=document.createElement('input');inp.value=url;document.body.appendChild(inp);
    inp.select();document.execCommand('copy');inp.remove();toast('تم نسخ الرابط','ok');
  });
}

/* ── Load results (with offline fallback) ─────────────────────────────── */
const CACHE_KEY='gula_results_cache';
async function loadResults(){
  const area=document.getElementById('resultArea');
  area.innerHTML=renderSkeleton();
  try{
    const data=await apiFetch('/citizen/results');
    const results=Array.isArray(data)?data:(data?.results||data||[]);
    try{localStorage.setItem(CACHE_KEY,JSON.stringify(results));}catch{}
    renderResults(results);
  }catch(e){
    // Offline or server error — try local cache
    try{
      const cached=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');
      if(cached&&cached.length){
        document.getElementById('offlineBanner').style.display='flex';
        renderResults(cached);
        return;
      }
    }catch{}
    area.innerHTML=renderError(e.message);
  }
}

/* ── Load orders (history) ─────────────────────────────────────────────── */
async function loadOrders(){
  try{
    const data=await apiFetch('/citizen/orders');
    const orders=data?.orders||data||[];
    if(!orders.length)return;
    document.getElementById('historyBtn').style.display='';
    const statusLabel={completed:'مكتمل',processing:'قيد التنفيذ',pending:'معلق',cancelled:'ملغي'};
    const statusCls={completed:'badge-normal',processing:'badge-warning',pending:'badge-warning',cancelled:'badge-warning'};
    document.getElementById('historyList').innerHTML=orders.map(o=>`
    <div class="h-item">
      <div>
        <div style="font-size:.88rem;font-weight:600">طلب #${esc(String(o.id||''))}</div>
        <div class="h-date">${(o.created_at||'').slice(0,10)}</div>
      </div>
      <span class="h-status ${statusCls[o.status]||'badge-warning'}">${statusLabel[o.status]||o.status}</span>
    </div>`).join('');
  }catch{ /* history is non-critical, fail silently */ }
}

function toggleHistory(){
  const list=document.getElementById('historyList');
  const btn=document.getElementById('historyBtn');
  const open=list.style.display==='block';
  list.style.display=open?'none':'block';
  btn.textContent=open?'عرض التحاليل السابقة ▾':'إخفاء السابقة ▲';
}

/* ── Init ──────────────────────────────────────────────────────────────── */
function init(){
  const raw=sessionStorage.getItem('citizen');
  if(!raw){location.replace('/citizen/login.html');return;}
  try{citizen=JSON.parse(raw);}catch{location.replace('/citizen/login.html');return;}

  const name=citizen.name||citizen.full_name||'مريض';
  document.getElementById('gName').textContent='أهلاً، '+name;
  const h=new Date().getHours();
  document.getElementById('gSub').textContent=
    (h<12?'صباح الخير ☀️':h<17?'مساء الخير 🌤️':'مساء النور 🌙')
    +' — هذه آخر نتائج تحاليلك';

  // Low-end device detection — disable animations to save CPU/battery
  const conn=navigator.connection||navigator.mozConnection||navigator.webkitConnection;
  if(conn?.saveData||conn?.effectiveType==='2g'||conn?.effectiveType==='slow-2g'){
    document.body.classList.add('low-end');
  }

  // Offline indicator
  function checkOnline(){
    document.getElementById('offlineBanner').style.display=navigator.onLine?'none':'flex';
  }
  window.addEventListener('online', ()=>{ checkOnline(); loadResults(); });
  window.addEventListener('offline', checkOnline);
  checkOnline();

  loadResults();
  loadOrders();
}

init();
</script>

</html>
