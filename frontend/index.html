<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GULA - منصة المختبرات</title>
<link rel="stylesheet" href="/assets/gula.css">
</head>
<body>
<!-- Sidebar -->
<aside id="sidebar" class="sidebar">
  <div class="sidebar-logo">
    <h1>GULA</h1>
    <span class="sidebar-lab" id="labName">منصة المختبرات</span>
  </div>
  <nav class="sidebar-nav">
    <a href="#dashboard" class="nav-item active" data-page="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      لوحة التحكم
    </a>
    <a href="#patients" class="nav-item" data-page="patients">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      المرضى
    </a>
    <a href="#orders" class="nav-item" data-page="orders">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      الطلبات والنتائج
    </a>
    <a href="#samples" class="nav-item" data-page="samples">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2v6.5c0 .8-.7 1.5-1.5 1.5S3 9.3 3 8.5V2"/><path d="M18 2v6.5c0 .8.7 1.5 1.5 1.5s1.5-.7 1.5-1.5V2"/><path d="M12 2v20"/><path d="M3 12h18"/><rect x="3" y="16" width="18" height="6" rx="2"/></svg>
      العينات
    </a>
    <a href="#lab" class="nav-item" data-page="lab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21V5a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v16"/><path d="M1 21h22"/><path d="M9 7h1"/><path d="M9 11h1"/><path d="M9 15h1"/><path d="M14 7h1"/><path d="M14 11h1"/><path d="M14 15h1"/></svg>
      المختبر
    </a>
    <div class="nav-divider"></div>
    <a href="#admin" class="nav-item" data-page="admin" id="adminNav" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      الإدارة
    </a>
  </nav>
  <div class="sidebar-footer">
    <div class="user-info" id="userInfo">
      <div class="user-avatar" id="userAvatar">م</div>
      <div class="user-details">
        <span class="user-name" id="userName">المستخدم</span>
        <span class="user-role" id="userRole">موظف</span>
      </div>
    </div>
    <button class="logout-btn" onclick="logout()">خروج</button>
  </div>
</aside>

<!-- Mobile header -->
<header class="mobile-header">
  <button class="menu-btn" onclick="toggleSidebar()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <h1>GULA</h1>
  <div></div>
</header>

<!-- Main content -->
<main id="content" class="content">
  <div id="page" class="page"></div>
</main>

<!-- Modal -->
<div id="modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeModal()" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modalTitle">عنوان</h3>
      <button onclick="closeModal()" class="modal-close" aria-label="إغلاق">&times;</button>
    </div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<script src="/assets/gula.js"></script>
</body>
</html>
