<!-- Mobile header -->
<header class="mobile-header">
  <button class="menu-btn" onclick="toggleSidebar()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>

  <h1>GULA</h1>
  <div></div>
</header>

<!-- Main content -->
<main id="content" class="content">
  <div id="page" class="page"></div>
</main>

<!-- Modal -->
<div id="modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeModal()" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modalTitle">عنوان</h3>
      <button onclick="closeModal()" class="modal-close" aria-label="إغلاق">&times;</button>
    </div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<!-- Offline banner -->
<div id="offlineBanner" class="offline-banner">لا يوجد اتصال بالإنترنت</div>

<script src="/assets/gula.js" defer></script>
<script>
// Offline/Online detection
window.addEventListener('offline', function() { document.getElementById('offlineBanner').classList.add('show'); });
window.addEventListener('online', function() { document.getElementById('offlineBanner').classList.remove('show'); });
if (!navigator.onLine) document.getElementById('offlineBanner').classList.add('show');
</script>
</body>
</html>
