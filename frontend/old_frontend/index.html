<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GULA Platform</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="manifest" href="/manifest.json">
<style>
  .sidebar-link { transition: all 0.2s; }
  .sidebar-link:hover { background: rgba(255,255,255,0.1); }
  .sidebar-link.active { background: rgba(59,130,246,0.3); border-right: 3px solid #3b82f6; }

  .stat-card:hover { transform: translateY(-2px); }
  .flag-H { color: #ef4444; font-weight: bold; }
  .flag-L { color: #3b82f6; font-weight: bold; }

  .flag-normal { color: #22c55e; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  .modal-backdrop { background: rgba(0,0,0,0.5); }
</style>
</head>
<body class="bg-gray-50">

<div id="app-auth" class="hidden">
  <!-- Login Page -->
  <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-900 to-blue-900">
    <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
      <div class="text-center mb-8">
        <h1 class="text-4xl font-bold text-gray-900">GULA</h1>
        <p class="text-gray-500 mt-2">Smart Health Platform</p>
      </div>

      <div id="login-form">
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input id="login-email" type="email" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="lab@example.com">
        </div>
        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input id="login-password" type="password" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="********">
        </div>
        <button onclick="doLogin()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">Login</button>

        <p class="text-center mt-4 text-sm text-gray-500">
          Don't have an account? <button onclick="showRegister()" class="text-blue-600 hover:underline">Register your lab</button>
        </p>
      </div>

      <div id="register-form" class="hidden">
        <div class="mb-3">
          <label class="block text-sm font-medium text-gray-700 mb-1">Lab Name</label>
          <input id="reg-lab-name" type="text" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="Lab name">
        </div>
        <div class="mb-3">
          <label class="block text-sm font-medium text-gray-700 mb-1">City</label>
          <input id="reg-city" type="text" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="City">
        </div>
        <div class="mb-3">
          <label class="block text-sm font-medium text-gray-700 mb-1">Your Name</label>
          <input id="reg-name" type="text" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="Admin name">
        </div>
        <div class="mb-3">
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input id="reg-email" type="email" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="email@example.com">
        </div>

        <p class="text-center mt-4 text-sm text-gray-500">

</div>

<div id="app-main" class="hidden">
  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <div class="w-64 bg-gray-900 text-white flex flex-col fixed h-full">
      <div class="p-6">
        <h1 class="text-2xl font-bold">GULA</h1>
        <p class="text-gray-400 text-xs mt-1" id="lab-name-sidebar">Smart Health Platform</p>
      </div>
      <nav class="flex-1 px-4 space-y-1">
        <button onclick="loadPage('dashboard')" class="sidebar-link block w-full text-left px-4 py-3 rounded-lg text-sm" data-page="dashboard">
          <span class="mr-2">&#9670;</span> Dashboard
        </button>
        <button onclick="loadPage('patients')" class="sidebar-link block w-full text-left px-4 py-3 rounded-lg text-sm" data-page="patients">
          <span class="mr-2">&#9824;</span> Patients
        </button>
        <button onclick="loadPage('new-order')" class="sidebar-link block w-full text-left px-4 py-3 rounded-lg text-sm" data-page="new-order">
          <span class="mr-2">&#10010;</span> New Test
        </button>
        <button onclick="loadPage('orders')" class="sidebar-link block w-full text-left px-4 py-3 rounded-lg text-sm" data-page="orders">
          <span class="mr-2">&#9729;</span> Orders & Results
        </button>
        <button onclick="loadPage('lab-settings')" class="sidebar-link block w-full text-left px-4 py-3 rounded-lg text-sm" data-page="lab-settings">
          <span class="mr-2">&#9881;</span> Lab Settings
        </button>
      </nav>
      <div class="p-4 border-t border-gray-700">
        <p class="text-sm text-gray-400" id="user-name-sidebar">User</p>
        <button onclick="logout()" class="text-red-400 text-sm hover:text-red-300 mt-1">Logout</button>
      </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 ml-64">
      <div class="p-8">
        <div id="page-content">
          <!-- Dynamic content loaded here -->
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal Container -->
<div id="modal" class="hidden fixed inset-0 z-50 modal-backdrop flex items-center justify-center">
  <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full mx-4 max-h-[90vh] overflow-y-auto" id="modal-content">
  </div>
</div>

<script>
// ========== GULA v1 Frontend ==========
const API = '';  // same origin

// XSS protection - escape HTML in user data before innerHTML
function esc(str) {
  if (str == null) return '';
  const d = document.createElement('div');
  d.textContent = String(str);
  return d.innerHTML;
}
let TOKEN = localStorage.getItem('gula_token');
let USER = JSON.parse(localStorage.getItem('gula_user') || 'null');

// API helper
async function api(path, options = {}) {
  const headers = { 'Content-Type': 'application/json', ...options.headers };
  if (TOKEN) headers['Authorization'] = `Bearer ${TOKEN}`;
  try {
    const res = await fetch(API + path, { ...options, headers });
    if (res.status === 401) { logout(); return null; }
    return await res.json();
  } catch (e) {
    console.error('API error:', e);
    return null;
  }
}

// Auth
function showLogin() {
  document.getElementById('login-form').classList.remove('hidden');
  document.getElementById('register-form').classList.add('hidden');
}
function showRegister() {
  document.getElementById('login-form').classList.add('hidden');
  document.getElementById('register-form').classList.remove('hidden');
}

async function doLogin() {
  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.classList.add('hidden');

  const data = await api('/login', {
    method: 'POST',
    body: JSON.stringify({ email, password })
  });

  if (data && data.token) {
    TOKEN = data.token;
    USER = data.user;
    localStorage.setItem('gula_token', TOKEN);
    localStorage.setItem('gula_user', JSON.stringify(USER));
    showApp();
  } else {
    errEl.textContent = (data && data.detail) || 'Login failed';
    errEl.classList.remove('hidden');
  }
}

async function doRegister() {
  const errEl = document.getElementById('register-error');
  errEl.classList.add('hidden');

  const body = {
    lab_name: document.getElementById('reg-lab-name').value,
    city: document.getElementById('reg-city').value,
    admin_name: document.getElementById('reg-name').value,
    email: document.getElementById('reg-email').value,
    password: document.getElementById('reg-password').value,
  };

  const data = await api('/register', {
    method: 'POST',
    body: JSON.stringify(body)
  });

  if (data && data.token) {
    TOKEN = data.token;
    USER = { id: data.user_id, name: body.admin_name, email: body.email, lab_id: data.lab_id, role: 'admin' };
    localStorage.setItem('gula_token', TOKEN);
    localStorage.setItem('gula_user', JSON.stringify(USER));
    showApp();
  } else {
    errEl.textContent = (data && data.detail) || 'Registration failed';
    errEl.classList.remove('hidden');
  }
}

function logout() {
  TOKEN = null;
  USER = null;
  localStorage.removeItem('gula_token');
  localStorage.removeItem('gula_user');
  showAuth();
}

function showAuth() {
  document.getElementById('app-auth').classList.remove('hidden');
  document.getElementById('app-main').classList.add('hidden');
}

function showApp() {
  document.getElementById('app-auth').classList.add('hidden');
  document.getElementById('app-main').classList.remove('hidden');
  if (USER) {
    document.getElementById('user-name-sidebar').textContent = USER.name || USER.email;
  }
  loadPage('dashboard');
}

// Pages
async function loadPage(page) {
  // Update sidebar active state
  document.querySelectorAll('.sidebar-link').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });

  const content = document.getElementById('page-content');

  switch (page) {
    case 'dashboard': await renderDashboard(content); break;
    case 'patients': await renderPatients(content); break;
    case 'new-order': await renderNewOrder(content); break;
    case 'orders': await renderOrders(content); break;
    case 'lab-settings': await renderLabSettings(content); break;
    case 'patient-history': await renderPatientHistory(content, currentHistoryPatientId); break;
    default: content.innerHTML = '<p>Page not found</p>';
  }
}

// ========== DASHBOARD ==========
async function renderDashboard(el) {
  el.innerHTML = '<p class="text-gray-400">Loading...</p>';
  const data = await api('/dashboard');
  if (!data) { el.innerHTML = '<p class="text-red-500">Failed to load dashboard</p>'; return; }

  el.innerHTML = `
    <h2 class="text-2xl font-bold text-gray-800 mb-6">Dashboard ${data.lab_name ? `<span class="text-lg font-normal text-gray-500">- ${data.lab_name}</span>` : ''}</h2>

    <!-- Today's Activity -->
    ${data.today ? `
    <div class="bg-gradient-to-r from-emerald-50 to-blue-50 rounded-xl p-4 mb-6 border border-emerald-100">
      <p class="text-sm font-semibold text-gray-600 mb-2">Today</p>
      <div class="flex gap-6 text-sm">
        <span class="text-gray-700"><span class="font-bold text-lg text-emerald-600">${data.today.patients}</span> new patients</span>
        <span class="text-gray-700"><span class="font-bold text-lg text-blue-600">${data.today.orders}</span> orders</span>
        <span class="text-gray-700"><span class="font-bold text-lg text-purple-600">${data.today.tests}</span> tests</span>
      </div>
    </div>
    ` : ''}

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
      <div class="stat-card bg-white rounded-xl shadow-sm p-6 border-l-4 border-blue-500">
        <p class="text-gray-500 text-sm">Total Patients</p>
        <p class="text-3xl font-bold text-gray-800">${data.patients}</p>
      </div>
      <div class="stat-card bg-white rounded-xl shadow-sm p-6 border-l-4 border-green-500">
        <p class="text-gray-500 text-sm">Total Orders</p>
        <p class="text-3xl font-bold text-gray-800">${data.orders}</p>
        ${data.this_week ? `<p class="text-xs text-green-600 mt-1">${data.this_week.orders} this week</p>` : ''}
      </div>
      <div class="stat-card bg-white rounded-xl shadow-sm p-6 border-l-4 border-purple-500">
        <p class="text-gray-500 text-sm">Test Results</p>
        <p class="text-3xl font-bold text-gray-800">${data.tests}</p>
      </div>
      <div class="stat-card bg-white rounded-xl shadow-sm p-6 border-l-4 border-red-500">
        <p class="text-gray-500 text-sm">Critical</p>
        <p class="text-3xl font-bold text-red-600">${data.critical}</p>
      </div>
    </div>
    ${data.patients === 0 ? `
    <!-- Guided Onboarding for New Labs -->
    <div class="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-2xl p-8 mb-8 text-white">
      <h3 class="text-2xl font-bold mb-2">Welcome to GULA!</h3>
      <p class="text-blue-100 mb-6">Get your lab up and running in 3 easy steps. Your first result link will be ready in under 5 minutes.</p>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-white/15 rounded-xl p-5 backdrop-blur-sm">
          <div class="w-10 h-10 bg-white/25 rounded-full flex items-center justify-center text-xl font-bold mb-3">1</div>
          <h4 class="font-semibold mb-1">Add Your First Patient</h4>
          <p class="text-blue-100 text-sm mb-3">Enter patient name and phone number.</p>
          <button onclick="loadPage('patients'); setTimeout(showAddPatientModal, 300)" class="bg-white text-blue-700 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-50 transition">Add Patient</button>
        </div>
        <div class="bg-white/15 rounded-xl p-5 backdrop-blur-sm">
          <div class="w-10 h-10 bg-white/25 rounded-full flex items-center justify-center text-xl font-bold mb-3">2</div>
          <h4 class="font-semibold mb-1">Create a Test Order</h4>
          <p class="text-blue-100 text-sm mb-3">Enter results using Quick Add profiles (CBC, Lipid, etc).</p>
          <button onclick="loadPage('new-order')" class="bg-white/25 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-white/35 transition">Create Order</button>
        </div>
        <div class="bg-white/15 rounded-xl p-5 backdrop-blur-sm">
          <div class="w-10 h-10 bg-white/25 rounded-full flex items-center justify-center text-xl font-bold mb-3">3</div>
          <h4 class="font-semibold mb-1">Share Result Link</h4>
          <p class="text-blue-100 text-sm mb-3">Send the smart result link via WhatsApp or print PDF.</p>
          <div class="text-white/70 text-sm italic">Available after creating your first order</div>
        </div>
      </div>
    </div>
    ` : ''}

    ${data.abnormal_results && data.abnormal_results.length > 0 ? `
    <div class="bg-white rounded-xl shadow-sm p-6 mb-6 border-l-4 border-red-400">
      <h3 class="text-lg font-semibold mb-4 text-red-700">Abnormal Results This Week</h3>
      <table class="w-full text-sm">
        <thead><tr class="text-left text-gray-500 border-b">
          <th class="pb-2">Patient</th><th class="pb-2">Test</th><th class="pb-2">Value</th><th class="pb-2">Status</th>
        </tr></thead>
        <tbody>
          ${data.abnormal_results.map(r => `
            <tr class="border-b last:border-0">
              <td class="py-2">${r.patient_name}</td>
              <td class="py-2">${r.test_name}</td>
              <td class="py-2 font-mono">${r.value} ${r.unit || ''}</td>
              <td class="py-2"><span class="px-2 py-0.5 rounded-full text-xs ${r.flag === 'critical' ? 'bg-red-100 text-red-700 font-bold' : r.flag === 'H' ? 'bg-red-50 text-red-600' : 'bg-blue-50 text-blue-600'}">${r.flag === 'critical' ? 'CRITICAL' : r.flag === 'H' ? 'High' : 'Low'}</span></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
    ` : ''}

    <div class="bg-white rounded-xl shadow-sm p-6">
      <h3 class="text-lg font-semibold mb-4">Recent Orders</h3>
      ${data.recent_orders && data.recent_orders.length > 0 ? `
        <table class="w-full">
          <thead><tr class="text-left text-sm text-gray-500 border-b">
            <th class="pb-3">Patient</th><th class="pb-3">Status</th><th class="pb-3">Date</th>
          </tr></thead>
          <tbody>
            ${data.recent_orders.map(o => `
              <tr class="border-b last:border-0">
                <td class="py-3">${o.patient_name}</td>
                <td class="py-3"><span class="px-2 py-1 rounded-full text-xs ${o.status === 'completed' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}">${o.status}</span></td>
                <td class="py-3 text-sm text-gray-500">${o.date ? new Date(o.date).toLocaleDateString() : '-'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      ` : '<p class="text-gray-400">No orders yet. Start by adding a patient and creating a test order.</p>'}
    </div>
  `;
}

// ========== PATIENTS ==========
async function renderPatients(el) {
  el.innerHTML = '<p class="text-gray-400">Loading...</p>';
  const data = await api('/patients');
  if (!data) { el.innerHTML = '<p class="text-red-500">Failed to load patients</p>'; return; }

  el.innerHTML = `
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-2xl font-bold text-gray-800">Patients</h2>
      <button onclick="showAddPatientModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition text-sm font-medium">+ Add Patient</button>
    </div>
    <div class="mb-4">
      <input id="patient-search" type="text" placeholder="Search by name or phone..." class="w-full md:w-96 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" oninput="searchPatients(this.value)">
    </div>
    <div class="bg-white rounded-xl shadow-sm overflow-hidden">
      <table class="w-full">
        <thead><tr class="text-left text-sm text-gray-500 bg-gray-50">
          <th class="px-6 py-3">Name</th><th class="px-6 py-3">Phone</th><th class="px-6 py-3">Health ID</th><th class="px-6 py-3">Gender</th><th class="px-6 py-3">Actions</th>
        </tr></thead>
        <tbody id="patients-table">
          ${data.patients.map(p => `
            <tr class="border-b hover:bg-gray-50 patient-row">
              <td class="px-6 py-4 font-medium">${p.full_name}</td>
              <td class="px-6 py-4 text-gray-600">${p.phone}</td>
              <td class="px-6 py-4"><span class="text-xs bg-blue-50 text-blue-600 px-2 py-1 rounded">${p.health_id || '-'}</span></td>
              <td class="px-6 py-4 text-gray-600">${p.gender === 'M' ? 'Male' : p.gender === 'F' ? 'Female' : '-'}</td>
              <td class="px-6 py-4">
                <button onclick="startNewOrder(${p.id}, '${p.full_name}')" class="text-blue-600 hover:text-blue-800 text-sm mr-3">+ New Test</button>
                <button onclick="viewPatientHistory(${p.id})" class="text-green-600 hover:text-green-800 text-sm">History</button>
              </td>
            </tr>
          `).join('')}
          ${data.patients.length === 0 ? '<tr><td colspan="5" class="px-6 py-8 text-center text-gray-400">No patients yet. Click "Add Patient" to get started.</td></tr>' : ''}
        </tbody>
      </table>
    </div>
  `;
}

let searchTimeout;
async function searchPatients(query) {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(async () => {
    const data = await api(`/patients?search=${encodeURIComponent(query)}`);
    if (!data) return;
    const tbody = document.getElementById('patients-table');
    if (!tbody) return;
    tbody.innerHTML = data.patients.map(p => `
      <tr class="border-b hover:bg-gray-50 patient-row">
        <td class="px-6 py-4 font-medium">${esc(p.full_name)}</td>
        <td class="px-6 py-4 text-gray-600">${esc(p.phone)}</td>
        <td class="px-6 py-4"><span class="text-xs bg-blue-50 text-blue-600 px-2 py-1 rounded">${esc(p.health_id || '-')}</span></td>
        <td class="px-6 py-4 text-gray-600">${p.gender === 'M' ? 'Male' : p.gender === 'F' ? 'Female' : '-'}</td>
        <td class="px-6 py-4">
          <button onclick="startNewOrder(${p.id}, '${esc(p.full_name)}')" class="text-blue-600 hover:text-blue-800 text-sm mr-3">+ New Test</button>
          <button onclick="viewPatientHistory(${p.id})" class="text-green-600 hover:text-green-800 text-sm">History</button>
        </td>
      </tr>
    `).join('');
  }, 300);
}

function showAddPatientModal() {
  const modal = document.getElementById('modal');
  document.getElementById('modal-content').innerHTML = `

      <h3 class="text-xl font-bold mb-4">Add New Patient</h3>
      <div class="space-y-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Full Name *</label>
          <input id="new-patient-name" type="text" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="Patient full name">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Phone *</label>
          <input id="new-patient-phone" type="tel" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="07xxxxxxxxx">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Gender</label>
            <select id="new-patient-gender" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
              <option value="">-</option>
              <option value="M">Male</option>
              <option value="F">Female</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Birth Date</label>
            <input id="new-patient-dob" type="date" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
          </div>
        </div>
      </div>
      <div class="flex justify-end gap-3 mt-6">
        <button onclick="closeModal()" class="px-4 py-2 text-gray-600 hover:text-gray-800">Cancel</button>
        <button onclick="addPatient()" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Save</button>
      </div>
      <div id="add-patient-error" class="text-red-500 text-sm mt-2 hidden"></div>
    </div>
  `;
  modal.classList.remove('hidden');
}

async function addPatient(forceCreate = false) {
  const name = document.getElementById('new-patient-name').value;
  const phone = document.getElementById('new-patient-phone').value;
  const gender = document.getElementById('new-patient-gender').value;
  const dob = document.getElementById('new-patient-dob').value;
  const errEl = document.getElementById('add-patient-error');

  if (!name || !phone) {
    errEl.textContent = 'Name and phone are required';
    errEl.classList.remove('hidden');
    return;
  }

  const body = { full_name: name, phone, gender: gender || null, birth_date: dob || null };
  if (forceCreate) body.force_create = true;

  const data = await api('/patients', {
    method: 'POST',
    body: JSON.stringify(body)
  });

  if (data && data.duplicate) {
    // Show duplicate warning
    const matches = data.matches || [{ patient: data.existing_patient, score: 1.0 }];
    errEl.innerHTML = `
      <div class="bg-amber-50 border border-amber-200 rounded-lg p-4 mt-3">
        <p class="text-amber-800 font-semibold mb-2">Possible duplicate patient found:</p>

          </div>
        `).join('')}
        <div class="flex gap-2 mt-3">
          <button onclick="closeModal(); loadPage('patients')" class="px-3 py-1.5 text-sm bg-gray-100 rounded hover:bg-gray-200">Use Existing</button>
          <button onclick="addPatient(true)" class="px-3 py-1.5 text-sm bg-blue-600 text-white rounded hover:bg-blue-700">Create Anyway</button>
        </div>
      </div>
    `;
    errEl.classList.remove('hidden');
    return;
  }

  if (data && data.patient) {
    closeModal();
    loadPage('patients');
  } else {
    errEl.textContent = (data && data.detail) || 'Failed to add patient';
    errEl.classList.remove('hidden');
  }
}

function fillTestDefaults(selectEl) {
  const row = selectEl.closest('.bg-gray-50');
  const opt = selectEl.selectedOptions[0];
  const customInput = row.querySelector('.test-name-custom');

  if (selectEl.value === 'custom') {
    customInput.classList.remove('hidden');
  } else {
    customInput.classList.add('hidden');
  }

  if (opt.dataset.unit) row.querySelector('.test-unit').value = opt.dataset.unit;
  if (opt.dataset.low) row.querySelector('.test-low').value = opt.dataset.low;
  if (opt.dataset.high) row.querySelector('.test-high').value = opt.dataset.high;
}

async function submitOrder() {
  const patientId = document.getElementById('order-patient').value;
  const doctorName = document.getElementById('order-doctor').value;
  const errEl = document.getElementById('order-error');
  const successEl = document.getElementById('order-success');
  errEl.classList.add('hidden');
  successEl.classList.add('hidden');

  if (!patientId) {
    errEl.textContent = 'Please select a patient';
    errEl.classList.remove('hidden');
    return;
  }

  const rows = document.querySelectorAll('#test-rows > div');
  const results = [];
  for (const row of rows) {
    const selectEl = row.querySelector('.test-name');
    let testName = selectEl.value;
    if (testName === 'custom') {
      testName = row.querySelector('.test-name-custom').value;
    }
    const value = parseFloat(row.querySelector('.test-value').value);
    const unit = row.querySelector('.test-unit').value;
    const low = parseFloat(row.querySelector('.test-low').value);
    const high = parseFloat(row.querySelector('.test-high').value);

    if (!testName || isNaN(value)) continue;

    results.push({
      test_name: testName,
      value,
      unit: unit || null,
      normal_range_low: isNaN(low) ? null : low,
      normal_range_high: isNaN(high) ? null : high,

  if (results.length === 0) {
    errEl.textContent = 'Add at least one test result';
    errEl.classList.remove('hidden');

            </tr>
          `).join('')}
          ${data.results.length === 0 ? '<tr><td colspan="5" class="py-4 text-center text-gray-400">No results yet</td></tr>' : ''}
        </tbody>
      </table>
    </div>
  `;

  // Store trends data globally for chart rendering
  window._patientTrends = data.trends;
  if (hasTrends) {
    setTimeout(renderTrendChart, 100);
  }
}

let trendChartInstance = null;
function renderTrendChart() {
  const select = document.getElementById('trend-select');
  if (!select || !window._patientTrends) return;
  const testName = select.value;
  const points = window._patientTrends[testName] || [];

  if (trendChartInstance) trendChartInstance.destroy();

  const ctx = document.getElementById('trend-chart');
  if (!ctx) return;

  const sortedPoints = [...points].sort((a, b) => new Date(a.date) - new Date(b.date));

  trendChartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: sortedPoints.map(p => p.date ? new Date(p.date).toLocaleDateString() : '?'),
      datasets: [{
        label: testName,
        data: sortedPoints.map(p => p.value),
        borderColor: '#3b82f6',
        backgroundColor: 'rgba(59,130,246,0.1)',
        fill: true,
        tension: 0.3,
        pointRadius: 6,
        pointBackgroundColor: sortedPoints.map(p =>
          p.flag === 'H' || p.flag === 'critical' ? '#ef4444' :
          p.flag === 'L' ? '#3b82f6' : '#22c55e'
        ),
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: false } }
    }
  });
}

// ========== COMPOSITE TEST PROFILES ==========
async function addProfileTests(profileName) {
  const profiles = await api('/test-profiles');
  if (!profiles || !profiles[profileName]) return;

  const tests = profiles[profileName];
  // Remove existing empty rows
  const existingRows = document.querySelectorAll('#test-rows > div');
  if (existingRows.length === 1) {
    const firstSelect = existingRows[0].querySelector('.test-name');
    if (firstSelect && !firstSelect.value) existingRows[0].remove();
  }

  for (const test of tests) {
    testRowCount++;
    const container = document.getElementById('test-rows');
    if (!container) return;

    const row = document.createElement('div');
    row.className = 'bg-gray-50 rounded-lg p-4 border';
    row.id = `test-row-${testRowCount}`;
    row.innerHTML = `
      <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
        <div>
          <label class="block text-xs text-gray-500 mb-1">Test Name *</label>
          <input class="test-name w-full px-2 py-1.5 border border-gray-300 rounded text-sm" value="${test.test_name}" readonly>
          <input class="test-name-custom hidden" value="${test.test_name}">
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1">Value *</label>
          <input class="test-value w-full px-2 py-1.5 border border-gray-300 rounded text-sm" type="number" step="0.01" placeholder="Enter value">
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1">Unit</label>
          <input class="test-unit w-full px-2 py-1.5 border border-gray-300 rounded text-sm" value="${test.unit}" readonly>
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1">Normal Low</label>
          <input class="test-low w-full px-2 py-1.5 border border-gray-300 rounded text-sm" type="number" step="0.01" value="${test.normal_range_low}">
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1">Normal High</label>
          <input class="test-high w-full px-2 py-1.5 border border-gray-300 rounded text-sm" type="number" step="0.01" value="${test.normal_range_high}">
        </div>
        <div class="flex items-end">
          <button onclick="this.closest('.bg-gray-50').remove()" class="text-red-400 hover:text-red-600 text-sm pb-1.5">Remove</button>
        </div>
      </div>
    `;
    container.appendChild(row);
  }
}

// Modal
function closeModal() {
  document.getElementById('modal').classList.add('hidden');
}
document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// Init
if (TOKEN && USER) {
  showApp();
} else {
  showAuth();
}
</script>
