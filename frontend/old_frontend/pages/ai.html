<h2 class="text-2xl mb-6">
AI Diagnostic Assistant
</h2>

<textarea id="input"
class="w-full p-3 bg-gray-800 rounded mb-4"
placeholder="Enter symptoms or lab values"></textarea>

<button onclick="analyze()"
class="bg-purple-600 px-6 py-2 rounded">

Analyze

</button>

<div id="answer" class="mt-6"></div>

<script>

async function analyze(){

let text=document.getElementById("input").value

let r=await api("/ai", "POST",{text})

answer.innerHTML=`

<div class="bg-gray-800 p-6 rounded">

${r.answer}

</div>

`

}

</script>
