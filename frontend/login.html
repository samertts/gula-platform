<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="GULA - تسجيل الدخول لمنصة المختبرات الطبية">
<meta name="theme-color" content="#0a0e1a">
<link rel="manifest" href="/manifest.json">
<title>GULA - تسجيل الدخول</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0a0e1a;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-container{width:100%;max-width:420px;padding:20px}
.logo{text-align:center;margin-bottom:40px}
.logo h1{font-size:2.5rem;font-weight:800;background:linear-gradient(135deg,#22d3ee,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo p{color:#64748b;margin-top:8px;font-size:.9rem}
.card{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:32px;box-shadow:0 25px 50px rgba(0,0,0,.3)}
.card h2{font-size:1.3rem;margin-bottom:24px;color:#f1f5f9}
.field{margin-bottom:20px}
.field label{display:block;font-size:.85rem;color:#94a3b8;margin-bottom:6px}
.field input{width:100%;padding:12px 16px;background:#0f172a;border:1px solid #1e293b;border-radius:10px;color:#e2e8f0;font-size:.95rem;transition:border .2s}
.field input:focus{outline:none;border-color:#818cf8}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 25px rgba(99,102,241,.3)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.error{background:#7f1d1d33;border:1px solid #991b1b;color:#fca5a5;padding:10px 14px;border-radius:8px;font-size:.85rem;margin-bottom:16px;display:none}
.register-link{text-align:center;margin-top:20px;font-size:.85rem;color:#64748b}
.register-link a{color:#818cf8;text-decoration:none}
.tabs{display:flex;gap:0;margin-bottom:24px;background:#0f172a;border-radius:10px;padding:4px}
.tab{flex:1;padding:10px;text-align:center;border-radius:8px;cursor:pointer;font-size:.9rem;color:#64748b;transition:all .2s}
.tab.active{background:#1e293b;color:#e2e8f0}
.form-section{display:none}
.form-section.active{display:block}
</style>
</head>
<body>
<div class="login-container">
  <div class="logo">
    <h1>GULA</h1>
    <p>منصة المختبرات الطبية</p>
  </div>
  <div class="card">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('login')">تسجيل الدخول</div>
      <div class="tab" onclick="switchTab('register')">تسجيل مختبر جديد</div>
    </div>
    <div id="error" class="error"></div>

    <!-- Login Form -->
    <form id="loginForm" class="form-section active" onsubmit="handleLogin(event)">
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="loginEmail" required placeholder="admin@lab.com">
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" id="loginPassword" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn" id="loginBtn">دخول</button>
    </form>

    <!-- Register Form -->
    <form id="registerForm" class="form-section" onsubmit="handleRegister(event)">
      <div class="field">
        <label>اسم المختبر</label>
        <input type="text" id="regLabName" required placeholder="مختبر الحياة">
      </div>
      <div class="field">
        <label>المدينة</label>
        <input type="text" id="regCity" required placeholder="بغداد">
      </div>
      <div class="field">
        <label>اسم المسؤول</label>
        <input type="text" id="regAdminName" required placeholder="الاسم الكامل">
      </div>
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="regEmail" required placeholder="admin@lab.com">
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" id="regPassword" required minlength="8" placeholder="8 أحرف على الأقل (أحرف وأرقام)">
      </div>
      <div class="field">
        <label>رقم الهاتف</label>
        <input type="tel" id="regPhone" placeholder="07xxxxxxxxx">
      </div>
      <button type="submit" class="btn" id="regBtn">تسجيل المختبر</button>
    </form>
  </div>
</div>
<script>
const API = '/api';

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (tab === 'login' && i === 0) || (tab === 'register' && i === 1));
  });
  document.getElementById('loginForm').classList.toggle('active', tab === 'login');
  document.getElementById('registerForm').classList.toggle('active', tab === 'register');
  document.getElementById('error').style.display = 'none';
}

function showError(msg) {
  const el = document.getElementById('error');
  el.textContent = msg;
  el.style.display = 'block';
}

async function _fetchWithTimeout(url, opts, ms = 12000) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try { return await fetch(url, { ...opts, signal: ctrl.signal }); }
  finally { clearTimeout(t); }
}

async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'جاري الدخول...';
  try {
    let res;
    try {
      res = await _fetchWithTimeout(API + '/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        credentials: 'include',
        body: JSON.stringify({
          email: document.getElementById('loginEmail').value,
          password: document.getElementById('loginPassword').value
        })
      });
    } catch (netErr) {
      if (netErr.name === 'AbortError') {
        throw new Error('انتهت مهلة الانتظار (12 ثانية) — الخادم لا يستجيب. أعد تشغيل الحاوية: docker compose restart');
      }
      throw new Error(navigator.onLine
        ? 'تعذّر الاتصال بالخادم — الخادم قد يكون متوقفاً، تحقق: docker compose ps'
        : 'لا يوجد اتصال بالإنترنت — تحقق من شبكتك');
    }
    let data;
    try { data = await res.json(); } catch { data = {}; }
    if (res.status === 401) throw new Error('البريد الإلكتروني أو كلمة المرور غير صحيحة');
    if (res.status === 403) throw new Error(data.detail || 'الحساب غير مفعّل — تواصل مع المسؤول');
    if (res.status === 429) throw new Error('محاولات كثيرة — انتظر دقيقة ثم حاول');
    if (res.status >= 500) throw new Error(`خطأ في الخادم (${res.status}) — تحقق: docker logs gula-backend`);
    if (!res.ok) throw new Error(data.detail || `خطأ ${res.status}`);
    if (!data.user) throw new Error('لم تصل بيانات المستخدم — تحقق من إعداد الخادم');
    sessionStorage.setItem('user', JSON.stringify(data.user));
    window.location.href = '/';
  } catch (err) {
    showError(err.message);
  } finally {
    btn.disabled = false; btn.textContent = 'دخول';
  }
}

async function handleRegister(e) {
  e.preventDefault();
  const pw = document.getElementById('regPassword').value;
  if (pw.length < 8) { showError('كلمة المرور يجب أن تكون 8 أحرف على الأقل'); return; }
  if (!/[a-zA-Z]/.test(pw) || !/\d/.test(pw)) { showError('كلمة المرور يجب أن تحتوي على حرف واحد ورقم واحد على الأقل'); return; }
  const btn = document.getElementById('regBtn');
  btn.disabled = true; btn.textContent = 'جاري التسجيل...';
  try {
    let res;
    try {
      res = await fetch(API + '/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        credentials: 'include',
        body: JSON.stringify({
          lab_name: document.getElementById('regLabName').value,
          city: document.getElementById('regCity').value,
          admin_name: document.getElementById('regAdminName').value,
          email: document.getElementById('regEmail').value,
          password: document.getElementById('regPassword').value,
          phone: document.getElementById('regPhone').value,
          address: ''
        })
      });
    } catch {
      throw new Error('تعذّر الاتصال بالخادم — تحقق من الشبكة');
    }
    let data;
    try { data = await res.json(); } catch { data = {}; }
    if (!res.ok) throw new Error(data.detail || `خطأ ${res.status} — حاول مجدداً`);
    // Token stored in httpOnly cookie by server
    sessionStorage.setItem('user', JSON.stringify({
      id: data.user_id, name: document.getElementById('regAdminName').value,
      email: document.getElementById('regEmail').value, role: 'admin', lab_id: data.lab_id
    }));
    window.location.href = '/';
  } catch (err) {
    showError(err.message);
  } finally {
    btn.disabled = false; btn.textContent = 'تسجيل المختبر';
  }
}

// Redirect if already logged in (check sessionStorage user metadata)
if (sessionStorage.getItem('user')) window.location.href = '/';
</script>
</body>
</html>
