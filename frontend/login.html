<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1e3a8a">
<title>GULA Laboratory — Secure Access</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#1e3a8a;
  --primary-hover:#1e40af;
  --blue-light:#dbeafe;
  --text:#0f172a;
  --text-muted:#64748b;
  --border:#e2e8f0;
  --input-bg:#f8fafc;
  --radius:12px;
  --shadow:0 20px 60px rgba(30,58,138,.12),0 4px 16px rgba(0,0,0,.06);
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:24px;
  background:linear-gradient(145deg,#f0f5ff 0%,#e8f0fe 40%,#f0f9ff 100%);
}
/* Logo area */
.brand{text-align:center;margin-bottom:24px}
.brand-icon{
  width:72px;height:72px;border-radius:18px;
  background:#fff;box-shadow:0 4px 20px rgba(30,58,138,.15);
  display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;
}
.brand-icon svg{width:38px;height:38px}
.brand-name{font-size:1.6rem;font-weight:800;color:var(--text);letter-spacing:-.02em}
.brand-sub{font-size:.75rem;letter-spacing:.12em;color:var(--text-muted);text-transform:uppercase;margin-top:3px}
/* Card */
.card{
  background:#fff;border-radius:20px;padding:36px;width:100%;max-width:420px;
  box-shadow:var(--shadow);
}
/* Card header */
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.card-title{font-size:1.2rem;font-weight:700;color:var(--primary)}
.lang-btns{display:flex;gap:4px}
.lang-btn{
  padding:4px 10px;border-radius:6px;border:1px solid var(--border);
  background:transparent;font-size:.78rem;font-weight:600;color:var(--text-muted);
  cursor:pointer;transition:all .15s;
}
.lang-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.lang-btn:hover:not(.active){background:var(--blue-light);color:var(--primary);border-color:var(--primary)}
/* Tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr;margin-bottom:24px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.tab{
  padding:10px;text-align:center;font-size:.82rem;font-weight:700;
  letter-spacing:.06em;cursor:pointer;transition:all .2s;
  color:var(--text-muted);background:#fff;border:none;
}
.tab.active{background:var(--primary);color:#fff}
.tab:not(.active):hover{background:var(--blue-light);color:var(--primary)}
/* Fields */
.field{margin-bottom:18px}
.field-label{
  display:block;font-size:.72rem;font-weight:700;letter-spacing:.08em;
  color:var(--text-muted);text-transform:uppercase;margin-bottom:7px;
}
.field-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.forgot{font-size:.76rem;color:var(--primary);text-decoration:none;font-weight:600}
.forgot:hover{text-decoration:underline}
.input-wrap{position:relative}
.input-wrap input{
  width:100%;padding:12px 44px 12px 14px;border-radius:10px;
  border:1.5px solid var(--border);background:var(--input-bg);
  font-size:.95rem;color:var(--text);outline:none;transition:border .2s;
  font-family:inherit;
}
.input-wrap input:focus{border-color:var(--primary);background:#fff}
.input-wrap input::placeholder{color:#b0bec5}
.input-icon{
  position:absolute;right:13px;top:50%;transform:translateY(-50%);
  color:#b0bec5;display:flex;align-items:center;
}
.input-icon svg{width:18px;height:18px}
/* Toggle password */
.toggle-pwd{
  position:absolute;right:13px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;color:#b0bec5;display:flex;align-items:center;
  padding:0;
}
.toggle-pwd:hover{color:var(--text-muted)}
/* Button */
.btn-primary{
  width:100%;padding:14px;border-radius:10px;border:none;
  background:var(--primary);color:#fff;font-size:.95rem;font-weight:700;
  cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;
  letter-spacing:.01em;
}
.btn-primary:hover{background:var(--primary-hover);transform:translateY(-1px);box-shadow:0 4px 16px rgba(30,58,138,.3)}
.btn-primary:active{transform:none}
.btn-primary:disabled{opacity:.7;cursor:not-allowed;transform:none}
/* Spinner */
.spinner{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Divider */
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--text-muted);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
/* Biometric */
.biometric{display:flex;flex-direction:column;align-items:center;gap:8px}
.bio-btn{
  width:60px;height:60px;border-radius:50%;border:1.5px solid var(--border);
  background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,.06);
}
.bio-btn:hover{border-color:var(--primary);box-shadow:0 4px 16px rgba(30,58,138,.15)}
.bio-btn svg{width:28px;height:28px;color:var(--text-muted)}
.bio-label{font-size:.72rem;letter-spacing:.08em;color:var(--text-muted);font-weight:600;text-transform:uppercase}
/* Footer */
.card-footer{text-align:center;margin-top:24px;font-size:.84rem;color:var(--text-muted)}
.card-footer a{color:var(--primary);font-weight:700;text-decoration:none}
.card-footer a:hover{text-decoration:underline}
.footer-links{display:flex;justify-content:center;gap:16px;margin-top:24px}
.footer-links a{font-size:.72rem;letter-spacing:.06em;color:var(--text-muted);text-decoration:none;text-transform:uppercase;font-weight:600}
.footer-links a:hover{color:var(--primary)}
/* Error */
.error-msg{
  background:#fef2f2;border:1px solid #fecaca;color:#dc2626;
  border-radius:8px;padding:10px 14px;font-size:.84rem;margin-bottom:16px;display:none;
}
/* Toast */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#1e293b;color:#fff;padding:12px 20px;border-radius:10px;
  font-size:.88rem;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;
  box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:999;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:480px){.card{padding:24px}.brand-icon{width:60px;height:60px}}
</style>
</head>
<body>

<div class="brand">
  <div class="brand-icon">
    <svg viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="38" height="38" rx="10" fill="#1e3a8a"/>
      <path d="M12 8h8l2 6-4 4 2 4H10l2-4-4-4 4-6z" fill="#93c5fd" opacity=".7"/>
      <path d="M14 10h4l1.5 4.5-3 3 1.5 3h-7l1.5-3-3-3L14 10z" fill="#fff"/>
      <circle cx="27" cy="24" r="6" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
      <line x1="31.2" y1="28.2" x2="34" y2="31" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="brand-name">GULA Laboratory</div>
  <div class="brand-sub">Clinical Precision</div>
</div>

<div class="card">
  <div class="card-head">
    <span class="card-title">Secure Access</span>
    <div class="lang-btns">
      <button class="lang-btn active" onclick="setLang('en',this)">EN</button>
      <button class="lang-btn" onclick="setLang('ar',this)">AR</button>
      <button class="lang-btn" onclick="setLang('ku',this)">KU</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="setTab('nid',this)" id="tab-nid" data-label-en="NATIONAL ID" data-label-ar="الهوية الوطنية" data-label-ku="ناسنامەی نیشتمانی">NATIONAL ID</button>
    <button class="tab" onclick="setTab('emp',this)" id="tab-emp" data-label-en="EMPLOYEE ID" data-label-ar="هوية الموظف" data-label-ku="ناسنامەی کارمەند">EMPLOYEE ID</button>
  </div>

  <div id="errorMsg" class="error-msg"></div>

  <form id="loginForm" onsubmit="doLogin(event)">
    <div class="field">
      <label class="field-label" id="label-id" data-en="IDENTIFICATION NUMBER" data-ar="رقم الهوية" data-ku="ژمارەی ناسنامە">IDENTIFICATION NUMBER</label>
      <div class="input-wrap">
        <input type="text" id="loginId" placeholder="Enter your ID number" required autocomplete="username" inputmode="numeric">
        <span class="input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/></svg>
        </span>
      </div>
    </div>
    <div class="field">
      <div class="field-row">
        <label class="field-label" id="label-pwd" data-en="SECURITY PASSWORD" data-ar="كلمة المرور" data-ku="وشەی نهێنی">SECURITY PASSWORD</label>
        <a href="#" class="forgot" id="label-forgot" data-en="FORGOT?" data-ar="نسيت؟" data-ku="بیرت چووە؟">FORGOT?</a>
      </div>
      <div class="input-wrap">
        <input type="password" id="loginPwd" placeholder="••••••••" required autocomplete="current-password">
        <button type="button" class="toggle-pwd" onclick="togglePwd()">
          <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <button type="submit" class="btn-primary" id="loginBtn">
      <span id="loginBtnText" data-en="Authorize Access →" data-ar="تسجيل الدخول ←" data-ku="دەستپێکردن ←">Authorize Access →</span>
      <span class="spinner" id="loginSpinner" style="display:none"></span>
    </button>
  </form>

  <div class="divider" id="label-or" data-en="OR AUTHENTICATE WITH" data-ar="أو المصادقة عبر" data-ku="یان بە ئەوەی">OR AUTHENTICATE WITH</div>

  <div class="biometric">
    <button class="bio-btn" onclick="bioLogin()" title="Biometric Login">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" color="var(--text-muted)">
        <path d="M12 2C9.8 2 7.8 2.9 6.3 4.3"/>
        <path d="M17.7 4.3C19.2 5.8 20 7.8 20 10c0 4.4-2.2 8.3-5.5 10.7"/>
        <path d="M6 10c0-3.3 2.7-6 6-6s6 2.7 6 6c0 2.7-.9 5.2-2.5 7"/>
        <path d="M8.5 10c0-1.9 1.6-3.5 3.5-3.5s3.5 1.6 3.5 3.5c0 1.7-.5 3.3-1.5 4.6"/>
        <path d="M12 10v.01"/>
        <path d="M9.5 13.5c.5 1.5 1.4 2.8 2.5 3.8"/>
      </svg>
    </button>
    <span class="bio-label" id="label-bio" data-en="BIOMETRIC LOGIN" data-ar="الدخول البيومتري" data-ku="چوونەژوورەوەی بیومەتریک">BIOMETRIC LOGIN</span>
  </div>
</div>

<div class="card-footer">
  <span id="label-no-account" data-en="Don't have a clinical profile?" data-ar="لا تملك ملفاً سريرياً؟" data-ku="پرۆفایلی کلینیکیت نییە؟">Don't have a clinical profile?</span>
  <a href="/register.html" id="label-create" data-en="Create Account" data-ar="إنشاء حساب" data-ku="هەژمار دروست بکە"> Create Account</a>
</div>

<div class="footer-links">
  <a href="#" data-en="SUPPORT" data-ar="الدعم" data-ku="پشتیوانی" class="flink">SUPPORT</a>
  <a href="#" data-en="PRIVACY POLICY" data-ar="سياسة الخصوصية" data-ku="سیاسەتی نهێنی" class="flink">PRIVACY POLICY</a>
  <a href="#" data-en="LEGAL NOTICE" data-ar="الإشعار القانوني" data-ku="ئاگادارکردنەوەی یاساییr" class="flink">LEGAL NOTICE</a>
</div>

<div class="toast" id="toast"></div>

<script>
const LABELS = {
  en:{tab_nid:'NATIONAL ID',tab_emp:'EMPLOYEE ID',id:'IDENTIFICATION NUMBER',pwd:'SECURITY PASSWORD',forgot:'FORGOT?',or:'OR AUTHENTICATE WITH',bio:'BIOMETRIC LOGIN',btn:'Authorize Access →',no_account:"Don't have a clinical profile?",create:'Create Account',support:'SUPPORT',privacy:'PRIVACY POLICY',legal:'LEGAL NOTICE',placeholder_id:'Enter your ID number',placeholder_pwd:'••••••••'},
  ar:{tab_nid:'الهوية الوطنية',tab_emp:'هوية الموظف',id:'رقم الهوية',pwd:'كلمة المرور',forgot:'نسيت؟',or:'أو المصادقة عبر',bio:'الدخول البيومتري',btn:'دخول ←',no_account:'لا تملك ملفاً سريرياً؟',create:'إنشاء حساب',support:'الدعم',privacy:'سياسة الخصوصية',legal:'الإشعار القانوني',placeholder_id:'أدخل رقم هويتك',placeholder_pwd:'كلمة المرور'},
  ku:{tab_nid:'ناسنامەی نیشتمانی',tab_emp:'ناسنامەی کارمەند',id:'ژمارەی ناسنامە',pwd:'وشەی نهێنی',forgot:'بیرت چووە؟',or:'یان بە',bio:'چوونەژوورەوەی بیومەتریک',btn:'دەستپێکردن ←',no_account:'پرۆفایلی کلینیکیت نییە؟',create:'هەژمار دروست بکە',support:'پشتیوانی',privacy:'سیاسەتی نهێنی',legal:'ئاگادارکردنەوەی یاسایی',placeholder_id:'ژمارەی ناسنامەت بنووسە',placeholder_pwd:'••••••••'}
};

let currentLang='en', currentTab='nid', pwdVisible=false;

function setLang(lang,btn){
  currentLang=lang;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const L=LABELS[lang];
  document.getElementById('tab-nid').textContent=L.tab_nid;
  document.getElementById('tab-emp').textContent=L.tab_emp;
  document.getElementById('label-id').textContent=L.id;
  document.getElementById('label-pwd').textContent=L.pwd;
  document.getElementById('label-forgot').textContent=L.forgot;
  document.getElementById('label-or').childNodes[1].textContent=L.or;
  document.getElementById('label-bio').textContent=L.bio;
  document.getElementById('loginBtnText').textContent=L.btn;
  document.getElementById('label-no-account').textContent=L.no_account;
  document.getElementById('label-create').textContent=' '+L.create;
  document.getElementById('loginId').placeholder=L.placeholder_id;
  document.getElementById('loginPwd').placeholder=L.placeholder_pwd;
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==='ar'||lang==='ku'?'rtl':'ltr';
}

function setTab(tab,btn){
  currentTab=tab;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

function togglePwd(){
  pwdVisible=!pwdVisible;
  const inp=document.getElementById('loginPwd');
  inp.type=pwdVisible?'text':'password';
  document.getElementById('eyeIcon').innerHTML=pwdVisible
    ?'<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
    :'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
}

function showError(msg){
  const el=document.getElementById('errorMsg');
  el.textContent=msg;el.style.display='block';
}
function hideError(){document.getElementById('errorMsg').style.display='none'}

function showToast(msg,ms=3000){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),ms);
}

async function doLogin(e){
  e.preventDefault();
  hideError();
  const id=document.getElementById('loginId').value.trim();
  const pwd=document.getElementById('loginPwd').value;
  if(!id||!pwd)return showError('Please enter your ID and password.');

  const btn=document.getElementById('loginBtn');
  const txt=document.getElementById('loginBtnText');
  const spn=document.getElementById('loginSpinner');
  btn.disabled=true;txt.style.display='none';spn.style.display='inline-block';

  try{
    // Determine email based on tab type
    const loginPayload=currentTab==='emp'
      ?{email:id,password:pwd}
      :{national_id:id,password:pwd,email:id};

    const res=await fetch('/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(loginPayload),
      credentials:'include'
    });

    if(res.ok){
      const data=await res.json();
      sessionStorage.setItem('user',JSON.stringify({
        name:data.name||data.full_name||'User',
        role:data.role||'staff',
        lab_id:data.lab_id,
        lab_name:data.lab_name||'GULA Laboratory'
      }));
      // Route based on role
      const role=(data.role||'').toLowerCase();
      if(role==='citizen'||role==='patient'){
        window.location.href='/citizen/index.html';
      } else {
        window.location.href='/';
      }
    } else {
      const err=await res.json().catch(()=>({}));
      showError(err.detail_ar||err.detail||'بيانات الدخول غير صحيحة. حاول مجدداً.');
    }
  } catch(ex){
    // Try fallback to existing login endpoint
    try{
      const res2=await fetch('/login',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({email:id,password:pwd}),
        credentials:'include'
      });
      if(res2.ok){
        const data=await res2.json();
        sessionStorage.setItem('user',JSON.stringify({
          name:data.name||'User',
          role:data.role||'staff',
          lab_id:data.lab_id,
          lab_name:data.lab_name||'GULA Laboratory'
        }));
        window.location.href='/';
      } else {
        showError('خطأ في الاتصال. تحقق من الشبكة وحاول مجدداً.');
      }
    } catch(ex2){
      showError('خطأ في الاتصال. تحقق من الشبكة وحاول مجدداً.');
    }
  } finally{
    btn.disabled=false;txt.style.display='inline';spn.style.display='none';
  }
}

function bioLogin(){
  showToast('Biometric authentication is not available on this device.');
}

// Check if already logged in
const u=sessionStorage.getItem('user');
if(u){try{const d=JSON.parse(u);if(d&&d.role){const r=d.role.toLowerCase();window.location.href=(r==='citizen'||r==='patient')?'/citizen/index.html':'/';}}catch(e){}}
</script>
</body>
</html>
