
<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Login</title>

<style>

body{
font-family:Arial;
background:#eef2f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh
}

.card{
background:white;
padding:40px;
border-radius:8px;
width:320px
}

input,select,button{
width:100%;
margin:8px 0;
padding:10px
}

button{
background:#1e88e5;
color:white;
border:none
}

</style>

</head>

<body>

<div class="card">

<h2>Platform Login</h2>

<select id="role">

<option value="citizen">Citizen</option>
<option value="lab">Laboratory</option>
<option value="doctor">Doctor</option>
<option value="admin">Lab Admin</option>

</select>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<a href="register.html">Create Account</a>

</div>

<script>

async function login(){

let data={
email:document.getElementById("email").value,
password:document.getElementById("password").value,
role:document.getElementById("role").value
}

let r=await fetch("http://localhost:8000/auth/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
})

let res=await r.json()

if(res.token){

localStorage.token=res.token

if(data.role=="lab")
location.href="../lab/lab_control_panel.html"

if(data.role=="doctor")
location.href="../doctor/dashboard.html"

if(data.role=="citizen")
location.href="../citizen/dashboard.html"

}

}

</script>

</body>
</html>
