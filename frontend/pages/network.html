<h2 class="text-2xl mb-6">
Laboratory Network
</h2>

<div id="labs"></div>

<script>

async function load(){

let labs=await api("/labs")

let html=""

labs.forEach(l=>{

html+=`

<div class="bg-gray-800 p-4 mb-3 rounded">

${l.name} — ${l.city}

</div>

`

})

labs.innerHTML=html

}

load()

</script>
