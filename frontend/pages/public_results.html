<h2 class="text-2xl font-bold text-gray-800 mb-6">Check Lab Result</h2>

<div class="bg-white rounded-xl shadow-sm p-6 max-w-lg">
  <p class="text-gray-600 mb-4">Enter the result code from your lab receipt to view your results.</p>

  <div class="flex gap-3 mb-4">
    <input id="result-code" type="text" class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="Enter result token...">
    <button onclick="checkResult()" class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 font-medium">Check</button>
  </div>

  <div id="check-result"></div>
</div>

<script>
async function checkResult() {
  const code = document.getElementById('result-code').value.trim();
  if (!code) return;

  const el = document.getElementById('check-result');
  el.innerHTML = '<p class="text-gray-400">Loading...</p>';

  try {
    const res = await fetch(`/r/${code}`);
    if (!res.ok) {
      el.innerHTML = '<p class="text-red-500 mt-4">Result not found or link has expired.</p>';
      return;
    }
    // Open in new tab for full result view
    window.open(`/result.html?token=${code}`, '_blank');
    el.innerHTML = '<p class="text-green-600 mt-4">Result opened in new tab.</p>';
  } catch (e) {
    el.innerHTML = '<p class="text-red-500 mt-4">Error checking result.</p>';
  }
}
</script>
