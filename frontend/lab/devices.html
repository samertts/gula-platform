
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Devices</title>
</head>

<body>

<h2>Connected Devices</h2>

<ul id="devices"></ul>

<script>

fetch("http://localhost:8000/devices")
.then(r=>r.json())
.then(d=>{

let html=""

d.forEach(i=>{
html+="<li>"+i.name+" ("+i.type+")</li>"
})

document.getElementById("devices").innerHTML=html

})

</script>

</body>
</html>
