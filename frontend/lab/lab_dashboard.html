<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Lab Dashboard</title>

<style>

body{
font-family:Arial;
background:#f4f6f9;
margin:0;
}

.header{
background:#2c3e50;
color:white;
padding:15px;
font-size:20px;
}

.container{
padding:20px;
}

.cards{
display:flex;
gap:20px;
margin-bottom:20px;
}

.card{
background:white;
padding:20px;
flex:1;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.buttons{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
}

button{
padding:15px;
font-size:16px;
border:none;
border-radius:8px;
background:#3498db;
color:white;
cursor:pointer;
}

button:hover{
background:#2980b9;
}

.patient-form{
background:white;
padding:20px;
border-radius:10px;
margin-top:20px;
display:none;
}

input{
padding:10px;
margin:5px;
width:200px;
}

</style>
</head>

<body>

<div class="header">
National Lab Platform - Laboratory Dashboard
</div>

<div class="container">

<div class="cards">

<div class="card">
<h3>Patients Today</h3>
<p id="patients">12</p>
</div>

<div class="card">
<h3>Samples Pending</h3>
<p id="samples">7</p>
</div>

<div class="card">
<h3>Results Completed</h3>
<p id="results">21</p>
</div>

</div>

<div class="buttons">

<button onclick="openPatient()">Register Patient</button>

<button onclick="enterResults()">Enter Results</button>

<button onclick="searchTests()">Search Tests</button>

<button onclick="deviceMonitor()">Device Monitor</button>

<button onclick="viewReports()">Reports</button>

<button onclick="aiAssistant()">AI Assistant</button>

</div>

<div class="patient-form" id="patientForm">

<h3>Register Patient</h3>

<input placeholder="Patient Name"><br>

<input placeholder="Age"><br>

<input placeholder="Gender"><br>

<input placeholder="Phone"><br>

<button>Save Patient</button>

</div>

</div>

<script>

function openPatient(){

document.getElementById("patientForm").style.display="block"

}

function enterResults(){

alert("Result Entry Module")

}

function searchTests(){

alert("Search Global Test Library")

}

function deviceMonitor(){

alert("Connected Devices")

}

function viewReports(){

alert("Lab Reports")

}

function aiAssistant(){

alert("AI Lab Assistant")

}

</script>

</body>
</html>
