
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
</head>
<body>

<h2>Laboratory Dashboard</h2>

<div id="stats"></div>

<script>

fetch("http://localhost:8000/labs/stats")
.then(r=>r.json())
.then(d=>{
document.getElementById("stats").innerHTML=
"Tests today: "+d.tests+"<br>"+
"Samples: "+d.samples
})

</script>

</body>
</html>
