# =============================================================================
# GULA PLATFORM - MVP Configuration
# Minimal services for production launch
# For full infrastructure: docker compose -f docker-compose.full.yml up
# Deploy: docker compose up -d --build --remove-orphans
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # DATABASE
  # ---------------------------------------------------------------------------

  postgres:
    image: postgres:17-alpine
    container_name: gula-postgres
    restart: always
    # Resource limits prevent a runaway PG process from starving other services
    mem_limit: ${PG_MEM_LIMIT:-896m}
    mem_reservation: 256m
    cpus: "${PG_CPUS:-1.0}"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: labdb
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=en_US.UTF-8"
      # Tune shared memory for PostgreSQL inside Docker
      POSTGRES_SHARED_BUFFERS: ${PG_SHARED_BUFFERS:-512MB}
    # SECURITY: No external ports - only accessible via internal network
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - gula-net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d labdb"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ---------------------------------------------------------------------------
  # CACHE
  # ---------------------------------------------------------------------------

  redis:
    image: redis:7-alpine
    container_name: gula-redis
    restart: always
    mem_limit: 320m
    mem_reservation: 64m
    cpus: "0.5"
    command: >
      redis-server
        --appendonly yes
        --maxmemory 256mb
        --maxmemory-policy volatile-lru
        --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
        --save 900 1
        --save 300 10
    # SECURITY: No external ports - only accessible via internal network
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - gula-net

    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # BACKEND API
  # ---------------------------------------------------------------------------

  gula-backend:
    # Use pre-built image from GHCR when GULA_IMAGE_TAG is set (CI/CD deployments),
    # otherwise fall back to building locally (developer machines).
    image: "${GULA_IMAGE_PREFIX:-local}/backend:${GULA_IMAGE_TAG:-local}"
    build:
      context: ./backend
      # build is ignored when 'image' resolves to an existing remote image pulled by compose pull
    container_name: gula-backend
    # Resource limits: cap RSS to prevent OOM from taking down the host.
    # Tune via BACKEND_MEM_LIMIT in .env (default 1.2GB for 4-worker setup).
    mem_limit: ${BACKEND_MEM_LIMIT:-1536m}
    mem_reservation: 384m
    cpus: "${BACKEND_CPUS:-1.5}"
    # always: restart after any exit (crash, OOM, deliberate stop).
    # The startup guard handles bad config / missing secrets gracefully — it exits
    # with a clear error message so the logs show WHY it failed.  Docker will
    # restart with exponential back-off (5s, 10s, 20s… up to 300s).
    restart: always
    # SECURITY: Prevent privilege escalation inside container
    security_opt:
      - no-new-privileges:true

    environment:
      ENV: ${ENV:-production}
      # Runtime isolation: API container must NEVER spawn maintenance loops.
      # Workers run in the dedicated gula-worker container.
      RUNTIME_MODE: api
      FEATURE_BACKGROUND_TASKS: "false"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/labdb
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # SECURITY: No hardcoded fallback — SECRET_KEY must be set in .env
      SECRET_KEY: ${SECRET_KEY:-}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      # SECURITY: No hardcoded fallback — ENCRYPTION_KEY must be set in .env
      # Generate: python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      NID_HMAC_KEY: ${NID_HMAC_KEY:-}
      AUDIT_ANCHOR_KEY: ${AUDIT_ANCHOR_KEY:-}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-8}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-30}
      BASE_URL: ${BASE_URL:-http://localhost}
      GULA_ADMIN_EMAIL: ${GULA_ADMIN_EMAIL:-admin@gula-platform.org}
      GULA_ADMIN_NAME: ${GULA_ADMIN_NAME:-GULA Admin}
      GULA_ADMIN_PASSWORD: ${GULA_ADMIN_PASSWORD:-}
      GULA_ADMIN_PASSWORD_HASH: ${GULA_ADMIN_PASSWORD_HASH:-}
      # SECURITY: Disable API docs in production by default
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      MAX_REQUEST_BODY_MB: ${MAX_REQUEST_BODY_MB:-10}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
      APNS_KEY: ${APNS_KEY:-}
      DEVICE_HMAC_KEY: ${DEVICE_HMAC_KEY:-}
      ALLOWED_DEVICE_IDS: ${ALLOWED_DEVICE_IDS:-}
      # Concurrency: number of uvicorn workers (each ~120 MB RSS).
      # 4 GB server: 3 workers × (6+12) = 54 DB connections (max_connections=100).
      # Formula: WEB_CONCURRENCY × (DB_POOL_SIZE + DB_MAX_OVERFLOW) < max_connections
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-6}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-12}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-10}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      # Concurrency throttle: max simultaneous write requests in-flight per worker
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-50}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Health alerting (Telegram / Discord / Slack webhook)
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      HEALTH_ALERT_INTERVAL_SECONDS: ${HEALTH_ALERT_INTERVAL_SECONDS:-60}
      # Prometheus scrape token
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
      RATE_LIMIT_BLOCK_DURATION_SECONDS: ${RATE_LIMIT_BLOCK_DURATION_SECONDS:-3600}
      PYTHONPATH: /app
    volumes:
      # Canonical shared library (mounted for hot-reload)
      - ./shared:/app/shared:ro
      # Audit anchor file: persisted outside DB for tamper detection
      # Mount as named volume so it survives container rebuilds
      - audit-anchors:/app/data
    # Allow backend to reach Ollama running on the Docker host (free local AI)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # SECURITY: No external ports - only accessible via api-gateway
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gula-net
    # IMPORTANT: Use python for health check (available in image) instead of wget/curl.
    # Points to /health/ready (readiness probe) — only returns 200 after the
    # startup guard completes: config validated, DB connected, migrations checked,
    # critical data seeded.  This prevents api-gateway from routing traffic to
    # a partially-initialised backend.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  # ---------------------------------------------------------------------------
  # BACKGROUND WORKER
  # ---------------------------------------------------------------------------
  # Runs the maintenance loops (outbox dispatch, recovery probe, health
  # watchdog, adaptive concurrency, auto-repair) in a process completely
  # separate from the API. Failure to set RUNTIME_MODE=worker here will
  # cause the entrypoint to refuse to start.

  gula-worker:
    image: "${GULA_IMAGE_PREFIX:-local}/backend:${GULA_IMAGE_TAG:-local}"
    build:
      context: ./backend
    container_name: gula-worker
    mem_limit: ${WORKER_MEM_LIMIT:-512m}
    mem_reservation: 128m
    cpus: "${WORKER_CPUS:-0.5}"
    restart: always
    security_opt:
      - no-new-privileges:true
    command: ["python", "-m", "app.worker"]
    environment:
      ENV: ${ENV:-production}
      RUNTIME_MODE: worker
      FEATURE_BACKGROUND_TASKS: "true"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/labdb
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SECRET_KEY: ${SECRET_KEY:-}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      NID_HMAC_KEY: ${NID_HMAC_KEY:-}
      AUDIT_ANCHOR_KEY: ${AUDIT_ANCHOR_KEY:-}
      DEVICE_HMAC_KEY: ${DEVICE_HMAC_KEY:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      HEALTH_ALERT_INTERVAL_SECONDS: ${HEALTH_ALERT_INTERVAL_SECONDS:-60}
      DB_POOL_SIZE: ${WORKER_DB_POOL_SIZE:-3}
      DB_MAX_OVERFLOW: ${WORKER_DB_MAX_OVERFLOW:-5}
      PYTHONPATH: /app
    volumes:
      - ./shared:/app/shared:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gula-net

  # ---------------------------------------------------------------------------
  # FRONTEND-V3 (React/Vite static build served by nginx)
  # ---------------------------------------------------------------------------

  frontend:
    build:
      context: ./frontend-v3
      dockerfile: Dockerfile
    image: "${GULA_IMAGE_PREFIX:-local}/frontend-v3:${GULA_IMAGE_TAG:-local}"
    restart: always
    security_opt:
      - no-new-privileges:true

    # SECURITY: No external ports - only accessible via api-gateway
    expose:
      - "80"
    volumes:
      - ./config/nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - gula-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ---------------------------------------------------------------------------
  # API GATEWAY (Nginx reverse proxy)
  # ---------------------------------------------------------------------------

  api-gateway:
    image: nginx:1.28-alpine
    container_name: gula-api-gateway
    restart: always
    security_opt:
      - no-new-privileges:true

    # Architecture: Internet → Host nginx (80/443) → Docker api-gateway (127.0.0.1:8080)
    # Host nginx handles SSL termination and certbot ACME challenges.
    # To enable: sudo cp config/nginx/system/gula-platform-http.conf /etc/nginx/sites-available/gula-platform
    #            sudo ln -sf /etc/nginx/sites-available/gula-platform /etc/nginx/sites-enabled/gula-platform
    #            sudo nginx -t && sudo systemctl reload nginx
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./config/ssl:/etc/nginx/ssl:ro
      - certbot-webroot:/var/www/certbot
      - ./logs/nginx:/var/log/nginx
    depends_on:
      gula-backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - gula-net

  # ---------------------------------------------------------------------------
  # MONITORING (Prometheus + Alertmanager + Grafana)
  # Internal only — no external port exposure. Access via SSH tunnel:
  #   ssh -L 9090:localhost:9090 -L 9093:localhost:9093 -L 3000:localhost:3000 user@server
  # Enable: ENABLE_MONITORING=true in .env (or uncomment profiles below)
  # ---------------------------------------------------------------------------

  alertmanager:
    image: prom/alertmanager:v0.33.1
    container_name: gula-alertmanager
    restart: always
    profiles: ["monitoring"]
    security_opt:
      - no-new-privileges:true
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    expose:
      - "9093"
    networks:
      - gula-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9093/-/healthy | grep -q OK"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  prometheus:
    image: prom/prometheus:v2.56.1
    container_name: gula-prometheus
    restart: always
    profiles: ["monitoring"]
    security_opt:
      - no-new-privileges:true

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=5GB'
      - '--web.enable-lifecycle'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
      # Bearer token file — generated by: make metrics-token
      - ./config/prometheus/metrics_token:/etc/prometheus/metrics_token:ro
    expose:
      - "9090"
    networks:
      - gula-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy | grep -q OK"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  grafana:
    image: grafana/grafana:11.7.1
    container_name: gula-grafana
    restart: always
    profiles: ["monitoring"]
    security_opt:
      - no-new-privileges:true

    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-changeme_grafana}
      GF_SECURITY_ADMIN_USER: admin
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    expose:
      - "3000"
    depends_on:
      - prometheus
    networks:
      - gula-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

# ---------------------------------------------------------------------------
  # DEVICE BRIDGE (LabLink-Core) — Lab instrument integration service
  # Translates ASTM/HL7 device data → GULA REST API
  # ---------------------------------------------------------------------------
  device-bridge:
    build:
      context: ./services/device_bridge
      dockerfile: Dockerfile
    container_name: gula-device-bridge
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 64m
    cpus: "0.5"
    environment:
      GULA_BACKEND_URL: "http://gula-backend:8000"
      LABLINK_API_KEY: "${LABLINK_API_KEY:-}"
      DEPLOYMENT_MODE: "${LABLINK_MODE:-hybrid}"
    expose:
      - "8200"
    depends_on:
      gula-backend:
        condition: service_healthy
    networks:
      - gula-net
    profiles:
      - device-bridge
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8200/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

# =============================================================================
# VOLUMES
# =============================================================================

volumes:
  pgdata:
    driver: local
  redis-data:
    driver: local
  certbot-webroot:
    driver: local
  # Audit anchor file - external to DB, survives DB reconstruction
  # Provides cryptographic proof of audit log state at each checkpoint
  audit-anchors:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  alertmanager-data:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================

networks:
  gula-net:
    driver: bridge
