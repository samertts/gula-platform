# =============================================================================
# GULA PLATFORM - MVP Configuration
# Minimal services for production launch
# For full infrastructure: docker compose -f docker-compose.full.yml up
# Deploy: docker compose up -d --build --remove-orphans
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # DATABASE
  # ---------------------------------------------------------------------------

  postgres:
    image: postgres:14-alpine
    container_name: gula-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gula_default_pg_pass}
      POSTGRES_DB: labdb
    # SECURITY: No external ports - only accessible via internal network
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - gula-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d labdb"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # CACHE
  # ---------------------------------------------------------------------------

  redis:
    image: redis:7-alpine
    container_name: gula-redis
    restart: always
    command: >
      redis-server
        --appendonly yes
        --maxmemory 128mb
        --maxmemory-policy volatile-lru
        --requirepass ${REDIS_PASSWORD:-gula_default_redis_pass}
        --save 900 1
        --save 300 10
    # SECURITY: No external ports - only accessible via internal network
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - gula-net
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-gula_default_redis_pass} ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # BACKEND API
  # ---------------------------------------------------------------------------

  gula-backend:
    # Use pre-built image from GHCR when GULA_IMAGE_TAG is set (CI/CD deployments),
    # otherwise fall back to building locally (developer machines).
    image: "${GULA_IMAGE_PREFIX:-local}/backend:${GULA_IMAGE_TAG:-local}"
    build:
      context: ./backend
      # build is ignored when 'image' resolves to an existing remote image pulled by compose pull
    container_name: gula-backend
    # Crash-loop protection: restart on failure but stop after 5 attempts.
    # If the startup guard raises (bad config, DB unreachable after retries),
    # we do NOT want an infinite restart loop consuming resources.
    restart: on-failure
    # SECURITY: Prevent privilege escalation inside container
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "1.0"
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
    environment:
      ENV: ${ENV:-production}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-gula_default_pg_pass}@postgres:5432/labdb
      REDIS_URL: redis://:${REDIS_PASSWORD:-gula_default_redis_pass}@redis:6379
      # SECURITY: No hardcoded fallback — SECRET_KEY must be set in .env
      SECRET_KEY: ${SECRET_KEY:-}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      # SECURITY: No hardcoded fallback — ENCRYPTION_KEY must be set in .env
      # Generate: python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      NID_HMAC_KEY: ${NID_HMAC_KEY:-}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-8}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-30}
      BASE_URL: ${BASE_URL:-http://localhost}
      GULA_ADMIN_EMAIL: ${GULA_ADMIN_EMAIL:-admin@gula-platform.org}
      GULA_ADMIN_NAME: ${GULA_ADMIN_NAME:-GULA Admin}
      GULA_ADMIN_PASSWORD: ${GULA_ADMIN_PASSWORD:-}
      GULA_ADMIN_PASSWORD_HASH: ${GULA_ADMIN_PASSWORD_HASH:-}
      # SECURITY: Disable API docs in production by default
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      MAX_REQUEST_BODY_MB: ${MAX_REQUEST_BODY_MB:-10}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
    volumes:
      # Audit anchor file: persisted outside DB for tamper detection
      # Mount as named volume so it survives container rebuilds
      - audit-anchors:/app/data
    # SECURITY: No external ports - only accessible via api-gateway
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gula-net
    # IMPORTANT: Use python for health check (available in image) instead of wget/curl.
    # Points to /health/ready (readiness probe) — only returns 200 after the
    # startup guard completes: config validated, DB connected, migrations checked,
    # critical data seeded.  This prevents api-gateway from routing traffic to
    # a partially-initialised backend.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # FRONTEND (static files served by nginx)
  # ---------------------------------------------------------------------------

  frontend:
    image: nginx:1.25-alpine
    container_name: gula-frontend
    restart: always
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    # SECURITY: No external ports - only accessible via api-gateway
    expose:
      - "80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./config/nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - gula-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ---------------------------------------------------------------------------
  # API GATEWAY (Nginx reverse proxy)
  # ---------------------------------------------------------------------------

  api-gateway:
    image: nginx:1.25-alpine
    container_name: gula-api-gateway
    restart: always
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    # Architecture: Internet → Host nginx (80/443) → Docker api-gateway (127.0.0.1:8080)
    # Host nginx handles SSL termination and certbot ACME challenges.
    # To enable: sudo cp config/nginx/system/gula-platform-http.conf /etc/nginx/sites-available/gula-platform
    #            sudo ln -sf /etc/nginx/sites-available/gula-platform /etc/nginx/sites-enabled/gula-platform
    #            sudo nginx -t && sudo systemctl reload nginx
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./config/ssl:/etc/nginx/ssl:ro
      - certbot-webroot:/var/www/certbot
      - ./logs/nginx:/var/log/nginx
    depends_on:
      gula-backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - gula-net

  # ---------------------------------------------------------------------------
  # MONITORING (Prometheus + Grafana)
  # Internal only — no external port exposure. Access via SSH tunnel:
  #   ssh -L 9090:localhost:9090 -L 3000:localhost:3000 user@server
  # Enable: ENABLE_MONITORING=true in .env (or uncomment profiles below)
  # ---------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: gula-prometheus
    restart: always
    profiles: ["monitoring"]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=5GB'
      - '--web.enable-lifecycle'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"
    networks:
      - gula-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy | grep -q OK"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  grafana:
    image: grafana/grafana:10.3.3
    container_name: gula-grafana
    restart: always
    profiles: ["monitoring"]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.25"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-changeme_grafana}
      GF_SECURITY_ADMIN_USER: admin
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    expose:
      - "3000"
    depends_on:
      - prometheus
    networks:
      - gula-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

# =============================================================================
# VOLUMES
# =============================================================================

volumes:
  pgdata:
    driver: local
  redis-data:
    driver: local
  certbot-webroot:
    driver: local
  # Audit anchor file - external to DB, survives DB reconstruction
  # Provides cryptographic proof of audit log state at each checkpoint
  audit-anchors:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================

networks:
  gula-net:
    driver: bridge
