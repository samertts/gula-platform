# =============================================================================
# GULA PLATFORM - MVP Configuration
# Minimal services for production launch
# For full infrastructure: docker compose -f docker-compose.full.yml up
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # DATABASE
  # ---------------------------------------------------------------------------

  postgres:
    image: postgres:14
    container_name: gula-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gula_secure_2024}
      POSTGRES_DB: labdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - gula-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d labdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # CACHE
  # ---------------------------------------------------------------------------

  redis:
    image: redis:7-alpine
    container_name: gula-redis
    restart: always
    command: >
      redis-server
        --appendonly yes
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --requirepass ${REDIS_PASSWORD:-gula_redis_2024}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - gula-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-gula_redis_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # BACKEND API
  # ---------------------------------------------------------------------------

  gula-backend:
    build: ./backend
    container_name: gula-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-gula_secure_2024}@postgres:5432/labdb
      REDIS_URL: redis://:${REDIS_PASSWORD:-gula_redis_2024}@redis:6379
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me-in-production}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gula-net

  # ---------------------------------------------------------------------------
  # FRONTEND
  # ---------------------------------------------------------------------------

  frontend:
    image: nginx:1.25-alpine
    container_name: gula-frontend
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./config/nginx/frontend.conf:/etc/nginx/conf.d/default.conf
    networks:
      - gula-net

  # ---------------------------------------------------------------------------
  # API GATEWAY (Nginx reverse proxy)
  # ---------------------------------------------------------------------------

  api-gateway:
    image: nginx:1.25-alpine
    container_name: gula-api-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./config/nginx/conf.d:/etc/nginx/conf.d
      - ./config/ssl:/etc/nginx/ssl
    depends_on:
      - gula-backend
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - gula-net

# =============================================================================
# VOLUMES
# =============================================================================

volumes:
  pgdata:
    driver: local
  redis-data:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================

networks:
  gula-net:
    driver: bridge
