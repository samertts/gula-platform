version: "3.9"

services:

  postgres:
    image: postgres:14
    container_name: lab-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: labdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - labnet

  redis:
    image: redis:7
    container_name: lab-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - labnet

  api:
    image: python:3.11
    container_name: lab-api
    working_dir: /app
    volumes:
      - ./api:/app
    command: >
      bash -c "pip install fastapi uvicorn psycopg2-binary requests reportlab python-jose passlib bcrypt &&
      uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    networks:
      - labnet

  ai:
    image: python:3.11
    container_name: ai-service
    working_dir: /app
    volumes:
      - ./ai:/app
    command: >
      bash -c "pip install fastapi uvicorn requests &&
      uvicorn ai_service:app --host 0.0.0.0 --port 9000"
    ports:
      - "9000:9000"
    networks:
      - labnet

  frontend:
    image: nginx:latest
    container_name: lab-frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    networks:
      - labnet
gateway:
    image: python:3.11
    container_name: lab-gateway
    working_dir: /app
    volumes:
      - ./gateway:/app
    command: >
      bash -c "pip install requests &&
      python device_gateway.py"
    environment:
      - LAB_API_URL=http://lab-api:8000/results
      - LAB_DEVICE_TOKEN=devicesecret
    ports:
      - "5000:5000"
    depends_on:
      - api
    networks:
      - labnet
volumes:
  pgdata:

networks:
  labnet:
    driver: bridge
