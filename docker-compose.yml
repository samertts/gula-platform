version: "3.9"

# =============================================================================
# GULA PLATFORM - Enterprise Medical Laboratory System
# Full Infrastructure Stack
# =============================================================================

services:

  # ===========================================================================
  # DATABASES
  # ===========================================================================

  postgres-primary:
    image: postgres:14
    container_name: gula-postgres-primary
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gula_secure_2024}
      POSTGRES_DB: labdb
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    command: >
      postgres
        -c wal_level=replica
        -c hot_standby=on
        -c max_wal_senders=3
        -c max_replication_slots=3
        -c hot_standby_feedback=on
        -c shared_preload_libraries=pg_stat_statements
        -c log_statement=all
        -c log_duration=on
    ports:
      - "5432:5432"
    volumes:
      - pgdata-primary:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./config/postgres/audit.sql:/docker-entrypoint-initdb.d/02-audit.sql
      - ./config/postgres/partitions.sql:/docker-entrypoint-initdb.d/03-partitions.sql
      - ./config/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf
    networks:
      - gula-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d labdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-replica:
    image: postgres:14
    container_name: gula-postgres-replica
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gula_secure_2024}
      PGPASSWORD: ${POSTGRES_PASSWORD:-gula_secure_2024}
      POSTGRES_DB: labdb
      PGDATA: /var/lib/postgresql/data
    command: >
      bash -c "
        until pg_isready -h postgres-primary -U postgres; do sleep 2; done;
        if [ ! -f /var/lib/postgresql/data/PG_VERSION ]; then
          pg_basebackup -h postgres-primary -U postgres -D /var/lib/postgresql/data -Fp -Xs -P -R;
        fi;
        postgres -c hot_standby=on -c primary_conninfo='host=postgres-primary port=5432 user=postgres password=${POSTGRES_PASSWORD:-gula_secure_2024}'
      "
    ports:
      - "5433:5432"
    volumes:
      - pgdata-replica:/var/lib/postgresql/data
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - gula-net

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: gula-pgbouncer
    restart: always
    environment:
      DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD:-gula_secure_2024}@postgres-primary:5432/labdb"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 50
      MIN_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 5
      SERVER_TLS_SSLMODE: disable
    ports:
      - "6432:5432"
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - gula-net

  redis:
    image: redis:7-alpine
    container_name: gula-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - gula-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: gula-clickhouse
    restart: always
    ports:
      - "8123:8123"
      - "9001:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./config/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - gula-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # MESSAGING & STREAMING
  # ===========================================================================

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: gula-rabbitmq
    restart: always
    hostname: gula-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-gula}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-gula_rabbit_2024}
      RABBITMQ_DEFAULT_VHOST: gula
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./config/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json
      - ./config/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    networks:
      - gula-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: gula-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    networks:
      - gula-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: gula-kafka
    restart: always
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - gula-net
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ===========================================================================
  # AI & ML SERVICES
  # ===========================================================================

  ollama:
    image: ollama/ollama:latest
    container_name: gula-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - gula-net
    deploy:
      resources:
        reservations:
          memory: 4G

  ai-service:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    container_name: gula-ai-service
    restart: always
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_FALLBACK: ${AI_FALLBACK:-false}
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-gula}:${RABBITMQ_PASS:-gula_rabbit_2024}@rabbitmq:5672/gula
    ports:
      - "9000:9000"
    depends_on:
      - ollama
      - redis
      - rabbitmq
    networks:
      - gula-net

  # ===========================================================================
  # OBJECT STORAGE
  # ===========================================================================

  minio:
    image: minio/minio:latest
    container_name: gula-minio
    restart: always
    command: server /data --console-address ":9002"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gula_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-gula_minio_2024}
    ports:
      - "9003:9000"
      - "9002:9002"
    volumes:
      - minio-data:/data
    networks:
      - gula-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ===========================================================================
  # SECURITY & IDENTITY
  # ===========================================================================

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: gula-keycloak
    restart: always
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-gula_keycloak_2024}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-primary:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-gula_secure_2024}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8081:8080"
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - gula-net

  vault:
    image: hashicorp/vault:1.15
    container_name: gula-vault
    restart: always
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-gula_vault_root_token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    volumes:
      - vault-data:/vault/data
      - ./config/vault/vault.hcl:/vault/config/vault.hcl
    networks:
      - gula-net

  # ===========================================================================
  # MONITORING & OBSERVABILITY
  # ===========================================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: gula-prometheus
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - gula-net

  grafana:
    image: grafana/grafana:latest
    container_name: gula-grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-gula_grafana_2024}
      GF_INSTALL_PLUGINS: grafana-piechart-panel,grafana-worldmap-panel
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - loki
    networks:
      - gula-net

  loki:
    image: grafana/loki:2.9.0
    container_name: gula-loki
    restart: always
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    networks:
      - gula-net

  promtail:
    image: grafana/promtail:2.9.0
    container_name: gula-promtail
    restart: always
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./config/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - gula-net

  jaeger:
    image: jaegertracing/all-in-one:1.51
    container_name: gula-jaeger
    restart: always
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "14268:14268"
      - "4317:4317"
      - "4318:4318"
    networks:
      - gula-net

  # ===========================================================================
  # CORE PLATFORM SERVICES
  # ===========================================================================

  api-gateway:
    image: nginx:1.25-alpine
    container_name: gula-api-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./config/nginx/conf.d:/etc/nginx/conf.d
      - ./config/ssl:/etc/nginx/ssl
    depends_on:
      - lab-service
      - patient-service
      - order-service
      - result-service
      - sample-service
    networks:
      - gula-net

  lab-service:
    build:
      context: ./services/lab
      dockerfile: Dockerfile
    container_name: gula-lab-service
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-gula_secure_2024}@pgbouncer:5432/labdb
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-gula}:${RABBITMQ_PASS:-gula_rabbit_2024}@rabbitmq:5672/gula
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-gula_minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-gula_minio_2024}
      JAEGER_ENDPOINT: http://jaeger:14268/api/traces
      SERVICE_NAME: lab-service
    ports:
      - "8001:8000"
    depends_on:
      postgres-primary:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gula-net

  patient-service:
    build:
      context: ./services/patient
      dockerfile: Dockerfile
    container_name: gula-patient-service
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-gula_secure_2024}@pgbouncer:5432/labdb
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-gula}:${RABBITMQ_PASS:-gula_rabbit_2024}@rabbitmq:5672/gula
      JAEGER_ENDPOINT: http://jaeger:14268/api/traces
      SERVICE_NAME: patient-service
    ports:
      - "8002:8000"
    depends_on:
      postgres-primary:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - gula-net

  order-service:
    build:
      context: ./services/order
      dockerfile: Dockerfile
    container_name: gula-order-service
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-gula_secure_2024}@pgbouncer:5432/labdb
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-gula}:${RABBITMQ_PASS:-gula_rabbit_2024}@rabbitmq:5672/gula
      JAEGER_ENDPOINT: http://jaeger:14268/api/traces
      SERVICE_NAME: order-service
    ports:
      - "8003:8000"
    depends_on:
      postgres-primary:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - gula-net

  result-service:
    build:
      context: ./services/result
      dockerfile: Dockerfile
    container_name: gula-result-service
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-gula_secure_2024}@pgbouncer:5432/labdb
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-gula}:${RABBITMQ_PASS:-gula_rabbit_2024}@rabbitmq:5672/gula
      CLICKHOUSE_URL: http://clickhouse:8123
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-gula_minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-gula_minio_2024}
      JAEGER_ENDPOINT: http://jaeger:14268/api/traces
      SERVICE_NAME: result-service
    ports:
      - "8004:8000"
    depends_on:
      postgres-primary:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - gula-net

  sample-service:
    build:
      context: ./services/sample
      dockerfile: Dockerfile
    container_name: gula-sample-service
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-gula_secure_2024}@pgbouncer:5432/labdb
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-gula}:${RABBITMQ_PASS:-gula_rabbit_2024}@rabbitmq:5672/gula
      JAEGER_ENDPOINT: http://jaeger:14268/api/traces
      SERVICE_NAME: sample-service
    ports:
      - "8005:8000"
    depends_on:
      postgres-primary:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - gula-net

  notification-service:
    build:
      context: ./services/notification
      dockerfile: Dockerfile
    container_name: gula-notification-service
    restart: always
    environment:
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-gula}:${RABBITMQ_PASS:-gula_rabbit_2024}@rabbitmq:5672/gula
      JAEGER_ENDPOINT: http://jaeger:14268/api/traces
      SERVICE_NAME: notification-service
    ports:
      - "8006:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - gula-net

  autonomous-manager:
    build:
      context: ./services/autonomous_manager
      dockerfile: Dockerfile
    container_name: gula-autonomous-manager
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-gula_secure_2024}@pgbouncer:5432/labdb
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-gula}:${RABBITMQ_PASS:-gula_rabbit_2024}@rabbitmq:5672/gula
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8010:8000"
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - gula-net

  frontend:
    image: nginx:1.25-alpine
    container_name: gula-frontend
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./config/nginx/frontend.conf:/etc/nginx/conf.d/default.conf
    networks:
      - gula-net

# =============================================================================
# VOLUMES
# =============================================================================

volumes:
  pgdata-primary:
    driver: local
  pgdata-replica:
    driver: local
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local
  kafka-data:
    driver: local
  zookeeper-data:
    driver: local
  zookeeper-log:
    driver: local
  clickhouse-data:
    driver: local
  minio-data:
    driver: local
  ollama-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local
  vault-data:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================

networks:
  gula-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
