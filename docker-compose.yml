# =============================================================================
# GULA PLATFORM - MVP Configuration
# Minimal services for production launch
# For full infrastructure: docker compose -f docker-compose.full.yml up
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # DATABASE
  # ---------------------------------------------------------------------------

  postgres:
    image: postgres:14
    container_name: gula-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: labdb
    # SECURITY: No external ports - only accessible via internal network
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - gula-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d labdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # CACHE
  # ---------------------------------------------------------------------------

  redis:
    image: redis:7-alpine
    container_name: gula-redis
    restart: always
    command: >
      redis-server
        --appendonly yes
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    # SECURITY: No external ports - only accessible via internal network
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - gula-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # BACKEND API
  # ---------------------------------------------------------------------------

  gula-backend:
    build: ./backend
    container_name: gula-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/labdb
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set in .env}
    # SECURITY: No external ports - only accessible via api-gateway
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gula-net
    # IMPORTANT: Use python for health check (available in image) instead of wget/curl.
    # This avoids false-unhealthy state and upstream 502 when wget is not installed.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # FRONTEND
  # ---------------------------------------------------------------------------

  frontend:
    image: nginx:1.25-alpine
    container_name: gula-frontend
    restart: always
    # SECURITY: No external ports - only accessible via api-gateway
    expose:
      - "80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./config/nginx/frontend.conf:/etc/nginx/conf.d/default.conf
    networks:
      - gula-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # API GATEWAY (Nginx reverse proxy)
  # ---------------------------------------------------------------------------

  api-gateway:
    image: nginx:1.25-alpine
    container_name: gula-api-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./config/nginx/conf.d:/etc/nginx/conf.d
      - ./config/ssl:/etc/nginx/ssl
      - certbot-webroot:/var/www/certbot
      - ./logs/nginx:/var/log/nginx
    depends_on:
      gula-backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - gula-net

# =============================================================================
# VOLUMES
# =============================================================================

volumes:
  pgdata:
    driver: local
  redis-data:
    driver: local
  certbot-webroot:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================

networks:
  gula-net:
    driver: bridge
