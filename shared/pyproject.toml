[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gula-shared"
version = "2.5.0"
description = "GULA Shared Engineering Library — canonical modules across all repositories"
requires-python = ">=3.10"
license = { text = "Proprietary" }

dependencies = [
    "bcrypt>=4.1.3", "cryptography>=49.0.0", "joserfc>=1.7.3",
    "pydantic>=2.13.4", "pydantic-settings>=2.14.2",
    "boto3>=1.28.0", "firebase-admin>=6.0.0", "redis>=8.0.1",
    "reportlab>=5.0.0", "qrcode>=8.2", "python-barcode>=0.15.0", "pillow>=12.3.0",
    "pika>=1.3.0",
    "opentelemetry-api>=1.20.0", "opentelemetry-sdk>=1.20.0",
    "whoosh>=1.7.0", "google-generativeai>=0.8.0", "httpx>=0.28.1",
    "jsonschema>=4.20.0", "jsonpath-ng>=1.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff>=0.5.0", "mypy>=1.10.0", "coverage>=7.0.0", "bandit>=1.7.0"]
sentry = ["sentry-sdk>=2.66.0"]
celery = ["celery>=5.3.0"]

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.packages.find]
where = ["."]
include = ["shared", "shared.*"]

[tool.ruff]
target-version = "py314"
line-length = 100
fix = true
show-fixes = true
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "N", "RUF", "T20"]
ignore = ["E501", "B008", "N818"]
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_return_any = true
show_error_codes = true
