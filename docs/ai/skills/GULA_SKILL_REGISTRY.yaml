registry:
  name: GULA Skill Registry
  version: 1.1.0
  status: provenance-reviewed
governance:
  authority_order:
  - GULA Constitution
  - GULA Security Policy
  - GULA Architecture
  - GULA ADRs
  - GULA Domain Rules
  - GULA Quality Gates
  - GULA-native Skills
  - Audited External Skills
  automatic_external_updates: false
  automatic_skill_promotion: false
  rules:
  - External skills must have verified provenance before trusted activation.
  - Unknown-provenance skills remain quarantined.
  - Security-related skills cannot become GULA security authority without behavioral
    validation.
  - Nested bundles must be classified separately from flat skills.
  - Duplicate workflows should be consolidated or explicitly justified.
  - External skills never override GULA Constitution or GULA security policy.
  - Automatic external updates are prohibited.
