# GULA Platform — Stress Test Configuration

test:
  name: "GULA Production Stress Test"
  base_url: "${BASE_URL:-http://localhost:8080}"
  
phases:
  - name: warmup
    duration: 2m
    users: 10
    ramp: false
    
  - name: ramp-up
    duration: 5m
    users: 100
    ramp: true
    ramp_target: 500
    
  - name: stress
    duration: 10m
    users: 500
    ramp: false
    
  - name: peak
    duration: 5m
    users: 1000
    ramp: true
    ramp_target: 1000
    
  - name: recovery
    duration: 5m
    users: 10
    ramp: false

endpoints:
  - path: /api/orders
    method: POST
    weight: 30
  - path: /api/results
    method: POST
    weight: 30
  - path: /api/patients
    method: GET
    weight: 20
  - path: /api/search
    method: GET
    weight: 10
  - path: /api/dashboard
    method: GET
    weight: 10

thresholds:
  http_req_duration:
    p50: 200ms
    p95: 500ms
    p99: 1000ms
  http_req_failed:
    rate: 0.01
  errors:
    rate: 0.01

monitoring:
  prometheus: "http://prometheus:9090"
  queries:
    - expr: "gula_active_requests"
      during: "all"
    - expr: "gula_db_latency_ms"
      during: "all"
    - expr: "gula_memory_rss_mb"
      during: "all"

output:
  report_dir: docs/reports/stress
  format: [json, html, md]
