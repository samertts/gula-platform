---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: result-service
  namespace: gula-platform
  labels:
    app: result-service
    tier: services
spec:
  replicas: 3
  selector:
    matchLabels:
      app: result-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: result-service
    spec:
      containers:
        - name: result-service
          image: gula-platform/result-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: gula-config
            - secretRef:
                name: gula-secrets
          env:
            - name: SERVICE_NAME
              value: result-service
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: result-service
  namespace: gula-platform
spec:
  selector:
    app: result-service
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: result-service-hpa
  namespace: gula-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: result-service
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
