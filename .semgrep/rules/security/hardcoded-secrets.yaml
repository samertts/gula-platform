# =============================================================================
# Semgrep Rule: Hardcoded Secrets Detection
# =============================================================================
# Path: .semgrep/rules/security/hardcoded-secrets.yaml
# Managed by: Security Operations
# Mitre: T1552 (Unsecured Credentials)
# Severity: ERROR (blocks CI)
# =============================================================================

rules:
  - id: hardcoded-api-key
    patterns:
      - pattern-either:
          - pattern: |
              $KEY = "..."
          - pattern: |
              $KEY = '...'
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(api_?key|api_?secret|apikey|api_secret).*
      - pattern-not: |
          $KEY = os.environ.get("...")
      - pattern-not: |
          $KEY = os.getenv("...")
      - pattern-not: |
          $KEY = config("...")
      - pattern-not-inside: |
          import os
          ...
      - pattern-not-inside: |
          from decouple import config
          ...
    message: >-
      Detected possible hardcoded API key. API keys must be stored in environment
      variables or a secrets manager. Use: API_KEY = os.environ.get("API_KEY")
    languages:
      - python
      - javascript
      - typescript
    severity: ERROR
    metadata:
      cwe: "CWE-798: Use of Hardcoded Credentials"
      owasp: "A2: Broken Authentication"
      category: security
      confidence: HIGH

  - id: hardcoded-password
    patterns:
      - pattern-either:
          - pattern: |
              $PASSWORD = "..."
          - pattern: |
              $PASSWORD = '...'
      - metavariable-regex:
          metavariable: $PASSWORD
          regex: (?i).*(password|pwd|passwd|pass).*
      - pattern-not: |
          $PASSWORD = os.environ.get("...")
      - pattern-not: |
          $PASSWORD = os.getenv("...")
      - pattern-not: |
          $PASSWORD = config("...")
      - pattern-not-inside: |
          import os
          ...
      - pattern-not-inside: |
          from decouple import config
          ...
      - pattern-not-regex: |
          (?i)(placeholder|example|changeme|testpassword|default)
    message: >-
      Detected possible hardcoded password. Passwords must be stored in
      environment variables or a secrets manager.
    languages:
      - python
      - javascript
      - typescript
      - java
      - go
    severity: ERROR
    metadata:
      cwe: "CWE-798: Use of Hardcoded Credentials"
      owasp: "A2: Broken Authentication"
      category: security

  - id: hardcoded-secret-key
    patterns:
      - pattern-either:
          - pattern: |
              $SECRET = "..."
          - pattern: |
              $SECRET = '...'
      - metavariable-regex:
          metavariable: $SECRET
          regex: (?i).*(secret_?key|secret_key|secret|token|encryption_key|hmac_key).*
      - pattern-not: |
          $SECRET = os.environ.get("...")
      - pattern-not: |
          $SECRET = os.getenv("...")
      - pattern-not: |
          $SECRET = config("...")
      - pattern-not-inside: |
          import os
          ...
      - pattern-not-inside: |
          from decouple import config
          ...
    message: >-
      Detected possible hardcoded secret key. Secret keys must be stored in
      environment variables or a secrets manager.
    languages:
      - python
      - javascript
      - typescript
    severity: ERROR
    metadata:
      cwe: "CWE-798: Use of Hardcoded Credentials"
      owasp: "A2: Broken Authentication"
      category: security

  - id: hardcoded-database-connection-string
    patterns:
      - pattern-either:
          - pattern: |
              "$URL"
          - pattern: |
              '$URL'
      - metavariable-regex:
          metavariable: $URL
          regex: (?i).*(postgresql://|mysql://|mongodb://|redis://|rabbitmq://).*:.*@.*
      - pattern-not: |
          $URL = os.environ.get("...")
      - pattern-not: |
          $URL = config("...")
    message: >-
      Detected hardcoded database connection string with credentials.
      Connection strings must be stored in environment variables.
    languages:
      - python
      - javascript
      - typescript
      - go
      - java
    severity: ERROR
    metadata:
      cwe: "CWE-798: Use of Hardcoded Credentials"
      owasp: "A2: Broken Authentication"
      category: security

  - id: hardcoded-jwt-secret
    patterns:
      - pattern-either:
          - pattern: |
              jwt.encode({...}, "...", algorithm=...)
          - pattern: |
              jwt.decode("...", "...", algorithms=[...])
          - pattern: |
              jwt.encode({...}, '...', algorithm=...)
      - pattern-not: |
          jwt.encode({...}, os.environ.get("..."), algorithm=...)
      - pattern-not: |
          jwt.decode(..., os.environ.get("..."), algorithms=[...])
    message: >-
      Detected hardcoded JWT secret in encode/decode call. JWT secrets
      must be stored in environment variables.
    languages:
      - python
    severity: ERROR
    metadata:
      cwe: "CWE-798: Use of Hardcoded Credentials"
      owasp: "A2: Broken Authentication"
      category: security

  - id: hardcoded-oauth-token
    patterns:
      - pattern-either:
          - pattern: |
              $TOKEN = "..."
          - pattern: |
              $TOKEN = '...'
      - metavariable-regex:
          metavariable: $TOKEN
          regex: (?i).*(oauth_token|access_token|refresh_token|bearer_token|bot_token).*
      - pattern-not: |
          $TOKEN = os.environ.get("...")
      - pattern-not: |
          $TOKEN = config("...")
    message: >-
      Detected possible hardcoded OAuth/access token. Tokens must be
      stored in environment variables or a secrets manager.
    languages:
      - python
      - javascript
      - typescript
    severity: ERROR
    metadata:
      cwe: "CWE-798: Use of Hardcoded Credentials"
      owasp: "A2: Broken Authentication"
      category: security

  - id: hardcoded-private-key
    patterns:
      - pattern-either:
          - pattern: |
              $KEY = """-----BEGIN $TYPE PRIVATE KEY-----..."""
          - pattern: |
              $KEY = "-----BEGIN $TYPE PRIVATE KEY-----..."
          - pattern: |
              $KEY = '-----BEGIN $TYPE PRIVATE KEY-----...'
      - metavariable-regex:
          metavariable: $TYPE
          regex: (RSA|EC|DSA|OPENSSH|PGP)
      - pattern-not-inside: |
          ...
          if __debug__:
              ...
    message: >-
      Detected hardcoded private key. Private keys must be stored in
      files with restricted permissions and referenced by path.
    languages:
      - python
      - javascript
      - typescript
      - go
    severity: ERROR
    metadata:
      cwe: "CWE-798: Use of Hardcoded Credentials"
      owasp: "A2: Broken Authentication"
      category: security

  - id: hardcoded-auth-header
    patterns:
      - pattern-either:
          - pattern: |
              headers = {"Authorization": "Bearer ..."}
          - pattern: |
              headers = {"Authorization": "Basic ..."}
          - pattern: |
              headers = {'Authorization': 'Bearer ...'}
          - pattern: |
              headers['Authorization'] = "Bearer ..."
    message: >-
      Detected hardcoded Authorization header value. Auth tokens must
      be fetched from environment variables at runtime.
    languages:
      - python
      - javascript
      - typescript
    severity: ERROR
    metadata:
      cwe: "CWE-798: Use of Hardcoded Credentials"
      owasp: "A2: Broken Authentication"
      category: security

  - id: hardcoded-sensitive-env-default
    patterns:
      - pattern-either:
          - pattern: |
              os.environ.get("...", "...")
          - pattern: |
              os.getenv("...", "...")
          - pattern: |
              environ.get("...", "...")
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(secret|password|key|token|credential|passwd).*
      - focus-metavariable: $DEFAULT
    message: >-
      Detected environment variable with a fallback default value for a
      sensitive key. Sensitive environment variables should never have
      default values; allow them to raise KeyError if unset.
    languages:
      - python
    severity: WARNING
    metadata:
      cwe: "CWE-798: Use of Hardcoded Credentials"
      owasp: "A2: Broken Authentication"
      category: security

  - id: hardcoded-redis-password-in-url
    patterns:
      - pattern: |
          redis://:$PASSWORD@...
      - pattern-not: |
          redis://:${REDIS_PASSWORD}@...
    message: >-
      Detected hardcoded Redis password in URL. Use environment variable
      interpolation.
    languages:
      - python
      - javascript
      - typescript
      - go
    severity: ERROR
    metadata:
      cwe: "CWE-798: Use of Hardcoded Credentials"
      owasp: "A2: Broken Authentication"
      category: security
