# =============================================================================
# Semgrep Rule: SQL Injection Detection
# =============================================================================
# Path: .semgrep/rules/security/sql-injection.yaml
# Managed by: Security Operations
# Mitre: T1190 (SQL Injection)
# Severity: ERROR (blocks CI)
# =============================================================================

rules:
  - id: sql-injection-fstring
    pattern-either:
      - pattern: f"$QUERY {...}"
      - pattern: f'$QUERY {...}'
    patterns:
      - pattern-inside: |
          $DB.execute(...)
      - pattern-inside: |
          $DB.exec_driver_sql(...)
      - metavariable-regex:
          metavariable: $QUERY
          regex: (SELECT|INSERT|UPDATE|DELETE|DROP|ALTER|CREATE|TRUNCATE)
    message: >-
      Detected SQL query built with f-string. Use parameterized queries
      to prevent SQL injection. Replace with: session.execute(text($QUERY), params)
    languages:
      - python
    severity: ERROR
    metadata:
      cwe: "CWE-89: SQL Injection"
      owasp: "A1: Injection"
      category: security
      technology: python
      confidence: HIGH

  - id: sql-injection-concatenation
    pattern-either:
      - pattern: |
          $QUERY + $INPUT
      - pattern: |
          $QUERY + str($INPUT)
    patterns:
      - pattern-inside: |
          $DB.execute(...)
      - metavariable-regex:
          metavariable: $QUERY
          regex: ('.*SELECT.*'|'.*INSERT.*'|'.*UPDATE.*'|'.*DELETE.*')
    message: >-
      Detected SQL query built with string concatenation. Use parameterized
      queries to prevent SQL injection.
    languages:
      - python
    severity: ERROR
    metadata:
      cwe: "CWE-89: SQL Injection"
      owasp: "A1: Injection"
      category: security

  - id: sql-injection-raw-sql
    patterns:
      - pattern-either:
          - pattern: |
              session.execute(text($INPUT))
          - pattern: |
              $DB.execute(raw_sql=$INPUT)
          - pattern: |
              $DB.exec_driver_sql($INPUT)
      - pattern-not: |
          session.execute(text("..."))
      - pattern-not: |
          $DB.execute(text("..."))
      - metavariable-regex:
          metavariable: $INPUT
          regex: (?!(("[^"]*")|('[^']*')|(\"\"\".*\"\"\")|(\'\'\'.*\'\'\'))$)
    message: >-
      Detected raw SQL execution with a non-literal argument. This could
      lead to SQL injection if the input contains user data.
      Use parameterized queries with :param style placeholders.
    languages:
      - python
    severity: ERROR
    metadata:
      cwe: "CWE-89: SQL Injection"
      owasp: "A1: Injection"
      category: security

  - id: sql-injection-like-operators
    patterns:
      - pattern: |
          $QUERY + "%" + $INPUT + "%"
      - pattern-inside: |
          $DB.execute(...)
    message: >-
      Detected SQL LIKE operator with string concatenation. Use
      parameterized LIKE queries: .where(column.like(f'%{val}%'))
    languages:
      - python
    severity: ERROR
    metadata:
      cwe: "CWE-89: SQL Injection"
      owasp: "A1: Injection"
      category: security

  - id: sql-injection-format-string
    patterns:
      - pattern: |
          $QUERY.format($INPUT)
      - pattern-inside: |
          $DB.execute(...)
    message: >-
      Detected SQL query built with .format(). Use parameterized queries
      to prevent SQL injection.
    languages:
      - python
    severity: ERROR
    metadata:
      cwe: "CWE-89: SQL Injection"
      owasp: "A1: Injection"
      category: security

  - id: sql-injection-modulo-string
    patterns:
      - pattern: |
          $QUERY % $INPUT
      - pattern-inside: |
          $DB.execute(...)
    message: >-
      Detected SQL query built with % formatting. Use parameterized
      queries to prevent SQL injection.
    languages:
      - python
    severity: ERROR
    metadata:
      cwe: "CWE-89: SQL Injection"
      owasp: "A1: Injection"
      category: security

  - id: sql-injection-sqlalchemy-text
    patterns:
      - pattern: |
          text(f"...{...}...")
      - pattern: |
          text('...' + $INPUT + '...')
      - pattern: |
          text("..." + $INPUT + "...")
    message: >-
      Detected SQLAlchemy text() with f-string or concatenation. Pass
      parameters as bound arguments: text("SELECT * FROM t WHERE id = :val")
      and use .params(val=user_input).
    languages:
      - python
    severity: ERROR
    metadata:
      cwe: "CWE-89: SQL Injection"
      owasp: "A1: Injection"
      category: security

  - id: sql-injection-subquery-user-input
    patterns:
      - pattern: |
          session.query(...).filter("..." + $INPUT + "...")
    message: >-
      Detected SQLAlchemy filter with string concatenation. Use
      column == value syntax for parameterized queries.
    languages:
      - python
    severity: ERROR
    metadata:
      cwe: "CWE-89: SQL Injection"
      owasp: "A1: Injection"
      category: security

  - id: sql-injection-execute-many
    patterns:
      - pattern: |
          $DB.execute_many($QUERY, ...)
      - focus-metavariable: $QUERY
      - metavariable-regex:
          metavariable: $QUERY
          regex: (?!(("[^"]*")|('[^']*')|(\"\"\".*\"\"\")|(\'\'\'.*\'\'\')$))
    message: >-
      Detected non-literal SQL in execute_many. Ensure the query
      is parameterized and uses :param style placeholders.
    languages:
      - python
    severity: WARNING
    metadata:
      cwe: "CWE-89: SQL Injection"
      owasp: "A1: Injection"
      category: security

  - id: sql-injection-in-operator
    patterns:
      - pattern: |
          f"... IN {...}"
      - pattern-inside: |
          $DB.execute(...)
    message: >-
      Detected SQL IN clause built with f-string. This is vulnerable
      to SQL injection if the values contain user input.
    languages:
      - python
    severity: ERROR
    metadata:
      cwe: "CWE-89: SQL Injection"
      owasp: "A1: Injection"
      category: security

  - id: sql-injection-order-by
    patterns:
      - pattern: |
          f"ORDER BY {column_name}"
      - pattern: |
          f"... ORDER BY {$INPUT} ..."
    message: >-
      Detected ORDER BY clause built with f-string. ORDER BY cannot be
      parameterized; validate against a whitelist of allowed column names.
    languages:
      - python
    severity: WARNING
    metadata:
      cwe: "CWE-89: SQL Injection"
      owasp: "A1: Injection"
      category: security

  - id: sql-injection-dynamic-table-name
    patterns:
      - pattern: |
          f"... FROM {$TABLE_NAME} ..."
      - pattern: |
          f"... INTO {$TABLE_NAME} ..."
      - pattern: |
          f"... JOIN {$TABLE_NAME} ..."
    message: >-
      Detected dynamic table name in SQL query. Table names cannot be
      parameterized; validate against a whitelist of allowed table names.
    languages:
      - python
    severity: WARNING
    metadata:
      cwe: "CWE-89: SQL Injection"
      owasp: "A1: Injection"
      category: security
