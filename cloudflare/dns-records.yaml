# GULA DNS records — Cloudflare zone `gula.health`
#
# Apply via:
#   cloudflare-cli dns import --zone gula.health dns-records.yaml
# or manually through the Cloudflare dashboard.
#
# Proxy status:
#   PROXIED   — hidden behind Cloudflare (orange cloud). Use for every
#               public HTTP endpoint so the Worker + WAF + rate-limit run.
#   DNS_ONLY  — grey cloud. Only for records that must bypass the proxy
#               (SMTP, API endpoints that government systems reach directly).
#
# TTLs: 1 == Cloudflare-managed automatic TTL.

zone: gula.health

records:
  # ── Public apex + www ──────────────────────────────────────────────────
  - { type: A,      name: "@",          content: "192.0.2.10",   ttl: 1, proxied: true,  comment: "Marketing site" }
  - { type: CNAME,  name: "www",        content: "gula.health",  ttl: 1, proxied: true,  comment: "Redirect to apex" }

  # ── Public API (HAProxy → gula-backend) ────────────────────────────────
  - { type: A,      name: "api",        content: "192.0.2.11",   ttl: 1, proxied: true,  comment: "Primary API; passes through Worker" }
  - { type: A,      name: "api-dr",     content: "192.0.2.12",   ttl: 1, proxied: true,  comment: "Disaster-recovery origin" }

  # ── Citizen / lab portals ──────────────────────────────────────────────
  - { type: CNAME,  name: "portal",     content: "pages.dev",    ttl: 1, proxied: true,  comment: "Citizen portal (Cloudflare Pages)" }
  - { type: CNAME,  name: "app",        content: "pages.dev",    ttl: 1, proxied: true,  comment: "Lab app (Cloudflare Pages)" }

  # ── Reports (R2 + custom domain) ───────────────────────────────────────
  - { type: CNAME,  name: "reports",    content: "r2.dev",       ttl: 1, proxied: true,  comment: "Signed report PDFs from R2" }

  # ── Government / integrations (DNS-only so IP allow-lists on the
  #     government side can pin an exact address) ─────────────────────────
  - { type: A,      name: "webhooks",   content: "192.0.2.20",   ttl: 300, proxied: false, comment: "Inbound webhooks from MoH/MoI/NHI" }

  # ── Email (SPF/DKIM/DMARC) ─────────────────────────────────────────────
  - { type: TXT,    name: "@",          content: "v=spf1 include:_spf.google.com -all",  ttl: 1, proxied: false }
  - { type: TXT,    name: "_dmarc",     content: "v=DMARC1; p=quarantine; rua=mailto:dmarc@gula.health; adkim=s; aspf=s", ttl: 1, proxied: false }

  # ── CAA — only Let's Encrypt + Cloudflare may issue certs ──────────────
  - { type: CAA,    name: "@",          content: "0 issue \"letsencrypt.org\"",  ttl: 1, proxied: false }
  - { type: CAA,    name: "@",          content: "0 issue \"pki.goog\"",         ttl: 1, proxied: false }
  - { type: CAA,    name: "@",          content: "0 issuewild \";\"",            ttl: 1, proxied: false, comment: "No wildcards from any CA" }
