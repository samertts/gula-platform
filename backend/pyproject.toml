[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gula-backend"
version = "2.5.0"
description = "GULA Platform Backend — FastAPI monolith for laboratory management"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "gunicorn>=21.2.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "python-multipart>=0.0.20",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1.3,<4.2.0",
    "joserfc>=1.7.3",
    "cryptography>=42.0.0",
    "qrcode>=7.4.2",
    "Pillow>=10.4.0",
    "reportlab>=4.1.0",
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.4.2",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "sentry-sdk[fastapi]>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25.0,<1.0.0",
    "factory_boy>=3.3.0",
    "chevron>=0.14.0",
    "webauthn>=2.0.0",
    "email-validator>=2.1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
