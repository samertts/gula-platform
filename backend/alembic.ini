# =============================================================================
# Alembic configuration — GULA Platform
# Run from: backend/
#   alembic upgrade head          apply all pending migrations
#   alembic revision --autogenerate -m "describe change"   generate new migration
#   alembic downgrade -1          undo last migration
#   alembic current               show current revision
#   alembic history               list all revisions
# =============================================================================

[alembic]
script_location = migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .

# DATABASE_URL is read from the environment in env.py — do not hardcode here
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
