[project]
name = "lablink-core"
version = "0.1.0"
description = "LabLink Core MVP for device-to-GULA integration"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.30.6",
  "pydantic>=2.9.0",
  "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
