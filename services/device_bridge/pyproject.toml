[project]
name = "lablink-core"
version = "0.1.0"
description = "LabLink Core MVP for device-to-GULA integration"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.139.2",
  "uvicorn[standard]>=0.51.0",
  "pydantic>=2.13.4",
  "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = [".", "../.."]
testpaths = ["tests"]
