[project]
name = "lablink-core"
version = "0.1.0"
description = "LabLink Core MVP for device-to-GULA integration"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.139.2",
  "uvicorn[standard]>=0.51.0",
  "pydantic>=2.13.4",
  "httpx>=0.28.1",
  # app/connectors/base.py opens a serial analyzer with `from serial import Serial`
  # (a lazy, function-local import, so it breaks on first use rather than at
  # startup). The package was declared nowhere. Declared here as the service's
  # real requirement; the Dockerfile's explicit pip install still omits it, and
  # correcting that needs an image build to verify. See IA-044.
  "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
